<html>
  <head>
    <title>404</title>
    <div id="common-head"></div>
    <script src="common.html" type="text/html"></script>
    <style>
      body{
        background-color: #5d4ea8;
        display: flex;
      }
      h1{
        color: #24f0ea;
        text-shadow: 17px 17px 17px #55367a;
        font-size: 7em;
        margin: auto;
      }
      p{
        font-size: larger;
      }
      .container {
        display: flex;
        align-items: stretch;
      }
      
      .container img {
        width: 170px;
      }
      
      .text-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding-right: 10px;
        padding-left: 10px;
        box-sizing: border-box;
        line-height:1.7;
      }
    </style>
  </head>
  <body>
    <div id="common-header"></div>
    <span class="Hide">404</span>
    <h1>404</h1>
    <img id="img1" src="/404/404.png" style="width: 37%; position: fixed; left: 7px; bottom: 0px; cursor: pointer;">
    <img id="img2" src="/404/All.png" style="width: 37%; display: none; position: fixed; right: 7px; bottom: 7px; cursor: pointer;" onclick="playVideo()">
    <script>
      document.getElementById('img1').addEventListener('click', function() {
        var img2 = document.getElementById('img2');
        if (img2.style.display === "none") {
          img2.style.display = "block";
          img1.style.display = "none"
        } else {
          img2.style.display = "none";
        }
      });
    </script>

    <video id="vdeo" width="100%" style="display:none;
      position: fixed;
      z-index: 1000;
      top: 0px;
      left: 0px;
    ">
      <source src="/404/404.mp4" type="video/mp4">
    </video>
    <div id="err" style="position: fixed;
      z-index: 1001;
      width: 100%; 
      height: 100%;
      left: 0px;
      top: 0px;
      background-color: #5d4ea8;
      color: #24f0ea;
      display: none;
      padding: 70px;
      padding-top: 34px;
      font-size: 25">
      <p style="
        font-size: 7em;
        margin: 0;
      ">:(</p>
      <p>您的设备遇到问题，需要重启。</p>
      <p>我们只假装收集某些错误信息，然后为你重新蓝屏</p>
      <p id="counter" style="margin-top: 47px; margin-bottom: 47px;">0% 完成</p>
      <div class="container">
        <img src="/404/QR.svg"/>
        <div class="text-container">
          有关此问题的详细信息和可能的解决万法，请访问<br>
          https://www.windows.com/stopcode<br>
          如果致电支持人员，请向他们提供以下信息：<br>
          终止代码: DO NOT TOUCH THEM
        </div>
      </div>
    </div>
    <script>
      let count = 0;
      const counterElement = document.getElementById('counter');
      const updateCounter = () => {
        if (count > 100) {
          count = 0;
          setTimeout(updateCounter, 1700);
          counterElement.textContent = count + '% complete';
        } else {
          count++;
          counterElement.textContent = count + '% complete';
          setTimeout(updateCounter, 70);
        }
      };

      function playVideo() {
        var video = document.getElementById("vdeo");
        var img2 = document.getElementById("img2");
        video.style.display = 'block';
        img2.style.display = 'none';
        video.play();
        video.addEventListener('ended', function() {
          document.getElementById('err').style.display = 'block';
          setTimeout(() => {
            updateCounter(); // 1.7秒后开始计数
          }, 1700);
        });
      }
    </script>
  </body>
</html>
