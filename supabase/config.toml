project_id = "sekbhrzxblaxvgspyjxa"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

# 本地邮件测试服务（Mailpit）。
# Supabase CLI v3 移除了 [inbucket]，改名为 [local_smtp]；段内键名不变。
# 只影响本地 `supabase start`，与线上部署无关，但不改名会让所有读配置的命令直接失败。
[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["https://localhost:9527", "https://ckarefulon.github.io"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = true

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

[functions.pulse-scheduler]
verify_jwt = false

# 反馈广场：站点 /feedback/ 页面调用。
# 走 apikey 而非 JWT（publishable key 不是 JWT），函数内部自己做限流/去重，所以不校验 JWT。
[functions.feedback]
verify_jwt = false

[analytics]
enabled = false
