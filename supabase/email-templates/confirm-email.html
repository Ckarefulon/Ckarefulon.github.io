<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>确认你的邮箱地址</title>
</head>
<body style="margin:0; padding:0; background-color:#0f0f16;" bgcolor="#0f0f16">
  <!-- Preview / preheader (hidden in most clients) -->
  <div style="display:none; max-height:0; overflow:hidden; opacity:0; font-size:0; line-height:0; color:transparent;">确认你的邮箱地址以完成注册。</div>

  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#0f0f16" style="margin:0; padding:0; background-color:#0f0f16; background-image:radial-gradient(circle at 18% 8%, rgba(93, 78, 168, 0.34), transparent 36%), radial-gradient(circle at 88% 0%, rgba(93, 78, 168, 0.16), transparent 32%), linear-gradient(180deg, #161620, #0d0d14); font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;">
    <tr>
      <td align="center" style="padding:56px 16px;">

        <table role="presentation" width="480" cellpadding="0" cellspacing="0" border="0" style="width:100%; max-width:480px; background-color:#161622; border:1px solid #35355a; border-radius:16px; box-shadow:0 18px 58px rgba(0, 0, 0, 0.5);">
          <tr>
            <td style="padding:40px 34px;">

              <!-- Brand row -->
              <div style="margin-bottom:26px; font-family:'Cascadia Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size:13px; letter-spacing:0.04em; color:#c0c2d0;">
                <span style="display:inline-block; width:8px; height:8px; border-radius:50%; background-color:#24f0ea; box-shadow:0 0 10px rgba(36, 240, 234, 0.8); vertical-align:middle; margin-right:8px;"></span><span style="color:#f4f4fb; font-weight:700; vertical-align:middle;">Ckarefulon</span>
              </div>

              <!-- Envelope badge (Unicode, email-safe) -->
              <div style="width:56px; height:56px; border-radius:14px; background-color:#211f33; border:1px solid #5d4ea8; text-align:center; line-height:54px; margin-bottom:22px; font-size:24px; color:#24f0ea;">&#9993;</div>

              <h2 style="margin:0 0 12px; font-size:25px; line-height:1.25; font-weight:700; color:#f4f4fb; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;">确认你的邮箱地址</h2>

              <p style="margin:0 0 28px; font-size:15px; line-height:1.65; color:#c0c2d0; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;">点击下方链接确认该邮箱地址，完成注册。</p>

              <p style="margin:0 0 26px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block; background-color:#6b5dc2; color:#ffffff; text-decoration:none; font-size:15px; font-weight:700; padding:14px 30px; border-radius:8px; border:1px solid #8174d6; box-shadow:0 6px 18px rgba(107, 93, 194, 0.35);">确认邮箱地址</a>
              </p>

              <!-- Plain-text fallback of the URL (helps deliverability / blocked buttons) -->
              <p style="margin:0 0 30px; font-size:12.5px; line-height:1.6; color:#7a7c92; word-break:break-all; font-family:'Cascadia Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;">
                或复制以下链接到浏览器打开：<br />
                <a href="{{ .ConfirmationURL }}" style="color:#24f0ea; text-decoration:none;">{{ .ConfirmationURL }}</a>
              </p>

              <div style="height:1px; background-color:#35355a; margin:0 0 20px;"></div>

              <p style="margin:0; font-size:12.5px; line-height:1.6; color:#7a7c92; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;">如果你没有注册账号，可以安全地忽略这封邮件。该链接即将过期。</p>

            </td>
          </tr>
        </table>

        <p style="margin:22px auto 0; max-width:480px; text-align:center; font-size:11.5px; color:#5a5c70; font-family:'Cascadia Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace;">Ckarefulon · 系统自动发送，请勿直接回复</p>

      </td>
    </tr>
  </table>
</body>
</html>
