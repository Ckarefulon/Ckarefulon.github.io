<div id="head">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="/Favicon.png">
  <meta name="author" content="小心超人  Careful S.">
  <script>
    function detectIE() {
      const ua = window.navigator.userAgent;
      return /MSIE |Trident\//.test(ua) && !/Edge\//.test(ua);
    }
    const isIE = detectIE();
    if (isIE) {
      window.location.href = '/IE.html'; 
    }
  </script>
  <style>
    .Top {
      background-color: #5d4ea8;
      border: 3px solid #24f0ea;
      padding: 10px;
      color: #24f0ea;
      box-shadow: 0px 17px 25px #55367a;
      margin: 0;
      position: fixed;
      right: 0px;
      left: 0px;
      top: 0px;
      border-radius: 0px 0px 17px 17px;
      z-index: 998;
    }
    .None {
      all: revert;
      float: right;
    }
    .Hide {
      all: revert;
      position: fixed;
      left: 0px;
      right: 0px;
      top: 0px;
      z-index: 999;
      margin-top: 12.4;
      text-align: center;
      color: #24f0ea;
    }
    .aNone {
      all: revert;
      float: right;
    }
    .bNone {
      all: revert;
      float: right;
      margin-right: 7px;
    }
    @media (max-width: 427px) {
      .Hide{ display: none; }
    }
    @media (max-width: 287px) {
      .aNone{ display: none; }
    }
    @media (max-width: 207px) {
      .bNone{ display: none; }
    }
  </style>
  <style>
    :where(.Box) {
      background-color: #5d4ea8;
      color: #24f0ea;
      border: 3px solid #24f0ea;
      border-radius: 17px;
      box-shadow: 10px 10px 17px #55367a;
    }
    :where(.Btn) {
      background-color: #24f0ea;
      color: #5d4ea8;
      border: none;
      border-radius: 17px;
      box-shadow: 10px 10px 17px #55367a;
      cursor: pointer;
    }
    :where(.Hvr):hover {
      box-shadow: inset 0px 0px 17px #24f0ea;
    }
    :where(.Box.Act) {
      box-shadow: inset 7px 7px 7px #55367a,
                  inset 0px 0px 17px #24f0ea;
  </style>
  <script>
    document.querySelectorAll('.Box').forEach(box => {
      box.onclick = () => box.classList.toggle('Act');
    });
  </script>
</div>


<div id="header">
  <br/>
  <div class="Top" translate="no">
    <div style="float: left;" class="None">Ckarefulon</div>
    <div class="aNone">Ckareful S.</div>
    <div class="None">< img style="width: 20px;height: 20px" src="/Avatar.png"></div>
    <div class="bNone">by</div>
  </div>
</div>
