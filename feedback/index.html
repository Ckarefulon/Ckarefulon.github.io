<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<link rel="icon" href="/favicon.svg?v=1877" type="image/svg+xml">

	<meta name="description" content="Ckarefulon 的反馈广场：看看别人提了什么，也可以新建一条。">

	<!-- 主题先落地，避免深浅色闪一下（与其它页面共用 smartCubeTheme） -->
	<script>
		(function () {
			var saved = null;
			try { saved = localStorage.getItem("smartCubeTheme"); } catch (e) {}
			var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
			document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
		})();
	</script>

	<link rel="stylesheet" href="/ui/colors_and_type.css">
	<link rel="stylesheet" href="/nav/nav.css?v=2475">
	<!-- GitHub 官方 Markdown 渲染样式（GFM）：详情正文与「预览」共用同一份，所见即所得。
	     ⚠️ 必须排在 feedback.css **之前**：我们的适配规则要能压过它（同特异性时靠源顺序），
	     否则它自带的深色背景会把卡片底色盖掉。 -->
	<link rel="stylesheet" href="/assets/vendor/github-markdown/github-markdown.css?v=2824">
	<link rel="stylesheet" href="/feedback/feedback.css?v=2824">

	<script src="/nav/nav.js?v=2712" defer></script>
	<script src="/assets/services/core/site-scope.js?v=2255" defer></script>

	<!-- 只有配置（385 字节，纯静态），**不加载** supabase-js（217KB）。
	       顶栏登录由 nav.js 按需拉取；本页自己发请求只需要 url + publishableKey。
	       以前这里连配置都没有，于是整个广场拿不到后端地址。 -->
	<script src="/supabase/supabase-config.js?v=1877" defer></script>

	<!-- 详情页完整 Markdown（issue #32）：marked 解析 + DOMPurify 消毒，均为本地 vendor -->
	<script src="/assets/vendor/marked/marked.min.js?v=2772" defer></script>
	<script src="/assets/vendor/dompurify/purify.min.js?v=2772" defer></script>
	<script src="/feedback/feedback-app.js?v=2824" defer></script>

	<title>反馈广场 — Ckarefulon</title>
</head>
<body>
	<main class="fbPage">
		<!-- ========== 广场（列表视图） ========== -->
		<div id="fbPageMain">
			<header class="fbHeader">
				<div class="fbHeaderText">
					<h1 class="fbTitle">反馈广场</h1>
					<p class="fbLead">
						别人提过的问题与想法都在这里。翻一翻再决定要不要新建，
						提交的内容会同步到
						<a href="https://github.com/Ckarefulon/Ckarefulon.github.io/discussions" target="_blank" rel="noopener noreferrer" id="fbDiscussionsLink">GitHub Discussions</a>。
					</p>
				</div>
				<button class="fbNewBtn" id="fbNewBtn" type="button">
					<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
					<span>新建</span>
				</button>
			</header>

			<div class="fbFilters" id="fbFilters" role="tablist" aria-label="按类型筛选">
				<!--
					跟进状态筛选（issue #37 / #29）：收进一个下拉框放在最前面，
					不再把六项横着铺一屏。默认只看「已反馈 / 已跟进 / 已计划」。
				-->
				<div class="fbStatesDrop" id="fbStatesDrop">
					<button class="fbStatesBtn" id="fbStatesBtn" type="button"
						aria-haspopup="true" aria-expanded="false" aria-controls="fbStatesPanel">
						<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor"
							stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polygon points="3 5 21 5 14 13 14 20 10 18 10 13"/></svg>
						<span class="fbStatesBtnText" id="fbStatesBtnText">状态</span>
						<svg class="fbStatesCaret" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor"
							stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
					</button>
					<div class="fbStatesPanel" id="fbStatesPanel" role="group" aria-label="按跟进状态筛选" hidden>
						<label class="fbStateCheck"><input type="checkbox" data-state="open" checked><span>已反馈</span></label>
						<label class="fbStateCheck"><input type="checkbox" data-state="followed" checked><span>已跟进</span></label>
						<label class="fbStateCheck"><input type="checkbox" data-state="planned" checked><span>已计划</span></label>
						<label class="fbStateCheck"><input type="checkbox" data-state="complete"><span>已完成</span></label>
						<label class="fbStateCheck"><input type="checkbox" data-state="duplicate"><span>重复</span></label>
						<label class="fbStateCheck"><input type="checkbox" data-state="not_planned"><span>不计划</span></label>
					</div>
				</div>

				<button class="fbFilter isActive" type="button" data-filter="all" role="tab" aria-selected="true">全部</button>
				<button class="fbFilter" type="button" data-filter="bug" role="tab" aria-selected="false">Bug</button>
				<button class="fbFilter" type="button" data-filter="feature" role="tab" aria-selected="false">Feature</button>
				<button class="fbFilter" type="button" data-filter="question" role="tab" aria-selected="false">Question</button>
				<button class="fbFilter" type="button" data-filter="chat" role="tab" aria-selected="false">Chat</button>
				<button class="fbFilter" type="button" data-filter="others" role="tab" aria-selected="false">Others</button>
			</div>

			<div class="fbListStatus" id="fbListStatus">正在加载…</div>
			<div class="fbList" id="fbList"></div>

			<div class="fbLoadMoreWrap">
				<button class="fbLoadMore" id="fbLoadMore" type="button" hidden>加载更多</button>
			</div>
		</div>

		<!-- ========== 详情视图 ========== -->
		<div id="fbPageDetail" hidden>
			<button class="fbBackBtn" id="fbBackBtn" type="button">
				<svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
				<span>返回广场</span>
			</button>
			<div id="fbDetailBody"></div>
		</div>
	</main>

	<!-- ========== 新建弹窗 ========== -->
	<div class="fbOverlay" id="fbOverlay" role="dialog" aria-modal="true" aria-labelledby="fbComposeTitle">
		<div class="fbModal">
			<div class="fbModalHead">
				<span class="fbModalTitle" id="fbComposeTitle">新建反馈</span>
				<!-- 上次写过的内容不自动填进来；点这里才恢复（localStorage 里仍留 7 天）。紧跟标题、居左。 -->
				<button class="fbRestoreBtn" id="fbRestoreBtn" type="button" hidden
					title="把上次没提交的内容填回表单">恢复上次内容</button>
				<button class="fbModalClose" id="fbComposeClose" type="button" title="关闭" aria-label="关闭">&times;</button>
			</div>

			<div class="fbField">
				<label class="fbLabel" for="fbTitle">标题</label>
				<input class="fbContact fbTitleInput" id="fbTitle" type="text" maxlength="120"
					placeholder="一句话概括，例如「窄屏下顶栏图标会错位」" autocomplete="off">
				<div class="fbFieldHint">标题与内容留空任意一个，提交时会自动用另一个补上。</div>
			</div>

			<div class="fbField">
				<span class="fbLabel">类型</span>
				<div class="fbTypes" id="fbTypes" role="tablist" aria-label="反馈类型">
					<button class="fbType isActive" type="button" data-type="bug" role="tab" aria-selected="true">Bug</button>
					<button class="fbType" type="button" data-type="feature" role="tab" aria-selected="false">Feature</button>
					<button class="fbType" type="button" data-type="question" role="tab" aria-selected="false">Question</button>
					<button class="fbType" type="button" data-type="chat" role="tab" aria-selected="false">Chat</button>
					<button class="fbType" type="button" data-type="others" role="tab" aria-selected="false">Others</button>
				</div>
				<div class="fbTypeHint" id="fbTypeHint"></div>
			</div>

			<!--
				内容区（issue #11 二轮 / Markdown 预览）：
				图片走「写」「预览」两个标签页 —— 和 GitHub 一样，
				选完图立刻上传，正文里先出现占位，传完自动换成图片。
			-->
			<div class="fbField">
				<div class="fbFieldHead">
					<label class="fbLabel" for="fbBody">内容</label>
					<div class="fbBodyTabs" role="tablist" aria-label="内容编辑与预览">
						<button class="fbBodyTab isActive" id="fbTabWrite" type="button" role="tab" aria-selected="true">写</button>
						<button class="fbBodyTab" id="fbTabPreview" type="button" role="tab" aria-selected="false">预览</button>
					</div>
				</div>
				<div id="fbBodyWrite">
					<textarea class="fbBody" id="fbBody" rows="7" maxlength="8000"
						placeholder="想说什么都可以。如果是 Bug，尽量写下你在哪一页、点了什么、看到了什么。支持 Markdown。"></textarea>
					<div class="fbBodyFoot">
						<input class="fbFileInput" id="fbImages" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden>
						<button class="fbTool fbBodyTool" id="fbImagePick" type="button" title="也可以直接把图片拖进来或粘贴进来">
							<span aria-hidden="true">🖼</span> 添加图片
						</button>
						<span class="fbImageHint" id="fbImageHint">PNG / JPEG / GIF / WebP，单张 10 MB 以内；图片会插在光标处</span>
					</div>
				</div>
				<div class="fbBodyPreview markdown-body" id="fbBodyPreview" hidden></div>
			</div>

			<div class="fbField">
				<label class="fbLabel" for="fbContact">联系方式<span class="fbOptional">选填</span></label>
				<input class="fbContact" id="fbContact" type="text" maxlength="140"
					placeholder="邮箱 / GitHub 用户名，方便回访" autocomplete="off">
			</div>

			<div class="fbField">
				<label class="fbLabel" for="fbPage">来源页面<span class="fbOptional">自动填写</span></label>
				<input class="fbContact fbPageInput" id="fbPage" type="text" maxlength="300"
					placeholder="例如 /Cube/Formula/" autocomplete="off">
				<div class="fbFieldHint" id="fbPageHint">从顶栏反馈图标进来时会自动填上你所在的那一页，提交后会写在帖子最上面。</div>
			</div>

			<!--
				附带信息（issue #18）：以前这些一律强行塞进正文，用户没法选。
				现在只剩「来源页面」必带（它已经写在上面那个框里），其余按勾选。
			-->
			<div class="fbField">
				<span class="fbLabel">一并提交</span>
				<div class="fbAttach" id="fbAttach">
					<label class="fbStateCheck"><input type="checkbox" data-attach="viewport" checked><span>视口与屏幕</span></label>
					<label class="fbStateCheck"><input type="checkbox" data-attach="ua" checked><span>浏览器标识</span></label>
					<label class="fbStateCheck"><input type="checkbox" data-attach="page" checked><span>完整页面地址</span></label>
					<label class="fbStateCheck"><input type="checkbox" data-attach="theme"><span>当前主题</span></label>
					<label class="fbStateCheck"><input type="checkbox" data-attach="referrer"><span>来源网址</span></label>
				</div>
				<div class="fbFieldHint">勾上的会放进帖子里的「环境信息」折叠块，随时可点开。</div>
			</div>

			<!-- 匿名提交（登录用户才有意义）：勾上就不记录登录身份，与游客提交无差别。
			     未登录时不显示这一行 —— 游客本来就是以游客身份提交。 -->
			<div class="fbField" id="fbAnonField" hidden>
				<label class="fbStateCheck"><input type="checkbox" id="fbAnonymous"><span>匿名提交</span></label>
				<div class="fbFieldHint">勾上后不记录你的登录身份：列表和详情里都显示「游客」，和你没登录时提交一样。</div>
			</div>

			<input class="fbHp" id="fbHp" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">

			<div class="fbStatus" id="fbStatus"></div>

			<div class="fbModalActions">
				<button class="siteHeaderBtn" id="fbGithubBtn" type="button">在 GitHub 中打开</button>
				<button class="siteHeaderBtn loginBtnPrimary fbSubmit" id="fbSubmitBtn" type="button">提交</button>
			</div>
		</div>
	</div>

	<script>
		/* nav.js 只注册 window.siteNav，顶栏要由页面自己 init（与全站其它页一致） */
		(function () {
			function applyTheme(theme) {
				theme = theme === "dark" ? "dark" : "light";
				document.documentElement.dataset.theme = theme;
				var btn = document.getElementById("siteThemeToggle");
				if (btn) { btn.textContent = theme === "dark" ? "\u2600" : "\u263E"; }
				try { localStorage.setItem("smartCubeTheme", theme); } catch (e) {}
			}
			function boot() {
				if (window.siteNav && typeof window.siteNav.init === "function") {
					window.siteNav.init({ setTheme: applyTheme });
				}
			}
			if (document.readyState === "loading") {
				document.addEventListener("DOMContentLoaded", boot);
			} else {
				boot();
			}
		})();
	</script>
</body>
</html>
