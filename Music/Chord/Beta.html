<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="https://cdn.tailwindcss.com"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#3B82F6',
          },
        },
      }
    }
  </script>
  
  <style type="text/tailwindcss">
    @layer utilities {
      .chord-hover {
        @apply transition-all duration-200 hover:scale-105 hover:shadow-lg active:scale-95;
      }
      .btn-octave {
        @apply px-4 py-2 rounded-lg font-medium transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2;
      }
      .playing {
        @apply bg-primary/20 border-2 border-primary;
      }
      .fading {
        @apply opacity-70;
      }
    }
  </style>
</head>
<body class="bg-gray-100 p-4 min-h-screen flex flex-col items-center justify-center">
  <!-- 八度控制区域（纯文字按钮，无图标） -->
  <div class="flex justify-center items-center gap-6 mb-8 w-full max-w-md">
    <button id="octave-down" class="btn-octave bg-primary/90 text-white hover:bg-primary focus:ring-primary">
      降八度
    </button>
    <button id="octave-up" class="btn-octave bg-primary/90 text-white hover:bg-primary focus:ring-primary">
      升八度
    </button>
  </div>
  
  <!-- 7个和弦按钮（居中显示） -->
  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-7 gap-4 w-full max-w-5xl">
    <div class="chord-item bg-white rounded-xl shadow-md p-6 flex flex-col items-center justify-center chord-hover cursor-pointer" data-chord="C">
      <h3 class="text-2xl font-bold text-primary mb-1">C</h3>
      <p class="text-sm text-gray-500">C-E-G</p>
    </div>
    
    <div class="chord-item bg-white rounded-xl shadow-md p-6 flex flex-col items-center justify-center chord-hover cursor-pointer" data-chord="Dm">
      <h3 class="text-2xl font-bold text-primary mb-1">Dm</h3>
      <p class="text-sm text-gray-500">D-F-A</p>
    </div>
    
    <div class="chord-item bg-white rounded-xl shadow-md p-6 flex flex-col items-center justify-center chord-hover cursor-pointer" data-chord="Em">
      <h3 class="text-2xl font-bold text-primary mb-1">Em</h3>
      <p class="text-sm text-gray-500">E-G-B</p>
    </div>
    
    <div class="chord-item bg-white rounded-xl shadow-md p-6 flex flex-col items-center justify-center chord-hover cursor-pointer" data-chord="F">
      <h3 class="text-2xl font-bold text-primary mb-1">F</h3>
      <p class="text-sm text-gray-500">F-A-C</p>
    </div>
    
    <div class="chord-item bg-white rounded-xl shadow-md p-6 flex flex-col items-center justify-center chord-hover cursor-pointer" data-chord="G">
      <h3 class="text-2xl font-bold text-primary mb-1">G</h3>
      <p class="text-sm text-gray-500">G-B-D</p>
    </div>
    
    <div class="chord-item bg-white rounded-xl shadow-md p-6 flex flex-col items-center justify-center chord-hover cursor-pointer" data-chord="Am">
      <h3 class="text-2xl font-bold text-primary mb-1">Am</h3>
      <p class="text-sm text-gray-500">A-C-E</p>
    </div>
    
    <div class="chord-item bg-white rounded-xl shadow-md p-6 flex flex-col items-center justify-center chord-hover cursor-pointer" data-chord="Bdim">
      <h3 class="text-2xl font-bold text-primary mb-1">Bdim</h3>
      <p class="text-sm text-gray-500">B-D-F</p>
    </div>
  </div>
</body>

<script>
  const audioContext = new (window.AudioContext || window.webkitAudioContext)();
  let currentOscillators = [];
  let currentChord = null;
  let currentChordElement = null;
  let octaveOffset = 0;
  const fadeDuration = 100; // 快速淡出

  // 和弦基准频率
  const chordNotes = {
    'C': [261.63, 329.63, 392.00],
    'Dm': [293.66, 349.23, 440.00],
    'Em': [329.63, 392.00, 493.88],
    'F': [349.23, 440.00, 523.25],
    'G': [392.00, 493.88, 587.33],
    'Am': [440.00, 523.25, 659.25],
    'Bdim': [493.88, 587.33, 698.46]
  };

  // 淡出并停止当前和弦
  function stopAndFadeCurrent() {
    return new Promise((resolve) => {
      if (currentOscillators.length === 0) {
        resolve();
        return;
      }

      if (currentChordElement) currentChordElement.classList.add('fading');

      currentOscillators.forEach(({ oscillator, gain }) => {
        const currentTime = audioContext.currentTime;
        gain.gain.setValueAtTime(gain.gain.value, currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, currentTime + fadeDuration / 1000);
        setTimeout(() => {
          oscillator.stop();
          oscillator.disconnect();
        }, fadeDuration);
      });

      setTimeout(() => {
        currentOscillators = [];
        if (currentChordElement) {
          currentChordElement.classList.remove('playing', 'fading');
          currentChordElement = null;
        }
        currentChord = null;
        resolve();
      }, fadeDuration);
    });
  }

  // 播放和弦
  function playChord(chordName, element) {
    if (audioContext.state === 'suspended') audioContext.resume();

    const baseNotes = chordNotes[chordName];
    const notesWithOctave = baseNotes.map(note => note * Math.pow(2, octaveOffset));

    notesWithOctave.forEach(frequency => {
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(frequency, audioContext.currentTime);
      gainNode.gain.value = 0.12;
      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);
      oscillator.start();
      currentOscillators.push({ oscillator, gain: gainNode });
    });

    currentChord = chordName;
    currentChordElement = element;
    element.classList.add('playing');
  }

  // 切换和弦逻辑
  async function toggleChord(chordName, element) {
    if (audioContext.state === 'suspended') await audioContext.resume();

    if (currentChord === chordName) {
      await stopAndFadeCurrent();
      return;
    }

    await stopAndFadeCurrent();
    playChord(chordName, element);
  }

  // 八度控制事件
  document.getElementById('octave-down').addEventListener('click', () => {
    if (octaveOffset > -2) octaveOffset--;
  });

  document.getElementById('octave-up').addEventListener('click', () => {
    if (octaveOffset < 2) octaveOffset++;
  });

  // 和弦点击事件
  document.querySelectorAll('.chord-item').forEach(item => {
    item.addEventListener('click', () => toggleChord(item.dataset.chord, item));
  });

  // 页面可见性处理
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) audioContext.suspend();
    else audioContext.resume();
  });
</script>
</html>
