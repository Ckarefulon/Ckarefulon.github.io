<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<link rel="icon" href="/favicon.svg?v=1877" type="image/svg+xml">

	<!-- 主题先落地，避免深浅色闪一下（与其它页面共用 smartCubeTheme） -->
	<script>
		(function () {
			var saved = null;
			try { saved = localStorage.getItem("smartCubeTheme"); } catch (e) {}
			var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
			document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
		})();
	</script>

	<!-- 设计令牌（dsk-*），必须先于页面样式 -->
	<link rel="stylesheet" href="/ui/colors_and_type.css">
	<link rel="stylesheet" href="/nav/nav.css?v=2475">
	<script src="/nav/nav.js?v=2593" defer></script>

	<!-- 站点作用域（必须先于云同步定义）。本页纯本地处理，不加载 Supabase -->
	<script src="/assets/services/core/site-scope.js?v=2255" defer></script>

	<title>DarkPDF — PDF 反色（黑底白字）</title>
	<style>
		/* ---------- 令牌映射：整页跟随站点深浅色 ---------- */
		:root {
			--dk-panel: var(--dsk-card);
			--dk-panel-2: var(--dsk-background-elevated);
			--dk-line: var(--dsk-border);
			--dk-text: var(--dsk-foreground);
			--dk-muted: var(--dsk-foreground-muted);
			--dk-dim: var(--dsk-foreground-subtle);
			--dk-accent: var(--dsk-primary);
			--dk-glow: var(--dsk-accent);
			--dk-accent-soft: var(--dsk-primary-soft);
			--dk-mono: var(--dsk-font-mono);
			--dk-track: var(--dsk-muted);
			--dk-overlay: rgba(6, 8, 11, 0.72);
			--dk-viewer-bg:
				radial-gradient(circle at 50% 0, rgba(107, 93, 194, 0.18), transparent 58%),
				linear-gradient(180deg, #0e1016, #090b0f);
		}
		:root[data-theme="light"] {
			--dk-overlay: rgba(244, 246, 251, 0.84);
			--dk-viewer-bg:
				radial-gradient(circle at 50% 0, rgba(93, 78, 168, 0.10), transparent 58%),
				linear-gradient(180deg, #eef0f7, #e6e9f2);
		}

		* { box-sizing: border-box; }
		html, body { height: 100%; }
		body {
			margin: 0;
			background-image: var(--dsk-page-bg);
			background-attachment: fixed;
			color: var(--dk-text);
			font: 14px/1.5 var(--dsk-font-sans);
			-webkit-font-smoothing: antialiased;
			overflow: hidden;
		}

		.dkApp {
			height: calc(100dvh - var(--site-nav-height));
			display: flex;
			flex-direction: column;
			overflow: hidden;
		}

		/* ---------- 工具条 ---------- */
		.dkBar {
			flex: none;
			height: 52px;
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 0 16px;
			background: var(--dk-panel);
			border-bottom: 1px solid var(--dk-line);
			position: relative;
			z-index: 5;
		}
		.dkLogo {
			display: flex; align-items: center; gap: 9px;
			font-weight: 600; letter-spacing: .2px;
			font-size: var(--dsk-text-base);
		}
		.dkLogo .dot {
			width: 9px; height: 9px; border-radius: 50%;
			background: var(--dk-glow); box-shadow: 0 0 12px var(--dk-glow);
		}
		.dkLogo small { color: var(--dk-dim); font-weight: 400; font-size: 12px; }
		.dkSpacer { flex: 1; }
		.dkBtn {
			appearance: none;
			border: 1px solid var(--dk-line);
			background: var(--dk-panel-2);
			color: var(--dk-text);
			height: 32px; padding: 0 13px;
			border-radius: 9px; cursor: pointer;
			font: inherit; font-size: 13px;
			display: inline-flex; align-items: center; gap: 7px;
			transition: border-color .16s ease, background .16s ease, color .16s ease;
			white-space: nowrap;
		}
		.dkBtn:hover { border-color: var(--dsk-primary-ring); background: var(--dsk-primary-soft); }
		.dkBtn:active { transform: translateY(1px); }
		.dkBtn:focus-visible { outline: 2px solid var(--dsk-ring); outline-offset: 2px; }
		.dkBtn.primary {
			background: var(--dsk-primary);
			border-color: var(--dsk-primary);
			color: var(--dsk-primary-foreground);
			font-weight: 600;
		}
		.dkBtn.primary:hover { background: var(--dsk-primary-hover); border-color: var(--dsk-primary-hover); }
		.dkBtn:disabled { opacity: .42; cursor: not-allowed; transform: none; }

		/* ---------- 布局 ---------- */
		main { display: flex; flex: 1; min-height: 0; }
		aside {
			width: 276px; flex: 0 0 276px;
			background: var(--dk-panel);
			border-right: 1px solid var(--dk-line);
			overflow-y: auto;
			padding: 16px 16px 24px;
		}
		aside::-webkit-scrollbar { width: 10px; }
		aside::-webkit-scrollbar-thumb {
			background: var(--dk-line); border-radius: 6px;
			border: 3px solid var(--dk-panel); background-clip: content-box;
		}
		.grp { margin-bottom: 20px; }
		.grp > h3 {
			margin: 0 0 10px;
			font-size: var(--dsk-text-xs);
			font-weight: 600;
			letter-spacing: 1.2px;
			color: var(--dk-dim);
			text-transform: uppercase;
			font-family: var(--dk-mono);
		}
		.seg {
			display: flex; gap: 3px;
			background: var(--dk-panel-2);
			border: 1px solid var(--dk-line);
			border-radius: 9px; padding: 3px;
		}
		.seg button {
			flex: 1; height: 28px;
			border: 0; border-radius: 6px;
			background: transparent; color: var(--dk-muted);
			font: inherit; font-size: 12.5px; cursor: pointer;
			transition: .15s;
		}
		.seg button:hover { color: var(--dk-text); }
		.seg button.on {
			background: var(--dk-accent-soft);
			color: var(--dk-text);
			font-weight: 600;
			box-shadow: inset 0 0 0 1px var(--dsk-primary-ring);
		}
		.row { display: flex; align-items: center; justify-content: space-between; margin: 13px 0 5px; }
		.row label { font-size: 12.5px; color: var(--dk-muted); }
		.row .val {
			font-family: var(--dk-mono); font-size: 12px; color: var(--dk-text);
			background: var(--dk-panel-2); border: 1px solid var(--dk-line);
			border-radius: 5px; padding: 1px 7px; min-width: 42px; text-align: right;
		}
		input[type=range] {
			-webkit-appearance: none; appearance: none;
			width: 100%; height: 18px;
			background: transparent; cursor: pointer; display: block;
		}
		input[type=range]::-webkit-slider-runnable-track {
			height: 4px; border-radius: 3px; background: var(--dk-track);
		}
		input[type=range]::-webkit-slider-thumb {
			-webkit-appearance: none; appearance: none;
			width: 13px; height: 13px; border-radius: 50%;
			background: var(--dk-accent);
			margin-top: -4.5px;
			border: 2px solid var(--dk-panel);
			box-shadow: 0 0 0 1px var(--dsk-primary-ring);
		}
		input[type=range]:active::-webkit-slider-thumb { background: var(--dsk-primary-hover); }
		input[type=range]::-moz-range-track { height: 4px; border-radius: 3px; background: var(--dk-track); }
		input[type=range]::-moz-range-thumb {
			width: 11px; height: 11px; border-radius: 50%;
			background: var(--dk-accent); border: 2px solid var(--dk-panel);
		}
		select {
			width: 100%; height: 32px;
			background: var(--dk-panel-2); color: var(--dk-text);
			border: 1px solid var(--dk-line); border-radius: 8px;
			padding: 0 8px; font: inherit; font-size: 13px; cursor: pointer;
		}
		select:focus-visible { outline: 2px solid var(--dsk-ring); outline-offset: 1px; }
		.chk {
			display: flex; align-items: center; gap: 8px;
			margin-top: 14px; cursor: pointer;
			font-size: 12.5px; color: var(--dk-muted); user-select: none;
		}
		.chk input {
			appearance: none; -webkit-appearance: none;
			width: 15px; height: 15px; border-radius: 4px;
			border: 1px solid var(--dk-line);
			background: var(--dk-panel-2);
			cursor: pointer; position: relative;
			transition: .15s; flex: 0 0 auto;
		}
		.chk input:checked { background: var(--dk-accent); border-color: var(--dk-accent); }
		.chk input:checked::after {
			content: ""; position: absolute; left: 4.5px; top: 1.5px;
			width: 4px; height: 8px;
			border: 2px solid var(--dsk-primary-foreground);
			border-top: 0; border-left: 0; transform: rotate(43deg);
		}
		.chk:hover span { color: var(--dk-text); }
		.hint { font-size: 11.5px; line-height: 1.65; color: var(--dk-dim); margin-top: 8px; }
		.hint b { color: var(--dk-muted); font-weight: 600; }
		.stat {
			border-top: 1px solid var(--dk-line);
			margin-top: 4px; padding-top: 12px;
			font-size: 11.5px; color: var(--dk-dim);
			font-family: var(--dk-mono); line-height: 1.75;
		}
		.stat span { color: var(--dk-muted); }

		/* ---------- 预览区 ---------- */
		.viewer {
			flex: 1; min-width: 0;
			position: relative;
			overflow-y: auto; overflow-x: auto;
			padding: 24px 24px 80px;
			background: var(--dk-viewer-bg);
		}
		.viewer::-webkit-scrollbar { width: 12px; height: 12px; }
		.viewer::-webkit-scrollbar-thumb {
			background: var(--dk-line); border-radius: 6px;
			border: 3px solid transparent; background-clip: content-box;
		}
		#pages { display: flex; flex-direction: column; align-items: center; gap: 22px; }
		.pg {
			position: relative;
			background: #000;
			border-radius: 3px;
			box-shadow: 0 8px 30px rgba(0, 0, 0, .55), 0 0 0 1px rgba(255, 255, 255, .08);
		}
		.pg canvas { display: block; border-radius: 3px; }
		.pg .no {
			position: absolute; left: 50%; top: 0; transform: translate(-50%, 0);
			background: var(--dk-panel-2); border: 1px solid var(--dk-line);
			color: var(--dk-dim);
			font-family: var(--dk-mono); font-size: 10.5px;
			padding: 1px 7px; border-radius: 0 0 6px 6px;
			opacity: 0; transition: opacity .2s ease;
		}
		.pg:hover .no { opacity: 1; }

		/* ---------- 空状态 ---------- */
		#empty {
			position: absolute; inset: 0;
			display: flex; flex-direction: column;
			align-items: center; justify-content: center;
			gap: 16px; padding: 32px; text-align: center;
		}
		#empty .card {
			border: 1.5px dashed var(--dk-line);
			border-radius: 16px;
			padding: 44px 54px;
			max-width: 440px;
			cursor: pointer;
			background: var(--dk-panel);
			transition: border-color .2s ease, background .2s ease;
		}
		#empty.drag .card { border-color: var(--dk-glow); background: var(--dsk-primary-soft); }
		#empty h2 { margin: 0 0 6px; font-size: var(--dsk-text-lg); font-weight: 600; }
		#empty p { margin: 0; color: var(--dk-muted); font-size: 13px; line-height: 1.7; }
		#empty .kbd { font-family: var(--dk-mono); font-size: 11px; color: var(--dk-dim); margin-top: 14px; }

		/* ---------- 进度遮罩 / 提示 ---------- */
		#busy {
			position: fixed; inset: 0;
			background: var(--dk-overlay);
			-webkit-backdrop-filter: blur(3px);
			backdrop-filter: blur(3px);
			display: none; align-items: center; justify-content: center;
			z-index: 900;
		}
		#busy.on { display: flex; }
		#busy .box {
			background: var(--dk-panel);
			border: 1px solid var(--dk-line);
			border-radius: 12px;
			padding: 20px 26px;
			display: flex; align-items: center; gap: 13px;
			font-size: 13px;
			box-shadow: var(--dsk-shadow-lg);
		}
		.spin {
			width: 16px; height: 16px;
			border: 2px solid var(--dk-line);
			border-top-color: var(--dk-glow);
			border-radius: 50%;
			animation: sp .7s linear infinite;
		}
		@keyframes sp { to { transform: rotate(360deg); } }
		.toast {
			position: fixed; left: 50%; bottom: 28px;
			transform: translate(-50%, 16px); opacity: 0;
			background: var(--dk-panel-2);
			border: 1px solid var(--dk-line);
			color: var(--dk-text);
			padding: 9px 16px; border-radius: 9px;
			font-size: 13px; transition: .25s;
			pointer-events: none; z-index: 950;
			box-shadow: var(--dsk-shadow-lg);
			max-width: 80vw;
		}
		.toast.on { opacity: 1; transform: translate(-50%, 0); }
		.toast.err { border-color: var(--dsk-danger); background: var(--dsk-danger); color: #fff; }

		/* ---------- 窄屏 ---------- */
		@media (max-width: 900px) {
			body { overflow: auto; }
			.dkApp { height: auto; min-height: calc(100dvh - var(--site-nav-height)); }
			.dkBar { height: auto; min-height: 52px; flex-wrap: wrap; padding: 8px 12px; gap: 8px; }
			.dkLogo small { display: none; }
			main { flex-direction: column; }
			aside {
				width: 100%; flex: none;
				border-right: 0; border-bottom: 1px solid var(--dk-line);
				padding: 14px 14px 18px;
			}
			.viewer { overflow: visible; padding: 16px 12px 56px; min-height: 62vh; }
			#empty .card { padding: 34px 24px; }
		}
	</style>
</head>
<body>

<div class="dkApp">
	<div class="dkBar">
		<div class="dkLogo"><span class="dot"></span>DarkPDF<small>黑底白字</small></div>
		<div class="dkSpacer"></div>
		<button class="dkBtn" id="openBtn">打开 PDF</button>
		<button class="dkBtn primary" id="vecBtn" disabled>导出矢量 PDF</button>
		<input type="file" id="file" accept="application/pdf,.pdf" hidden>
	</div>

	<main>
		<aside>
			<div class="grp">
				<h3>反色</h3>
				<div class="seg" id="modeSeg">
					<button data-mode="invert" class="on">反色</button>
					<button data-mode="threshold">阈值</button>
					<button data-mode="none">原样</button>
				</div>
				<div class="row"><label for="bg">背景灰度</label><span class="val" id="bgVal">18</span></div>
				<input type="range" id="bg" min="0" max="60" value="18">
				<div class="row"><label for="ink">文字亮度</label><span class="val" id="inkVal">229</span></div>
				<input type="range" id="ink" min="150" max="255" value="229">
				<div id="thrWrap" hidden>
					<div class="row"><label for="thr">阈值</label><span class="val" id="thrVal">150</span></div>
					<input type="range" id="thr" min="30" max="230" value="150">
					<div class="row"><label for="sm">边缘平滑</label><span class="val" id="smVal">6</span></div>
					<input type="range" id="sm" min="0" max="24" value="6">
				</div>
				<label class="chk"><input type="checkbox" id="autoLv" checked><span>自动色阶（扫描件灰底压成纯黑）</span></label>
				<label class="chk"><input type="checkbox" id="edgeTrim" checked><span>裁掉扫描暗边（反色后不留白角）</span></label>
				<label class="chk"><input type="checkbox" id="imgInv" checked><span>位图一并处理</span></label>
				<p class="hint">彩色一律转黑白：取反后红变青，不转灰就不是「黑底白字」。<br>
					「阈值」把页面二值化：小于阈值算墨，适合底色发灰的扫描件。<br>
					<b>这里的设置会自动记住</b>，下次打开还是你这套数值。</p>
			</div>

			<div class="grp">
				<h3>视图</h3>
				<select id="zoom">
					<option value="fit" selected>适合宽度</option>
					<option value="0.75">75%</option>
					<option value="1">100%</option>
					<option value="1.25">125%</option>
					<option value="1.5">150%</option>
					<option value="2">200%</option>
				</select>
			</div>

			<div class="grp">
				<h3>导出</h3>
				<select id="dpi">
					<option value="150">图片 PDF · 150 dpi</option>
					<option value="300" selected>图片 PDF · 300 dpi</option>
					<option value="450">图片 PDF · 450 dpi</option>
				</select>
				<button class="dkBtn" id="imgBtn" style="width:100%;margin-top:8px;justify-content:center" disabled>导出图片 PDF</button>
				<button class="dkBtn" id="pngBtn" style="width:100%;margin-top:8px;justify-content:center" disabled>导出当前页 PNG</button>
				<p class="hint"><b>矢量 PDF</b> 直接改写内容流，文字仍可选中/搜索，体积几乎不变；<b>图片 PDF</b> 按当前反色设置逐页光栅化，扫描件用它更稳。</p>
			</div>

			<div class="stat" id="stat">
				<div>文件 <span id="stName">—</span></div>
				<div>页数 <span id="stPages">—</span></div>
				<div>体积 <span id="stSize">—</span></div>
			</div>
		</aside>

		<div class="viewer" id="viewer">
			<div id="pages"></div>
			<div id="empty">
				<div class="card" id="drop">
					<h2>拖入 PDF 文件</h2>
					<p>或点击这里选择文件<br>全程在本机浏览器内处理，不上传任何数据</p>
					<div class="kbd">黑白文档 → 黑底白字 · 矢量输出</div>
				</div>
			</div>
		</div>
	</main>
</div>

<div id="busy"><div class="box"><div class="spin"></div><span id="busyText">处理中…</span></div></div>

<!-- ===== 反色核心 ===== -->
<script>
/* ============================================================
 * invert-core.js —— 颜色算子重写核心（浏览器 / Node 通用）
 *
 * 把 PDF 内容流里的颜色算子逐通道取反，使其成为"黑底白字"。
 * 不依赖渲染器的混合模式(blend mode)，因此 pdfium / poppler / Acrobat /
 * 浏览器预览 / 打印链路表现一致，且输出仍是矢量。
 *
 * 关键点：操作数先缓冲，遇到算子时才决定"原样输出"还是"改写后输出"，
 * 否则同一个操作数会被输出两遍（`0 0 0 scn` → `0 0 0 1 1 1 scn`，参数超量报错）。
 * ============================================================ */

const WS_CODE = new Set([0x00, 0x09, 0x0a, 0x0c, 0x0d, 0x20]);
const DELIM = new Set([...'()<>[]{}/%'].map((c) => c.charCodeAt(0)));

const COLOR_1 = new Set(['g', 'G']);
const COLOR_N = new Set(['rg', 'RG', 'k', 'K', 'sc', 'scn', 'SC', 'SCN']);
const STROKE_N = new Set(['RG', 'K', 'SC', 'SCN']);

/** RGB / CMYK 操作数 -> 0..1 亮度（CMYK 按油墨覆盖反算） */
function luminance(nums) {
  let l;
  if (nums.length === 3) l = 0.299 * nums[0] + 0.587 * nums[1] + 0.114 * nums[2];
  else {
    const [c, m, y, k] = nums;
    l = 1 - Math.min(1, 0.3 * c + 0.59 * m + 0.11 * y + k);
  }
  return l < 0 ? 0 : l > 1 ? 1 : l;
}

/* ============================================================
 * 自动色阶曲线（预览 / 矢量导出 / 位图导出 共用同一份）
 *
 * 预览按「像素直方图」走、矢量导出按「内容流里出现过的灰度」走，
 * 只要两边都调用这一个函数，得到的映射就完全一致 —— 否则就是
 * 「预览好看、导出变样」。
 * ============================================================ */

/** smootherstep：两端平、中间陡，浅灰（水印/纸纹）压到背景，墨仍落在最亮端 */
function smoothstepCurve(t) {
  return t * t * t * (t * (t * 6 - 15) + 10);
}

/**
 * 由直方图求出纸/墨两端，返回 256 项查找表（索引 = 输入灰阶 0..255）。
 * @param {Uint32Array|Array<number>} hist 256 项直方图
 * @param {number} total 直方图样本总数
 * @param {number} bg255 背景灰度 0..255
 * @param {number} ink255 文字亮度 0..255
 * @param {boolean} auto 是否自动色阶（false 时两端固定 0/255）
 * @returns {Uint8ClampedArray}
 */
function makeLevelsLut(hist, total, bg255, ink255, auto) {
  const n = total || 1;
  const pick = (p) => {
    let acc = 0;
    const target = n * p;
    for (let v = 0; v < 256; v++) { acc += hist[v] || 0; if (acc >= target) return v; }
    return 255;
  };
  let lo = 0, hi = 255;
  if (auto) {
    // 墨（暗端）取 0.5% 分位：真墨常只占 1-2%，3% 会被半透明水印/纸纹拖到 200 以上，
    // 水印于是被当成墨、反色后变成一片亮白。
    lo = pick(0.005); hi = pick(0.98);
    if (lo > 128) lo = 0;              // 整页没有真墨（空白页），不拉伸
    if (hi - lo < 24) { lo = 0; hi = 255; }
  }
  const span = hi - lo;
  const lut = new Uint8ClampedArray(256);
  for (let v = 0; v < 256; v++) {
    let t = span > 0 ? (v - lo) / span : v / 255;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    if (auto) t = smoothstepCurve(t);
    lut[v] = Math.round(bg255 + (1 - t) * (ink255 - bg255));
  }
  return lut;
}

/** 像素直方图（步进采样，上限约 20 万点） */
function histFromPixels(data) {
  const hist = new Uint32Array(256);
  // 采样上限放宽到 20 万点：0.5% 分位只有几百个像素，样本太少会被 JPEG 噪点带偏
  const step = Math.max(4, Math.floor(data.length / 4 / 200000) * 4);
  let n = 0;
  for (let i = 0; i + 2 < data.length; i += step) {
    hist[(0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]) | 0]++;
    n++;
  }
  return { hist, total: n };
}

/**
 * 阈值模式的查找表：小于阈值算墨，边缘按 smooth 过渡。
 * 与反色表一样是 256 项，这样三种模式在预览/导出里都能走同一条 LUT。
 */
function makeThresholdLut(bg255, ink255, thr255, smooth) {
  const thr = (thr255 == null ? 150 : thr255) / 255;
  const sm = (smooth == null ? 6 : smooth) / 255;
  const lo = thr - sm / 2, hi = thr + sm / 2;
  const span = (ink255 - bg255) / 255;
  const lut = new Uint8ClampedArray(256);
  for (let v = 0; v < 256; v++) {
    const u = v / 255;
    let t;
    if (sm <= 0) {
      t = u < thr ? 1 : 0;
    } else {
      t = (hi - u) / (hi - lo || 1);
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      t = t * t * (3 - 2 * t);      // smoothstep
    }
    lut[v] = Math.round(bg255 + t * span * 255);
  }
  return lut;
}

/** 按当前模式选一张 LUT（预览与两种导出都调这一个） */
function makeModeLut(mode, hist, total, bg255, ink255, thr255, smooth, auto) {
  if (mode === 'threshold') return makeThresholdLut(bg255, ink255, thr255, smooth);
  return makeLevelsLut(hist, total, bg255, ink255, auto);
}

/** Uint8Array -> latin1 字符串（1 字节 1 字符，可无损往返） */
function bytesToLatin1(bytes) {
  let out = '';
  const CH = 0x2000;
  for (let i = 0; i < bytes.length; i += CH) {
    out += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  }
  return out;
}

function latin1ToBytes(str) {
  const out = new Uint8Array(str.length);
  for (let i = 0; i < str.length; i++) out[i] = str.charCodeAt(i) & 0xff;
  return out;
}

function isNum(s) {
  if (!s.length) return false;
  const c = s.charCodeAt(0);
  if (!((c >= 48 && c <= 57) || c === 45 || c === 46 || c === 43)) return false;
  return !Number.isNaN(parseFloat(s));
}

function fmt(v) {
  const s = v.toFixed(6).replace(/0+$/, '').replace(/\.$/, '');
  return s === '' || s === '-0' ? '0' : s;
}

/** 读字面字符串 '(' ... ')'，返回结束后下标 */
function skipLiteral(s, i) {
  let depth = 1;
  i++;
  while (i < s.length && depth > 0) {
    const ch = s[i];
    if (ch === '\\') { i += 2; continue; }
    if (ch === '(') depth++;
    else if (ch === ')') depth--;
    i++;
  }
  return i;
}

/** 读十六进制字符串 <...>，返回结束后下标 */
function skipHex(s, i) {
  const j = s.indexOf('>', i);
  return j < 0 ? s.length : j + 1;
}

/** 读数组 [ ... ] 或字典 << ... >>，返回结束后下标 */
function skipArray(s, i, dictMode) {
  let depth = 0;
  i += dictMode ? 2 : 1;
  while (i < s.length) {
    const ch = s[i];
    if (ch === '(') { i = skipLiteral(s, i); continue; }
    if (ch === '<') {
      if (s.startsWith('<<', i)) { depth++; i += 2; continue; }
      i = skipHex(s, i); continue;
    }
    if (dictMode) {
      if (s.startsWith('>>', i)) {
        if (depth === 0) return i + 2;
        depth--; i += 2; continue;
      }
    } else {
      if (ch === '[') depth++;
      else if (ch === ']') {
        if (depth === 0) return i + 1;
        depth--;
      }
    }
    i++;
  }
  return s.length;
}

/** 跳过内联图像 BI ... ID <bin> EI，返回 'EI' 之后下标 */
function skipInlineImage(s, i) {
  let k = s.indexOf('ID', i);
  if (k < 0) return s.length;
  k += 3;
  for (;;) {
    const e = s.indexOf('EI', k);
    if (e < 0) return s.length;
    const before = s.charCodeAt(e - 1);
    const after = e + 2 < s.length ? s.charCodeAt(e + 2) : 32;
    if (WS_CODE.has(before) && WS_CODE.has(after)) return e + 2;
    k = e + 2;
  }
}

/**
 * 重写颜色算子。
 *
 * 必须与预览（paint()）用同一张查找表，否则就是「预览好看、导出不对」：
 *   mode=none       原样返回（矢量导出就是复制文件，不再反色）
 *   其它            u(0..1) → LUT[round(u*255)] / 255
 *
 * LUT 由 makeModeLut() 统一产出，预览、矢量导出、图片导出三条链路共用一份。
 *
 * @param {string} src  latin1 内容流
 * @param {number} bg   背景灰度 0..1（纸的颜色）
 * @param {number} ink  文字亮度 0..1（墨的颜色）
 * @param {{mode?:string, thr?:number, smooth?:number, lut?:Uint8ClampedArray}} [opt]
 * @returns {string}    改写后的 latin1 内容流
 */
function rewriteColors(src, bg, ink, opt) {
  const o = opt || {};
  const mode = o.mode || 'invert';
  if (mode === 'none') return src;              // 原样模式：一个字节都不碰

  const table = o.lut || null;

  /** 0..1 亮度 -> 输出灰度 0..1 */
  const mapU = (u) => {
    const v = Math.round(u * 255);
    const idx = v < 0 ? 0 : v > 255 ? 255 : v;
    if (table) return fmt(table[idx] / 255);
    // 没有 LUT 时的兜底：与 makeLevelsLut 在 auto=false 时等价
    return fmt(bg + (1 - idx / 255) * (ink - bg));
  };

  const out = [];
  let pend = '';          // 待输出的操作数原文
  let nums = [];          // 顶层数字操作数
  let pure = true;        // 操作数是否全是裸数字
  const n = src.length;
  let i = 0;

  const reset = () => { pend = ''; nums = []; pure = true; };

  while (i < n) {
    const code = src.charCodeAt(i);
    const ch = src[i];

    if (WS_CODE.has(code)) { i++; continue; }

    if (ch === '(') { const j = skipLiteral(src, i); pend += src.slice(i, j) + ' '; pure = false; i = j; continue; }
    if (ch === '<') {
      const j = src.startsWith('<<', i) ? skipArray(src, i, true) : skipHex(src, i);
      pend += src.slice(i, j) + ' '; pure = false; i = j; continue;
    }
    if (ch === '[') { const j = skipArray(src, i, false); pend += src.slice(i, j) + ' '; pure = false; i = j; continue; }
    if (ch === ']' || ch === '}' || ch === '>') { pend += ch + ' '; pure = false; i++; continue; }
    if (ch === '{') { pend += ch; pure = false; i++; continue; }
    if (ch === '/') {
      let j = i + 1;
      while (j < n && !WS_CODE.has(src.charCodeAt(j)) && !DELIM.has(src.charCodeAt(j))) j++;
      pend += src.slice(i, j) + ' '; pure = false; i = j; continue;
    }
    if (ch === '%') {
      const j = src.indexOf('\n', i);
      const e = j < 0 ? n : j;
      out.push(src.slice(i, e) + '\n'); i = e; continue;
    }

    let j = i;
    while (j < n && !WS_CODE.has(src.charCodeAt(j)) && !DELIM.has(src.charCodeAt(j))) j++;
    const tok = src.slice(i, j);
    i = j;

    if (isNum(tok)) { pend += tok + ' '; nums.push(parseFloat(tok)); continue; }

    if (tok === 'BI') {
      const k = skipInlineImage(src, i - 2);
      out.push(pend + src.slice(i - 2, k) + '\n');
      i = k; reset(); continue;
    }

    if (pure && COLOR_1.has(tok) && nums.length === 1) {
      out.push(mapU(nums[0]) + ' ' + tok + '\n');
    } else if (pure && COLOR_N.has(tok) && nums.length === 1) {
      out.push(mapU(nums[0]) + ' ' + tok + '\n');
    } else if (pure && COLOR_N.has(tok) && (nums.length === 3 || nums.length === 4)) {
      // 彩色统一降为灰度：否则红变青，出来的不是"黑底白字"
      out.push(mapU(luminance(nums)) + (STROKE_N.has(tok) ? ' G\n' : ' g\n'));
    } else {
      out.push(pend + tok + '\n');
    }
    reset();
  }

  out.push(pend);
  return out.join('');
}


/* ============================================================
 * vector-export.js —— 矢量反色（浏览器 / Node 通用，依赖 pdf-lib + invert-core）
 *
 * 流程：取每页内容流 → 颜色算子取反（彩色降为灰度）→ 前面插一张底色矩形 → 写回；
 *      再递归处理资源里的 Form XObject（水印/模板/拍平的页）；
 *      位图在浏览器里解成像素、转灰度取反后重新编码（不再用 /Decode，
 *      因为 poppler 系渲染器会忽略 /Decode，表现为"转换后毫无变化"）。
 * ============================================================ */

/**
 * @param {object} PDFLib  pdf-lib 命名空间
 * @param {Uint8Array} bytes  原 PDF 字节
 * @param {{bg:number, ink:number, mode?:string, thr?:number, smooth?:number,
 *          images?:boolean, autoLevel?:boolean, edge?:boolean}} opts  bg/ink 为 0..255
 * @param {(done:number,total:number)=>void} [onProgress]
 * @returns {Promise<{bytes:Uint8Array, failed:number, forms:number, images:number}>}
 */
async function vectorInvert(PDFLib, bytes, opts, onProgress) {
  const { PDFDocument, PDFName, PDFArray, PDFRawStream, decodePDFRawStream } = PDFLib;

  const doc = await PDFDocument.load(bytes, { ignoreEncryption: true, updateMetadata: false });
  const ctx = doc.context;
  const bg255 = opts.bg || 0;
  const ink255 = opts.ink == null ? 255 : opts.ink;
  const bg = bg255 / 255;
  const ink = ink255 / 255;
  const doImages = opts.images !== false;
  const mode = opts.mode || 'invert';
  const autoLevel = opts.autoLevel !== false;
  // 预览侧已经算好的查找表（256 项）。传进来就直接用，
  // 保证「屏幕上看到什么，导出就是什么」。
  const sharedLut = opts.lut || null;

  const seenForm = new Set();
  const imgDone = new Map();

  /* 「原样」模式：矢量导出就是原文件，不做任何改写 */
  if (mode === 'none') {
    if (onProgress) onProgress(1, 1);
    return { bytes, failed: 0, forms: 0, images: 0 };
  }

  /** 色彩空间 → 通道数。必须支持间接形式，扫描仪常写 [/ICCBased <流 /N 3>]，
   *  只认 /DeviceRGB 的名字会把这类整页扫描件直接跳过（表现为"转了跟没转一样"）。 */
  function componentsOf(cs) {
    if (!cs) return 0;
    if (cs instanceof PDFArray) {
      const h = cs.get(0) ? cs.get(0).toString() : '';
      if (h === '/ICCBased') {
        const prof = ctx.lookup(cs.get(1));
        const nn = prof && prof.dict ? prof.dict.get(PDFName.of('N')) : null;
        const v = nn && typeof nn.asNumber === 'function' ? nn.asNumber() : 0;
        return v === 1 || v === 3 || v === 4 ? v : 0;
      }
      if (h === '/CalRGB') return 3;
      if (h === '/CalGray') return 1;
      if (h === '/Separation') return 1;      // tint 值本身就是 0..1 浓度
      return 0;                               // Indexed / DeviceN：像素不是直接色彩，跳过
    }
    switch (cs.toString()) {
      case '/DeviceGray': case '/G': case '/CalGray': return 1;
      case '/DeviceRGB': case '/RGB': case '/CalRGB': return 3;
      case '/DeviceCMYK': case '/CMYK': return 4;
      default: return 0;
    }
  }
  let forms = 0, imgs = 0, failed = 0;

  /** 取出一条内容流（单条或数组）解码后合并的字节 */
  function readContents(node) {
    const raw = node.get(PDFName.of('Contents'));
    if (!raw) return new Uint8Array(0);
    const resolved = ctx.lookup(raw);
    const parts = [];
    if (resolved instanceof PDFArray) {
      for (let k = 0; k < resolved.size(); k++) {
        const s = ctx.lookup(resolved.get(k));
        if (s instanceof PDFRawStream) parts.push(decodePDFRawStream(s).decode());
      }
    } else if (resolved instanceof PDFRawStream) {
      parts.push(decodePDFRawStream(resolved).decode());
    }
    const total = parts.reduce((a, p) => a + p.length + 1, 0);
    const buf = new Uint8Array(total);
    let off = 0;
    for (const p of parts) {
      buf.set(p, off);
      off += p.length;
      buf[off++] = 0x0a;
    }
    return buf;
  }

  /** 递归：Form XObject 内容取反、位图转灰度取反 */
  async function processResources(res) {
    if (!res) return;
    const xo = res.lookup ? res.lookup(PDFName.of('XObject')) : res.get(PDFName.of('XObject'));
    if (!xo || !xo.entries) return;

    for (const [key, ref] of [...xo.entries()]) {
      const obj = ctx.lookup(ref);
      if (!obj || !obj.dict) continue;
      const sub = obj.dict.get(PDFName.of('Subtype'));
      const subName = sub ? sub.toString() : '';

      if (subName === '/Form') {
        const id = String(ref);
        if (seenForm.has(id)) continue;
        seenForm.add(id);
        try {
          // Form 的内容就是这条流本身，不在 /Contents 里
          const inner = decodePDFRawStream(obj).decode();
          const text = rewriteColors(bytesToLatin1(inner), bg, ink, {
            mode, thr: opts.thr, smooth: opts.smooth, lut,
          });
          // 复制原字典（去掉滤波器相关项）。注意 pdf-lib 的 flateStream 会 {...dict}，
          // 必须给普通对象，直接塞 PDFDict 会被摊成 {dict, context} 两个键。
          const keep = {};
          for (const [k2, v2] of obj.dict.entries()) {
            const n2 = k2.toString().replace(/^\//, '');
            if (n2 === 'Filter' || n2 === 'Length' || n2 === 'DecodeParms') continue;
            keep[n2] = v2;
          }
          const ns = ctx.flateStream(latin1ToBytes(text), keep);
          xo.set(key, ctx.register(ns));
          forms++;
          const subRes = ns.dict.get(PDFName.of('Resources'));
          await processResources(subRes ? ctx.lookup(subRes) : null);
        } catch (e) {
          /* 解不开的流就保持原样 */
        }
      } else if (subName === '/Image') {
        if (!doImages) continue;
        const id = String(ref);
        const mask = obj.dict.get(PDFName.of('ImageMask'));
        if (mask && mask.toString() === '/true') continue;
        // /ColorSpace 可能是间接引用（扫描仪导出常见），必须先 lookup
        const n = componentsOf(ctx.lookup(obj.dict.get(PDFName.of('ColorSpace'))));
        if (!n) continue;

        // 同一张图被多页共用：替换结果缓存一份，逐页挂回去
        if (imgDone.has(id)) {
          const cached = imgDone.get(id);
          if (cached) xo.set(key, cached);
          continue;
        }

        let handled = false;
        if (canRaster) {
          try {
            const ns = await grayJpegStream(obj, n);
            if (ns) {
              // 原地改写的返回的是同一个对象，再 register 会在文件里多出一份副本
              const refNew = ns === obj ? ref : ctx.register(ns);
              if (ns !== obj) xo.set(key, refNew);
              imgDone.set(id, refNew);
              imgs++;
              handled = true;
            }
          } catch (e) { console.warn('[img]', e && e.message); }
        }
        if (!handled) {
          const dec = [];
          for (let k = 0; k < n; k++) dec.push(1, 0);
          obj.dict.set(PDFName.of('Decode'), ctx.obj(dec));
          imgDone.set(id, null);
          imgs++;
        }
      }
    }
  }

  /* ---------------- 位图：解像素 → 灰度取反 → 重新编码 ---------------- */
  const canRaster = typeof createImageBitmap === 'function' &&
    (typeof document !== 'undefined' || typeof OffscreenCanvas !== 'undefined');

  const makeCanvas = (w, h) => {
    if (typeof document !== 'undefined') {
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      return c;
    }
    return new OffscreenCanvas(w, h);
  };

  const toJpeg = async (canvas) => {
    const blob = canvas.convertToBlob
      ? await canvas.convertToBlob({ type: 'image/jpeg', quality: 0.9 })
      : await new Promise((r) => canvas.toBlob(r, 'image/jpeg', 0.9));
    return new Uint8Array(await blob.arrayBuffer());
  };

  /** PNG 预测器反解（/Predictor 10-15）。
   *  pdf-lib 的 decodePDFRawStream 只做 zlib 解压，不做预测器还原；
   *  每行开头的 filter 字节被当成像素读进去，整幅图会逐行错位，看起来满屏噪点。
   *  返回 null 表示数据形状不符（不是带预测器的数据），调用方保持原样。 */
  function pngUnfilter(data, columns, rows, bpp) {
    const rowBytes = columns * bpp;
    if (data.length !== rows * (rowBytes + 1)) return null;
    const out = new Uint8Array(rows * rowBytes);
    for (let y = 0; y < rows; y++) {
      const ft = data[y * (rowBytes + 1)];
      const src = y * (rowBytes + 1) + 1;
      const dst = y * rowBytes;
      const up = dst - rowBytes;
      for (let x = 0; x < rowBytes; x++) {
        const rv = data[src + x];
        const a = x >= bpp ? out[dst + x - bpp] : 0;
        const b = y > 0 ? out[up + x] : 0;
        const c = (y > 0 && x >= bpp) ? out[up + x - bpp] : 0;
        let v;
        if (ft === 0) v = rv;
        else if (ft === 1) v = rv + a;
        else if (ft === 2) v = rv + b;
        else if (ft === 3) v = rv + ((a + b) >> 1);
        else if (ft === 4) {
          const p = a + b - c;
          const pa = Math.abs(p - a), pb = Math.abs(p - b), pc = Math.abs(p - c);
          v = rv + (pa <= pb && pa <= pc ? a : pb <= pc ? b : c);
        } else return null;
        out[dst + x] = v & 255;
      }
    }
    return out;
  }

  /** zlib 压缩（PDF 的 FlateDecode 就是 zlib 封装） */
  const deflateBytes = async (bytes) => {
    const cs = new CompressionStream('deflate');
    const stream = new Blob([bytes]).stream().pipeThrough(cs);
    return new Uint8Array(await new Response(stream).arrayBuffer());
  };

  /** 用直方图估计纸/墨两个色阶，返回 256 项查找表。
   *  曲线本体在 invert-core 的 makeLevelsLut 里，预览/矢量/位图三处共用同一份，
   *  否则同一份 PDF 会「预览一个样、导出另一个样」。 */
  const buildLut = (data, bg255, ink255, auto) => {
    const { hist, total } = histFromPixels(data);
    return makeLevelsLut(hist, total, bg255, ink255, auto);
  };

  /** 扫描件四边常有书脊/纸边的暗影，反色后会翻成白角白边。
   *  逐行逐列从四边找第一块纸色，外面的暗影直接按背景色写死。 */
  const edgeCuts = (gray, w, h, T) => {
    const cutL = new Int32Array(h), cutR = new Int32Array(h);
    const cutT = new Int32Array(w), cutB = new Int32Array(w);
    let sum = 0;
    for (let y = 0; y < h; y++) {
      const off = y * w;
      let l = -1, r = -1;
      for (let x = 0; x < w; x++) if (gray[off + x] > T) { l = x; break; }
      for (let x = w - 1; x >= 0; x--) if (gray[off + x] > T) { r = x; break; }
      // 多切 6px：纸边是 3~6px 的高光+过渡带，停在这里反色后会留一条灰白细线
      if (l > 0) { cutL[y] = l + 6; sum += l + 6; }
      if (r >= 0 && r < w - 1) { cutR[y] = w - 1 - r + 6; sum += w - 1 - r + 6; }
    }
    for (let x = 0; x < w; x++) {
      let t = -1, b = -1;
      for (let y = 0; y < h; y++) if (gray[y * w + x] > T) { t = y; break; }
      for (let y = h - 1; y >= 0; y--) if (gray[y * w + x] > T) { b = y; break; }
      if (t > 0) { cutT[x] = t + 6; sum += t + 6; }
      if (b >= 0 && b < h - 1) { cutB[x] = h - 1 - b + 6; sum += h - 1 - b + 6; }
    }
    if (sum > 0.22 * w * h * 2) return null;
    return { cutL, cutR, cutT, cutB, any: sum > 0 };
  };

  /** 读出 /Decode 数组（可能是间接引用）。
   *  扫描仪常把图像存成"反着"的：像素值 255 表示纸白、0 表示墨黑，
   *  再靠 /Decode [1 0] 在显示时翻回来。直接拿原始字节当亮度用，
   *  就会把白纸认成黑墨 —— 反色后整页发白，看起来"跟没转一样"。 */
  function readDecode(dict, nComp) {
    let d = dict.get(PDFName.of('Decode'));
    if (!d) return null;
    d = ctx.lookup(d);
    if (!(d instanceof PDFArray)) return null;
    const out = [];
    for (let i = 0; i < d.size(); i++) {
      const v = ctx.lookup(d.get(i));
      out.push(v && typeof v.asNumber === 'function' ? v.asNumber() : Number(v));
    }
    return out.length >= nComp * 2 ? out : null;
  }

  /** 按 /Decode 把样本值映射回"真实亮度"（0..255） */
  function applyDecodeTables(dec, nComp, bpc) {
    const maxV = (1 << bpc) - 1;
    const tables = [];
    for (let c = 0; c < nComp; c++) {
      const lo = dec[c * 2], hi = dec[c * 2 + 1];
      const t = new Uint8Array(maxV + 1);
      for (let v = 0; v <= maxV; v++) {
        const u = lo + (v / maxV) * (hi - lo);
        t[v] = Math.max(0, Math.min(255, Math.round(u * 255)));
      }
      tables.push(t);
    }
    return tables;
  }

  /** 把一张图像流变成灰度 JPEG 流；无法处理时返回 null（调用方退回 /Decode） */
  async function grayJpegStream(obj, nComp) {
    const filt = obj.dict.get(PDFName.of('Filter'));
    // /Filter 可能是数组（扫描仪/相机 App 常写成 [/DCTDecode]），
    // 只认名字会把整张图漏掉，退回 /Decode 后 pdfium/poppler 又不认，导出来还是白底。
    let fname = '';
    if (filt) {
      const arr = typeof filt.asArray === 'function' ? filt.asArray() : null;
      const one = arr ? arr[0] : filt;
      fname = one ? one.toString() : '';
    }
    let w, h, img;

    if (fname === '/DCTDecode') {
      const bmp = await createImageBitmap(new Blob([obj.contents], { type: 'image/jpeg' }));
      w = bmp.width; h = bmp.height;
      const cv = makeCanvas(w, h);
      const g2 = cv.getContext('2d');
      g2.drawImage(bmp, 0, 0);
      img = g2.getImageData(0, 0, w, h);
      if (bmp.close) bmp.close();
      // JPEG 同样可能挂 /Decode 反相，画到 canvas 之后按通道表翻回来
      const jdec = readDecode(obj.dict, nComp);
      if (jdec) {
        const dt = applyDecodeTables(jdec, nComp, 8);
        const jd = img.data;
        for (let i = 0, p = 0; i < w * h; i++, p += 4) {
          jd[p] = dt[0][jd[p]];
          if (nComp >= 3) { jd[p + 1] = dt[1][jd[p + 1]]; jd[p + 2] = dt[2][jd[p + 2]]; }
          else jd[p + 1] = jd[p + 2] = jd[p];
        }
      }
      obj.dict.delete(PDFName.of('Decode'));
    } else if (fname === '' || fname === '/FlateDecode') {
      const num = (v) => (v && typeof v.asNumber === 'function' ? v.asNumber() : Number(v));
      w = num(obj.dict.get(PDFName.of('Width')));
      h = num(obj.dict.get(PDFName.of('Height')));
      const bpc = num(obj.dict.get(PDFName.of('BitsPerComponent'))) || 8;
      let raw = decodePDFRawStream(obj).decode();

      // 预测器：/DecodeParms 可能是单个字典，也可能是与 /Filter 一一对应的数组
      let dpRaw = ctx.lookup(obj.dict.get(PDFName.of('DecodeParms')));
      if (dpRaw instanceof PDFArray) dpRaw = ctx.lookup(dpRaw.get(0));
      let pred = 1, colors = nComp, cols = w;
      if (dpRaw && typeof dpRaw.get === 'function') {
        const pick = (key, dv) => {
          const x = ctx.lookup(dpRaw.get(PDFName.of(key)));
          return x && typeof x.asNumber === 'function' ? x.asNumber() : dv;
        };
        pred = pick('Predictor', 1);
        colors = pick('Colors', nComp);
        cols = pick('Columns', w);
      }
      if (pred >= 10) {
        if (bpc !== 8) return null;
        const un = pngUnfilter(raw, cols, h, colors);
        if (!un) return null;
        raw = un;
        nComp = colors;
      }

      if (!w || !h || raw.length < w * h * nComp) return null;
      // /Decode 必须在算亮度之前应用：扫描件常存成反相 + /Decode [1 0]
      const dec = readDecode(obj.dict, nComp);
      const dt = dec ? applyDecodeTables(dec, nComp, bpc) : null;
      img = new ImageData(w, h);
      const d = img.data;
      for (let i = 0, p = 0; i < w * h; i++, p += 4) {
        if (nComp === 1) {
          const v = dt ? dt[0][raw[i]] : raw[i];
          d[p] = d[p + 1] = d[p + 2] = v;
        } else {
          const q = i * nComp;
          d[p] = dt ? dt[0][raw[q]] : raw[q];
          d[p + 1] = dt ? dt[1][raw[q + 1]] : raw[q + 1];
          d[p + 2] = dt ? dt[2][raw[q + 2]] : raw[q + 2];
        }
        d[p + 3] = 255;
      }
      // 已经按真实亮度重编码，旧的 /Decode 必须去掉，否则会被再翻一次
      obj.dict.delete(PDFName.of('Decode'));
    } else {
      return null;
    }

    const d = img.data;
    const bgV = opts.bg || 0;
    // 有共享色阶就用共享的：预览里这块图长什么样，导出后就长什么样。
    // 没有才按这张图自己的直方图估。
    const lut = sharedLut || buildLut(d, bgV, opts.ink == null ? 255 : opts.ink, opts.autoLevel !== false);
    const gray = new Uint8Array(w * h);
    for (let i = 0, p = 0; i < gray.length; i++, p += 4) {
      gray[i] = (0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2]) | 0;
    }
    // 只裁整页扫描：带透明蒙版的贴图不能裁（边缘会被涂黑），
    // 小图（二维码、logo）裁 6px 会削掉定位方块，直接扫码失败。
    const hasMask = !!(obj.dict.get(PDFName.of('SMask')) || obj.dict.get(PDFName.of('Mask')));
    const cut = opts.edge !== false && !hasMask && w >= 800 && h >= 800
      ? edgeCuts(gray, w, h, 180) : null;
    const useCut = cut && cut.any;
    for (let i = 0, p = 0, x = 0, y = 0; i < gray.length; i++, p += 4) {
      let g2;
      if (useCut && (x < cut.cutL[y] || x >= w - cut.cutR[y] ||
                     y < cut.cutT[x] || y >= h - cut.cutB[x])) {
        g2 = bgV;                       // 纸外暗影：反色后本会变白，直接按背景
      } else {
        g2 = lut[gray[i]];
      }
      d[p] = d[p + 1] = d[p + 2] = g2;
      if (++x === w) { x = 0; y++; }
    }

    // 抽出 1 通道灰度（此时 R=G=B），走 FlateDecode：
    // canvas 只能编出 3 通道 JPEG，标成 /DeviceGray 就成了非法组合（1 通道声明 + 3 通道数据），
    // 而且反色后的文档高度二值化，Flate 无损还比 JPEG 小。
    for (let i = 0, p = 0; i < gray.length; i++, p += 4) gray[i] = d[p];

    if (typeof CompressionStream === 'function') {
      try {
        const packed = await deflateBytes(gray);
        // 拍照类扫描件（纸张纹理、渐变多）JPEG 更省；文档类二值化后 Flate 更省。
        // 两条都算一遍取小的，代价是多一次编码。
        const cv = makeCanvas(w, h);
        cv.getContext('2d').putImageData(img, 0, 0);
        const jpeg = await toJpeg(cv);
        if (jpeg.length + 256 < packed.length) {
          const d2 = obj.dict;
          d2.set(PDFName.of('Filter'), PDFName.of('DCTDecode'));
          // canvas 出来的 JPEG 一定是 3 通道，声明 DeviceGray 就是非法组合
          d2.set(PDFName.of('ColorSpace'), PDFName.of('DeviceRGB'));
          d2.set(PDFName.of('Width'), ctx.obj(w));
          d2.set(PDFName.of('Height'), ctx.obj(h));
          d2.set(PDFName.of('BitsPerComponent'), ctx.obj(8));
          d2.set(PDFName.of('Length'), ctx.obj(jpeg.length));
          d2.delete(PDFName.of('Decode'));
          d2.delete(PDFName.of('DecodeParms'));
          obj.contents = jpeg;
          return obj;
        }
        // 原地改写同一条流：新建对象会在文件里留下无人引用的旧数据，体积翻倍
        const d2 = obj.dict;
        d2.set(PDFName.of('Filter'), PDFName.of('FlateDecode'));
        d2.set(PDFName.of('ColorSpace'), PDFName.of('DeviceGray'));
        d2.set(PDFName.of('Width'), ctx.obj(w));
        d2.set(PDFName.of('Height'), ctx.obj(h));
        d2.set(PDFName.of('BitsPerComponent'), ctx.obj(8));
        d2.set(PDFName.of('Length'), ctx.obj(packed.length));
        d2.delete(PDFName.of('Decode'));
        d2.delete(PDFName.of('DecodeParms'));
        obj.contents = packed;
        return obj;
      } catch (e) { /* 没有 CompressionStream 就退回 JPEG */ }
    }

    // 回退：canvas 出来的 JPEG 一定是 3 通道，必须声明 /DeviceRGB 才能解码
    const cv = makeCanvas(w, h);
    cv.getContext('2d').putImageData(img, 0, 0);
    const jpeg = await toJpeg(cv);
    try {
      const d2 = obj.dict;
      d2.set(PDFName.of('Filter'), PDFName.of('DCTDecode'));
      d2.set(PDFName.of('ColorSpace'), PDFName.of('DeviceRGB'));
      d2.set(PDFName.of('Width'), ctx.obj(w));
      d2.set(PDFName.of('Height'), ctx.obj(h));
      d2.set(PDFName.of('BitsPerComponent'), ctx.obj(8));
      d2.set(PDFName.of('Length'), ctx.obj(jpeg.length));
      d2.delete(PDFName.of('Decode'));
      d2.delete(PDFName.of('DecodeParms'));
      obj.contents = jpeg;
      return obj;
    } catch (e) {
      const dict = {
        Type: 'XObject', Subtype: 'Image',
        Width: w, Height: h, BitsPerComponent: 8,
        ColorSpace: 'DeviceRGB', Filter: 'DCTDecode',
      };
      const sm = obj.dict.get(PDFName.of('SMask'));
      if (sm) dict.SMask = sm;
      return PDFLib.PDFRawStream.of(ctx.obj(dict), jpeg);
    }
  }

  /** 把一条内容流里的灰度直方图统计出来。矢量导出靠它估纸/墨两端，
   *  这样预览（像素直方图）与导出（算子直方图）走的是同一条色阶曲线。 */
  function colorHistOf(src, hist) {
    let pend = '', nums = [], pure = true, i = 0;
    const n = src.length;
    const add = (u) => { hist[Math.max(0, Math.min(255, Math.round(u * 255)))]++; };
    while (i < n) {
      const code = src.charCodeAt(i);
      const ch = src[i];
      if (WS_CODE.has(code)) { i++; continue; }
      if (ch === '(') { const j = skipLiteral(src, i); pend += 'x'; pure = false; i = j; continue; }
      if (ch === '<') {
        const j = src.startsWith('<<', i) ? skipArray(src, i, true) : skipHex(src, i);
        pend += 'x'; pure = false; i = j; continue;
      }
      if (ch === '[') { const j = skipArray(src, i, false); pend += 'x'; pure = false; i = j; continue; }
      if (ch === ']' || ch === '>' || ch === '}' || ch === '{') { pure = false; i++; continue; }
      if (ch === '/') {
        let j = i + 1;
        while (j < n && !WS_CODE.has(src.charCodeAt(j)) && !DELIM.has(src.charCodeAt(j))) j++;
        pure = false; i = j; continue;
      }
      if (ch === '%') { const j = src.indexOf('\n', i); i = j < 0 ? n : j; continue; }
      let j = i;
      while (j < n && !WS_CODE.has(src.charCodeAt(j)) && !DELIM.has(src.charCodeAt(j))) j++;
      const tok = src.slice(i, j);
      i = j;
      if (isNum(tok)) { nums.push(parseFloat(tok)); continue; }
      if (tok === 'BI') { const k = skipInlineImage(src, i - 2); i = k; pend = ''; nums = []; pure = true; continue; }
      if (pure && (COLOR_1.has(tok) || COLOR_N.has(tok))) {
        if (nums.length === 1) add(nums[0]);
        else if (nums.length === 3 || nums.length === 4) add(luminance(nums));
      }
      pend = ''; nums = []; pure = true;
    }
  }

  /* 色阶表：优先用预览传进来的那份（两边逐像素一致）；
     没传（比如直接调 API）才按内容流里出现过的灰度自己估一份。 */
  let lut = sharedLut;
  if (mode === 'threshold') {
    if (!lut) lut = makeThresholdLut(bg255, ink255, opts.thr, opts.smooth);
  } else if (autoLevel && !lut) {
    const hist = new Uint32Array(256);
    for (const page of doc.getPages()) {
      try {
        const node = page.node;
        colorHistOf(bytesToLatin1(readContents(node)), hist);
        const res = node.Resources ? node.Resources() : null;
        if (res) collectFormHist(res, hist, new Set());
      } catch (e) { /* 单页读不出就跳过，不拖垮整份文档 */ }
    }
    let total = 0;
    for (let v = 0; v < 256; v++) total += hist[v];
    if (total >= 64) lut = makeLevelsLut(hist, total, bg255, ink255, true);
  } else if (!lut) {
    lut = makeLevelsLut(null, 0, bg255, ink255, false);
  }

  /** 递归统计 Form XObject 里的颜色算子（水印/模板常整页拍平成 Form） */
  function collectFormHist(res, hist, seen) {
    const xo = res.lookup ? res.lookup(PDFName.of('XObject')) : res.get(PDFName.of('XObject'));
    if (!xo || !xo.entries) return;
    for (const [, ref] of xo.entries()) {
      const obj = ctx.lookup(ref);
      if (!obj || !obj.dict) continue;
      const sub = obj.dict.get(PDFName.of('Subtype'));
      if (!sub || sub.toString() !== '/Form') continue;
      const id = String(ref);
      if (seen.has(id)) continue;
      seen.add(id);
      try {
        colorHistOf(bytesToLatin1(decodePDFRawStream(obj).decode()), hist);
        const subRes = obj.dict.get(PDFName.of('Resources'));
        if (subRes) collectFormHist(ctx.lookup(subRes), hist, seen);
      } catch (e) { /* 解不开就跳过 */ }
    }
  }

  const pages = doc.getPages();
  for (let i = 0; i < pages.length; i++) {
    if (onProgress) onProgress(i + 1, pages.length);
    const page = pages[i];
    const node = page.node;
    try {
      const body = readContents(node);
      const mb = page.getMediaBox();
      // cropBox(): 有的 PDF 没有 /CropBox，pdf-lib 会退回 MediaBox；
      // 注意它返回的是 PDFArray 对象，不是 JS 数组，不能直接解构，
      // 否则整个页面会抛 TypeError 被 catch 吞掉 —— 表现就是"导出跟没转一样"。
      function boxNumbers(arr, fallback) {
        if (!arr) return fallback;
        const out = [];
        const n = typeof arr.size === 'function' ? arr.size() : 0;
        for (let k = 0; k < n; k++) {
          const v = ctx.lookup(typeof arr.get === 'function' ? arr.get(k) : arr[k]);
          out.push(v && typeof v.asNumber === 'function' ? v.asNumber() : Number(v));
        }
        return out.length === 4 && out.every((x) => Number.isFinite(x)) ? out : fallback;
      }
      const fb = [mb.x, mb.y, mb.x + mb.width, mb.y + mb.height];
      const cb = boxNumbers(node.CropBox ? node.CropBox() : null, null);
      const [x0, y0, x1, y1] = cb && cb[2] > cb[0] && cb[3] > cb[1] ? cb : fb;
      // 三种模式都必须铺底：PDF 页面默认是白的，不铺的话阈值模式会把
      // 没被覆盖的区域留成一片白纸（反色模式下恰好有铺底才没暴露）。
      const head = `${bg.toFixed(4)} g\n${x0} ${y0} ${x1 - x0} ${y1 - y0} re\nf\n`;
      const text = head + rewriteColors(bytesToLatin1(body), bg, ink, {
        mode, thr: opts.thr, smooth: opts.smooth, lut,
      });
      node.set(PDFName.of('Contents'), ctx.register(ctx.flateStream(latin1ToBytes(text), {})));
      await processResources(node.Resources ? node.Resources() : null);
    } catch (e) {
      failed++;
    }
  }

  return { bytes: await doc.save({ useObjectStreams: false }), failed, forms, images: imgs };
}

if (typeof module !== 'undefined' && module.exports) {
  module.exports = { vectorInvert };
}

</script>

<script>
(() => {
  'use strict';

  /* ---------------- 库装载 ---------------- */
  const b64ToBlob = (b64, type) => {
    const bin = atob(b64);
    const buf = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) buf[i] = bin.charCodeAt(i);
    return new Blob([buf], { type });
  };
  async function gunzip(b64) {
    const blob = b64ToBlob(b64, 'application/octet-stream');
    const stream = blob.stream().pipeThrough(new DecompressionStream('gzip'));
    return new Blob([await new Response(stream).arrayBuffer()], { type: 'application/javascript' });
  }
  function injectScript(url) {
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = url; s.onload = res; s.onerror = () => rej(new Error('库加载失败'));
      document.head.appendChild(s);
    });
  }
  let libsReady = null;
  function loadLibs() {
    if (libsReady) return libsReady;
    libsReady = (async () => {
      const v = (id) => document.getElementById(id).textContent.trim();
      const [jsUrl, workerUrl, libUrl] = await Promise.all([
        gunzip(v('lib-pdfjs')).then((b) => URL.createObjectURL(b)),
        gunzip(v('lib-worker')).then((b) => URL.createObjectURL(b)),
        gunzip(v('lib-pdflib')).then((b) => URL.createObjectURL(b)),
      ]);
      await injectScript(jsUrl);
      await injectScript(libUrl);
      pdfjsLib.GlobalWorkerOptions.workerSrc = workerUrl;
      return true;
    })();
    return libsReady;
  }

  /* ---------------- 状态 ---------------- */
  const $ = (s) => document.querySelector(s);

  /* ---------------- 偏好记忆 ----------------
   * 背景灰度/文字亮度这类「调到舒服就再也不想动」的值必须记住，
   * 否则每次打开都回到默认，等于每次都要重调一遍。 */
  const PREF_KEY = 'darkpdf.prefs.v1';
  const PREF_KEYS = ['mode', 'bg', 'ink', 'thr', 'smooth', 'images', 'autoLevel', 'edge', 'dpi', 'zoom'];

  function loadPrefs() {
    try {
      const raw = localStorage.getItem(PREF_KEY);
      if (!raw) return null;
      const o = JSON.parse(raw);
      return o && typeof o === 'object' ? o : null;
    } catch (e) { return null; }
  }
  let prefTimer = 0;
  function savePrefs() {
    clearTimeout(prefTimer);
    // 拖动滑块会连发 input，攒一下再写，避免每 16ms 一次 localStorage
    prefTimer = setTimeout(() => {
      try {
        const o = {};
        for (const k of PREF_KEYS) if (state.opts[k] !== undefined) o[k] = state.opts[k];
        o.dpi = $('#dpi').value;
        o.zoom = state.zoomMode;
        localStorage.setItem(PREF_KEY, JSON.stringify(o));
      } catch (e) { /* 隐私模式下写不了就算了，不影响功能 */ }
    }, 220);
  }

  const state = {
    doc: null, bytes: null, name: '',
    scale: 1, dpr: Math.min(window.devicePixelRatio || 1, 2),
    opts: { mode: 'invert', bg: 18, ink: 229, thr: 150, smooth: 6, images: true, autoLevel: true, edge: true },
    pages: [], observer: null, zoomMode: 'fit',
  };

  const toast = (msg, err) => {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast on' + (err ? ' err' : '');
    clearTimeout(t._t);
    t._t = setTimeout(() => (t.className = 'toast' + (err ? ' err' : '')), err ? 4200 : 2200);
  };
  const busy = (on, text) => {
    $('#busy').classList.toggle('on', !!on);
    if (text) $('#busyText').textContent = text;
  };
  const kb = (n) => n > 1048576 ? (n / 1048576).toFixed(2) + ' MB' : Math.round(n / 1024) + ' KB';

  /* ---------------- 像素处理 ---------------- */
  /** 扫描件四边常有书脊/纸边的暗影，反色后会翻成刺眼的白角白边。
   *  逐行逐列从四边往里找第一块纸色，外面的暗影直接当背景。
   *  返回每条边的裁剪量；整页一起裁掉超过 22% 说明不是暗边（可能是满版黑图），弃用。 */
  function edgeCuts(gray, w, h, T) {
    const cutL = new Int32Array(h), cutR = new Int32Array(h);
    const cutT = new Int32Array(w), cutB = new Int32Array(w);
    let sum = 0;
    for (let y = 0; y < h; y++) {
      const off = y * w;
      let l = -1, r = -1;
      for (let x = 0; x < w; x++) if (gray[off + x] > T) { l = x; break; }
      for (let x = w - 1; x >= 0; x--) if (gray[off + x] > T) { r = x; break; }
      // 多切 6px：纸边是 3~6px 的高光+过渡带，停在这里反色后会留一条灰白细线
      if (l > 0) { cutL[y] = l + 6; sum += l + 6; }
      if (r >= 0 && r < w - 1) { cutR[y] = w - 1 - r + 6; sum += w - 1 - r + 6; }
    }
    for (let x = 0; x < w; x++) {
      let t = -1, b = -1;
      for (let y = 0; y < h; y++) if (gray[y * w + x] > T) { t = y; break; }
      for (let y = h - 1; y >= 0; y--) if (gray[y * w + x] > T) { b = y; break; }
      if (t > 0) { cutT[x] = t + 6; sum += t + 6; }
      if (b >= 0 && b < h - 1) { cutB[x] = h - 1 - b + 6; sum += h - 1 - b + 6; }
    }
    if (sum > 0.22 * w * h * 2) return null;      // 上下+左右各算一次，正常暗边远小于此
    return { cutL, cutR, cutT, cutB, any: sum > 0 };
  }

  /** 把一块像素就地改写成"黑底白字"（预览与两种导出共用，保证结果一致）。
   *  lut 是 256 项查找表，由 makeModeLut() 产生；不传就现场算一张。 */
  function paint(imgData, lut) {
    const { mode, bg, ink, thr, smooth, edge } = state.opts;
    if (mode === 'none') return;
    const d = imgData.data;
    const w = imgData.width, h = imgData.height;
    const gray = new Uint8Array(w * h);
    for (let i = 0, p = 0; i < gray.length; i++, p += 4) {
      // 彩色一律降为灰度：取反后红会变青，那不是"黑底白字"
      gray[i] = 0.299 * d[p] + 0.587 * d[p + 1] + 0.114 * d[p + 2];
    }
    const { hist, total } = histFromPixels(imgData.data);
    const table = lut || makeModeLut(mode, hist, total, bg, ink, thr, smooth, state.opts.autoLevel);
    const cut = edge !== false && w > 16 && h > 16 ? edgeCuts(gray, w, h, 180) : null;
    for (let i = 0, p = 0, x = 0, y = 0; i < gray.length; i++, p += 4) {
      let v;
      if (cut && cut.any && (x < cut.cutL[y] || x >= w - cut.cutR[y] ||
                             y < cut.cutT[x] || y >= h - cut.cutB[x])) {
        v = bg;                                   // 纸外的暗影：反色后本会变白，直接按背景
      } else {
        v = table[gray[i]];
      }
      d[p] = d[p + 1] = d[p + 2] = v;
      d[p + 3] = 255;
      if (++x === w) { x = 0; y++; }
    }
  }

  /** 预览用：按当前设置给一页算好查找表（导出时原样递给 vectorInvert / 图片导出） */
  function lutFor(imgData) {
    const { mode, bg, ink, thr, smooth, autoLevel } = state.opts;
    if (mode === 'none') return null;
    const { hist, total } = histFromPixels(imgData.data);
    return makeModeLut(mode, hist, total, bg, ink, thr, smooth, autoLevel);
  }

  function applyColor(ps) {
    if (!ps.base) return;
    if (state.opts.mode === 'none') { ps.ctx.putImageData(ps.base, 0, 0); return; }
    const out = ps.ctx.createImageData(ps.base.width, ps.base.height);
    out.data.set(ps.base.data);
    paint(out, lutFor(ps.base));
    ps.ctx.putImageData(out, 0, 0);
  }

  function reprocessAll() {
    for (const ps of state.pages) if (ps.base) applyColor(ps);
  }

  /* ---------------- 渲染 ---------------- */
  function targetScale(viewerW, pageW) {
    const z = state.zoomMode;
    if (z === 'fit') return Math.max(0.2, (viewerW - 64) / pageW);
    return parseFloat(z) || 1;
  }

  async function renderPage(ps) {
    if (ps.rendering || ps.done) return;
    ps.rendering = true;
    try {
      const vp1 = ps.page.getViewport({ scale: 1 });
      const scale = targetScale($('#viewer').clientWidth, vp1.width);
      const vp = ps.page.getViewport({ scale: scale * state.dpr });
      ps.canvas.width = Math.floor(vp.width);
      ps.canvas.height = Math.floor(vp.height);
      ps.canvas.style.width = Math.floor(vp.width / state.dpr) + 'px';
      ps.canvas.style.height = Math.floor(vp.height / state.dpr) + 'px';
      await ps.page.render({ canvasContext: ps.ctx, viewport: vp }).promise;
      ps.base = ps.ctx.getImageData(0, 0, ps.canvas.width, ps.canvas.height);
      applyColor(ps);
      ps.done = true;
    } catch (e) {
      console.error(e);
    } finally {
      ps.rendering = false;
    }
  }

  function relayout() {
    for (const ps of state.pages) {
      ps.done = false;
      // 尺寸变化前先收缩，避免撑出滚动条抖动
      ps.canvas.width = ps.canvas.width;
    }
    for (const ps of state.pages) {
      if (isNear(ps)) renderPage(ps);
    }
  }
  const isNear = (ps) => {
    const r = ps.el.getBoundingClientRect();
    const vh = window.innerHeight;
    return r.bottom > -800 && r.top < vh + 800;
  };

  async function openPdf(arrayBuffer, name) {
    busy(true, '解析 PDF…');
    try {
      await loadLibs();
      if (state.doc) { try { state.doc.destroy(); } catch (e) {} }
      $('#pages').innerHTML = '';
      state.pages = [];
      state.bytes = arrayBuffer;
      state.name = (name || 'document').replace(/\.pdf$/i, '');
      state.doc = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer.slice(0)) }).promise;

      for (let i = 1; i <= state.doc.numPages; i++) {
        const page = await state.doc.getPage(i);
        const el = document.createElement('div');
        el.className = 'pg';
        const canvas = document.createElement('canvas');
        const no = document.createElement('div');
        no.className = 'no';
        no.textContent = String(i);
        el.appendChild(canvas);
        el.appendChild(no);
        $('#pages').appendChild(el);
        const ps = { page, el, canvas, ctx: canvas.getContext('2d', { willReadFrequently: true }), base: null, done: false, rendering: false };
        state.pages.push(ps);
      }

      $('#empty').style.display = 'none';
      ['vecBtn', 'imgBtn', 'pngBtn'].forEach((id) => ($('#' + id).disabled = false));
      $('#stName').textContent = state.name.length > 14 ? state.name.slice(0, 13) + '…' : state.name;
      $('#stPages').textContent = state.doc.numPages;
      $('#stSize').textContent = kb(arrayBuffer.byteLength);

      await Promise.all(state.pages.slice(0, 3).map(renderPage));
      rest();
    } catch (e) {
      console.error(e);
      toast('打不开这个 PDF：' + e.message, true);
    } finally {
      busy(false);
    }
  }

  function rest() {
    if (state.observer) state.observer.disconnect();
    state.observer = new IntersectionObserver((entries) => {
      for (const en of entries) {
        if (!en.isIntersecting) continue;
        const ps = state.pages[Number(en.target.dataset.idx)];
        if (ps && !ps.done) renderPage(ps);
      }
    }, { root: $('#viewer'), rootMargin: '800px 0px' });
    state.pages.forEach((ps, i) => { ps.el.dataset.idx = i; state.observer.observe(ps.el); });
  }

  /* ---------------- 事件 ---------------- */
  $('#openBtn').onclick = () => $('#file').click();
  $('#drop').onclick = () => $('#file').click();
  $('#file').onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    const buf = await f.arrayBuffer();
    openPdf(buf, f.name.replace(/\.pdf$/i, ''));
    e.target.value = '';
  };

  const viewer = $('#viewer');
  ['dragenter', 'dragover'].forEach((ev) => viewer.addEventListener(ev, (e) => {
    e.preventDefault(); $('#empty').classList.add('drag');
  }));
  ['dragleave', 'drop'].forEach((ev) => viewer.addEventListener(ev, (e) => {
    e.preventDefault(); $('#empty').classList.remove('drag');
  }));
  viewer.addEventListener('drop', async (e) => {
    const f = [...(e.dataTransfer.files || [])].find((x) => /pdf$/i.test(x.name) || x.type === 'application/pdf');
    if (!f) return toast('请拖入 PDF 文件', true);
    openPdf(await f.arrayBuffer(), f.name.replace(/\.pdf$/i, ''));
  });

  $('#modeSeg').onclick = (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    setMode(b.dataset.mode);
    reprocessAll();
  };

  function setMode(mode) {
    state.opts.mode = mode;
    [...$('#modeSeg').children].forEach((x) => x.classList.toggle('on', x.dataset.mode === mode));
    $('#thrWrap').hidden = mode !== 'threshold';
  }

  const bindRange = (id, key, labelId, after) => {
    const el = $('#' + id);
    const sync = () => {
      state.opts[key] = +el.value;
      $('#' + labelId).textContent = el.value;
      savePrefs();
      if (after) after();
    };
    el.oninput = sync;
    sync();
  };
  bindRange('bg', 'bg', 'bgVal', reprocessAll);
  bindRange('ink', 'ink', 'inkVal', reprocessAll);
  bindRange('thr', 'thr', 'thrVal', reprocessAll);
  bindRange('sm', 'smooth', 'smVal', reprocessAll);

  $('#imgInv').onchange = (e) => { state.opts.images = e.target.checked; savePrefs(); };
  $('#autoLv').onchange = (e) => { state.opts.autoLevel = e.target.checked; savePrefs(); reprocessAll(); };
  $('#edgeTrim').onchange = (e) => { state.opts.edge = e.target.checked; savePrefs(); reprocessAll(); };
  $('#dpi').onchange = savePrefs;

  $('#zoom').onchange = (e) => { state.zoomMode = e.target.value; savePrefs(); relayout(); };
  window.addEventListener('resize', () => { if (state.zoomMode === 'fit') relayout(); });

  /* ---------------- 恢复上次的设置 ---------------- */
  function restorePrefs() {
    const p = loadPrefs();
    if (!p) return;
    const setRange = (id, key, labelId) => {
      const el = $('#' + id);
      if (typeof p[key] !== 'number') return;
      const v = Math.max(+el.min, Math.min(+el.max, p[key]));
      el.value = v;
      state.opts[key] = v;
      $('#' + labelId).textContent = v;
    };
    setRange('bg', 'bg', 'bgVal');
    setRange('ink', 'ink', 'inkVal');
    setRange('thr', 'thr', 'thrVal');
    setRange('sm', 'smooth', 'smVal');

    if (typeof p.images === 'boolean') { state.opts.images = p.images; $('#imgInv').checked = p.images; }
    if (typeof p.autoLevel === 'boolean') { state.opts.autoLevel = p.autoLevel; $('#autoLv').checked = p.autoLevel; }
    if (typeof p.edge === 'boolean') { state.opts.edge = p.edge; $('#edgeTrim').checked = p.edge; }
    if (p.mode) setMode(p.mode);

    if (p.dpi && [...$('#dpi').options].some((o) => o.value === String(p.dpi))) $('#dpi').value = String(p.dpi);
    if (p.zoom && [...$('#zoom').options].some((o) => o.value === String(p.zoom))) {
      $('#zoom').value = String(p.zoom);
      state.zoomMode = String(p.zoom);
    }
  }
  restorePrefs();

  /* ---------------- 导出：矢量 ---------------- */
  async function exportVector() {
    busy(true, '正在反色…');
    try {
      // 把预览页已经算好的查找表交给矢量导出：
      // 两边用同一张表，才谈得上「预览什么样，导出就什么样」。
      const ref = state.pages.find((p) => p.base);
      const lut = ref ? lutFor(ref.base) : null;
      const r = await vectorInvert(window.PDFLib, new Uint8Array(state.bytes.slice(0)), {
        bg: state.opts.bg, ink: state.opts.ink, images: state.opts.images,
        autoLevel: state.opts.autoLevel,
        edge: state.opts.edge,
        // 这三项以前没传：矢量导出永远走「反色」，选了阈值/原样也照样反色，
        // 结果就是预览和导出对不上。
        mode: state.opts.mode, thr: state.opts.thr, smooth: state.opts.smooth,
        lut,
      }, (done, total) => busy(true, `正在反色 ${done}/${total} 页…`));

      if (r.failed) toast(`有 ${r.failed} 页没能处理（结构特殊），已原样保留`, true);
      saveBlob(new Blob([r.bytes], { type: 'application/pdf' }), state.name + ' - Dark.pdf');
      const extra = [r.forms ? `${r.forms} 个表单` : '', r.images ? `${r.images} 张位图` : '']
        .filter(Boolean).join(' · ');
      toast('矢量反色 PDF 已导出' + (extra ? `（含 ${extra}）` : ''));
    } catch (e) {
      console.error(e);
      toast('矢量导出失败（这类 PDF 结构不支持），请改用图片 PDF', true);
    } finally {
      busy(false);
    }
  }

  /* ---------------- 导出：图片 PDF ---------------- */
  async function exportImagePdf() {
    const dpi = +$('#dpi').value;
    const n = state.pages.length;
    busy(true, '正在渲染…');
    const imgs = [];
    try {
      for (let i = 0; i < n; i++) {
        busy(true, `渲染 ${i + 1}/${n} 页 · ${dpi} dpi`);
        const ps = state.pages[i];
        const vp1 = ps.page.getViewport({ scale: 1 });
        const scale = dpi / 72;
        const vp = ps.page.getViewport({ scale });
        const cv = document.createElement('canvas');
        cv.width = Math.floor(vp.width); cv.height = Math.floor(vp.height);
        const c2 = cv.getContext('2d', { willReadFrequently: true });
        await ps.page.render({ canvasContext: c2, viewport: vp }).promise;
        const data = c2.getImageData(0, 0, cv.width, cv.height);
        applyColorToData(data, cv);
        c2.putImageData(data, 0, 0);
        const enc = await grayFlate(data.data, cv.width, cv.height);
        imgs.push({
          w: cv.width, h: cv.height, pw: vp1.width, ph: vp1.height,
          bytes: enc.bytes, flate: enc.flate,
        });
      }
      const pdf = await buildImagePdf(imgs);
      saveBlob(new Blob([pdf], { type: 'application/pdf' }), state.name + ` - Dark-${dpi}dpi.pdf`);
      toast('图片 PDF 已导出');
    } catch (e) {
      console.error(e); toast('导出失败：' + e.message, true);
    } finally {
      busy(false);
    }
  }

  function applyColorToData(imgData) {
    if (state.opts.mode === 'none') return;
    paint(imgData, lutFor(imgData));
  }

  /** RGBA 像素 -> 1 通道灰度 + Flate 无损压缩。
   *  这里绝不能用 JPEG：反色后的文档大面积是同一灰度，
   *  JPEG 的 8x8 DCT 在平坦区会留下块状/条状振铃，
   *  放大缩小时还会跳动（看起来像"有根线在闪"）。Flate 无损，且这种图反而更小。
   *  @returns {Promise<{bytes:Uint8Array, flate:boolean}>} */
  async function grayFlate(rgba, w, h) {
    const gray = new Uint8Array(w * h);
    for (let i = 0, p = 0; i < gray.length; i++, p += 4) gray[i] = rgba[p];
    if (typeof CompressionStream === 'function') {
      try {
        const s = new Blob([gray]).stream().pipeThrough(new CompressionStream('deflate'));
        return { bytes: new Uint8Array(await new Response(s).arrayBuffer()), flate: true };
      } catch (e) { /* 落到下面不压缩的兜底 */ }
    }
    return { bytes: gray, flate: false };
  }

  /* 手写一个只装灰度图的 PDF（避免再引一个 PDF 生成库） */
  function buildImagePdf(pages) {
    const enc = new TextEncoder();
    const chunks = [];
    let len = 0;
    const push = (d) => { const b = typeof d === 'string' ? enc.encode(d) : d; chunks.push(b); len += b.length; return len; };
    const offsets = [];
    const obj = (id, body, stream) => {
      offsets[id] = len;
      push(`${id} 0 obj\n${body}\n`);
      if (stream) { push('stream\r\n'); push(stream); push('\r\nendstream\n'); }
      push('endobj\n');
    };

    const bin = (str) => { const b = new Uint8Array(str.length); for (let i = 0; i < str.length; i++) b[i] = str.charCodeAt(i) & 0xff; return b; };
    push(bin('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n'));
    const n = pages.length;
    const kids = pages.map((_, i) => `${4 + i * 3} 0 R`).join(' ');
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, `<< /Type /Pages /Kids [${kids}] /Count ${n} >>`);
    obj(3, '<< /Producer (pdf-invert) >>');

    pages.forEach((p, i) => {
      const pageId = 4 + i * 3, contId = pageId + 1, imgId = pageId + 2;
      obj(pageId, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${p.pw.toFixed(2)} ${p.ph.toFixed(2)}] `
        + `/Resources << /XObject << /Im0 ${imgId} 0 R >> >> /Contents ${contId} 0 R >>`);
      const content = `q\n${p.pw.toFixed(2)} 0 0 ${p.ph.toFixed(2)} 0 0 cm\n/Im0 Do\nQ`;
      obj(contId, `<< /Length ${content.length} >>`, content);
      const imgDict = `<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} `
        + `/ColorSpace /DeviceGray /BitsPerComponent 8`
        + (p.flate ? ' /Filter /FlateDecode' : '')
        + ` /Length ${p.bytes.length} >>`;
      obj(imgId, imgDict, p.bytes);
    });

    const xref = len;
    const total = 3 + n * 3 + 1;
    let x = `xref\n0 ${total}\n0000000000 65535 f \n`;
    for (let i = 1; i < total; i++) {
      x += String(offsets[i] || 0).padStart(10, '0') + ' 00000 n \n';
    }
    push(x);
    push(`trailer\n<< /Size ${total} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF`);
    return new Blob(chunks).arrayBuffer().then((ab) => new Uint8Array(ab));
  }

  function saveBlob(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
  }

  $('#vecBtn').onclick = exportVector;
  $('#imgBtn').onclick = exportImagePdf;
  $('#pngBtn').onclick = () => {
    const ps = state.pages.find((p) => p.done) || state.pages[0];
    if (!ps || !ps.done) return toast('页面还没渲染好', true);
    ps.canvas.toBlob((b) => saveBlob(b, state.name + ' - Dark-第1页.png'), 'image/png');
  };

  /* ---------------- 对外接口 / URL 参数 ---------------- */
  window.PDFInvert = {
    async load(arrayBuffer, name) { await openPdf(arrayBuffer, name || 'document'); },
    async loadUrl(url, name) {
      const r = await fetch(url);
      await openPdf(await r.arrayBuffer(), name || decodeURIComponent(url.split('/').pop()));
    },
    get opts() { return state.opts; },
  };

  (async () => {
    await loadLibs();
    const q = new URLSearchParams(location.search);
    const f = q.get('file');
    if (f) {
      try { await window.PDFInvert.loadUrl(f); }
      catch (e) { toast('载入 ' + f + ' 失败：' + e.message, true); }
    }
  })();
})();
</script>

<!-- nav.js 只注册 window.siteNav，顶栏要由页面自己 init；顺带把主题切换接上 -->
<script>
	(function () {
		function applyTheme(theme) {
			theme = theme === "light" ? "light" : "dark";
			document.documentElement.dataset.theme = theme;
			var btn = document.getElementById("siteThemeToggle");
			if (btn) { btn.textContent = theme === "dark" ? "\u2600" : "\u263E"; }
			try { localStorage.setItem("smartCubeTheme", theme); } catch (e) {}
		}
		function boot() {
			if (window.siteNav && typeof window.siteNav.init === "function") {
				window.siteNav.init({ setTheme: applyTheme });
			}
		}
		if (document.readyState === "loading") {
			document.addEventListener("DOMContentLoaded", boot);
		} else {
			boot();
		}
	})();
</script>
