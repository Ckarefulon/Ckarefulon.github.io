<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="/favicon.svg?v=7" type="image/svg+xml">

	<link rel="stylesheet" href="/nav/nav.css?v=20260707">
	<link rel="stylesheet" href="relay.css?v=7">

	<script src="/nav/nav.js?v=20260707" defer></script>

	<!-- Relay 自己的站点作用域（必须最先定义） -->
	<script src="/assets/services/core/site-scope.js?v=7" defer></script>

	<!-- 复用通用服务 -->
	<script src="/assets/services/core/storage-manager.js?v=7" defer></script>

	<!-- Supabase Auth -->
	<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
	<script src="/supabase/supabase-config.js?v=7" defer></script>
	<script src="/supabase/supabase-client.js?v=7" defer></script>
	<script src="/supabase/auth-manager.js?v=7" defer></script>
	<script src="/assets/backend/profile-manager.js?v=7" defer></script>
	<script src="/assets/services/global/global-data-manager.js?v=7" defer></script>

	<!-- Relay 核心逻辑（包含 cloudSyncManager 实现） -->
	<script src="relay-app.js?v=20260704" defer></script>

	<title>Relay — 文字传输</title>
	<style>
		:root {
			color-scheme: light;
			--bg: #f6f7fb;
			--surface: rgba(255, 255, 255, 0.9);
			--surfaceSolid: #ffffff;
			--ink: #242436;
			--muted: #575a6d;
			--line: #d5d8e5;
			--accent: #5d4ea8;
			--accentSoft: rgba(93, 78, 168, 0.12);
			--cyan: #24f0ea;
			--good: #178b82;
			--red: #e85d6a;
			--primaryBg: #5d4ea8;
			--primaryHoverBg: #514598;
			--primaryText: #ffffff;
			--primaryBorder: #5d4ea8;
			--controlBg: #ffffff;
			--controlText: #242436;
			--controlBorder: #cfd3e3;
			--controlHoverBg: rgba(93, 78, 168, 0.10);
			--pageBg: radial-gradient(circle at 16% 8%, rgba(93, 78, 168, 0.16), transparent 34%), radial-gradient(circle at 86% 12%, rgba(36, 240, 234, 0.10), transparent 30%), linear-gradient(135deg, #fafaff, #f4f6fb 58%, #ffffff);
			--shadow: 0 18px 50px rgba(36, 36, 54, 0.10);
		}

		:root[data-theme="dark"] {
			color-scheme: dark;
			--bg: #0f0f16;
			--surface: rgba(27, 27, 38, 0.94);
			--surfaceSolid: #1c1c28;
			--ink: #f4f4fb;
			--muted: #c0c2d0;
			--line: #414157;
			--accentSoft: rgba(93, 78, 168, 0.26);
			--good: #24f0ea;
			--red: #e85d6a;
			--primaryBg: #6b5dc2;
			--primaryHoverBg: #786bd0;
			--primaryText: #ffffff;
			--primaryBorder: #8174d6;
			--controlBg: #252536;
			--controlText: #f6f7ff;
			--controlBorder: #595c72;
			--controlHoverBg: #303046;
			--pageBg: radial-gradient(circle at 18% 10%, rgba(93, 78, 168, 0.34), transparent 34%), radial-gradient(circle at 88% 0%, rgba(93, 78, 168, 0.16), transparent 32%), linear-gradient(180deg, #161620, #0d0d14);
			--shadow: 0 18px 58px rgba(0, 0, 0, 0.32);
		}

		* { box-sizing: border-box; }

		html, body {
			height: 100%;
			margin: 0;
		}

		body {
			background: var(--pageBg);
			color: var(--ink);
			font: 15px/1.45 Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
			transition: background 0.22s ease, color 0.22s ease;
		}

		button, input, textarea {
			font: inherit;
		}
	</style>
</head>
<body>
	<div class="relayApp">
		<div class="relayToolbar">
			<div class="relayToolbarLeft">
				<button id="realtimeToggle" class="relayBtn" type="button" title="实时同步：输入后自动上传到云端">
					<span class="relayBtnLabel">实时同步</span>
				</button>
				<button id="intervalToggle" class="relayBtn" type="button" title="定时同步：每隔指定秒数从云端拉取">
					<span class="relayBtnLabel">定时同步</span>
				</button>
				<div class="relayIntervalWrap" id="intervalWrap">
					<input type="number" id="intervalInput" min="1" step="1" placeholder="秒" value="">
					<span class="relayIntervalUnit">秒</span>
				</div>
			</div>
			<div class="relayToolbarCenter">
				<button id="cloudUploadBtn" class="relayIconBtn" type="button" title="上传本地数据到云端">
					<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
				</button>
				<button id="cloudDownloadBtn" class="relayIconBtn" type="button" title="从云端恢复到本地">
					<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
				</button>
				<button id="undoBtn" class="relayIconBtn" type="button" title="恢复 / 撤销 (Ctrl+Z)" disabled>
					<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 0 0-15-6.7L3 13"/></svg>
				</button>
				<button id="clearBtn" class="relayIconBtn" type="button" title="清空文本">
					<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
				</button>
				<button id="copyAllBtn" class="relayIconBtn" type="button" title="全文复制">
					<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
				</button>
			</div>
			<div class="relayToolbarRight">
				<span id="syncStatus" class="relayStatus">就绪</span>
			</div>
		</div>
		<textarea id="relayTextarea" class="relayTextarea" placeholder="在这里输入文字，跨设备实时同步..." spellcheck="false"></textarea>
	</div>
</body>
</html>
