<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="/favicon.svg?v=1877" type="image/svg+xml">

	<!-- 主题先落地，避免深浅色闪一下（与其它页面共用 smartCubeTheme） -->
	<script>
		(function () {
			try {
				var t = localStorage.getItem("smartCubeTheme");
				if (t === "light" || t === "dark") {
					document.documentElement.setAttribute("data-theme", t);
				}
			} catch (e) {}
		})();
	</script>

	<!-- 设计令牌（dsk-*），必须先于页面样式 -->
	<link rel="stylesheet" href="/ui/colors_and_type.css">
	<link rel="stylesheet" href="/nav/nav.css?v=1877">
	<script src="/nav/nav.js?v=1877" defer></script>

	<script src="speed-app.js?v=1892" defer></script>

	<title>Speed — 自定义主机测速</title>
	<style>
		:root {
			color-scheme: dark;
			--bg: #0f0f16;
			--surface: rgba(27, 27, 38, 0.94);
			--surfaceSolid: #1c1c28;
			--ink: #f4f4fb;
			--muted: #c0c2d0;
			--line: #414157;
			--accent: #6b5dc2;
			--accentSoft: rgba(107, 93, 194, 0.26);
			--good: #24f0ea;
			--red: #e85d6a;
			--orange: #f0c050;
			--blue: #5aa0f0;
			--primaryBg: #6b5dc2;
			--primaryHoverBg: #786bd0;
			--primaryText: #ffffff;
			--controlBg: #252536;
			--controlText: #f6f7ff;
			--controlBorder: #595c72;
			--controlHoverBg: #303046;
			--pageBg: radial-gradient(circle at 18% 10%, rgba(107, 93, 194, 0.34), transparent 34%), radial-gradient(circle at 88% 0%, rgba(107, 93, 194, 0.16), transparent 32%), linear-gradient(180deg, #161620, #0d0d14);
			--shadow: 0 18px 58px rgba(0, 0, 0, 0.32);
		}
		:root[data-theme="light"] {
			color-scheme: light;
			--bg: #f6f7fb;
			--surface: rgba(255, 255, 255, 0.9);
			--surfaceSolid: #ffffff;
			--ink: #242436;
			--muted: #575a6d;
			--line: #d5d8e5;
			--accent: #5d4ea8;
			--accentSoft: rgba(93, 78, 168, 0.12);
			--good: #178b82;
			--red: #e85d6a;
			--orange: #e6b84a;
			--blue: #4a90e6;
			--primaryBg: #5d4ea8;
			--primaryHoverBg: #514598;
			--primaryText: #ffffff;
			--controlBg: #ffffff;
			--controlText: #242436;
			--controlBorder: #cfd3e3;
			--controlHoverBg: rgba(93, 78, 168, 0.10);
			--pageBg: radial-gradient(circle at 16% 8%, rgba(93, 78, 168, 0.16), transparent 34%), radial-gradient(circle at 86% 12%, rgba(36, 240, 234, 0.10), transparent 30%), linear-gradient(135deg, #fafaff, #f4f6fb 58%, #ffffff);
			--shadow: 0 18px 50px rgba(36, 36, 54, 0.10);
		}
		* { box-sizing: border-box; }
		html, body { height: 100%; margin: 0; }
		body {
			color: var(--ink);
			font: 15px/1.45 Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
			transition: color 0.22s ease;
			background: var(--bg);
		}
		.speedBg {
			position: fixed;
			inset: 0;
			z-index: -1;
			background: var(--pageBg);
			transition: background 0.22s ease;
		}
		.speedLoading {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 16px;
			height: calc(100dvh - var(--site-nav-height));
			color: var(--muted);
			font-size: 14px;
		}
		.speedSpinner {
			width: 32px;
			height: 32px;
			border: 3px solid var(--line);
			border-top-color: var(--accent);
			border-radius: 50%;
			animation: speedSpin 0.8s linear infinite;
		}
		@keyframes speedSpin { to { transform: rotate(360deg); } }
		.speedApp {
			display: none;
			max-width: 960px;
			margin: 0 auto;
			padding: 32px 20px 48px;
		}
		.speedApp.isVisible { display: block; }
		.speedTitle {
			text-align: center;
			font-size: 22px;
			font-weight: 700;
			margin-bottom: 6px;
			color: var(--ink);
		}
		.speedSubtitle {
			text-align: center;
			font-size: 13px;
			color: var(--muted);
			margin-bottom: 24px;
		}
		.speedHostPanel {
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 14px;
			box-shadow: var(--shadow);
			-webkit-backdrop-filter: blur(14px);
			backdrop-filter: blur(14px);
			padding: 16px;
			margin-bottom: 20px;
		}
		.speedHostLabel {
			display: block;
			font-size: 12px;
			font-weight: 600;
			color: var(--muted);
			text-transform: uppercase;
			letter-spacing: 0.04em;
			margin-bottom: 8px;
		}
		.speedHostInput {
			width: 100%;
			min-height: 84px;
			resize: vertical;
			border: 1px solid var(--controlBorder);
			border-radius: 10px;
			background: var(--controlBg);
			color: var(--controlText);
			font: 13px/1.6 ui-monospace, Consolas, monospace;
			padding: 10px 12px;
			outline: none;
			transition: border-color 0.15s ease;
		}
		.speedHostInput:focus { border-color: var(--accent); }
		.speedHostHint {
			font-size: 12px;
			color: var(--muted);
			margin-top: 8px;
		}
		.speedStartWrap {
			display: flex;
			justify-content: center;
			gap: 12px;
			margin-bottom: 24px;
		}
		.speedBtn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 8px;
			height: 46px;
			padding: 0 32px;
			border: none;
			border-radius: 10px;
			background: var(--primaryBg);
			color: var(--primaryText);
			font: 600 15px/1 inherit;
			cursor: pointer;
			transition: background 0.15s, transform 0.12s;
		}
		.speedBtn:hover { background: var(--primaryHoverBg); transform: translateY(-1px); }
		.speedBtn:disabled { opacity: 0.55; cursor: not-allowed; transform: none; }
		.speedBtnGhost {
			background: transparent;
			border: 1px solid var(--controlBorder);
			color: var(--muted);
		}
		.speedBtnGhost:hover { background: var(--controlHoverBg); color: var(--ink); }
		.speedGrid {
			display: grid;
			grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
			gap: 16px;
		}
		.speedGridEmpty {
			padding: 30px;
			border: 1px dashed var(--line);
			border-radius: 14px;
			color: var(--muted);
			font-size: 13px;
			text-align: center;
		}
		.speedCard {
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 14px;
			box-shadow: var(--shadow);
			-webkit-backdrop-filter: blur(14px);
			backdrop-filter: blur(14px);
			overflow: hidden;
			transition: transform 0.18s ease;
		}
		.speedCard:hover { transform: translateY(-2px); }
		.speedCardHeader {
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 14px 16px 12px;
			border-bottom: 1px solid var(--line);
		}
		.speedRank {
			font-size: 13px;
			font-weight: 700;
			color: var(--accent);
			background: var(--accentSoft);
			padding: 2px 8px;
			border-radius: 6px;
			margin-right: 6px;
			flex-shrink: 0;
		}
		@keyframes speedRankHighlight {
			0% { background: var(--accentSoft); }
			50% { background: rgba(107, 93, 194, 0.4); }
			100% { background: var(--accentSoft); }
		}
		.speedRankAnimating { animation: speedRankHighlight 0.6s ease; }
		.speedCardDomainLink {
			font-size: 14px;
			font-weight: 700;
			color: var(--ink);
			word-break: break-all;
			flex: 1;
			text-decoration: none;
			transition: color 0.15s ease;
		}
		.speedCardDomainLink:hover { color: var(--accent); text-decoration: underline; }
		.speedCardRemove {
			flex-shrink: 0;
			width: 26px;
			height: 26px;
			border: none;
			border-radius: 8px;
			background: transparent;
			color: var(--muted);
			font-size: 15px;
			line-height: 1;
			cursor: pointer;
			transition: background 0.15s ease, color 0.15s ease;
		}
		.speedCardRemove:hover { background: rgba(232, 93, 106, 0.14); color: var(--red); }
		.speedCardStatus {
			font-size: 11px;
			font-weight: 600;
			padding: 3px 10px;
			border-radius: 999px;
			white-space: nowrap;
			flex-shrink: 0;
		}
		.speedCardStatus.waiting { background: rgba(87, 90, 109, 0.12); color: var(--muted); }
		.speedCardStatus.running { background: rgba(74, 144, 230, 0.12); color: var(--blue); animation: speedPulse 1.5s ease-in-out infinite; }
		.speedCardStatus.done { background: rgba(23, 139, 130, 0.12); color: var(--good); }
		.speedCardStatus.fail { background: rgba(232, 93, 106, 0.12); color: var(--red); }
		@keyframes speedPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
		.speedProgressWrap { padding: 0 16px 12px; }
		.speedProgressBar {
			height: 3px;
			background: var(--line);
			border-radius: 999px;
			overflow: hidden;
		}
		.speedProgressFill {
			height: 100%;
			background: var(--accent);
			border-radius: 999px;
			transition: width 0.3s ease;
			width: 0%;
		}
		.speedPhaseLabel {
			font-size: 11px;
			color: var(--muted);
			margin-top: 5px;
			text-align: center;
		}
		.speedCardBody { padding: 14px 16px; }
		.speedMetric {
			display: flex;
			align-items: center;
			justify-content: space-between;
			padding: 7px 0;
			border-bottom: 1px solid var(--line);
			gap: 10px;
		}
		.speedMetric:last-child { border-bottom: none; }
		.speedMetricLabel {
			font-size: 12px;
			font-weight: 600;
			color: var(--muted);
			text-transform: uppercase;
			letter-spacing: 0.04em;
			flex-shrink: 0;
		}
		.speedMetricValue {
			font-size: 15px;
			font-weight: 700;
			color: var(--ink);
			text-align: right;
			font-variant-numeric: tabular-nums;
		}
		.speedMetricValue .unit { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 3px; }
		.speedMetricValue .estMark {
			font-size: 10px;
			font-weight: 600;
			color: var(--orange);
			margin-left: 4px;
			vertical-align: 1px;
		}
		.speedFooter {
			text-align: center;
			margin-top: 32px;
			font-size: 12px;
			color: var(--muted);
		}
		@media (max-width: 500px) {
			.speedGrid { grid-template-columns: 1fr; }
		}
	</style>
</head>
<body>
	<div class="speedBg"></div>
	<div class="speedLoading" id="speedLoading">
		<div class="speedSpinner"></div>
		<span>加载中…</span>
	</div>
	<div class="speedApp" id="speedApp">
		<h1 class="speedTitle">自定义主机测速</h1>
		<p class="speedSubtitle">填入任意主机 · 检测延迟 · 抖动 · 上传 · 下载速率</p>
		<div class="speedHostPanel">
			<label class="speedHostLabel" for="hostInput">主机列表（一行一个，支持 https:// 前缀，留协议默认 https）</label>
			<textarea class="speedHostInput" id="hostInput" spellcheck="false" placeholder="example.com&#10;https://mirror.example.org/download"></textarea>
			<p class="speedHostHint">列表自动保存在本机。下载测速优先按实际响应大小计算；跨域读不到大小时按 500KB 估算（结果标「估」）。</p>
		</div>
		<div class="speedStartWrap">
			<button class="speedBtn" id="startBtn" type="button">
				<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>
				开始测速
			</button>
			<button class="speedBtn speedBtnGhost" id="resetBtn" type="button">恢复默认列表</button>
		</div>
		<div class="speedGrid" id="grid"></div>
		<div class="speedFooter">结果仅供参考，受限于浏览器网络 API 的跨域限制</div>
	</div>
</body>
</html>
