<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KGenesis — KGM/KGMA 解密</title>
  <link rel="stylesheet" href="/nav/nav.css?v=20260707">
  <style>
    :root {
      --bg: #0d0d12;
      --surface: #14141c;
      --surface-2: #1c1c28;
      --border: #2a2a3a;
      --text: #e8e8f0;
      --text-dim: #8888a0;
      --accent: #5d4ea8;
      --accent-light: #7b6fc4;
      --cyan: #24f0ea;
      --green: #34d399;
      --red: #f87171;
      --orange: #fb923c;
      --radius: 12px;
      --radius-sm: 8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 80px 20px 40px;
    }
    html.light body { --bg: #f5f5f8; --surface: #ffffff; --surface-2: #f0f0f5; --border: #e0e0ea; --text: #1a1a2e; --text-dim: #686880; }
    h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { color: var(--text-dim); font-size: 14px; margin-bottom: 32px; }

    .drop-zone {
      width: 100%;
      max-width: 700px;
      border: 2px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
      background: var(--surface);
    }
    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent);
      background: var(--surface-2);
    }
    .drop-zone.drag-over { border-color: var(--cyan); }
    .drop-icon { font-size: 48px; margin-bottom: 16px; }
    .drop-text { font-size: 16px; color: var(--text-dim); }
    .drop-text span { color: var(--accent-light); font-weight: 600; }
    #fileInput { display: none; }
    .queue { width: 100%; max-width: 700px; margin-top: 24px; }
    .queue-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .queue-title { font-size: 14px; color: var(--text-dim); }
    .queue-actions { display: flex; gap: 8px; }
    .btn {
      padding: 8px 16px;
      border-radius: var(--radius-sm);
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.15s;
    }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-light); }
    .btn-cyan { background: var(--cyan); color: #0d0d12; }
    .btn-cyan:hover:not(:disabled) { background: #4ff8f4; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text-dim); }
    .btn-outline:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
    .btn-danger { background: var(--red); color: #fff; }
    .btn-danger:hover:not(:disabled) { background: #fca5a5; }

    .file-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 8px;
      transition: all 0.15s;
    }
    .file-item:hover { border-color: var(--accent); }
    .file-icon { font-size: 20px; }
    .file-info { flex: 1; min-width: 0; }
    .file-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-meta { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
    .file-status { font-size: 12px; font-weight: 600; white-space: nowrap; }
    .status-pending { color: var(--text-dim); }
    .status-running { color: var(--cyan); }
    .status-done { color: var(--green); }
    .status-error { color: var(--red); }
    .progress-bar { width: 100%; height: 3px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--cyan)); border-radius: 2px; transition: width 0.3s; }
  </style>
  <script>
    (function(){
      var saved = localStorage.getItem('theme');
      if (saved === 'light') {
        document.documentElement.classList.add('light');
      } else {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
</head>
<body>
  <h1>KGenesis</h1>
  <p class="subtitle">拖入或选择文件，自动解密并保留原始音频格式</p>

  <div class="drop-zone" id="dropZone">
    <div class="drop-icon">&#128205;</div>
    <div class="drop-text">拖放文件到此处，或 <span>点击选择</span></div>
    <div class="drop-text" style="font-size:12px;margin-top:8px;">支持 .kgm / .kgma / .flac / .mp3</div>
  </div>
  <input type="file" id="fileInput" accept=".kgm,.kgma,.flac,.mp3" multiple>

  <div class="queue" id="queue" style="display:none;">
    <div class="queue-header">
      <span class="queue-title" id="queueTitle">0 个文件</span>
      <div class="queue-actions">
        <button class="btn btn-primary" id="convertBtn" disabled>转换</button>
        <button class="btn btn-cyan" id="downloadAllBtn" disabled>下载全部</button>
        <button class="btn btn-outline" id="clearBtn">清空</button>
      </div>
    </div>
    <div id="fileList"></div>
  </div>

  <script src="/nav/nav.js?v=20260707" defer></script>
  <script src="./a3-runtime.js?v=6" defer></script>
  <script src="./kgm-decoder.js?v=1" defer></script>
  <script src="./kgm-app.js?v=1" defer></script>
</body>
</html>
