<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="/favicon.svg?v=7" type="image/svg+xml">

	<link rel="stylesheet" href="/nav/nav.css?v=8">

	<script src="/nav/nav.js?v=8" defer></script>

	<title>KGenesis — KGM/KGMA 解密</title>
	<style>
		:root {
			color-scheme: light;
			--bg: #f6f7fb;
			--surface: rgba(255, 255, 255, 0.9);
			--surfaceSolid: #ffffff;
			--ink: #242436;
			--muted: #575a6d;
			--line: #d5d8e5;
			--accent: #5d4ea8;
			--accentSoft: rgba(93, 78, 168, 0.12);
			--cyan: #24f0ea;
			--good: #178b82;
			--red: #e85d6a;
			--orange: #e6b84a;
			--blue: #4a90e6;
			--primaryBg: #5d4ea8;
			--primaryHoverBg: #514598;
			--primaryText: #ffffff;
			--primaryBorder: #5d4ea8;
			--controlBg: #ffffff;
			--controlText: #242436;
			--controlBorder: #cfd3e3;
			--controlHoverBg: rgba(93, 78, 168, 0.10);
			--pageBg: radial-gradient(circle at 16% 8%, rgba(93, 78, 168, 0.16), transparent 34%), radial-gradient(circle at 86% 12%, rgba(36, 240, 234, 0.10), transparent 30%), linear-gradient(135deg, #fafaff, #f4f6fb 58%, #ffffff);
			--shadow: 0 18px 50px rgba(36, 36, 54, 0.10);
		}

		:root[data-theme="dark"] {
			color-scheme: dark;
			--bg: #0f0f16;
			--surface: rgba(27, 27, 38, 0.94);
			--surfaceSolid: #1c1c28;
			--ink: #f4f4fb;
			--muted: #c0c2d0;
			--line: #414157;
			--accentSoft: rgba(93, 78, 168, 0.26);
			--good: #24f0ea;
			--red: #e85d6a;
			--orange: #f0c050;
			--blue: #5aa0f0;
			--primaryBg: #6b5dc2;
			--primaryHoverBg: #786bd0;
			--primaryText: #ffffff;
			--primaryBorder: #8174d6;
			--controlBg: #252536;
			--controlText: #f6f7ff;
			--controlBorder: #595c72;
			--controlHoverBg: #303046;
			--pageBg: radial-gradient(circle at 18% 10%, rgba(93, 78, 168, 0.34), transparent 34%), radial-gradient(circle at 88% 0%, rgba(93, 78, 168, 0.16), transparent 32%), linear-gradient(180deg, #161620, #0d0d14);
			--shadow: 0 18px 58px rgba(0, 0, 0, 0.32);
		}

		* { box-sizing: border-box; }

		html, body {
			height: 100%;
			margin: 0;
		}

		body {
			background: var(--pageBg);
			color: var(--ink);
			font: 15px/1.45 Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
			transition: background 0.22s ease, color 0.22s ease;
			display: flex;
			flex-direction: column;
			align-items: center;
			padding: 80px 20px 40px;
		}

		button, input, textarea, select {
			font: inherit;
		}

		h1 { font-size: 28px; font-weight: 700; margin-bottom: 8px; color: var(--ink); }
		.subtitle { color: var(--muted); font-size: 14px; margin-bottom: 32px; }

		/* Drop Zone */
		.drop-zone {
			width: 100%;
			max-width: 700px;
			border: 2px dashed var(--line);
			border-radius: 12px;
			padding: 48px 24px;
			text-align: center;
			cursor: pointer;
			transition: all 0.2s;
			background: var(--surface);
			backdrop-filter: blur(14px);
		}
		.drop-zone:hover, .drop-zone.drag-over {
			border-color: var(--accent);
			background: var(--controlHoverBg);
		}
		.drop-zone.drag-over { border-color: var(--cyan); }
		.drop-icon { font-size: 48px; margin-bottom: 16px; }
		.drop-text { font-size: 16px; color: var(--muted); }
		.drop-text span { color: var(--accent); font-weight: 600; }
		#fileInput { display: none; }

		/* Queue */
		.queue { width: 100%; max-width: 700px; margin-top: 24px; }
		.queue-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
		.queue-title { font-size: 14px; color: var(--muted); font-weight: 600; }

		/* Buttons */
		.btn {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 6px;
			height: 40px;
			padding: 0 18px;
			border: 1px solid var(--controlBorder);
			border-radius: 8px;
			background: var(--controlBg);
			color: var(--controlText);
			font-size: 14px;
			font-weight: 600;
			cursor: pointer;
			transition: all 0.15s ease;
			user-select: none;
			white-space: nowrap;
		}
		.btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
		.btn-primary { background: var(--primaryBg); border-color: var(--primaryBorder); color: var(--primaryText); }
		.btn-primary:hover:not(:disabled) { background: var(--primaryHoverBg); border-color: var(--primaryBorder); color: var(--primaryText); transform: translateY(-1px); }
		.btn-cyan { background: var(--cyan); color: var(--ink); border-color: var(--cyan); }
		.btn-cyan:hover:not(:disabled) { background: #4ff8f4; border-color: #4ff8f4; transform: translateY(-1px); }
		.btn-outline { background: var(--controlBg); border-color: var(--controlBorder); color: var(--controlText); }
		.btn-outline:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); }
		.btn-danger { border-color: var(--red); color: var(--red); }
		.btn-danger:hover:not(:disabled) { background: var(--red); color: #fff; transform: translateY(-1px); }

		.queue-actions { display: flex; gap: 8px; flex-wrap: wrap; }

		/* Icon buttons */
		.btn-icon {
			display: inline-flex;
			align-items: center;
			justify-content: center;
			width: 32px;
			height: 32px;
			border-radius: 8px;
			border: 1px solid var(--controlBorder);
			background: var(--controlBg);
			color: var(--muted);
			cursor: pointer;
			transition: all 0.15s;
			flex-shrink: 0;
		}
		.btn-icon:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); background: var(--controlHoverBg); transform: translateY(-1px); }
		.btn-icon:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
		.btn-icon.convert:hover:not(:disabled) { border-color: var(--cyan); color: var(--cyan); }
		.btn-icon.delete:hover:not(:disabled) { border-color: var(--red); color: var(--red); }
		.btn-icon.download:hover:not(:disabled) { border-color: var(--good); color: var(--good); }
		.btn-icon svg { width: 14px; height: 14px; }
		.file-actions { display: flex; gap: 4px; flex-shrink: 0; }

		/* File item */
		.file-item {
			display: flex;
			align-items: center;
			gap: 12px;
			padding: 12px 16px;
			background: var(--surface);
			border: 1px solid var(--line);
			border-radius: 10px;
			margin-bottom: 8px;
			transition: all 0.15s;
			backdrop-filter: blur(14px);
		}
		.file-item:hover { border-color: var(--accent); background: var(--controlHoverBg); }
		.file-icon { font-size: 20px; flex-shrink: 0; }
		.file-info { flex: 1; min-width: 0; }
		.file-name { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink); }
		.file-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
		.file-status { font-size: 12px; font-weight: 600; white-space: nowrap; flex-shrink: 0; }
		.status-pending { color: var(--muted); }
		.status-running { color: var(--blue); }
		.status-done { color: var(--good); }
		.status-error { color: var(--red); }
		.progress-bar { width: 100%; height: 3px; background: var(--line); border-radius: 2px; margin-top: 6px; overflow: hidden; }
		.progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--cyan)); border-radius: 2px; transition: width 0.3s; }

		/* Toast */
		.kgToast {
			position: fixed;
			bottom: 24px;
			left: 50%;
			transform: translateX(-50%) translateY(100px);
			padding: 12px 20px;
			background: var(--surfaceSolid);
			border: 1px solid var(--line);
			border-radius: 10px;
			box-shadow: 0 8px 30px rgba(0, 0, 0, 0.18);
			font-size: 14px;
			color: var(--ink);
			z-index: 3000;
			opacity: 0;
			transition: all 0.3s ease;
			pointer-events: none;
			max-width: calc(100vw - 32px);
		}
		.kgToast.isVisible { transform: translateX(-50%) translateY(0); opacity: 1; }
		.kgToast.isSuccess { border-color: rgba(23, 139, 130, 0.4); color: var(--good); }
		.kgToast.isError { border-color: rgba(232, 93, 106, 0.4); color: var(--red); }

		@media (max-width: 768px) {
			body { padding: 70px 12px 30px; }
			.queue-actions { gap: 6px; }
			.btn { height: 36px; padding: 0 12px; font-size: 13px; }
		}
	</style>
</head>
<body>
	<h1>KGenesis</h1>
	<p class="subtitle">拖入或选择文件，自动解密并保留原始音频格式</p>

	<div class="drop-zone" id="dropZone">
		<div class="drop-icon">&#128205;</div>
		<div class="drop-text">拖放文件到此处，或 <span>点击选择</span></div>
		<div class="drop-text" style="font-size:12px;margin-top:8px;">支持 .kgm / .kgma / .flac / .mp3</div>
	</div>
	<input type="file" id="fileInput" accept=".kgm,.kgma,.flac,.mp3" multiple>

	<div class="queue" id="queue" style="display:none;">
		<div class="queue-header">
			<span class="queue-title" id="queueTitle">0 个文件</span>
			<div class="queue-actions">
				<button class="btn btn-primary" id="convertBtn" disabled>
					<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"/><line x1="4" y1="20" x2="21" y2="3"/><polyline points="21 16 21 21 16 21"/><line x1="15" y1="15" x2="21" y2="21"/><line x1="4" y1="4" x2="9" y2="9"/></svg>
					转换
				</button>
				<button class="btn btn-cyan" id="downloadAllBtn" disabled>
					<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
					下载全部
				</button>
				<button class="btn btn-outline" id="zipDownloadBtn" disabled>
					<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
					打包下载
				</button>
				<button class="btn btn-outline" id="clearBtn">清空</button>
			</div>
		</div>
		<div id="fileList"></div>
	</div>

	<div class="kgToast" id="kgToast"></div>

	<!-- dark default – applied before nav renders -->
	<script>(function(){try{var t=localStorage.getItem('smartCubeTheme');if(t&&t!=='none'){document.documentElement.dataset.theme=t;}else if(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches){document.documentElement.dataset.theme='dark';}}catch(e){}})();</script>

	<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
	<script src="/nav/nav.js?v=8" defer></script>
	<script src="./a3-runtime.js?v=7" defer></script>
	<script src="./kgm-decoder.js?v=2" defer></script>
	<script src="./kgm-app.js?v=4" defer></script>
</body>
</html>
