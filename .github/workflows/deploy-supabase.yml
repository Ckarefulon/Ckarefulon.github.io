name: Deploy Supabase

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      PULSE_ENCRYPTION_KEY: ${{ secrets.PULSE_ENCRYPTION_KEY }}
      # ⚠️ if: 里**不能**直接引用 secrets 上下文（GitHub 不允许，会校验失败或被判空）。
      #    所以这里先求值成一个布尔字符串，step 的 if 只读这个 env 标记。
      #    名字一律不带 GITHUB_ 前缀 —— 那是 GitHub 保留前缀。
      FEEDBACK_CONFIGURED: ${{ secrets.DISCUSSIONS_TOKEN != '' || secrets.APP_ID != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        # v3：数据库命令默认打本地栈，改动托管项目需要显式 --remote / --yes。
        # 下面每一条命令都按 v3 口径写死了目标与确认，不依赖交互终端。
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Show CLI version
        # 出问题时第一时间能看到实际用的 CLI 版本（v3 的命令口径与 v2 不同）
        run: supabase --version

      - name: Link Supabase project
        run: supabase link --project-ref $SUPABASE_PROJECT_ID

      - name: Push database migrations
        # v3 必带 --remote（否则打本地栈）与 --yes（CI 无法交互确认）
        run: supabase db push --remote --yes

      - name: Push feedback function secrets
        # 只要配了 PAT 或 GitHub App 任一种身份就下发；都没有时函数照常部署，
        # 前端会收到 configure:true 并引导用户改用「在 GitHub 中打开」。
        #
        # 这里读的是 job 级 env 标记，不是 secrets —— 见上方注释。
        if: ${{ env.FEEDBACK_CONFIGURED == 'true' }}
        env:
          DISCUSSIONS_TOKEN: ${{ secrets.DISCUSSIONS_TOKEN }}
          FEEDBACK_REPO: ${{ vars.FEEDBACK_REPO }}
          DISCUSSIONS_CATEGORIES: ${{ vars.DISCUSSIONS_CATEGORIES }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
          APP_INSTALLATION_ID: ${{ vars.APP_INSTALLATION_ID }}
        run: |
          set -euo pipefail

          # ⚠️ 千万不要用 `while read ... <<EOF` 批量喂多行值。
          #    APP_PRIVATE_KEY 是多行 PEM，按行读会把主体全部丢掉，
          #    最后只下发 "-----BEGIN PRIVATE KEY-----" 这一行 ——
          #    表现为函数里报「私钥为空或无法识别」，而 Secret 本身完全正确。
          #    所以这里每个键单独一次调用，值用引号原样传递。
          #
          # 另一个坑：GitHub Actions 里未设置的 secret 会展开成空串，
          # 直接下发会把线上已有的值覆盖掉，因此逐个判断非空再下发。

          set_secret() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "::notice::$name 未设置，跳过（不会覆盖线上已有值）"
              return 0
            fi
            echo "::notice::setting $name (${#value} bytes)"
            supabase secrets set --yes "$name=$value"
          }

          set_secret DISCUSSIONS_TOKEN   "$DISCUSSIONS_TOKEN"
          set_secret FEEDBACK_REPO       "$FEEDBACK_REPO"
          set_secret DISCUSSIONS_CATEGORIES "$DISCUSSIONS_CATEGORIES"
          set_secret APP_ID              "$APP_ID"
          set_secret APP_PRIVATE_KEY     "$APP_PRIVATE_KEY"
          set_secret APP_INSTALLATION_ID "$APP_INSTALLATION_ID"

          # 下发后核对：私钥若不是一份完整 PEM，这里立刻失败，
          # 而不是等到部署完、用户点反馈时才在函数里报「私钥无法识别」。
          if [ -n "$APP_PRIVATE_KEY" ]; then
            if ! printf '%s' "$APP_PRIVATE_KEY" | grep -q "-----BEGIN"; then
              echo "::error::APP_PRIVATE_KEY 里没有 -----BEGIN----- 行（下发值异常）"
              exit 1
            fi
            if ! printf '%s' "$APP_PRIVATE_KEY" | grep -q "-----END"; then
              echo "::error::APP_PRIVATE_KEY 缺少 -----END----- 行（值被截断，可能只下发了首行）"
              exit 1
            fi
            lines=$(printf '%s' "$APP_PRIVATE_KEY" | wc -l)
            if [ "$lines" -lt 2 ]; then
              echo "::error::APP_PRIVATE_KEY 只有 $lines 行，正常 PEM 至少 3 行（疑似换行被吞）"
              exit 1
            fi
            echo "::notice::APP_PRIVATE_KEY 看起来完整（$lines 行，${#APP_PRIVATE_KEY} 字节）"
          fi

      - name: Deploy Edge Functions
        # feedback：站点反馈广场（列表 / 详情 / 回复 / 新建）
        # v3：functions deploy 同样需要 --yes
        run: supabase functions deploy --yes pulse-upsert-target pulse-run-now pulse-scheduler pulse-delete-target pulse-get-services feedback
