name: Discussion ↔ Issue 联动

# 约定：Issue 正文里写「Discussion #N」即视为把该 Issue 链接到 Discussion #N。
# 新建/编辑/关闭/重开时，在对应 Discussion 下自动留言；同一条只留一次（标记写在 Discussion 评论里）。
# 与 Changelog → Issue 联动 共用同一个 PAT 身份（ISSUE_SYNC_PAT）。
#
# 补跑历史 Issue：Actions → 本工作流 → Run workflow，issue_numbers 填 "11,12" 或 "all"。

on:
  issues:
    types: [opened, edited, closed, reopened]
  workflow_dispatch:
    inputs:
      issue_numbers:
        description: '要补跑的 Issue 编号（逗号分隔），或填 all 扫描全部；留空则不做事'
        required: false
        default: ''

permissions:
  # 实际读写都走 ISSUE_SYNC_PAT；这里只保留最低权限。
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      # if: 里不能直接引用 secrets，先求值成布尔字符串（名字不带 GITHUB_ 前缀）。
      ISSUE_SYNC_PAT_SET: ${{ secrets.ISSUE_SYNC_PAT != '' }}
    steps:
      - name: 检查 PAT 是否配置
        if: ${{ env.ISSUE_SYNC_PAT_SET != 'true' }}
        run: |
          echo "::error::缺少 ISSUE_SYNC_PAT secret。本工作流统一用 PAT 身份在 Discussion 下留言。"
          echo "::error::请在仓库 Settings → Secrets and variables → Actions 添加 ISSUE_SYNC_PAT。"
          exit 1

      - name: 在关联的 Discussion 下留言
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.ISSUE_SYNC_PAT }}
          script: |
            const { owner, repo } = context.repo;
            const LINK_RE = /Discussion\s*#(\d+)/gi;

            // 收集正文里所有「Discussion #N」，保序去重
            function discussionNums(body) {
              const seen = new Set();
              for (const m of String(body || '').matchAll(LINK_RE)) {
                const n = Number(m[1]);
                if (Number.isFinite(n) && n > 0) seen.add(n);
              }
              return [...seen];
            }

            // 读讨论本体 + 分页读完所有评论的 body（去重标记可能在很后面）
            async function loadDiscussion(num) {
              const res = await github.graphql(
                `query($o:String!,$r:String!,$n:Int!,$after:String){
                   repository(owner:$o,name:$r){
                     discussion(number:$n){
                       id
                       title
                       closed
                       comments(first:100,after:$after){
                         nodes { body }
                         pageInfo { hasNextPage endCursor }
                       }
                     }
                   }
                 }`,
                { o: owner, r: repo, n: num, after: null }
              );
              const d = res && res.repository ? res.repository.discussion : null;
              if (!d) return null;

              const bodies = d.comments.nodes.map(c => String(c.body || ''));
              let info = d.comments.pageInfo;
              // 上限防跑飞：最多翻 20 页（2000 条评论）
              for (let page = 0; info.hasNextPage && page < 20; page++) {
                const more = await github.graphql(
                  `query($o:String!,$r:String!,$n:Int!,$after:String){
                     repository(owner:$o,name:$r){
                       discussion(number:$n){
                         comments(first:100,after:$after){
                           nodes { body }
                           pageInfo { hasNextPage endCursor }
                         }
                       }
                     }
                   }`,
                  { o: owner, r: repo, n: num, after: info.endCursor }
                );
                const c = more.repository.discussion.comments;
                bodies.push(...c.nodes.map(x => String(x.body || '')));
                info = c.pageInfo;
              }
              return { id: d.id, title: d.title, closed: !!d.closed, bodies };
            }

            // 关闭 Discussion。原因映射：Issue 已完成 → RESOLVED；
            // 不计划处理 → OUTDATED。已经是关闭状态就跳过。
            //
            // 关键保护：一条 Discussion 可能被多个 Issue 引用（例如 #5 同时被 #17、#18 引用）。
            // 只有当引用它的 Issue「全部已关闭」时才关讨论；还有任一 OPEN 就留着。
            // 关闭原因映射（与 Issue 侧一致）：
            //   completed → RESOLVED（已完成）
            //   not_planned → OUTDATED（不计划处理）
            //   duplicate → DUPLICATE（重复）
            const CLOSE_REASON = {
              completed: 'RESOLVED',
              not_planned: 'OUTDATED',
              duplicate: 'DUPLICATE',
            };

            // 用 GitHub 搜索反查「正文里引用了 Discussion #N 的 Issue」
            // 注意：search API 要求查询里必须带 is:issue 或 is:pull-request，
            // 否则直接报 "Query must include 'is:issue' or 'is:pull-request'"。
            async function issuesReferencing(num) {
              const q = `repo:${owner}/${repo} is:issue "Discussion #${num}" in:body`;
              try {
                const res = await github.rest.search.issuesAndPullRequests({ q, per_page: 100 });
                return (res.data.items || [])
                  .filter(it => !it.pull_request)
                  .map(it => ({ number: it.number, state: String(it.state || '').toLowerCase() }));
              } catch (e) {
                core.warning(`反查 Discussion #${num} 的引用失败：${e.message}`);
                return null;   // null = 查不清，保守起见不关
              }
            }

            async function closeDiscussion(d, num, issueReason) {
              const reason = CLOSE_REASON[issueReason] || 'RESOLVED';
              if (d.closed) {
                core.info(`Discussion #${num} 已是关闭状态，跳过。`);
                return false;
              }

              // 还有别的 Issue 引用且未关闭 → 不能关
              const refs = await issuesReferencing(num);
              if (refs === null) {
                core.info(`Discussion #${num} 引用关系查不清，保守跳过关闭。`);
                return false;
              }
              const stillOpen = refs.filter(r => r.state !== 'closed');
              if (stillOpen.length > 0) {
                core.info(`Discussion #${num} 仍被未关闭的 Issue 引用（`
                  + stillOpen.map(r => '#' + r.number).join(', ') + '），不关闭。');
                return false;
              }

              try {
                await github.graphql(
                  `mutation($id:ID!,$reason:DiscussionCloseReason!){
                     closeDiscussion(input:{discussionId:$id,reason:$reason}){ discussion{ id closed } }
                   }`,
                  { id: d.id, reason }
                );
                core.info(`Discussion #${num} 已关闭（${reason}）。`);
                return true;
              } catch (e) {
                core.warning(`Discussion #${num} 关闭失败：${e.message}`);
                return false;
              }
            }

            // 重新打开 Discussion（Issue 被重开时用，两边状态保持一致）
            async function reopenDiscussion(d, num) {
              if (!d.closed) {
                core.info(`Discussion #${num} 本来就是打开的，跳过。`);
                return false;
              }
              try {
                await github.graphql(
                  `mutation($id:ID!){ reopenDiscussion(input:{discussionId:$id}){ discussion{ id closed } } }`,
                  { id: d.id }
                );
                core.info(`Discussion #${num} 已重新打开。`);
                return true;
              } catch (e) {
                core.warning(`Discussion #${num} 重开失败：${e.message}`);
                return false;
              }
            }

            // 留言；同一 Issue+Discussion+类别 只留一次
            async function commentOnDiscussion(issue, num, key, makeText) {
              let d = null;
              try {
                d = await loadDiscussion(num);
              } catch (e) {
                core.warning(`Discussion #${num} 读取失败：${e.message}`);
                return false;
              }
              if (!d) {
                core.warning(`Discussion #${num} 不存在或无权限，跳过。`);
                return false;
              }
              const tag = `<!-- disc-link:i${issue.number}:d${num}:${key} -->`;
              if (d.bodies.some(b => b.includes(tag))) {
                core.info(`Discussion #${num}：${key} 留言已存在，跳过。`);
                return false;
              }
              // 去重标记放在正文末尾：邮件/搜索/首行摘要里都不会露出内部标记。
              // 判定仍然用 includes，位置不影响识别。
              await github.graphql(
                `mutation($id:ID!,$body:String!){
                   addDiscussionComment(input:{discussionId:$id,body:$body}){ comment { id } }
                 }`,
                { id: d.id, body: `${makeText(d)}\n\n${tag}` }
              );
              core.info(`已在 Discussion #${num} 留言（${key}）。`);
              return true;
            }

            // 尝试把 Discussion 关闭（内部还有「是否仍有未关闭 Issue 引用」的保护）
            async function ensureClosed(num, reason) {
              // completed → RESOLVED；not_planned → OUTDATED；duplicate → DUPLICATE
              if (!['completed', 'not_planned', 'duplicate'].includes(reason)) return;
              try {
                const d = await loadDiscussion(num);
                if (d) await closeDiscussion(d, num, reason);
              } catch (e) {
                core.warning(`Discussion #${num} 关闭流程失败：${e.message}`);
              }
            }

            async function ensureOpen(num) {
              try {
                const d = await loadDiscussion(num);
                if (d) await reopenDiscussion(d, num);
              } catch (e) {
                core.warning(`Discussion #${num} 重开流程失败：${e.message}`);
              }
            }

            // 关闭原因的文案，集中一处，避免各分支写漏
            function closedLabel(reason) {
              return reason === 'completed' ? '已完成'
                : reason === 'not_planned' ? '已关闭（不计划处理）'
                : reason === 'duplicate' ? '已关闭（重复）'
                : '已关闭';
            }

            /**
             * 把一个 Issue 与它引用的 Discussion 收敛到一致状态。
             *
             * 关键点：不按「事件类型」决定发哪几条，而是按「当前真实状态」补齐缺的那几条。
             * 因为任何一条事件都可能被漏掉（工作流未部署、失败、GITHUB_TOKEN 触发被吞），
             * 只按事件发就会出现「有已关闭但没有已链接」这种残缺记录。
             * 去重靠隐藏标记，所以重复调用是安全的、幂等的。
             */
            async function syncIssue(issue, opts) {
              const o = opts || {};
              const nums = discussionNums(issue.body);
              if (!nums.length) {
                core.info(`Issue #${issue.number} 正文没有 Discussion #N 引用，跳过。`);
                return 0;
              }
              const url = `https://github.com/${owner}/${repo}/issues/${issue.number}`;
              const title = issue.title || '';
              const isClosed = String(issue.state || '').toLowerCase() === 'closed';
              // 事件 payload 用 state_reason（下划线），GraphQL 返回用 stateReason（驼峰），两者都认。
              const reason = String(issue.stateReason || issue.state_reason || '').toLowerCase();
              let posted = 0;

              for (const num of nums) {
                // ① 链接留言：只要还没有就补（否则关闭/重开时会出现「无链接」的残缺记录）
                if (await commentOnDiscussion(issue, num, 'linked', () =>
                  `已链接到 Issue #${issue.number}：${title}\n\n${url}`)) {
                  posted += 1;
                }

                // ② 按当前真实状态补齐后续留言
                if (isClosed) {
                  if (['completed', 'not_planned', 'duplicate'].includes(reason)) {
                    if (await commentOnDiscussion(issue, num, `closed-${reason}`, () =>
                      `${closedLabel(reason)}，详见 Issue #${issue.number}：${title}\n\n${url}`)) {
                      posted += 1;
                    }
                    await ensureClosed(num, reason);
                  }
                } else if (o.reopenNotice) {
                  // 只有「刚被重开」这个事件才写重开留言；补跑时不写，
                  // 免得给「本来就开着」的 Issue 凭空造一条重开记录。
                  if (await commentOnDiscussion(issue, num, 'reopened', () =>
                    `Issue #${issue.number} 已重新打开：${title}\n\n${url}`)) {
                    posted += 1;
                  }
                  await ensureOpen(num);
                }
              }
              return posted;
            }

            // —— 常规事件 ——
            if (context.payload.action) {
              const action = context.payload.action;
              // 补跑/常规都走同一套收敛逻辑；只有 reopened 才额外写「重新打开」留言。
              const n = await syncIssue(context.payload.issue, { reopenNotice: action === 'reopened' });
              core.info(`事件 ${context.eventName}.${action}：新增留言 ${n} 条。`);
              return;
            }

            // —— workflow_dispatch 补跑 ——
            const raw = String((context.payload.inputs && context.payload.inputs.issue_numbers) || '').trim();
            if (!raw) {
              core.warning('未填 issue_numbers，补跑不做任何事（避免误发一批留言）。');
              return;
            }

            // 统一用 GraphQL 取 Issue：REST 列表接口的 state_reason 不可靠，
            // 拿不到会让关闭文案退化成「已关闭」、Discussion 也不会被关。
            const ISSUE_FIELDS = `number title body state stateReason`;
            async function fetchIssue(num) {
              const res = await github.graphql(
                `query($o:String!,$r:String!,$n:Int!){
                   repository(owner:$o,name:$r){ issue(number:$n){ ${ISSUE_FIELDS} } }
                 }`,
                { o: owner, r: repo, n: num }
              );
              return res && res.repository ? res.repository.issue : null;
            }

            async function fetchAllIssues() {
              const out = [];
              let after = null;
              for (let page = 0; page < 20; page++) {
                const res = await github.graphql(
                  `query($o:String!,$r:String!,$after:String){
                     repository(owner:$o,name:$r){
                       issues(first:50,after:$after,states:[OPEN,CLOSED]){
                         nodes{ ${ISSUE_FIELDS} }
                         pageInfo{ hasNextPage endCursor }
                       }
                     }
                   }`,
                  { o: owner, r: repo, after }
                );
                const conn = res.repository.issues;
                out.push(...conn.nodes);
                if (!conn.pageInfo.hasNextPage) break;
                after = conn.pageInfo.endCursor;
              }
              return out;
            }

            let issues = [];
            if (raw.toLowerCase() === 'all') {
              issues = await fetchAllIssues();
            } else {
              for (const part of raw.split(/[,\s]+/).filter(Boolean)) {
                const num = Number(part.replace(/^#/, ''));
                if (!Number.isFinite(num) || num <= 0) {
                  core.warning(`忽略无法识别的编号：${part}`);
                  continue;
                }
                try {
                  const iss = await fetchIssue(num);
                  if (iss) issues.push(iss);
                  else core.warning(`Issue #${num} 不存在，跳过。`);
                } catch (e) {
                  core.warning(`Issue #${num} 读取失败：${e.message}`);
                }
              }
            }

            let total = 0;
            for (const iss of issues) {
              // 走同一套收敛逻辑：缺「已链接」补已链接，已关闭的补关闭留言并关讨论。
              // 补跑不写「重新打开」留言（那不是当前状态，会给开着的 Issue 凭空造记录）。
              total += await syncIssue(iss, { reopenNotice: false });
            }
            core.info(`补跑检查 ${issues.length} 个 Issue，新增留言 ${total} 条。`);
