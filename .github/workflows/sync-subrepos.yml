name: Sync to Sub-repositories

on:
  push:
    branches:
      - main
    paths:
      - '*'
      - '[a-z]*/**'
      - 'Tools/Relay/**'
      - 'Cube/Formula/**'
      - 'Tools/KGenesis/**'
      - 'Tools/Pulse/**'

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_repo: Tools-Relay
            source_path: Tools/Relay
          - target_repo: Cube-Formula
            source_path: Cube/Formula
          - target_repo: Tools-KGenesis
            source_path: Tools/KGenesis
          - target_repo: Tools-Pulse
            source_path: Tools/Pulse

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6
        with:
          path: source

      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          repository: Ckarefulon/${{ matrix.target_repo }}
          token: ${{ secrets.TARGET_REPO_TOKEN }}
          path: target
          fetch-depth: 0

      - name: Clean target repository (preserve .git, .github, and README.md)
        run: |
          cd target
          # 保留 .git 文件夹、.github 文件夹以及精确的 README.md（区分大小写）
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'README.md' \
            -exec rm -rf {} +

      - name: Sync folders and files
        run: |
          cd source

          # 1. 复制所有首字母小写的顶层目录（完整内容）
          for d in */; do
            d="${d%/}"
            if [[ "$d" =~ ^[a-z] ]]; then
              mkdir -p "../target/$d"
              rsync -av "$d/" "../target/$d/"
            fi
          done

          # 2. 复制根目录下的所有普通文件（不含子目录）
          for f in *; do
            [ -f "$f" ] && cp "$f" ../target/
          done

          # 3. 单独复制当前矩阵项指定的深层子目录（与触发路径一致）
          mkdir -p "../target/${{ matrix.source_path }}"
          if [ -d "${{ matrix.source_path }}" ] && [ "$(ls -A "${{ matrix.source_path }}" 2>/dev/null)" ]; then
            cp -r "${{ matrix.source_path }}"/* "../target/${{ matrix.source_path }}/"
          fi

      - name: Commit and push to target
        run: |
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync from Ckarefulon.github.io (${{ github.sha }}) - ${{ matrix.source_path }}"
            git push origin main
          fi