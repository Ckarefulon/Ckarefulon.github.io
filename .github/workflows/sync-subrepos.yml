name: Sync to Sub-repositories

# 同步范围不再手写清单，而是由 .github/scripts/discover-sync-targets.sh 现场推导：
# 站点里所有「每一级目录名都以大写字母 A-Z 开头」的目录（判据同站点根的 .make-index.ps1）
# 都各是一个目标，仓库名 = 路径里的 "/" 换成 "-"（Cube/Formula → Cube-Formula）。
on:
  push:
    branches:
      - main
    # 同步范围是现场推导的，不在 workflow 里静态列举；
    # 任何改动（含 .github/ 下的 workflow 与脚本本身）都触发一轮。
    paths:
      - '**'

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.scan.outputs.matrix }}
      count: ${{ steps.scan.outputs.count }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6
        with:
          path: source

      - name: Discover sync targets
        id: scan
        env:
          TARGET_OWNER: Ckarefulon
          REPO_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: bash source/.github/scripts/discover-sync-targets.sh source

  sync:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v6
        with:
          path: source

      - name: Checkout target repository
        uses: actions/checkout@v6
        with:
          repository: Ckarefulon/${{ matrix.target_repo }}
          token: ${{ secrets.TARGET_REPO_TOKEN }}
          path: target
          fetch-depth: 0

      - name: Clean target repository (preserve .git, .github, and README.md)
        run: |
          cd target
          # 保留 .git 文件夹、.github 文件夹以及精确的 README.md（区分大小写）
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name 'README.md' \
            -exec rm -rf {} +

      - name: Sync target folder and its lowercase ancestors
        run: |
          bash source/.github/scripts/sync-one-target.sh source target '${{ matrix.source_path }}'

      - name: Commit and push to target
        run: |
          cd target
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync from Ckarefulon.github.io (${{ github.sha }}) - ${{ matrix.source_path }}"
            git push origin main
          fi
