<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="OneDrive.svg" type="image/svg+xml">

    <!-- 主题先落地，避免深浅色闪一下（与其它页面共用 smartCubeTheme） -->
    <script>
        (function () {
            var saved = null;
            try { saved = localStorage.getItem("smartCubeTheme"); } catch (e) {}
            var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
        })();
    </script>

    <!-- 设计令牌 + 站点顶栏（本页 3 秒后跳走，故不接 Supabase 登录栈） -->
    <link rel="stylesheet" href="/ui/colors_and_type.css">
    <link rel="stylesheet" href="/nav/nav.css?v=1877">
    <script src="/nav/nav.js?v=1892" defer></script>
    <script src="/assets/services/core/site-scope.js?v=1877" defer></script>

    <style>
        html, body {
            height: 100%;
            margin: 0;
        }

        /* nav.css 已给 body 加了 padding-top（顶栏高度），这里用 border-box
           让 100% 高度包含这段内边距，图标仍然是「顶着屏幕垂直居中」 */
        body {
            box-sizing: border-box;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        .svg-icon {
            width: 50vh;
            height: 50vh;
        }
    </style>
    <meta http-equiv="refresh" content="3;url=https://ckarefulon-my.sharepoint.com/:f:/g/personal/careful_ckarefulon_onmicrosoft_com/Eu2fTkVQiJJJnR2bRxtwvRkB8yo4wTi8XFfdNs0cgjmSKg?e=lgzfwk">
</head>
<body>
    <div class="container">
        <a href="https://ckarefulon-my.sharepoint.com/:f:/g/personal/careful_ckarefulon_onmicrosoft_com/Eu2fTkVQiJJJnR2bRxtwvRkB8yo4wTi8XFfdNs0cgjmSKg?e=lgzfwk">
            <svg class="svg-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <defs>
                    <style>
                        .cls-1 {
                            fill: none;
                        }

                        .cls-2 {
                            fill: #0364b8;
                        }

                        .cls-3 {
                            fill: #0078d4;
                        }

                        .cls-4 {
                            fill: #1490df;
                        }

                        .cls-5 {
                            fill: #28a8ea;
                        }
                    </style>
                </defs>
                <title>OneDrive</title>
                <g id="OneDrive">
                    <rect class="cls-1" width="24" height="24" />
                    <path class="cls-2" d="M14.5,15l4.95-4.74A7.5,7.5,0,0,0,5.92,8C6,8,14.5,15,14.5,15Z" />
                    <path class="cls-3" d="M9.15,8.89h0A6,6,0,0,0,6,8H5.92a6,6,0,0,0-4.84,9.43L8.5,16.5l5.69-4.59Z" />
                    <path class="cls-4" d="M19.45,10.26h-.32a4.84,4.84,0,0,0-1.94.4h0l-3,1.26L17.5,16l5.92,1.44a4.88,4.88,0,0,0-4-7.18Z" />
                    <path class="cls-5" d="M1.08,17.43A6,6,0,0,0,6,20H19.13a4.89,4.89,0,0,0,4.29-2.56l-9.23-5.53Z" />
                </g>
            </svg>
        </a>
    </div>
    <script>
        // nav.js 只注册 window.siteNav，顶栏要由页面自己 init
        document.addEventListener("DOMContentLoaded", function () {
            if (window.siteNav && typeof window.siteNav.init === "function") {
                window.siteNav.init({
                    setTheme: function (theme) {
                        document.documentElement.dataset.theme = theme;
                        try { localStorage.setItem("smartCubeTheme", theme); } catch (e) {}
                    }
                });
            }
        });
        sleep(3000)
        window.location.href = "https://ckarefulon-my.sharepoint.com/:f:/g/personal/careful_ckarefulon_onmicrosoft_com/Eu2fTkVQiJJJnR2bRxtwvRkB8yo4wTi8XFfdNs0cgjmSKg?e=lgzfwk";
    </script>
</body>
</html>
