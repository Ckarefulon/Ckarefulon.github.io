<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Input 输入框 — Ziqing Design System</title>
  <link rel="stylesheet" href="../colors_and_type.css" />
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--dsk-font-sans);
      background: var(--dsk-background);
      color: var(--dsk-foreground);
      min-height: 100vh;
      padding: 60px 40px;
      line-height: 1.5;
    }

    .page-title {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .page-desc {
      color: var(--dsk-foreground-muted);
      font-size: 14px;
      margin-bottom: 48px;
    }

    .section {
      margin-bottom: 48px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 500;
      color: var(--dsk-foreground-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 20px;
    }

    .demo-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 420px;
    }

    .demo-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .demo-label {
      font-size: 12px;
      color: var(--dsk-foreground-subtle);
    }

    /* ---------- Input Component ---------- */
    .input-field {
      width: 100%;
      height: 40px;
      padding: 0 14px;
      font-family: var(--dsk-font-sans);
      font-size: 14px;
      color: var(--dsk-input-foreground);
      background: var(--dsk-input);
      border: 1px solid var(--dsk-border);
      border-radius: var(--dsk-radius-md);
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease, opacity 0.2s ease;
    }

    .input-field::placeholder {
      color: var(--dsk-foreground-subtle);
    }

    .input-field:hover:not(:disabled):not([aria-invalid="true"]) {
      border-color: var(--dsk-slate-600);
    }

    .input-field:focus {
      border-color: var(--dsk-accent);
      box-shadow: 0 0 0 3px var(--dsk-accent-soft),
                  0 0 20px var(--dsk-accent-glow);
    }

    .input-field:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .input-field[aria-invalid="true"] {
      border-color: var(--dsk-danger);
    }

    .input-field[aria-invalid="true"]:focus {
      box-shadow: 0 0 0 3px rgba(232, 93, 106, 0.15),
                  0 0 16px rgba(232, 93, 106, 0.12);
    }

    /* Input with label */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .input-group label {
      font-size: 13px;
      font-weight: 500;
      color: var(--dsk-foreground);
    }

    .error-message {
      font-size: 12px;
      color: var(--dsk-danger);
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .error-message svg {
      width: 14px;
      height: 14px;
    }

    /* Input with icon */
    .input-icon-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-wrapper .input-icon {
      position: absolute;
      left: 12px;
      width: 16px;
      height: 16px;
      color: var(--dsk-foreground-subtle);
      pointer-events: none;
    }

    .input-icon-wrapper .input-field {
      padding-left: 40px;
    }

    /* Sizes */
    .input-field.sm {
      height: 32px;
      font-size: 13px;
      padding: 0 12px;
      border-radius: var(--dsk-radius-sm);
    }

    .input-icon-wrapper .input-field.sm {
      padding-left: 34px;
    }

    .input-icon-wrapper .input-icon.sm {
      width: 14px;
      height: 14px;
      left: 10px;
    }

    .input-field.md {
      height: 40px;
      font-size: 14px;
      padding: 0 14px;
    }

    .input-field.lg {
      height: 48px;
      font-size: 15px;
      padding: 0 16px;
      border-radius: var(--dsk-radius-lg);
    }

    .input-icon-wrapper .input-field.lg {
      padding-left: 46px;
    }

    .input-icon-wrapper .input-icon.lg {
      width: 18px;
      height: 18px;
      left: 14px;
    }

    /* Textarea */
    textarea.input-field {
      height: auto;
      min-height: 100px;
      padding: 12px 14px;
      resize: vertical;
      line-height: 1.6;
    }

    /* Focused demo (pre-focused state) */
    .input-field.is-focused {
      border-color: var(--dsk-accent);
      box-shadow: 0 0 0 3px var(--dsk-accent-soft),
                  0 0 20px var(--dsk-accent-glow);
    }

    /* Size comparison row */
    .size-row {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .size-item {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .size-name {
      width: 40px;
      font-size: 12px;
      color: var(--dsk-foreground-subtle);
      font-family: var(--dsk-font-mono);
      text-transform: uppercase;
    }

    .size-item .input-field {
      flex: 1;
      max-width: 320px;
    }
  </style>
</head>
<body>
  <h1 class="page-title">Input 输入框</h1>
  <p class="page-desc">基础输入组件，支持多种状态、尺寸与图标搭配。</p>

  <!-- 默认状态 -->
  <div class="section">
    <div class="section-title">默认状态 Default</div>
    <div class="demo-grid">
      <div class="input-group">
        <label for="input-default">用户名</label>
        <input
          id="input-default"
          type="text"
          class="input-field"
          placeholder="请输入用户名"
        />
      </div>
      <div class="input-group">
        <label for="input-filled">邮箱地址</label>
        <input
          id="input-filled"
          type="email"
          class="input-field"
          value="ziqing@example.com"
        />
      </div>
    </div>
  </div>

  <!-- 聚焦状态 -->
  <div class="section">
    <div class="section-title">聚焦状态 Focus</div>
    <div class="demo-grid">
      <div class="input-group">
        <label for="input-focus">搜索</label>
        <input
          id="input-focus"
          type="text"
          class="input-field is-focused"
          placeholder="输入关键词搜索..."
        />
      </div>
      <div class="demo-label">青色边框 + 极淡青色光晕，体现光感与科技气质</div>
    </div>
  </div>

  <!-- 禁用状态 -->
  <div class="section">
    <div class="section-title">禁用状态 Disabled</div>
    <div class="demo-grid">
      <div class="input-group">
        <label for="input-disabled">不可编辑字段</label>
        <input
          id="input-disabled"
          type="text"
          class="input-field"
          placeholder="此字段不可编辑"
          disabled
        />
      </div>
      <div class="input-group">
        <label for="input-disabled-value">已禁用（有值）</label>
        <input
          id="input-disabled-value"
          type="text"
          class="input-field"
          value="不可修改的内容"
          disabled
        />
      </div>
    </div>
  </div>

  <!-- 错误状态 -->
  <div class="section">
    <div class="section-title">错误状态 Error</div>
    <div class="demo-grid">
      <div class="input-group">
        <label for="input-error">密码</label>
        <input
          id="input-error"
          type="password"
          class="input-field"
          value="123"
          aria-invalid="true"
        />
        <div class="error-message">
          <i data-lucide="alert-circle"></i>
          <span>密码长度至少为 8 位</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 带图标输入框 -->
  <div class="section">
    <div class="section-title">带图标 With Icon</div>
    <div class="demo-grid">
      <div class="input-icon-wrapper">
        <i data-lucide="search" class="input-icon"></i>
        <input
          type="text"
          class="input-field"
          placeholder="搜索内容..."
        />
      </div>
      <div class="input-icon-wrapper">
        <i data-lucide="user" class="input-icon"></i>
        <input
          type="text"
          class="input-field"
          placeholder="用户名 / 邮箱"
        />
      </div>
      <div class="input-icon-wrapper">
        <i data-lucide="mail" class="input-icon"></i>
        <input
          type="email"
          class="input-field"
          value="hello@ziqing.design"
        />
      </div>
    </div>
  </div>

  <!-- 文本域 -->
  <div class="section">
    <div class="section-title">文本域 Textarea</div>
    <div class="demo-grid" style="max-width: 560px;">
      <div class="input-group">
        <label for="textarea-default">个人简介</label>
        <textarea
          id="textarea-default"
          class="input-field"
          placeholder="介绍一下你自己..."
          rows="4"
        ></textarea>
      </div>
      <div class="input-group">
        <label for="textarea-filled">反馈内容</label>
        <textarea
          id="textarea-filled"
          class="input-field"
          rows="4"
        >设计系统整体视觉统一，暗色模式下的青色光效很有科技感。希望能增加更多组件的变体支持。</textarea>
      </div>
    </div>
  </div>

  <!-- 尺寸 -->
  <div class="section">
    <div class="section-title">尺寸 Sizes</div>
    <div class="size-row">
      <div class="size-item">
        <span class="size-name">sm</span>
        <input type="text" class="input-field sm" placeholder="Small — 32px" />
      </div>
      <div class="size-item">
        <span class="size-name">md</span>
        <input type="text" class="input-field md" placeholder="Medium — 40px" />
      </div>
      <div class="size-item">
        <span class="size-name">lg</span>
        <input type="text" class="input-field lg" placeholder="Large — 48px" />
      </div>
    </div>
  </div>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
