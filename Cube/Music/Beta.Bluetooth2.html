<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蓝牙设备扫描器</title>
</head>
<body>
    <!-- 主要内容区 -->
    <main>
        <!-- 状态信息 -->
        <section>
            <div>
                <div>
                    <div>
                        <div>
                            <h2>当前状态</h2>
                            <p id="connection-status">未连接到任何设备</p>
                        </div>
                    </div>
                    <div>
                        <span>当前设备:</span>
                        <span id="current-device">未选择</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- 设备列表与连接控制 -->
        <section>
            <div>
                <div>
                    <h2>蓝牙设备</h2>
                    <div>
                        <button id="scan-devices">扫描设备</button>
                        <button id="connect-selected" disabled>连接</button>
                        <button id="disconnect" disabled>断开连接</button>
                        <button id="scan-devices-no-filter">不筛选扫描设备</button>
                    </div>
                </div>
                
                <!-- 设备列表 -->
                <div id="devices-list">
                    <div>
                        <p>点击"扫描设备"开始搜索蓝牙设备</p>
                    </div>
                </div>
            </div>
        </section>

        <!-- 设备操作区 -->
        <section>
            <div>
                <h2>设备操作</h2>
                
                <div id="device-controls" style="opacity: 0.5; pointer-events: none;">
                    <!-- 设备控制命令 -->
                    <div>
                        <div>
                            <h3>发送命令</h3>
                            <div>
                                <input type="text" id="command-input" placeholder="输入命令...">
                                <button id="send-command">发送</button>
                            </div>
                        </div>
                        
                        <div>
                            <h3>预设命令</h3>
                            <div>
                                <button class="preset-command">命令1</button>
                                <button class="preset-command">命令2</button>
                                <button class="preset-command">命令3</button>
                                <button class="preset-command">命令4</button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 数据接收区 -->
                    <div>
                        <h3>数据接收</h3>
                        <div id="data-display">
                            <p>等待接收数据...</p>
                        </div>
                    </div>
                </div>
                
                <!-- 未连接提示 -->
                <div id="no-device-connected">
                    <h3>未连接到任何设备</h3>
                    <p>请先从设备列表中选择一个蓝牙设备并连接</p>
                </div>
            </div>
        </section>

        <!-- 日志区域 -->
        <section>
            <div>
                <div>
                    <h2>操作日志</h2>
                    <button id="clear-logs">清空日志</button>
                </div>
                
                <div id="logs-container">
                    <div>
                        <span>[初始化]</span> 蓝牙设备扫描器已启动
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 页脚 -->
    <footer>
        <div>
            <p>蓝牙设备扫描器 &copy; 2025 | 使用 Web Bluetooth API 构建</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // 全局变量
            let bluetoothDevice = null;
            let server = null;
            let characteristic = null;
            let selectedDevice = null;
            
            // DOM 元素
            const scanDevicesBtn = document.getElementById('scan-devices');
            const connectSelectedBtn = document.getElementById('connect-selected');
            const disconnectBtn = document.getElementById('disconnect');
            const devicesList = document.getElementById('devices-list');
            const connectionStatus = document.getElementById('connection-status');
            const currentDevice = document.getElementById('current-device');
            const deviceControls = document.getElementById('device-controls');
            const noDeviceConnected = document.getElementById('no-device-connected');
            const commandInput = document.getElementById('command-input');
            const sendCommandBtn = document.getElementById('send-command');
            const presetCommands = document.querySelectorAll('.preset-command');
            const dataDisplay = document.getElementById('data-display');
            const logsContainer = document.getElementById('logs-container');
            const clearLogsBtn = document.getElementById('clear-logs');
            const scanDevicesNoFilterBtn = document.getElementById('scan-devices-no-filter');
            
            // 初始化日志
            log('蓝牙设备扫描器已启动');
            log('正在检查浏览器兼容性...');
            
            // 检测蓝牙支持
            if (!navigator.bluetooth) {
                log('您的浏览器不支持Web Bluetooth API', 'error');
                showError('您的浏览器不支持Web Bluetooth API，请使用Chrome、Edge或Opera浏览器。');
            } else {
                log('浏览器支持Web Bluetooth API');
            }
            
            // 事件绑定
            scanDevicesBtn.addEventListener('click', scanForDevices);
            scanDevicesNoFilterBtn.addEventListener('click', scanForDevicesNoFilter);
            connectSelectedBtn.addEventListener('click', connectToDevice);
            disconnectBtn.addEventListener('click', disconnectDevice);
            sendCommandBtn.addEventListener('click', sendCommand);
            
            presetCommands.forEach(btn => {
                btn.addEventListener('click', function() {
                    const command = this.textContent.trim();
                    commandInput.value = command;
                    sendCommand();
                });
            });
            
            clearLogsBtn.addEventListener('click', clearLogs);
            
            // 蓝牙核心功能
            function checkBluetoothSupport() {
                return !!navigator.bluetooth;
            }
            
            function scanForDevices() {
                log('开始扫描蓝牙设备...');
                devicesList.innerHTML = '<div><p>正在扫描蓝牙设备...</p></div>';
                
                const filters = [
                    { services: ['00001800-0000-1000-8000-00805f9b34fb'] },
                    { services: ['00001801-0000-1000-8000-00805f9b34fb'] },
                    { services: ['0000180a-0000-1000-8000-00805f9b34fb'] },
                    { namePrefix: 'BLE' },
                    { namePrefix: 'HC-' }
                ];
                
                navigator.bluetooth.requestDevice({
                    filters: filters,
                    optionalServices: [
                        '00001800-0000-1000-8000-00805f9b34fb',
                        '00001801-0000-1000-8000-00805f9b34fb',
                        '0000180a-0000-1000-8000-00805f9b34fb',
                        '0000ffe0-0000-1000-8000-00805f9b34fb',
                        '0000fff0-0000-1000-8000-00805f9b34fb'
                    ]
                })
                .then(device => {
                    log('已发现设备: ' + device.name);
                    bluetoothDevice = device;
                    
                    devicesList.innerHTML = `
                        <div data-id="${device.id}">
                            <div>
                                <div>
                                    <div>
                                        <h3>${device.name || '未知设备'}</h3>
                                        <p>ID: ${device.id.substring(0, 8)}...</p>
                                    </div>
                                </div>
                                <div>已选中</div>
                            </div>
                        </div>
                    `;
                    
                    selectedDevice = device;
                    connectSelectedBtn.removeAttribute('disabled');
                    currentDevice.textContent = device.name || '未知设备';
                    device.addEventListener('gattserverdisconnected', onDeviceDisconnected);
                })
                .catch(error => {
                    log('扫描设备时出错: ' + error, 'error');
                    devicesList.innerHTML = `
                        <div>
                            <p>扫描设备失败: ${error.message}</p>
                            <p>请确保蓝牙已开启且设备处于可发现状态</p>
                        </div>
                    `;
                });
            }
            
            function scanForDevicesNoFilter() {
                log('开始不筛选扫描蓝牙设备...');
                devicesList.innerHTML = '<div><p>正在不筛选扫描蓝牙设备...</p></div>';
                
                navigator.bluetooth.requestDevice({
                    acceptAllDevices: true,
                    optionalServices: [
                        '00001800-0000-1000-8000-00805f9b34fb',
                        '00001801-0000-1000-8000-00805f9b34fb',
                        '0000180a-0000-1000-8000-00805f9b34fb',
                        '0000ffe0-0000-1000-8000-00805f9b34fb',
                        '0000fff0-0000-1000-8000-00805f9b34fb'
                    ]
                })
                .then(device => {
                    log('已发现设备: ' + device.name);
                    bluetoothDevice = device;
                    
                    devicesList.innerHTML = `
                        <div data-id="${device.id}">
                            <div>
                                <div>
                                    <div>
                                        <h3>${device.name || '未知设备'}</h3>
                                        <p>ID: ${device.id.substring(0, 8)}...</p>
                                    </div>
                                </div>
                                <div>已选中</div>
                            </div>
                        </div>
                    `;
                    
                    selectedDevice = device;
                    connectSelectedBtn.removeAttribute('disabled');
                    currentDevice.textContent = device.name || '未知设备';
                    device.addEventListener('gattserverdisconnected', onDeviceDisconnected);
                })
                .catch(error => {
                    log('扫描设备时出错: ' + error, 'error');
                    devicesList.innerHTML = `
                        <div>
                            <p>扫描设备失败: ${error.message}</p>
                            <p>请确保蓝牙已开启且设备处于可发现状态</p>
                        </div>
                    `;
                });
            }
            
            function connectToDevice() {
                if (!selectedDevice) {
                    log('没有选中的设备', 'error');
                    return;
                }
                
                log('正在连接到设备: ' + selectedDevice.name);
                updateConnectionStatus('正在连接...');
                
                selectedDevice.gatt.connect()
                .then(gattServer => {
                    server = gattServer;
                    log('已连接到 GATT 服务器');
                    
                    const serviceUUIDs = [
                        '0000ffe0-0000-1000-8000-00805f9b34fb',
                        '0000fff0-0000-1000-8000-00805f9b34fb',
                        '00001800-0000-1000-8000-00805f9b34fb',
                        '00001801-0000-1000-8000-00805f9b34fb'
                    ];
                    
                    return tryGetService(server, serviceUUIDs);
                })
                .then(service => {
                    log('已获取服务');
                    
                    const characteristicUUIDs = [
                        '0000ffe1-0000-1000-8000-00805f9b34fb',
                        '0000fff1-0000-1000-8000-00805f9b34fb',
                        '00002a00-0000-1000-8000-00805f9b34fb',
                        '00002a01-0000-1000-8000-00805f9b34fb'
                    ];
                    
                    return tryGetCharacteristic(service, characteristicUUIDs);
                })
                .then(char => {
                    characteristic = char;
                    log('已获取特征');
                    
                    updateConnectionStatus('已连接');
                    deviceControls.style.opacity = '1';
                    deviceControls.style.pointerEvents = 'auto';
                    noDeviceConnected.style.display = 'none';
                    disconnectBtn.removeAttribute('disabled');
                    connectSelectedBtn.setAttribute('disabled', 'true');
                    
                    if (characteristic.properties.notify) {
                        characteristic.startNotifications()
                        .then(() => {
                            log('已启用特征通知');
                            characteristic.addEventListener('characteristicvaluechanged', handleCharacteristicValueChanged);
                        })
                        .catch(error => {
                            log('启用通知失败: ' + error, 'warning');
                        });
                    }
                    
                    log('设备连接成功，可以开始通信');
                })
                .catch(error => {
                    log('连接设备时出错: ' + error, 'error');
                    updateConnectionStatus('连接失败');
                    resetConnectionState();
                });
            }
            
            function disconnectDevice() {
                if (!server || !server.connected) {
                    log('没有活动的连接', 'warning');
                    return;
                }
                
                log('正在断开连接...');
                updateConnectionStatus('正在断开连接...');
                
                if (characteristic && characteristic.properties.notify) {
                    characteristic.stopNotifications()
                    .then(() => {
                        log('已停止特征通知');
                        characteristic.removeEventListener('characteristicvaluechanged', handleCharacteristicValueChanged);
                    })
                    .catch(error => {
                        log('停止通知失败: ' + error, 'warning');
                    });
                }
                
                server.disconnect();
                log('已断开与设备的连接');
                updateConnectionStatus('未连接');
                resetConnectionState();
            }
            
            function resetConnectionState() {
                server = null;
                characteristic = null;
                deviceControls.style.opacity = '0.5';
                deviceControls.style.pointerEvents = 'none';
                noDeviceConnected.style.display = 'block';
                disconnectBtn.setAttribute('disabled', 'true');
                connectSelectedBtn.removeAttribute('disabled');
                dataDisplay.innerHTML = '<p>等待接收数据...</p>';
            }
            
            function handleCharacteristicValueChanged(event) {
                const value = event.target.value;
                const dataString = bytesToString(value);
                log('接收到数据: ' + dataString);
                
                const dataItem = document.createElement('div');
                dataItem.innerHTML = `<span>[接收]</span> ${dataString}`;
                dataDisplay.appendChild(dataItem);
                dataDisplay.scrollTop = dataDisplay.scrollHeight;
            }
            
            function sendCommand() {
                const command = commandInput.value.trim();
                if (!command) {
                    log('命令不能为空', 'warning');
                    return;
                }
                
                if (!characteristic) {
                    log('未连接到设备，无法发送命令', 'error');
                    return;
                }
                
                log('发送命令: ' + command);
                
                const dataItem = document.createElement('div');
                dataItem.innerHTML = `<span>[发送]</span> ${command}`;
                dataDisplay.appendChild(dataItem);
                dataDisplay.scrollTop = dataDisplay.scrollHeight;
                
                const dataArray = stringToBytes(command);
                
                if (characteristic.properties.writeWithoutResponse) {
                    characteristic.writeValueWithoutResponse(dataArray)
                    .then(() => log('命令发送成功 (无响应)'))
                    .catch(error => log('发送命令失败: ' + error, 'error'));
                } else if (characteristic.properties.write) {
                    characteristic.writeValue(dataArray)
                    .then(() => log('命令发送成功'))
                    .catch(error => log('发送命令失败: ' + error, 'error'));
                } else {
                    log('特征不支持写入操作', 'error');
                }
            }
            
            function updateConnectionStatus(statusText) {
                connectionStatus.textContent = statusText;
            }
            
            function log(message, type = 'info') {
                const now = new Date();
                const timeString = now.toLocaleTimeString();
                const logItem = document.createElement('div');
                
                let prefix = '';
                switch(type) {
                    case 'error': prefix = '[错误]'; break;
                    case 'warning': prefix = '[警告]'; break;
                    case 'success': prefix = '[成功]'; break;
                    default: prefix = '[信息]';
                }
                
                logItem.innerHTML = `<span>[${timeString}]</span> <span>${prefix}</span> ${message}`;
                logsContainer.appendChild(logItem);
                logsContainer.scrollTop = logsContainer.scrollHeight;
            }
            
            function clearLogs() {
                logsContainer.innerHTML = '';
                log('日志已清空');
            }
            
            function onDeviceDisconnected() {
                log('设备已断开连接', 'warning');
                updateConnectionStatus('未连接');
                resetConnectionState();
            }
            
            function tryGetService(server, serviceUUIDs) {
                let promise = Promise.reject(new Error('No services found'));
                for (const uuid of serviceUUIDs) {
                    promise = promise.catch(() => server.getPrimaryService(uuid));
                }
                return promise;
            }
            
            function tryGetCharacteristic(service, characteristicUUIDs) {
                let promise = Promise.reject(new Error('No characteristics found'));
                for (const uuid of characteristicUUIDs) {
                    promise = promise.catch(() => service.getCharacteristic(uuid));
                }
                return promise;
            }
            
            function bytesToString(buffer) {
                return String.fromCharCode.apply(null, new Uint8Array(buffer));
            }
            
            function stringToBytes(str) {
                const array = new Uint8Array(str.length);
                for (let i = 0; i < str.length; i++) {
                    array[i] = str.charCodeAt(i);
                }
                return array;
            }
            
            function showError(message) {
                logsContainer.innerHTML = `<div><span>[错误]</span> ${message}</div>`;
            }
        });
    </script>
</body>
</html>
