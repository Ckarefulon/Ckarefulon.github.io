<!DOCTYPE html>
<html translate="no">
<head>
    <title>Cube</title>    
    <div id="common-head"></div>
    <style>
        a {
            color: #24f0ea;
            text-shadow: 17px 17px 17px #55367a;
            text-decoration: none;
            font-weight: bold;
            font-size: 7em;
            margin: auto;
            padding: 17px;
            display: inline-block;
        }
        .Hide {
            display: none;
        }
        .error {
            color: red;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="common-header"></div>
    <span class="Hide">Cube</span>
    <a href="ZBLL">ZBLL</a>
    <a href="Cross">Cross</a>

    <script>
        // 等待DOM加载完成
        document.addEventListener('DOMContentLoaded', function() {
            // 尝试加载头部
            loadHeader('Common.html', 'common-head')
                .catch(() => loadHeaderFromScriptTag())
                .catch(error => showError('common-head', error));
            
            // 尝试加载第二个头部
            loadHeader('CommonHeader.html', 'common-header')
                .catch(error => showError('common-header', error));
        });

        // 使用Fetch API加载头部
        async function loadHeader(filePath, targetId) {
            try {
                const response = await fetch(filePath);
                if (!response.ok) throw new Error(`HTTP错误: ${response.status}`);
                
                const html = await response.text();
                document.getElementById(targetId).innerHTML = html;
                console.log(`${filePath} 加载成功`);
            } catch (error) {
                console.error(`加载 ${filePath} 失败:`, error);
                throw error;
            }
        }

        // 备选方案：从script标签加载
        function loadHeaderFromScriptTag() {
            const scriptTag = document.querySelector('script[type="text/html"]');
            if (scriptTag) {
                document.getElementById('common-head').innerHTML = scriptTag.innerHTML;
                console.log('从script标签加载头部成功');
                return Promise.resolve();
            }
            return Promise.reject(new Error('找不到script标签'));
        }

        // 显示错误信息
        function showError(targetId, error) {
            const target = document.getElementById(targetId);
            target.innerHTML = `
                <div class="error">
                    加载失败: ${error.message}
                    <br>请确保文件存在且路径正确
                </div>
            `;
        }
    </script>

    <!-- 备选方案：内联头部内容 -->
    <script type="text/html" id="inline-header">
        <div class="inline-header">
            <h1>备选头部</h1>
            <p>如果外部文件加载失败，将显示此内容</p>
        </div>
    </script>
</body>
</html>
