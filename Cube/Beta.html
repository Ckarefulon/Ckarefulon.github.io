<!DOCTYPE html>
<html translate="no">
<head>
    <title>Cube</title>    
    <div id="common-head"></div>
    <style>
        a {
            color: #24f0ea;
            text-shadow: 17px 17px 17px #55367a;
            text-decoration: none;
            font-weight: bold;
            font-size: 7em;
            margin: auto;
            padding: 17px;
            display: inline-block; /* 确保内边距生效 */
        }
        .Hide {
            display: none;
        }
    </style>
</head>
<body>
    <div id="common-header"></div>
    <span class="Hide">Cube</span>
    <a href="ZBLL">ZBLL</a>
    <a href="Cross">Cross</a>

    <script>
        // 等待DOM完全加载
        document.addEventListener('DOMContentLoaded', function() {
            loadHeader();
            loadHeader2(); // 加载第二个头部（如果需要）
        });

        // 加载第一个头部
        function loadHeader() {
            fetch('Common.html') // 相对路径，根据实际情况调整
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`加载失败: ${response.status}`);
                    }
                    return response.text();
                })
                .then(html => {
                    document.getElementById('common-head').innerHTML = html;
                    console.log('头部加载成功');
                })
                .catch(error => {
                    console.error('加载头部时出错:', error);
                    // 可以在这里添加备选内容
                    document.getElementById('common-head').innerHTML = 
                        '<div class="error">头部加载失败</div>';
                });
        }

        // 加载第二个头部（如果需要）
        function loadHeader2() {
            fetch('CommonHeader.html') // 第二个头部文件
                .then(response => response.text())
                .then(html => {
                    document.getElementById('common-header').innerHTML = html;
                })
                .catch(error => {
                    console.error('加载第二个头部时出错:', error);
                });
        }
    </script>
</body>
</html>
