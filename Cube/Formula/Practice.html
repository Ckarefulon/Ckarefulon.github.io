<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>训练模式</title>
	<style>
		:root {
			color-scheme: light;
			--bg: #f6f7fb;
			--surface: rgba(255, 255, 255, 0.9);
			--surfaceSolid: #ffffff;
			--ink: #242436;
			--muted: #575a6d;
			--line: #d5d8e5;
			--panel: rgba(255, 255, 255, 0.88);
			--accent: #5d4ea8;
			--accentSoft: rgba(93, 78, 168, 0.12);
			--cyan: #24f0ea;
			--cyanSoft: rgba(36, 240, 234, 0.12);
			--good: #178b82;
			--red: #d8485f;
			--primaryBg: #5d4ea8;
			--primaryHoverBg: #514598;
			--primaryText: #ffffff;
			--primaryBorder: #5d4ea8;
			--controlBg: #ffffff;
			--controlText: #242436;
			--controlBorder: #cfd3e3;
			--controlHoverBg: rgba(93, 78, 168, 0.10);
			--rotationBg: rgba(93, 78, 168, 0.12);
			--rotationText: #45388e;
			--chipBg: #5d4ea8;
			--chipText: #ffffff;
			--logBg: rgba(93, 78, 168, 0.09);
			--dropBg: rgba(93, 78, 168, 0.10);
			--dropText: #4d3f96;
			--pageBg: radial-gradient(circle at 16% 8%, rgba(93, 78, 168, 0.16), transparent 34%), radial-gradient(circle at 86% 12%, rgba(36, 240, 234, 0.10), transparent 30%), linear-gradient(135deg, #fafaff, #f4f6fb 58%, #ffffff);
			--stageBg: radial-gradient(circle at 50% 52%, rgba(255, 255, 255, 0.98), transparent 60%), linear-gradient(145deg, rgba(36, 240, 234, 0.07), transparent 46%), linear-gradient(320deg, rgba(93, 78, 168, 0.11), transparent 52%), #ffffff;
			--shadow: 0 18px 50px rgba(36, 36, 54, 0.12);
		}

		:root[data-theme="dark"] {
			color-scheme: dark;
			--bg: #0f0f16;
			--surface: rgba(27, 27, 38, 0.94);
			--surfaceSolid: #1c1c28;
			--ink: #f4f4fb;
			--muted: #c0c2d0;
			--line: #414157;
			--panel: rgba(27, 27, 38, 0.92);
			--accentSoft: rgba(93, 78, 168, 0.26);
			--cyanSoft: rgba(36, 240, 234, 0.08);
			--good: #24f0ea;
			--red: #ff6b83;
			--primaryBg: #6b5dc2;
			--primaryHoverBg: #786bd0;
			--primaryText: #ffffff;
			--primaryBorder: #8174d6;
			--controlBg: #252536;
			--controlText: #f6f7ff;
			--controlBorder: #595c72;
			--controlHoverBg: #303046;
			--rotationBg: #32304a;
			--rotationText: #ffffff;
			--chipBg: #eceeff;
			--chipText: #161621;
			--logBg: rgba(255, 255, 255, 0.07);
			--dropBg: #242437;
			--dropText: #f6f7ff;
			--pageBg: radial-gradient(circle at 18% 10%, rgba(93, 78, 168, 0.34), transparent 34%), radial-gradient(circle at 88% 0%, rgba(93, 78, 168, 0.16), transparent 32%), linear-gradient(180deg, #161620, #0d0d14);
			--stageBg: radial-gradient(circle at 50% 52%, rgba(255, 255, 255, 0.07), transparent 58%), linear-gradient(150deg, rgba(93, 78, 168, 0.16), transparent 50%), linear-gradient(180deg, #1c1c29, #13131d);
			--shadow: 0 18px 58px rgba(0, 0, 0, 0.32);
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			height: 100%;
			margin: 0;
		}

		body {
			background: var(--pageBg);
			color: var(--ink);
			font: 15px/1.45 Inter, "Segoe UI", system-ui, -apple-system, sans-serif;
			overflow: hidden;
			transition: background 0.22s ease, color 0.22s ease;
		}

		button,
		input {
			font: inherit;
		}

		.app {
			display: grid;
			grid-template-columns: minmax(0, 1fr) 340px;
			gap: 18px;
			height: 100dvh;
			padding: 18px;
			min-height: 0;
		}

		.stage {
			position: relative;
			min-width: 0;
			min-height: 420px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--stageBg);
			box-shadow: var(--shadow);
			overflow: hidden;
			transition: background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
		}

		#cubeStage {
			position: absolute;
			inset: 0;
			display: grid;
			place-items: center;
			padding: min(5vh, 44px);
			cursor: grab;
			touch-action: none;
			user-select: none;
		}

		#cubeStage.isDragging {
			cursor: grabbing;
		}

		#cubeStage > div {
			width: min(82vh, 82vw);
			height: min(82vh, 82vw);
			max-width: 760px;
			max-height: 760px;
		}

		#cubeStage canvas {
			display: block;
			margin: auto;
		}

		.touchcube {
			position: absolute;
			inset: 0;
			width: 100%;
			height: 100%;
			border-collapse: collapse;
			color: transparent;
			opacity: 0;
			pointer-events: none;
		}

		.topbar {
			position: absolute;
			top: 18px;
			left: 18px;
			right: 18px;
			display: flex;
			align-items: center;
			justify-content: space-between;
			gap: 12px;
			z-index: 2;
			pointer-events: none;
		}

		.brand {
			position: relative;
			display: block;
			width: 188px;
			min-width: 188px;
			padding: 0;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--panel);
			color: var(--ink);
			backdrop-filter: blur(14px);
			pointer-events: auto;
			cursor: pointer;
			box-shadow: 0 10px 30px rgba(93, 78, 168, 0.12);
			transition: transform 0.16s ease, border-color 0.16s ease, background 0.22s ease, box-shadow 0.16s ease;
		}

		.brand:hover,
		.brand.isOpen {
			border-color: rgba(93, 78, 168, 0.45);
			background: var(--surfaceSolid);
		}

		.brand.isOpen {
			border-bottom-color: transparent;
			border-radius: 8px 8px 0 0;
		}

		.logo {
			width: 30px;
			height: 30px;
			position: relative;
			display: block;
			padding: 0;
			border-radius: 6px;
			background: linear-gradient(135deg, var(--accent), var(--cyan));
			flex: 0 0 auto;
			box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.28);
			overflow: hidden;
		}

		.logo::before,
		.logo::after {
			content: "";
			position: absolute;
			background: rgba(255, 255, 255, 0.64);
		}

		.logo::before {
			left: 9px;
			top: 3px;
			width: 2px;
			height: 24px;
			box-shadow: 9px 0 0 rgba(255, 255, 255, 0.64);
		}

		.logo::after {
			left: 3px;
			top: 9px;
			width: 24px;
			height: 2px;
			box-shadow: 0 9px 0 rgba(255, 255, 255, 0.64);
		}

		.logo span {
			display: none;
		}

		.modeOption {
			width: 100%;
			min-height: 50px;
			display: flex;
			align-items: center;
			gap: 10px;
			padding: 10px 12px;
			border: 0;
			border-radius: 7px;
			background: transparent;
			color: var(--ink);
			text-align: left;
			text-decoration: none;
			cursor: pointer;
			font: inherit;
			font-weight: 700;
			transition: background 0.14s ease, color 0.14s ease, transform 0.14s ease;
		}

		.modeOption:hover,
		.modeOption:focus-visible {
			background: var(--controlHoverBg);
			color: var(--controlText);
			box-shadow: inset 2px 0 0 var(--cyan);
		}

		.modeCurrent {
			border-radius: 7px;
		}

		.brand.isOpen .modeCurrent {
			border-radius: 7px 7px 0 0;
		}

		.modeText {
			white-space: nowrap;
			font-size: 15px;
			letter-spacing: 0;
		}

		.modeChevron {
			width: 8px;
			height: 8px;
			margin-left: auto;
			border-right: 2px solid currentColor;
			border-bottom: 2px solid currentColor;
			transform: rotate(45deg) translateY(-2px);
			transition: transform 0.14s ease;
		}

		.brand.isOpen .modeChevron {
			transform: rotate(-135deg) translateY(-1px);
		}

		.modeMenu {
			position: absolute;
			top: calc(100% - 1px);
			left: -1px;
			right: -1px;
			width: auto;
			display: grid;
			gap: 0;
			padding: 0;
			border: 1px solid var(--line);
			border-top: 0;
			border-radius: 0 0 8px 8px;
			background: var(--surfaceSolid);
			box-shadow: 0 18px 34px rgba(36, 36, 54, 0.16);
			opacity: 0;
			visibility: hidden;
			transform: translateY(-5px);
			pointer-events: none;
			transition: opacity 0.14s ease, transform 0.14s ease, visibility 0.14s ease;
		}

		.brand.isOpen .modeMenu {
			opacity: 1;
			visibility: visible;
			transform: translateY(0);
			pointer-events: auto;
		}

		.modeMenu .modeOption {
			min-height: 50px;
			border-top: 1px solid var(--line);
			border-radius: 0;
		}

		.modeMenu .modeOption:last-child {
			border-radius: 0 0 7px 7px;
		}

		.practiceIcon,
		.formulaIcon {
			width: 30px;
			height: 30px;
			position: relative;
			flex: 0 0 auto;
			border-radius: 6px;
			background: var(--controlBg);
			box-shadow: inset 0 0 0 1px var(--controlBorder);
		}

		.practiceIcon::before,
		.practiceIcon::after,
		.formulaIcon::before,
		.formulaIcon::after {
			content: "";
			position: absolute;
		}

		.practiceIcon::before {
			left: 7px;
			top: 8px;
			width: 16px;
			height: 10px;
			border: 2px solid var(--cyan);
			border-radius: 999px;
		}

		.practiceIcon::after {
			left: 13px;
			top: 14px;
			width: 4px;
			height: 4px;
			border-radius: 50%;
			background: var(--accent);
			box-shadow: -7px 0 0 var(--accent), 7px 0 0 var(--accent);
		}

		.formulaIcon::before {
			left: 7px;
			top: 8px;
			width: 16px;
			height: 14px;
			border-left: 2px solid var(--accent);
			border-right: 2px solid var(--accent);
		}

		.formulaIcon::after {
			left: 8px;
			top: 9px;
			width: 14px;
			height: 12px;
			background:
				linear-gradient(var(--cyan), var(--cyan)) 0 0 / 14px 2px no-repeat,
				linear-gradient(var(--cyan), var(--cyan)) 0 5px / 10px 2px no-repeat,
				linear-gradient(var(--cyan), var(--cyan)) 0 10px / 14px 2px no-repeat;
		}

		.topActions {
			display: flex;
			align-items: center;
			justify-content: flex-end;
			gap: 10px;
			min-width: 0;
			pointer-events: auto;
		}

		.statusPill {
			max-width: 42vw;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			padding: 9px 12px;
			border: 1px solid var(--line);
			border-radius: 999px;
			background: var(--panel);
			color: var(--muted);
			backdrop-filter: blur(14px);
		}

		.statusPill[data-state="connected"] {
			color: var(--good);
			border-color: rgba(36, 240, 234, 0.46);
			box-shadow: inset 0 0 0 1px rgba(36, 240, 234, 0.10);
		}

		.statusPill[data-state="error"] {
			color: var(--red);
			border-color: rgba(201, 61, 61, 0.28);
		}

		.themeButton {
			min-height: 38px;
			padding: 0 12px;
			border: 1px solid var(--line);
			border-radius: 999px;
			background: var(--panel);
			color: var(--ink);
			cursor: pointer;
			backdrop-filter: blur(14px);
			font-weight: 700;
			transition: border-color 0.16s ease, color 0.16s ease, background 0.22s ease, transform 0.16s ease;
		}

		.themeButton:hover {
			border-color: rgba(36, 240, 234, 0.58);
			color: var(--accent);
			transform: translateY(-1px);
		}

		:root[data-theme="dark"] .modeMenu a:hover {
			background: var(--controlHoverBg);
			color: var(--controlText);
		}

		:root[data-theme="dark"] .panelHeader h1,
		:root[data-theme="dark"] .historyTitle span:first-child,
		:root[data-theme="dark"] .metric span {
			color: var(--cyan);
		}

		:root[data-theme="dark"] .themeButton:hover {
			color: var(--controlText);
		}

		button:focus-visible,
		.brand:focus-visible,
		.modeMenu a:focus-visible,
		.stateTextarea:focus-visible {
			outline: 2px solid var(--cyan);
			outline-offset: 2px;
		}

		.panel {
			display: flex;
			flex-direction: column;
			min-height: 0;
			max-height: calc(100dvh - 36px);
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--surface);
			box-shadow: var(--shadow);
			overflow-x: hidden;
			overflow-y: auto;
			scrollbar-gutter: stable;
			transition: background 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
		}

		.panelHeader,
		.panelSection {
			flex: 0 0 auto;
			padding: 16px;
			border-bottom: 1px solid var(--line);
		}

		.panelHeader h1 {
			margin: 0;
			font-size: 20px;
			line-height: 1.15;
			letter-spacing: 0;
		}

		.panelHeader p {
			margin: 8px 0 0;
			color: var(--muted);
			font-size: 13px;
		}

		.macHelp {
			display: none;
			background: #20211e;
			color: #fff;
		}

		.macHelp.isVisible {
			display: block;
		}

		.macHelp strong {
			display: block;
			margin-bottom: 8px;
			font-size: 14px;
		}

		.macHelp p {
			margin: 0;
			color: #f2f3ea;
			font-size: 13px;
		}

		.macHelp code {
			color: #ffffff;
			font-family: "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
			font-size: 12px;
		}

		.macHelpReason {
			margin-top: 9px;
			color: #ffc66d;
			font-size: 13px;
		}

		.controls {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 10px;
		}

		.practicePanel {
			gap: 0;
		}

		.practiceControls {
			grid-template-columns: minmax(0, 1fr) 132px;
			align-items: stretch;
		}

		.practiceModeSelect {
			min-height: 42px;
			width: 100%;
			padding: 0 34px 0 12px;
			border: 1px solid var(--controlBorder);
			border-radius: 8px;
			background:
				linear-gradient(45deg, transparent 50%, var(--muted) 50%) calc(100% - 18px) 18px / 6px 6px no-repeat,
				linear-gradient(135deg, var(--muted) 50%, transparent 50%) calc(100% - 12px) 18px / 6px 6px no-repeat,
				var(--controlBg);
			color: var(--controlText);
			font: inherit;
			font-weight: 700;
			appearance: none;
			cursor: pointer;
			transition: border-color 0.14s ease, box-shadow 0.14s ease, background-color 0.22s ease;
		}

		.practiceModeSelect:hover,
		.practiceModeSelect:focus-visible {
			border-color: var(--cyan);
			box-shadow: 0 0 0 3px rgba(36, 240, 234, 0.10);
			outline: none;
		}

		.importButtons {
			grid-template-columns: 1fr 1fr;
		}

		.button {
			min-height: 42px;
			border: 1px solid var(--primaryBorder);
			border-radius: 8px;
			background: var(--primaryBg);
			color: var(--primaryText);
			cursor: pointer;
			transition: transform 0.12s ease, background 0.12s ease, border-color 0.12s ease;
			font-weight: 700;
		}

		.button:hover {
			transform: translateY(-1px);
			border-color: var(--cyan);
			background: var(--primaryHoverBg);
			box-shadow: 0 0 0 3px rgba(36, 240, 234, 0.10);
		}

		.button:disabled {
			cursor: progress;
			opacity: 0.68;
			transform: none;
		}

		.button.secondary {
			background: var(--controlBg);
			color: var(--controlText);
			border-color: var(--controlBorder);
		}

		.button.secondary:hover {
			border-color: var(--cyan);
			background: var(--controlHoverBg);
			box-shadow: inset 0 0 0 1px rgba(36, 240, 234, 0.08);
		}

		.button.small {
			min-height: 34px;
			padding: 0 10px;
			font-size: 13px;
		}

		.hiddenFileInput {
			display: none;
		}

		.importDropZone {
			min-height: 58px;
			display: grid;
			place-items: center;
			margin-bottom: 10px;
			padding: 12px;
			border: 1px dashed var(--controlBorder);
			border-radius: 8px;
			background: var(--dropBg);
			color: var(--dropText);
			text-align: center;
			font-weight: 700;
		}

		.importDropZone.isDragging {
			border-color: var(--cyan);
			background: var(--cyanSoft);
		}

		.textImport {
			display: none;
			margin-top: 10px;
		}

		.textImport.isVisible {
			display: grid;
			gap: 8px;
		}

		.stateTextarea {
			width: 100%;
			min-height: 92px;
			resize: vertical;
			border: 1px solid var(--line);
			border-radius: 8px;
			padding: 10px;
			background: var(--controlBg);
			color: var(--controlText);
			font: 13px/1.45 "Cascadia Mono", "SFMono-Regular", Consolas, monospace;
		}

		.stateOptions {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-top: 12px;
			color: var(--muted);
			font-size: 13px;
		}

		.importStatus {
			margin-top: 10px;
			color: var(--muted);
			font-size: 13px;
		}

		.stateList {
			display: grid;
			grid-template-columns: repeat(auto-fit, minmax(132px, 1fr));
			gap: 10px;
			margin-top: 12px;
		}

		.stateCard {
			display: grid;
			grid-template-rows: 124px auto;
			gap: 8px;
			align-items: center;
			justify-items: center;
			min-height: 174px;
			padding: 10px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--controlBg);
			color: var(--ink);
			cursor: pointer;
			font: inherit;
			text-align: center;
			transition: transform 0.14s ease, border-color 0.14s ease, background 0.22s ease, box-shadow 0.14s ease;
		}

		.stateCard:hover,
		.stateCard:focus-visible {
			border-color: rgba(36, 240, 234, 0.68);
			background: var(--controlHoverBg);
			box-shadow: inset 0 0 0 1px rgba(36, 240, 234, 0.08);
			outline: none;
			transform: translateY(-1px);
		}

		.stateCard.isActive {
			border-color: rgba(93, 78, 168, 0.68);
			box-shadow: inset 0 0 0 1px rgba(93, 78, 168, 0.20), 0 0 0 3px var(--accentSoft);
		}

		.stateCard strong {
			display: block;
			width: 100%;
			overflow-wrap: anywhere;
			font-size: 14px;
			line-height: 1.25;
		}

		.stateCard small {
			display: none;
		}

		.stateName {
			width: 100%;
			color: var(--ink);
			overflow-wrap: anywhere;
		}

		.statePreview {
			width: 100%;
			height: 124px;
			cursor: grab;
			touch-action: none;
			user-select: none;
		}

		.statePreview.isDragging {
			cursor: grabbing;
		}

		.statePreview > div {
			width: 116px;
			height: 116px;
			margin: 0 auto;
		}

		.practiceDiagnostics {
			display: none;
		}

		.metrics {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 10px;
		}

		.metric {
			min-height: 68px;
			padding: 10px;
			border: 1px solid var(--line);
			border-radius: 8px;
			background: var(--controlBg);
			transition: background 0.22s ease, border-color 0.22s ease;
		}

		.metric span {
			display: block;
			color: var(--muted);
			font-size: 12px;
		}

		.metric strong {
			display: block;
			margin-top: 6px;
			overflow: hidden;
			text-overflow: ellipsis;
			white-space: nowrap;
			font-size: 18px;
			letter-spacing: 0;
		}

		.moves {
			display: grid;
			grid-template-columns: repeat(6, minmax(0, 1fr));
			gap: 7px;
		}

		.moveButton {
			aspect-ratio: 1;
			min-height: 40px;
			border: 1px solid var(--controlBorder);
			border-radius: 8px;
			background: var(--controlBg);
			color: var(--controlText);
			cursor: pointer;
			font-weight: 700;
			transition: transform 0.12s ease, border-color 0.14s ease, color 0.14s ease, background 0.22s ease;
		}

		.moveButton:hover {
			border-color: rgba(36, 240, 234, 0.7);
			color: var(--controlText);
			background: var(--controlHoverBg);

	<script>
		(function() {
			"use strict";

			window.DEBUG = false;
			window.DEBUGBL = false;
			Math.TAU = Math.TAU || Math.PI * 2;

			if (!Array.prototype.at) {
				Array.prototype.at = function(index) {
					index = Math.trunc(index) || 0;
					if (index < 0) index += this.length;
					return this[index];
				};
			}

			window.requestAnimFrame = window.requestAnimationFrame ||
				window.webkitRequestAnimationFrame ||
				window.mozRequestAnimationFrame ||
				function(callback) { return setTimeout(callback, 16); };

			window.execMain = function(fn, args) {
				return fn.apply(null, args || []);
			};

			var propStore = {
				vrcOri: "18,6",
				vrcSpeed: "90",
				giiRST: "n",
				giiMacMap: localStorage.getItem("smartCubeMacMap") || "{}"
			};

			var MAC_HELP_TEXT = [
				"请输入智能硬件的MAC地址（xx:xx:xx:xx:xx:xx）。",
				"你可以通过 chrome://bluetooth-internals/#devices 找到MAC地址，或者修改以下配置让csTimer自动获取蓝牙地址：",
				"Chrome：在浏览器设置里打开 chrome://flags/#enable-experimental-web-platform-features",
				"Bluefy：在浏览器设置里开启 Enable BLE Advertisements"
			].join("\n");

			window.kernel = {
				getProp: function(key, fallback) {
					if (key === "giiSolved") {
						return propStore.giiSolved || (window.mathlib && mathlib.SOLVED_FACELET) ||
							"UUUUUUUUURRRRRRRRRFFFFFFFFFDDDDDDDDDLLLLLLLLLBBBBBBBBB";
					}
					return key in propStore ? propStore[key] : fallback;
				},
				setProp: function(key, value) {
					propStore[key] = value;
					if (key === "giiMacMap") {
						localStorage.setItem("smartCubeMacMap", value);
					}
				}
			};

			window.GIIKER_NOBLEMSG = "当前浏览器不可用 Web Bluetooth。请使用支持 Web Bluetooth 的浏览器，并通过 localhost 或 https 打开。";
			window.GIIKER_REQMACMSG = MAC_HELP_TEXT;
			window.CONFIRM_GIIRST = "是否把当前魔方状态标记为复原？";
			window.LGHINT_BTCONSUC = "蓝牙已连接";
			window.LGHINT_BTDISCON = "蓝牙已断开";
			window.LGHINT_BTNOTSUP = "暂不支持这个智能硬件";
			window.LGHINT_BTINVMAC = "MAC 地址格式不正确";

			window.logohint = {
				push: function(message) {
					if (window.smartCubeApp) {
						window.smartCubeApp.log("hint", message);
						if (/mac|地址|not support|不支持|invalid/i.test(String(message))) {
							window.smartCubeApp.showMacHelp(String(message));
						}
					} else {
						console.log(message);
					}
				}
			};

			window.giikerutil = {
				chkAvail: function() {
					if (!navigator.bluetooth) {
						return Promise.reject(window.GIIKER_NOBLEMSG);
					}
					if (!navigator.bluetooth.getAvailability) {
						return Promise.resolve();
					}
					return navigator.bluetooth.getAvailability().then(function(available) {
						if (!available) {
							return Promise.reject(window.GIIKER_NOBLEMSG);
						}
					});
				},
				log: function() {
					if (window.smartCubeApp) {
						window.smartCubeApp.log.apply(window.smartCubeApp, arguments);
					} else {
						console.log.apply(console, arguments);
					}
				},
				reqMacAddr: function(forcePrompt, isWrongKey, deviceMac, defaultMac) {
					var rawMap = kernel.getProp("giiMacMap", "{}");
					var savedMap = {};
					try {
						savedMap = JSON.parse(rawMap);
					} catch (error) {
						savedMap = {};
					}
					var key = "last";
					var mac = deviceMac || savedMap[key] || defaultMac || "";
					if (!mac || forcePrompt && !deviceMac) {
						if (window.smartCubeApp) {
							window.smartCubeApp.showMacHelp(isWrongKey ? "上一次 MAC 可能不正确，请重新输入。" : "这个设备需要 MAC 地址来解密蓝牙数据。");
						}
						mac = prompt((isWrongKey ? "上一次 MAC 可能不正确。\n" : "") + window.GIIKER_REQMACMSG, mac || "xx:xx:xx:xx:xx:xx");
					}
					if (!mac || !/^([0-9a-f]{2}[:-]){5}[0-9a-f]{2}$/i.test(mac)) {
						window.logohint.push(window.LGHINT_BTINVMAC);
						if (window.smartCubeApp) {
							window.smartCubeApp.showMacHelp("MAC 地址格式不正确，连接无法继续。");
							window.smartCubeApp.setStatus("error", "MAC 地址格式不正确");
						}
						return;
					}
					savedMap[key] = mac;
					kernel.setProp("giiMacMap", JSON.stringify(savedMap));
					return mac;
				},
				markSolved: function() {
					if (window.smartCubeApp) {
						window.smartCubeApp.log("view", "忽略硬件复原标记，当前页面只同步转动");
					}
				},
				updateBattery: function(value) {
					if (window.smartCubeApp) {
						window.smartCubeApp.setDevice(value && value[1], value && value[0]);
					}
				}
			};
		})();
	</script>

	<script>
		(function() {
			"use strict";

			var app = {
				twistyScene: null,
				virtualCubie: null,
				moveHistory: [],
				importedStates: [],
				showStateThumbs: true,
				thumbnailScenes: [],
				thumbnailYaw: 0,
				thumbnailPitch: 0,
				moveCount: 0,
				movesSinceState: 0,
				currentStateIndex: -1,
				practiceMode: "sequence",
				randomBag: [],
				recentStateIndices: [],
				solveSwitchTimer: null,
				solvedAdvancePending: false,
				seenUnsolvedSinceState: false,
				seenUnsolvedFaceletSinceState: false,
				seenUnsolvedVirtualSinceState: false,
				lastFaceletSolved: false,
				deviceName: "",
				batteryLevel: null,
				connected: false,
				ignoreMoves: false,
				hasValidCubeState: false,
				macWarningVisible: false,
				cubeDimension: 3,
				orientationMatrix: null,
				viewYaw: 0,
				viewPitch: 0,
				elements: {},

				init: function() {
					this.elements = {
						cubeStage: document.getElementById("cubeStage"),
						modeSwitcher: document.getElementById("modeSwitcher"),
						modeCurrent: document.getElementById("modeCurrent"),
						themeToggle: document.getElementById("themeToggle"),
						connectBtn: document.getElementById("connectBtn"),
						practiceModeSelect: document.getElementById("practiceModeSelect"),
						orientationMoves: document.getElementById("orientationMoves"),
						statusPill: document.getElementById("statusPill"),
						deviceName: document.getElementById("deviceName"),
						moveCount: document.getElementById("moveCount"),
						moveList: document.getElementById("moveList"),
						log: document.getElementById("log"),
						lastTs: document.getElementById("lastTs"),
						stateDropZone: document.getElementById("stateDropZone"),
						chooseStateFileBtn: document.getElementById("chooseStateFileBtn"),
						stateFileInput: document.getElementById("stateFileInput"),
						toggleTextImportBtn: document.getElementById("toggleTextImportBtn"),
						textImportBox: document.getElementById("textImportBox"),
						stateTextInput: document.getElementById("stateTextInput"),
						parseStateTextBtn: document.getElementById("parseStateTextBtn"),
						stateImportStatus: document.getElementById("stateImportStatus"),
						stateList: document.getElementById("stateList"),
						macHelp: document.getElementById("macHelp"),
						macHelpReason: document.getElementById("macHelpReason")
					};

					this.initTwisty();
					this.initTheme();
					this.bindUI();
					this.setStatus("idle", "未连接");
					this.log("ready", "页面已就绪");
					if (!navigator.bluetooth) {
						this.setStatus("error", "浏览器不支持 Web Bluetooth");
						this.log("error", "请通过 Chrome/Edge 等支持 Web Bluetooth 的浏览器访问 localhost");
					}
				},

				initTwisty: function() {
					this.elements.cubeStage.innerHTML = "";
					this.elements.cubeStage.dataset.roll = "0";
					this.orientationMatrix = this.identityMatrix();
					this.viewYaw = 0;
					this.viewPitch = 0;
					this.twistyScene = new twistyjs.TwistyScene();
					this.elements.cubeStage.appendChild(this.twistyScene.getDomElement());
					this.twistyScene.initializeTwisty({
						type: "cube",
						dimension: this.cubeDimension,
						stickerWidth: 1.72,
						scale: 0.96,
						allowDragging: false,
						faceColors: [0xffffff, 0xf05a3b, 0x2dbb70, 0xffd447, 0xff941f, 0x2f69df]
					});
					this.resizeTwisty();
				},

				resizeTwisty: function() {
					if (this.twistyScene) {
						this.twistyScene.resize();
					}
				},

				bindUI: function() {
					var self = this;
					this.elements.modeSwitcher.addEventListener("click", function(event) {
						if (event.target.closest("a")) {
							return;
						}
						self.toggleModeMenu();
						event.stopPropagation();
					});
					this.elements.modeSwitcher.addEventListener("keydown", function(event) {
						if (event.target.closest("a")) {
							return;
						}
						if (event.key === "Enter" || event.key === " ") {
							self.toggleModeMenu();
							event.preventDefault();
						}
					});
					this.elements.themeToggle.addEventListener("click", function() {
						self.setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
					});
					this.elements.connectBtn.addEventListener("click", function() {
						if (self.connected) {
							self.disconnect();
						} else {
							self.connect();
						}
					});
					this.elements.practiceModeSelect.addEventListener("change", function(event) {
						self.practiceMode = event.target.value === "random" ? "random" : "sequence";
						self.randomBag = [];
					});
					this.elements.orientationMoves.addEventListener("click", function(event) {
						var button = event.target.closest("[data-move]");
						if (button) {
							self.playMove(button.getAttribute("data-move"), "manual", Date.now());
						}
					});
					this.bindStateImport();
					window.addEventListener("resize", function() {
						self.resizeTwisty();
					});
					this.bindViewDrag();
					document.addEventListener("keydown", function(event) {
						if (event.key === "Escape") {
							self.closeModeMenu();
						}
					});
					document.addEventListener("click", function() {
						self.closeModeMenu();
					});
				},

				toggleModeMenu: function() {
					var isOpen = this.elements.modeSwitcher.classList.toggle("isOpen");
					this.elements.modeSwitcher.setAttribute("aria-expanded", isOpen ? "true" : "false");
					this.elements.modeCurrent.setAttribute("aria-expanded", isOpen ? "true" : "false");
				},

				closeModeMenu: function() {
					this.elements.modeSwitcher.classList.remove("isOpen");
					this.elements.modeSwitcher.setAttribute("aria-expanded", "false");
					this.elements.modeCurrent.setAttribute("aria-expanded", "false");
				},

				initTheme: function() {
					var saved = localStorage.getItem("smartCubeTheme");
					var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
					this.setTheme(saved || (prefersDark ? "dark" : "light"), false);
				},

				setTheme: function(theme, save) {
					theme = theme === "dark" ? "dark" : "light";
					document.documentElement.dataset.theme = theme;
					this.elements.themeToggle.textContent = theme === "dark" ? "亮色" : "暗色";
					if (save !== false) {
						localStorage.setItem("smartCubeTheme", theme);
					}
				},

				bindStateImport: function() {
					var self = this;
					this.elements.chooseStateFileBtn.addEventListener("click", function() {
						self.elements.stateFileInput.click();
					});
					this.elements.stateFileInput.addEventListener("change", function(event) {
						self.importFiles(event.target.files);
						event.target.value = "";
					});
					this.elements.toggleTextImportBtn.addEventListener("click", function() {
						self.elements.textImportBox.classList.toggle("isVisible");
						var isVisible = self.elements.textImportBox.classList.contains("isVisible");
						self.elements.toggleTextImportBtn.textContent = isVisible ? "收起文本框" : "输入文本";
						if (isVisible) {
							self.elements.stateTextInput.focus();
						}
					});
					this.elements.parseStateTextBtn.addEventListener("click", function() {
						self.importStateText(self.elements.stateTextInput.value, "text");
					});
					this.elements.stateList.addEventListener("click", function(event) {
						if (self.thumbnailWasDragged || Date.now() < (self.thumbnailDragUntil || 0)) {
							return;
						}
						var button = event.target.closest("[data-state-index]");
						if (button) {
							self.applyImportedState(Number(button.getAttribute("data-state-index")));
						}
					});
					this.elements.stateList.addEventListener("keydown", function(event) {
						if (event.key !== "Enter" && event.key !== " ") {
							return;
						}
						var card = event.target.closest("[data-state-index]");
						if (card) {
							event.preventDefault();
							self.applyImportedState(Number(card.getAttribute("data-state-index")));
						}
					});
					this.bindThumbnailDrag();
					this.elements.stateDropZone.addEventListener("dragover", function(event) {
						event.preventDefault();
						self.elements.stateDropZone.classList.add("isDragging");
					});
					this.elements.stateDropZone.addEventListener("dragleave", function() {
						self.elements.stateDropZone.classList.remove("isDragging");
					});
					this.elements.stateDropZone.addEventListener("drop", function(event) {
						event.preventDefault();
						self.elements.stateDropZone.classList.remove("isDragging");
						self.importFiles(event.dataTransfer && event.dataTransfer.files);
					});
				},

				bindThumbnailDrag: function() {
					var self = this;
					var drag = {
						active: false,
						preview: null,
						x: 0,
						y: 0,
						yaw: 0,
						pitch: 0,
						moved: false
					};
					this.elements.stateList.addEventListener("pointerdown", function(event) {
						var preview = event.target.closest(".statePreview");
						if (!preview || event.button !== 0) {
							return;
						}
						drag.active = true;
						drag.preview = preview;
						drag.x = event.clientX;
						drag.y = event.clientY;
						drag.yaw = self.thumbnailYaw;
						drag.pitch = self.thumbnailPitch;
						drag.moved = false;
						preview.classList.add("isDragging");
						preview.setPointerCapture(event.pointerId);
						event.preventDefault();
					});
					this.elements.stateList.addEventListener("pointermove", function(event) {
						if (!drag.active) {
							return;
						}
						var rect = drag.preview.getBoundingClientRect();
						var limit = Math.PI / 4;
						var dragSpan = Math.max(90, Math.min(rect.width, rect.height) * 0.85);
						var scale = limit / dragSpan;
						if (Math.abs(event.clientX - drag.x) + Math.abs(event.clientY - drag.y) > 4) {
							drag.moved = true;
							self.thumbnailWasDragged = true;
							self.thumbnailDragUntil = Date.now() + 250;

				importStateText: function(text, source) {

				parseStateDefinitions: function(text) {
					var entries = String(text).replace(/锛[\?\uFFFD]/g, "：").replace(/[\r\n]+/g, "").split(";");
					var states = [];
					var skipped = 0;
					for (var i = 0; i < entries.length; i++) {
						var entry = entries[i].trim();
						if (!entry) {
							continue;
						}
						var colon = this.findStateDelimiter(entry);
						if (colon < 0) {
							skipped++;
							continue;
						}
						var name = entry.slice(0, colon).trim();
						var alg = entry.slice(colon + 1).trim();
						try {
							var moves = this.parseMoveSequence(alg);
							if (!name || moves.length === 0) {
								skipped++;
								continue;
							}
							states.push({
								name: name,
								alg: moves.join(""),
								moves: moves
							});
						} catch (error) {
							skipped++;
						}
					}
					return {
						states: states,
						skipped: skipped

				findStateDelimiter: function(entry) {
					var english = entry.indexOf(":");
					var chinese = entry.indexOf("：");
					if (english < 0) {

					}
					if (chinese < 0) {

					}
					return Math.min(english, chinese);

				parseMoveSequence: function(alg) {

					while (index < source.length) {
						var face = source.charAt(index);
						if (!/[URFDLBXYZ]/i.test(face)) {
							throw new Error("bad move");
						}
						var token = face;
						index++;
						if (source.charAt(index) === "2") {
							token += "2";
							index++;
						}
						if (source.charAt(index) === "'") {
							token += "'";
							index++;
						}
						var move = this.normalizeMove(token);
						if (!move) {
							throw new Error("bad move");
						}
						moves.push(move.text);
					}
					return moves;
				},

					this.moveHistory = [];

					this.seenUnsolvedVirtualSinceState = !this.isVirtualStateSolved();

					}

				recordStateVisit: function(index) {
					var recent = [];
					for (var i = 0; i < this.recentStateIndices.length; i++) {
						if (this.recentStateIndices[i] !== index) {
							recent.push(this.recentStateIndices[i]);
						}
					}
					recent.unshift(index);
					recent.length = Math.min(recent.length, Math.max(1, Math.min(4, this.importedStates.length)));

				cancelSolvedAdvance: function() {

						clearTimeout(this.solveSwitchTimer);
						this.solveSwitchTimer = null;

					this.solvedAdvancePending = false;

				scheduleSolvedAdvance: function() {
					var self = this;
					if (this.solvedAdvancePending || this.importedStates.length === 0) {
						return;
					}
					this.solvedAdvancePending = true;
					this.setImportStatus("已还原，0.7 秒后切换");
					this.solveSwitchTimer = setTimeout(function() {
						self.solveSwitchTimer = null;
						self.solvedAdvancePending = false;
						self.advancePracticeState();
					}, 700);
				},

				advancePracticeState: function() {
					if (!this.importedStates.length) {
						return;
					}
					var nextIndex = this.practiceMode === "random" ? this.pickRandomStateIndex() : this.pickSequentialStateIndex();
					this.applyImportedState(nextIndex);
				},

				pickSequentialStateIndex: function() {
					if (!this.importedStates.length) {
						return -1;
					}
					if (this.currentStateIndex < 0) {
						return 0;
					}
					return (this.currentStateIndex + 1) % this.importedStates.length;
				},

				pickRandomStateIndex: function() {
					var count = this.importedStates.length;
					if (count <= 1) {
						return 0;
					}
					if (!this.randomBag.length) {
						this.refillRandomBag();
					}
					if (!this.randomBag.length) {
						return this.pickSequentialStateIndex();
					}
					return this.randomBag.shift();
				},

				refillRandomBag: function() {
					var count = this.importedStates.length;
					var recentLimit = Math.min(3, Math.max(1, count - 1));
					var recent = this.recentStateIndices.slice(0, recentLimit);
					var preferred = [];
					var delayed = [];
					for (var i = 0; i < count; i++) {
						if (recent.indexOf(i) === -1) {
							preferred.push(i);
						} else {
							delayed.push(i);
						}
					}
					this.shuffle(preferred);
					this.shuffle(delayed);

				shuffle: function(items) {

						items[i] = items[j];
						items[j] = tmp;
					}
					return items;
				},

				updateSolveDetection: function(facelet, hadCubeMove) {
					if (!this.importedStates.length || this.currentStateIndex < 0) {
						return;
					}
					var normalizedFacelet = String(facelet || "").toUpperCase().replace(/[^URFDLB]/g, "");
					var hasFacelet = normalizedFacelet.length === 54;
					var faceletSolved = hasFacelet && this.isFaceletSolved(normalizedFacelet);
					var virtualSolved = !!this.virtualCubie && this.isVirtualStateSolved();

					var canAdvanceByVirtual = virtualSolved && this.seenUnsolvedVirtualSinceState && this.movesSinceState > 0;
					if (canAdvanceByFacelet || canAdvanceByVirtual) {

						this.scheduleSolvedAdvance();

					}
					if (hasFacelet && !faceletSolved) {
						this.seenUnsolvedFaceletSinceState = true;
						this.seenUnsolvedSinceState = true;
					}
					if (this.virtualCubie && !virtualSolved) {
						this.seenUnsolvedVirtualSinceState = true;
						this.seenUnsolvedSinceState = true;
					}
					if (hasFacelet && !faceletSolved || this.virtualCubie && !virtualSolved) {

					}

				isFaceletSolved: function(facelet) {
					facelet = String(facelet || "").toUpperCase().replace(/[^URFDLB]/g, "");
					var solved = window.mathlib && mathlib.SOLVED_FACELET || kernel.getProp("giiSolved", "UUUUUUUUURRRRRRRRRFFFFFFFFFDDDDDDDDDLLLLLLLLLBBBBBBBBB");
					solved = String(solved || "").toUpperCase().replace(/[^URFDLB]/g, "");
					if (facelet === solved) {
						return true;
					}
					if (facelet.length !== 54) {
						return false;
					}
					var centers = [];
					for (var offset = 0; offset < 54; offset += 9) {
						var color = facelet.charAt(offset);
						if (!color) {
							return false;
						}
						for (var i = 1; i < 9; i++) {
							if (facelet.charAt(offset + i) !== color) {
								return false;
							}
						}
						centers.push(facelet.charAt(offset + 4));
					}
					return new Set(centers).size === 6;
				},

				resetVirtualState: function() {

				},

				applyMoveToVirtualState: function(move) {

				},

				isVirtualStateSolved: function() {

				},

				buildTwistyMoves: function(tokens, updateOrientationState, trackVirtualState) {

							continue;
						}
						move = this.mapManualMove(move);
						moves.push(move.twisty);
						if (trackVirtualState) {
							this.applyMoveToVirtualState(move);
						}
						if (updateOrientationState && move.type === "orientation") {

						}
					}
					return moves;
				},

				bindViewDrag: function() {
					var self = this;
					var drag = {
						active: false,
						x: 0,
						y: 0,

						}

						drag.x = event.clientX;
						drag.y = event.clientY;

						var dragSpan = Math.max(140, Math.min(rect.width, rect.height) * 0.45);
						var scale = limit / dragSpan;

						event.preventDefault();
					});

							}

				setViewDrag: function(yaw, pitch) {

				playMove: function(rawMove, source, timestamp, options) {

				pushHistory: function(text, source, timestamp) {

						text: text,
						source: source || "",

					}
					this.elements.lastTs.textContent = this.formatTime(timestamp || Date.now());
					this.renderMoves();
				},

				normalizeMove: function(rawMove) {
					if (!rawMove) {
						return null;
					}
					var text = String(rawMove).replace(/[’‘`]/g, "'").replace(/\s+/g, "");
					var match = /^([URFDLB])([2']?)$/i.exec(text);
					if (match) {
						var face = match[1].toUpperCase();
						var facePow = match[2] === "2" ? 2 : match[2] === "'" ? -1 : 1;
						return {
							text: face + match[2],
							type: "face",
							face: face,
							pow: facePow,
							twisty: [1, 1, face, facePow]
						};
					}
					match = /^([XYZ])([2']?)$/i.exec(text);
					if (!match) {
						return null;
					}
					var axis = {
						X: "R",
						Y: "U",
						Z: "F"
					}[match[1].toUpperCase()];
					var pow = match[2] === "2" ? 2 : match[2] === "'" ? -1 : 1;
					return {
						text: match[1].toLowerCase() + match[2],
						type: "orientation",
						axis: axis,
						pow: pow,
						twisty: [1, this.cubeDimension, axis, pow]
					};
				},

				mapManualMove: function(move) {
					if (!move) {
						return move;
					}
					if (move.type === "face") {
						var face = this.mapUiFace(move.face);
						return {
							text: move.text,
							type: "face",
							face: face,
							uiFace: move.face,
							pow: move.pow,
							twisty: [1, 1, face, move.pow]
						};
					}
					if (move.type === "orientation") {
						var axis = this.mapUiFace(move.axis);
						return {
							text: move.text,
							type: "orientation",
							axis: axis,
							uiAxis: move.axis,
							pow: move.pow,
							twisty: [1, this.cubeDimension, axis, move.pow]
						};
					}
					return move;
				},

				mapUiFace: function(face) {
					return {
						U: "U",
						R: "B",
						F: "R",
						D: "D",
						L: "F",
						B: "L"
					}[face] || face;
				},

				applyOrientationMove: function(move) {
					this.twistyScene.addMoves([move.twisty]);
					this.updateOrientation(move.axis, move.pow);
				},

				rollView: function(direction) {
					var current = Number(this.elements.cubeStage.dataset.roll || "0");
					current = (current + direction * 90) % 360;
					this.elements.cubeStage.dataset.roll = String(current);
					var inner = this.elements.cubeStage.firstElementChild;
					if (inner) {
						inner.style.transform = "rotate(" + current + "deg)";
						inner.style.transformOrigin = "50% 50%";
					}
				},

				transformCubeMove: function(move) {
					if (!move || move.type !== "face") {
						return move;
					}
					if (!this.orientationMatrix) {
						this.orientationMatrix = this.identityMatrix();
					}
					var targetFace = this.faceFromNormal(this.matrixVectorMultiply(this.orientationMatrix, this.faceNormal(move.face)));
					if (!targetFace) {
						return move;
					}
					var transformed = this.matrixMultiply(
						this.matrixMultiply(this.orientationMatrix, this.rotationMatrix(move.face, move.pow)),
						this.matrixTranspose(this.orientationMatrix)
					);
					var pows = Math.abs(move.pow) === 2 ? [2] : [move.pow, -move.pow];
					for (var i = 0; i < pows.length; i++) {
						if (this.matrixEquals(transformed, this.rotationMatrix(targetFace, pows[i]))) {
							return {
								text: this.formatMoveText(targetFace, pows[i]),
								rawText: move.text,
								type: "face",
								face: targetFace,
								pow: pows[i],
								twisty: [1, 1, targetFace, pows[i]]
							};
						}
					}
					return {
						text: this.formatMoveText(targetFace, move.pow),
						rawText: move.text,
						type: "face",
						face: targetFace,
						pow: move.pow,
						twisty: [1, 1, targetFace, move.pow]
					};
				},

				updateOrientation: function(axis, pow) {
					if (!this.orientationMatrix) {
						this.orientationMatrix = this.identityMatrix();
					}
					this.orientationMatrix = this.matrixMultiply(this.rotationMatrix(axis, pow), this.orientationMatrix);
				},

				formatMoveText: function(face, pow) {
					return face + (Math.abs(pow) === 2 ? "2" : pow < 0 ? "'" : "");
				},

				identityMatrix: function() {
					return [
						[1, 0, 0],
						[0, 1, 0],
						[0, 0, 1]
					];
				},

				rotationMatrix: function(face, pow) {
					var base = {
						U: [[0, 0, -1], [0, 1, 0], [1, 0, 0]],
						R: [[1, 0, 0], [0, 0, 1], [0, -1, 0]],
						F: [[0, 1, 0], [-1, 0, 0], [0, 0, 1]],
						D: [[0, 0, 1], [0, 1, 0], [-1, 0, 0]],
						L: [[1, 0, 0], [0, 0, -1], [0, 1, 0]],
						B: [[0, -1, 0], [1, 0, 0], [0, 0, 1]]
					}[face];
					var turns = ((pow % 4) + 4) % 4;
					var result = this.identityMatrix();
					for (var i = 0; i < turns; i++) {
						result = this.matrixMultiply(result, base);
					}
					return result;
				},

				matrixMultiply: function(a, b) {
					var result = this.identityMatrix();
					for (var row = 0; row < 3; row++) {
						for (var col = 0; col < 3; col++) {
							result[row][col] = a[row][0] * b[0][col] + a[row][1] * b[1][col] + a[row][2] * b[2][col];
						}
					}
					return result;
				},

				matrixTranspose: function(matrix) {
					return [
						[matrix[0][0], matrix[1][0], matrix[2][0]],
						[matrix[0][1], matrix[1][1], matrix[2][1]],
						[matrix[0][2], matrix[1][2], matrix[2][2]]
					];
				},

				faceNormal: function(face) {
					return {
						U: [0, 1, 0],
						R: [1, 0, 0],
						F: [0, 0, 1],
						D: [0, -1, 0],
						L: [-1, 0, 0],
						B: [0, 0, -1]
					}[face];
				},

				faceFromNormal: function(normal) {
					var key = normal.join(",");
					return {
						"0,1,0": "U",
						"1,0,0": "R",
						"0,0,1": "F",
						"0,-1,0": "D",
						"-1,0,0": "L",
						"0,0,-1": "B"
					}[key];
				},

				matrixVectorMultiply: function(matrix, vector) {
					return [
						matrix[0][0] * vector[0] + matrix[0][1] * vector[1] + matrix[0][2] * vector[2],
						matrix[1][0] * vector[0] + matrix[1][1] * vector[1] + matrix[1][2] * vector[2],
						matrix[2][0] * vector[0] + matrix[2][1] * vector[1] + matrix[2][2] * vector[2]
					];
				},

				matrixEquals: function(a, b) {
					for (var row = 0; row < 3; row++) {
						for (var col = 0; col < 3; col++) {
							if (a[row][col] !== b[row][col]) {
								return false;
							}
						}
					}
					return true;
				},

				renderMoves: function() {
					this.elements.moveList.innerHTML = "";
					var frag = document.createDocumentFragment();
					this.moveHistory.slice(0, 7).forEach(function(item) {
						var chip = document.createElement("span");
						chip.className = "moveChip";
						chip.textContent = item.text;
						frag.appendChild(chip);
					});
					this.elements.moveList.appendChild(frag);
				},

				setDevice: function(name, battery) {
					if (name) {
						this.deviceName = name;
					}
					if (typeof battery === "number") {
						this.batteryLevel = battery;
					}
					var label = this.deviceName || "-";
					if (typeof this.batteryLevel === "number" && this.batteryLevel > 0) {
						label += " · " + this.batteryLevel + "%";
					}
					this.elements.deviceName.textContent = label;
					if (this.connected) {
						this.setStatus("connected", "已连接" + (this.deviceName ? " · " + this.deviceName : ""));
					}
				},

				setStatus: function(state, text) {
					this.elements.statusPill.dataset.state = state;
					this.elements.statusPill.textContent = text;
				},

				showConnectionError: function(error) {
					var message = String(error && error.message || error || "连接失败");
					this.setStatus("error", message);
					this.log("error", String(error && error.stack || error || message));
					if (!/cancel|chooser|user cancelled|用户取消/i.test(message)) {
						this.showMacHelp("连接失败。如果设备需要解密，MAC 地址错误或浏览器未开启蓝牙广播权限都会导致失败。");
					}
				},

				showMacHelp: function(reason) {
					if (!this.elements.macHelp || !this.elements.macHelpReason) {
						return;
					}
					this.macWarningVisible = true;
					this.elements.macHelp.classList.add("isVisible");
					this.elements.macHelpReason.textContent = reason || "";
				},

				hideMacHelp: function() {
					if (!this.elements.macHelp || !this.elements.macHelpReason) {
						return;
					}
					this.macWarningVisible = false;
					this.elements.macHelp.classList.remove("isVisible");
					this.elements.macHelpReason.textContent = "";
				},

				log: function() {
					var parts = Array.prototype.slice.call(arguments).map(function(item) {
						if (item instanceof DataView) {
							return "[DataView " + item.byteLength + "]";
						}
						if (item && item.buffer instanceof ArrayBuffer && typeof item.byteLength === "number") {
							return "[DataView " + item.byteLength + "]";
						}
						if (typeof item === "object") {
							try {
								return JSON.stringify(item);
							} catch (error) {
								return String(item);
							}
						}
						return String(item);
					});
					var line = "[" + new Date().toLocaleTimeString() + "] " + parts.join(" ");
					var joined = parts.join(" ");
					if (!this.hasValidCubeState && /verify error|invalid magic|invalid data|invalid axis|crc checked error|wrong key|decrypt/i.test(joined)) {
						this.setStatus("error", "可能是 MAC 地址错误");
						this.showMacHelp("收到的数据无法正确解密或校验，MAC 地址可能不正确。");
					}
					var oldLines = this.elements.log.textContent ? this.elements.log.textContent.split("\n") : [];
					oldLines.push(line);
					if (oldLines.length > 90) {
						oldLines = oldLines.slice(oldLines.length - 90);
					}
					this.elements.log.textContent = oldLines.join("\n");
					this.elements.log.scrollTop = this.elements.log.scrollHeight;
					console.log.apply(console, arguments);
				},

				formatTime: function(value) {
					var date = new Date(value);
					return date.toLocaleTimeString([], {
						hour: "2-digit",
						minute: "2-digit",
						second: "2-digit"
					});
				}
			};

			window.smartCubeApp = app;
			$(function() {
				app.init();
			});
		})();
	</script>
