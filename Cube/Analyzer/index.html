<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0f0d18">
  <link rel="icon" href="/favicon.svg?v=1877" type="image/svg+xml">
  <title>Cube Analyzer · 魔方训练与分析</title>
  <meta name="description" content="智能魔方训练、计时、成绩趋势、分段与 TPS 数据分析。">
  <script>
    (() => {
      const saved = localStorage.getItem('smartCubeTheme');
      document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
    })();
  </script>

  <link rel="stylesheet" href="/nav/nav.css?v=2475">
  <link rel="stylesheet" href="../assets/scramble/scramble.css?v=1892">
  <link rel="stylesheet" href="../assets/state-reset/state-reset.css?v=1949">
  <!-- 魔方展开图（Cube 公用 /Cube/assets/cube-net/），与 Cross、Trainer 共用同一份 -->
  <link rel="stylesheet" href="../assets/cube-net/cube-net.css?v=2664">
  <link rel="stylesheet" href="./assets/analyzer.css?v=2875">

  <script src="../assets/base/jquery-4.0.0.min.js"></script>
  <script src="../assets/base/compat.js?v=1877" defer></script>
  <script src="/nav/nav.js?v=2712" defer></script>
  <script src="/assets/services/core/site-scope.js?v=2255" defer></script>
  <script src="/assets/services/core/storage-manager.js?v=1892" defer></script>
  <script src="../../assets/vendor/supabase/supabase.min.js" defer></script>
  <script src="/supabase/supabase-config.js?v=1877" defer></script>
  <script src="/supabase/supabase-client.js?v=2579" defer></script>
  <script src="/supabase/auth-manager.js?v=1892" defer></script>
  <script src="/assets/backend/profile-manager.js?v=1877" defer></script>
  <script src="/assets/services/global/global-data-manager.js?v=1877" defer></script>

  <script src="../assets/codec/lzstring.js?v=1877" defer></script>
  <script src="../assets/codec/sha256.js?v=1877" defer></script>
  <script src="../assets/codec/isaac.js?v=1877" defer></script>
  <script src="../assets/cube-solve/mathlib.js?v=1877" defer></script>
  <script src="../assets/cube-solve/formula-core.js?v=2317" defer></script>
  <script src="../assets/cube-solve/cubejs-cube.js?v=2034" defer></script>
  <script src="../assets/cube-solve/cubejs-solve.js?v=2034" defer></script>
  <script src="../assets/bluetooth/bluetooth.js?v=1877" defer></script>
  <script src="../assets/bluetooth/giikercube.js?v=2005" defer></script>
  <script src="../assets/bluetooth/gocube.js?v=2005" defer></script>
  <script src="../assets/bluetooth/gancube.js?v=2005" defer></script>
  <script src="../assets/bluetooth/moyucube.js?v=2005" defer></script>
  <script src="../assets/bluetooth/moyu32cube.js?v=2005" defer></script>
  <script src="../assets/bluetooth/qiyicube.js?v=1877" defer></script>
  <script src="../assets/state-reset/state-reset.js?v=1949" defer></script>
  <script src="../assets/bluetooth/facelet-gap.js?v=1927" defer></script>

  <!-- 3D 魔方（Cube 公用：pnltri → three → twisty → twistynnn），录像回放用 -->
  <script src="../assets/cube-3d/pnltri.js?v=1877" defer></script>
  <script src="../assets/cube-3d/threemin.js?v=1877" defer></script>
  <script src="../assets/cube-3d/twisty.js?v=1877" defer></script>
  <script src="../assets/cube-3d/twistynnn.js?v=2450" defer></script>

  <script src="./assets/analyzer-core.js?v=1877" defer></script>
  <!-- 魔方展开图（Cube 公用 /Cube/assets/cube-net/）。必须排在 analyzer-app.js 之前：
       状态图在 init 里就要用到 window.CubeNet。 -->
  <script src="../assets/cube-net/cube-net.js?v=2664" defer></script>
  <!-- Case 示意图（2026-11-24）：静态 SVG 目录 assets/cases/ 已删除，改为现场出图。
       cube-figure.js 负责「状态 → 矢量图」，cube-case-data.js 从 Cube/algs/ 取
       OLL / PLL / F2L / AF2L / CMLL 的案例状态。两者都必须排在 analyzer-app.js 之前。 -->
  <script src="../assets/cube-figure/cube-figure.js?v=2875" defer></script>
  <script src="./assets/cube-case-data.js?v=2895" defer></script>
  <script src="./assets/analyzer-import.js?v=2063" defer></script>
  <script src="./assets/analyzer-charts.js?v=1877" defer></script>
  <!-- 智能魔方蓝牙桥：Cube 公用（/Cube/assets/bluetooth/smartcube-bridge.js），
       与 Cross / Trainer 共用同一份。对外仍是 window.CubeAnalyzerSmartCube。 -->
  <script src="../assets/bluetooth/smartcube-bridge.js?v=2683" defer></script>
  <script src="./assets/solve-analyzer.js?v=1877" defer></script>
  <script src="/assets/services/sync/payload-codec.js?v=1892" defer></script>
  <script src="./assets/analyzer-store.js?v=2579" defer></script>
  <script src="./assets/analyzer-cloud.js?v=2579" defer></script>
  <script src="../assets/scramble/scramble.js?v=1892" defer></script>
  <script src="../assets/audio/cube-audio.js?v=2034" defer></script>
  <script src="./assets/analyzer-quality.js?v=2005" defer></script>
  <script src="./assets/analyzer-ai.js?v=2005" defer></script>
  <script src="./assets/analyzer-replay.js?v=2767" defer></script>
  <script src="./assets/analyzer-app.js?v=2895" defer></script>
</head>
<body data-workspace="training">
  <div class="page-shell">
    <section class="control-bar card" aria-label="Analyzer 主控制栏">
      <div class="device-cluster training-only">
        <button class="btn btn-primary device-button" id="connectCubeBtn" type="button">
          <span class="device-dot"></span><span id="connectCubeLabel">连接魔方</span>
        </button>
        <span class="tool-status" id="cubeStatus">未连接</span>
      </div>

      <div class="mode-switch" id="workspaceMode" role="tablist" aria-label="训练与分析">
        <button class="mode-switch-btn active" type="button" data-mode="training" role="tab" aria-selected="true">训练</button>
        <button class="mode-switch-btn" type="button" data-mode="analysis" role="tab" aria-selected="false">分析</button>
      </div>

      <div class="training-controls training-only">
        <label class="toolbar-field compact-field">解法
          <select id="trainingMethod"><option>CFOP</option><option>Roux</option><option>ZZ</option></select>
        </label>
        <label class="toolbar-field compact-field session-field">Session
          <input id="trainingSession" type="text" maxlength="40" value="日常训练" autocomplete="off">
        </label>
        <!-- 训练设置：自由打乱 / 观察 / 声音等低频开关收进抽屉，主栏只留每把都要看的项 -->
        <button class="icon-btn settings-btn" id="settingsBtn" type="button" aria-expanded="false" aria-controls="settingsPanel" title="训练设置：自由打乱、观察倒计时、语音音效">
          <span class="settings-glyph" aria-hidden="true">⚙</span>
        </button>
      </div>

      <div class="workspace-meta">
        <span class="cloud-state" id="cloudState">本地数据</span>
        <span class="badge" id="totalSolveBadge">0 solves</span>
      </div>

      <div class="settings-pop training-only" id="settingsPanel" hidden>
        <div class="settings-pop-head">
          <strong>训练设置</strong>
          <button class="icon-btn" id="closeSettingsBtn" type="button" aria-label="关闭设置">×</button>
        </div>
        <label class="settings-row">
          <span class="settings-text">自由打乱<em>不按公式，自己随便拧；公式由转动记录实时反算，魔方不必先复原</em></span>
          <input id="freeScrambleToggle" type="checkbox">
        </label>
        <label class="settings-row">
          <span class="settings-text">观察倒计时<em>开始前倒计时，超时按 WCA 口径 +2 / DNF</em></span>
          <input id="inspectionToggle" type="checkbox">
        </label>
        <label class="settings-row">
          <span class="settings-text">观察时长<em>剩 12s / 8s 语音报点与判罚窗口随之调整</em></span>
          <select id="inspectionSec"><option value="10">10s</option><option value="12">12s</option><option value="15" selected>15s</option><option value="20">20s</option><option value="30">30s</option></select>
        </label>
        <div class="settings-row">
          <span class="settings-text">声音<em>观察报点与起停提示音</em></span>
          <span class="settings-inline">
            <label class="toolbar-check" title="观察阶段剩 12s / 8s 语音提醒（WCA 报点口径）"><input id="voiceToggle" type="checkbox" checked> <span>语音</span></label>
            <label class="toolbar-check" title="开始计时 / 观察判罚提示音"><input id="soundToggle" type="checkbox" checked> <span>音效</span></label>
          </span>
        </div>
        <div class="settings-row">
          <span class="settings-text">状态重置<em>把魔方当前状态认作复原态（重置内部面位）</em></span>
          <span id="stateResetMount"></span>
        </div>
        <p class="settings-note" title="CFOP、Roux、ZZ 均遍历完整方位识别，不锁定白底或固定持握方向">六色底 / 方位自动识别：按打乱后的实际状态识别解法方位。</p>
      </div>
    </section>

    <main class="workspace-main">
      <section class="workspace-panel active" id="trainingWorkspace" data-workspace="training">
        <section class="trainer-grid">
          <article class="card timer-card">
            <div class="scramble-head">
              <span class="section-kicker">打乱</span>
              <span class="scramble-hint" id="scrambleHint">双击公式换一条</span>
            </div>
            <div class="scramble-tape">
              <div class="scramble-text" id="scrambleText"></div>
            </div>
            <!-- 自由打乱时，打乱区下面出现「结束打乱」：点它即进入可计时状态，公式反算在后台进行 -->
            <div class="scramble-finish">
              <button class="btn btn-primary" id="freeScrambleDoneBtn" type="button" hidden>结束打乱</button>
            </div>
            <div class="scramble-meta" id="scrambleMeta"></div>

            <div class="timer-hero">
              <div class="timer-stage" id="timerStage" data-state="idle">
                <div class="timer-status" id="timerStatus">按公式打乱</div>
                <div class="timer-value" id="timerValue">0.00</div>
                <div class="timer-sub" id="timerSub">Space 起停，或直接转动使用魔方状态自动起停</div>
              </div>

              <div class="timer-actions">
                <button class="btn btn-primary ready-btn" id="readyBtn" type="button" hidden>开始</button>
                <button class="btn btn-ghost" id="cancelTimerBtn" type="button" disabled>取消本把</button>
                <!-- 状态图（飞机图）：与 Cross 同一套交互 —— 点开在按钮旁弹出六面展开图。
                     展开图本体与配色换算都是 Cube 公用件 /Cube/assets/cube-net/，这里只挂宿主 div。 -->
                <div class="cubePopWrap" id="cubeNetWrap">
                  <button class="btn btn-ghost" id="cubeNetBtn" type="button" aria-expanded="false" aria-controls="cubeNetPop" aria-haspopup="dialog" title="查看当前魔方状态（六面展开图）">状态图</button>
                  <div class="cubePop" id="cubeNetPop" role="dialog" aria-label="魔方状态">
                    <div class="cubePopHead">
                      <span id="cubeNetTitle">魔方状态</span>
                      <span class="cubeHint" id="cubeNetHint">未连接</span>
                    </div>
                    <div class="cubeNet" id="cubeNet" aria-label="魔方六面展开图"></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="keyboard-hint" id="keyboardHint"><kbd>Space</kbd> 起停；若不按 Space 而直接转动，本把将全程使用状态计时</div>
          </article>

          <aside class="trainer-side">
            <!-- 右侧：窄屏时两栏合成一张卡（左四宫格 / 右记录）；
                 宽屏时两块各自成为一张卡，都留在右侧。 -->

            <!-- 成绩记录 -->
            <article class="stat-block stat-block-score">
              <div class="block-head">
                <h2>成绩</h2>
                <button class="text-btn" id="goAnalysisBtn" type="button">全部记录 →</button>
              </div>
              <div class="score-list" id="trainingRecent"></div>
            </article>

            <!-- 实时指标 + 本次 Session -->
            <article class="stat-block stat-block-live">
              <div class="block-head">
                <h2>实时</h2>
                <span class="panel-sub" id="liveDevice">等待训练</span>
              </div>
              <div class="live-metrics">
                <div><span>TPS</span><strong id="liveTps">—</strong></div>
                <div><span>Turns</span><strong id="liveTurns">0</strong></div>
                <div><span>Fluency</span><strong id="liveFluency">—</strong></div>
                <div><span>PB</span><strong id="liveBest">—</strong></div>
              </div>
              <!-- 四宫格下方：修正本 Session 最新一把（DNF / +2 / 删除） -->
              <div class="live-actions" id="liveActions" role="group" aria-label="修正最新一把">
                <button class="live-action" id="liveDnfBtn" type="button" data-live-penalty="dnf" aria-pressed="false" title="把本 Session 最新一把标记为 DNF">DNF</button>
                <button class="live-action" id="livePlusTwoBtn" type="button" data-live-penalty="plus_two" aria-pressed="false" title="给本 Session 最新一把加 2 秒">+2</button>
                <button class="live-action danger" id="liveDeleteBtn" type="button" data-live-delete="1" title="删除本 Session 最新一把（需确认）">删除</button>
              </div>
              <div class="move-stream" id="moveStream"><span class="muted">动作会显示在这里</span></div>

              <div class="session-block">
                <div class="block-head">
                  <h2>本次 Session</h2>
                  <span class="panel-sub" id="sessionSummary">暂无成绩</span>
                  <button class="text-btn" id="sessionAiBtn" type="button" title="用 AI 生成本 Session 训练小结">AI 小结 →</button>
                </div>
                <div class="session-metrics" id="sessionMetrics"></div>
              </div>
            </article>
          </aside>
        </section>
      </section>

      <section class="workspace-panel" id="analysisWorkspace" data-workspace="analysis">
        <section class="analysis-control card">
          <div class="analysis-headline">
            <div class="analysis-data-meta">
              <strong id="datasetName">训练数据</strong>
              <span class="badge" id="datasetCount">0 solves</span>
              <span class="badge subtle" id="deepDataBadge">0 replay</span>
            </div>
            <div class="analysis-actions">
              <input id="fileInput" type="file" accept=".json,.csv,application/json,text/csv" hidden multiple>
              <button class="text-btn" id="importBtn" type="button">导入</button>
              <button class="text-btn" id="exportBtn" type="button">导出</button>
              <button class="text-btn" id="qualityBtn" type="button" hidden title="异常记录只标记不修改；确认误报后可恢复纳入统计">体检</button>
              <button class="text-btn danger-text" id="clearBtn" type="button">清空</button>
            </div>
          </div>
          <!-- 窄屏：筛选栏默认收起，先给一行当前条件摘要，点开才展开完整筛选 -->
          <button class="filter-toggle" id="filterToggle" type="button" aria-expanded="false" aria-controls="filterBar">
            <span>筛选</span><span class="filter-sum" id="filterSummary">全部数据</span>
            <span class="filter-caret" aria-hidden="true">⌄</span>
          </button>
          <div class="filter-bar" id="filterBar" aria-label="数据筛选">
            <label>方法<select id="methodFilter"><option value="all">全部</option><option>CFOP</option><option>Roux</option><option>ZZ</option></select></label>
            <label>Session<select id="sessionFilter"><option value="all">全部</option></select></label>
            <label>设备<select id="deviceFilter"><option value="all">全部</option></select></label>
            <label>起始日期<input id="startDate" type="date"></label>
            <label>结束日期<input id="endDate" type="date"></label>
            <button class="btn btn-ghost filter-reset" id="resetFilterBtn" type="button">重置</button>
          </div>
        </section>

        <nav class="tabs card compact-card" id="tabs" aria-label="分析视图">
          <button class="tab active" data-tab="overview">总览</button>
          <button class="tab" data-tab="trend">趋势</button>
          <button class="tab" data-tab="splits">分段洞察</button>
          <button class="tab" data-tab="tps">TPS 曲线</button>
          <button class="tab" data-tab="cases">Case</button>
          <button class="tab" data-tab="solves">单次</button>
          <button class="tab" data-tab="ai">AI</button>
        </nav>

        <section class="tab-panel active" data-panel="overview"><div id="overviewContent"></div></section>
        <section class="tab-panel" data-panel="trend"><div id="trendContent"></div></section>
        <section class="tab-panel" data-panel="splits"><div id="splitsContent"></div></section>
        <section class="tab-panel" data-panel="tps"><div id="tpsContent"></div></section>
        <section class="tab-panel" data-panel="cases"><div id="casesContent"></div></section>
        <section class="tab-panel" data-panel="solves"><div id="solvesContent"></div></section>
        <section class="tab-panel" data-panel="ai"><div id="aiContent"></div></section>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <div class="modal-backdrop" id="replayModal" hidden></div>
  <div class="modal-backdrop" id="solveModal" hidden>
    <div class="modal card" role="dialog" aria-modal="true" aria-labelledby="solveModalTitle">
      <div class="modal-head"><h2 id="solveModalTitle">单次详情</h2><button class="icon-btn" id="closeSolveModal" type="button">×</button></div>
      <div id="solveModalBody"></div>
    </div>
  </div>
</body>
</html>
