<!doctype html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#0f0d18">
  <link rel="icon" href="/favicon.svg?v=0349" type="image/svg+xml">
  <title>Cube Analyzer · 魔方训练与分析</title>
  <meta name="description" content="智能魔方训练、计时、成绩趋势、分段与 TPS 数据分析。">
  <script>
    (() => {
      const saved = localStorage.getItem('smartCubeTheme');
      document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark';
    })();
  </script>

  <link rel="stylesheet" href="/ui/colors_and_type.css">
  <link rel="stylesheet" href="/nav/nav.css?v=12">
  <link rel="stylesheet" href="./analyzer.css?v=6">

  <script src="../lib/jquery-4.0.0.min.js"></script>
  <script src="../compat.js?v=1526" defer></script>
  <script src="/nav/nav.js?v=12" defer></script>
  <!-- 站点作用域（必须先于云同步定义）+ 云同步（Supabase，登录态与 Formula 共享） -->
  <script src="/assets/services/core/site-scope.js?v=0915b" defer></script>
  <script src="/assets/services/core/storage-manager.js?v=0567" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="/supabase/supabase-config.js?v=0618" defer></script>
  <script src="/supabase/supabase-client.js?v=0618" defer></script>
  <script src="/supabase/auth-manager.js?v=0677" defer></script>
  <script src="/assets/backend/profile-manager.js?v=0843" defer></script>
  <script src="/assets/services/global/global-data-manager.js?v=0666" defer></script>

  <script src="../lib/lzstring.js?v=0286" defer></script>
  <script src="../lib/sha256.js?v=0286" defer></script>
  <script src="../lib/isaac.js?v=0286" defer></script>
  <script src="../lib/mathlib.js?v=0286" defer></script>
  <script src="../lib/formula-core.js?v=1577" defer></script>
  <script src="../hardware/bluetooth.js?v=1072" defer></script>
  <script src="../hardware/giikercube.js?v=0286" defer></script>
  <script src="../hardware/gocube.js?v=0286" defer></script>
  <script src="../hardware/gancube.js?v=1823" defer></script>
  <script src="../hardware/moyucube.js?v=1072" defer></script>
  <script src="../hardware/moyu32cube.js?v=1072" defer></script>
  <script src="../hardware/qiyicube.js?v=0286" defer></script>

  <script src="./analyzer-core.js?v=6" defer></script>
  <script src="./analyzer-import.js?v=6" defer></script>
  <script src="./analyzer-charts.js?v=6" defer></script>
  <script src="./smartcube-bridge.js?v=6" defer></script>
  <script src="./solve-analyzer.js?v=6" defer></script>
  <script src="./analyzer-cloud.js?v=6" defer></script>
  <script src="./analyzer-app.js?v=6" defer></script>
</head>
<body data-workspace="training">
  <div class="page-shell">
    <section class="control-bar card" aria-label="Analyzer 主控制栏">
      <div class="device-cluster">
        <button class="btn btn-primary device-button" id="connectCubeBtn" type="button">
          <span class="device-dot"></span><span id="connectCubeLabel">连接魔方</span>
        </button>
        <span class="tool-status" id="cubeStatus">未连接</span>
      </div>

      <div class="mode-switch" id="workspaceMode" role="tablist" aria-label="训练与分析">
        <button class="mode-switch-btn active" type="button" data-mode="training" role="tab" aria-selected="true">训练</button>
        <button class="mode-switch-btn" type="button" data-mode="analysis" role="tab" aria-selected="false">分析</button>
      </div>

      <div class="training-controls training-only">
        <label class="toolbar-field compact-field">解法
          <select id="trainingMethod"><option>CFOP</option><option>Roux</option><option>ZZ</option></select>
        </label>
        <label class="toolbar-field compact-field session-field">Session
          <input id="trainingSession" type="text" maxlength="40" value="日常训练" autocomplete="off">
        </label>
        <label class="toolbar-check"><input id="inspectionToggle" type="checkbox"> <span>15 秒观察</span></label>
        <span class="auto-frame-chip" title="CFOP、Roux、ZZ 均遍历完整方位识别，不锁定白底或固定持握方向">六色底 / 方位自动识别</span>
      </div>

      <div class="workspace-meta">
        <span class="cloud-state" id="cloudState">本地数据</span>
        <span class="badge" id="totalSolveBadge">0 solves</span>
      </div>
    </section>

    <main class="workspace-main">
      <section class="workspace-panel active" id="trainingWorkspace" data-workspace="training">
        <section class="trainer-grid">
          <article class="card timer-card">
            <div class="scramble-head">
              <div>
                <span class="section-kicker">打乱</span>
                <span class="scramble-legend"><i class="pending"></i>待完成 <i class="current"></i>当前 / 修正 <i class="done"></i>已完成</span>
              </div>
              <button class="text-btn" id="newScrambleBtn" type="button">换一个</button>
            </div>
            <div class="scramble-text" id="scrambleText"></div>
            <div class="scramble-meta" id="scrambleMeta"></div>

            <div class="timer-stage" id="timerStage" data-state="idle">
              <div class="timer-status" id="timerStatus">按公式打乱</div>
              <div class="timer-value" id="timerValue">0.00</div>
              <div class="timer-sub" id="timerSub">Space 起停，或直接转动使用魔方状态自动起停</div>
            </div>

            <div class="timer-actions">
              <button class="btn btn-primary ready-btn" id="readyBtn" type="button" hidden>开始</button>
              <button class="btn btn-ghost" id="cancelTimerBtn" type="button" disabled>取消本把</button>
            </div>
            <div class="keyboard-hint" id="keyboardHint"><kbd>Space</kbd> 起停；若不按 Space 而直接转动，本把将全程使用状态计时</div>
          </article>

          <aside class="trainer-side">
            <article class="card live-card">
              <div class="panel-head compact-head"><div><h2>实时数据</h2><div class="panel-sub" id="liveDevice">等待训练</div></div></div>
              <div class="live-metrics">
                <div><span>TPS</span><strong id="liveTps">—</strong></div>
                <div><span>Turns</span><strong id="liveTurns">0</strong></div>
                <div><span>Fluency</span><strong id="liveFluency">—</strong></div>
              </div>
              <div class="move-stream" id="moveStream"><span class="muted">动作会显示在这里</span></div>
            </article>

            <article class="card session-card">
              <div class="panel-head compact-head"><div><h2>本次 Session</h2><div class="panel-sub" id="sessionSummary">暂无成绩</div></div></div>
              <div class="session-metrics" id="sessionMetrics"></div>
            </article>
          </aside>
        </section>

        <section class="card recent-card">
          <div class="panel-head">
            <div><h2>最近成绩</h2><div class="panel-sub">训练完成即保存完整智能魔方轨迹，可修正 +2 / DNF 或删除误触记录。</div></div>
            <button class="text-btn" id="goAnalysisBtn" type="button">查看分析 →</button>
          </div>
          <div id="trainingRecent"></div>
        </section>
      </section>

      <section class="workspace-panel" id="analysisWorkspace" data-workspace="analysis">
        <section class="analysis-control card">
          <div class="analysis-headline">
            <div class="analysis-data-meta">
              <strong id="datasetName">训练数据</strong>
              <span class="badge" id="datasetCount">0 solves</span>
              <span class="badge subtle" id="deepDataBadge">0 replay</span>
            </div>
            <div class="analysis-actions">
              <input id="fileInput" type="file" accept=".json,.csv,application/json,text/csv" hidden multiple>
              <button class="text-btn" id="importBtn" type="button">导入</button>
              <button class="text-btn" id="exportBtn" type="button">导出</button>
              <button class="text-btn danger-text" id="clearBtn" type="button">清空</button>
            </div>
          </div>
          <div class="filter-bar" aria-label="数据筛选">
            <label>方法<select id="methodFilter"><option value="all">全部</option><option>CFOP</option><option>Roux</option><option>ZZ</option></select></label>
            <label>Session<select id="sessionFilter"><option value="all">全部</option></select></label>
            <label>设备<select id="deviceFilter"><option value="all">全部</option></select></label>
            <label>起始日期<input id="startDate" type="date"></label>
            <label>结束日期<input id="endDate" type="date"></label>
            <button class="btn btn-ghost filter-reset" id="resetFilterBtn" type="button">重置</button>
          </div>
        </section>

        <nav class="tabs card compact-card" id="tabs" aria-label="分析视图">
          <button class="tab active" data-tab="overview">总览</button>
          <button class="tab" data-tab="trend">趋势</button>
          <button class="tab" data-tab="splits">分段洞察</button>
          <button class="tab" data-tab="tps">TPS 曲线</button>
          <button class="tab" data-tab="cases">Case</button>
          <button class="tab" data-tab="solves">单次</button>
        </nav>

        <section class="tab-panel active" data-panel="overview"><div id="overviewContent"></div></section>
        <section class="tab-panel" data-panel="trend"><div id="trendContent"></div></section>
        <section class="tab-panel" data-panel="splits"><div id="splitsContent"></div></section>
        <section class="tab-panel" data-panel="tps"><div id="tpsContent"></div></section>
        <section class="tab-panel" data-panel="cases"><div id="casesContent"></div></section>
        <section class="tab-panel" data-panel="solves"><div id="solvesContent"></div></section>
      </section>
    </main>
  </div>

  <div class="toast" id="toast" role="status"></div>
  <div class="modal-backdrop" id="solveModal" hidden>
    <div class="modal card" role="dialog" aria-modal="true" aria-labelledby="solveModalTitle">
      <div class="modal-head"><h2 id="solveModalTitle">单次详情</h2><button class="icon-btn" id="closeSolveModal" type="button">×</button></div>
      <div id="solveModalBody"></div>
    </div>
  </div>
</body>
</html>
