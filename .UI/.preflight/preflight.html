<!DOCTYPE html>
<html lang="zh-CN" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* ============================================================
   Design System — Color & Type Tokens
   Brand prefix: dsk
   ============================================================ */

:root {
  color-scheme: dark;

  /* ---------- Brand Primitive Scales ---------- */
  /* Purple scale (主品牌色 — 气质、科技、稳定) */
  --dsk-purple-50:  #efeafb;
  --dsk-purple-100: #ddd4f6;
  --dsk-purple-200: #b9a9ed;
  --dsk-purple-300: #957fe4;
  --dsk-purple-400: #7a65d0;
  --dsk-purple-500: #5d4ea8;  /* 品牌主色 */
  --dsk-purple-600: #4d3f96;
  --dsk-purple-700: #3e3276;
  --dsk-purple-800: #2e2556;
  --dsk-purple-900: #1e1836;
  --dsk-purple-950: #141026;

  /* Cyan scale (高亮点缀色 — 光感、灵动、仪式感) */
  --dsk-cyan-50:  #e6fdfc;
  --dsk-cyan-100: #c5faf7;
  --dsk-cyan-200: #8cf4ef;
  --dsk-cyan-300: #52eee7;
  --dsk-cyan-400: #24f0ea;  /* 高亮点缀主色 */
  --dsk-cyan-500: #14c9c4;
  --dsk-cyan-600: #0e9995;
  --dsk-cyan-700: #0a6e6b;
  --dsk-cyan-800: #074745;
  --dsk-cyan-900: #042524;

  /* Neutral scale — cool, with subtle purple undertone */
  --dsk-slate-50:  #f7f8fc;
  --dsk-slate-100: #eceef6;
  --dsk-slate-200: #d5d8e5;
  --dsk-slate-300: #b5b9cc;
  --dsk-slate-400: #8a8fa6;
  --dsk-slate-500: #676c84;
  --dsk-slate-600: #50556a;
  --dsk-slate-700: #3e4154;
  --dsk-slate-800: #2a2c3c;
  --dsk-slate-900: #1a1b28;
  --dsk-slate-950: #10101a;

  /* Status colors */
  --dsk-success: #24f0ea;  /* 暗色模式用青色表成功 */
  --dsk-success-light: #0e9995;
  --dsk-danger: #e85d6a;
  --dsk-warning: #e6b84a;
  --dsk-info: #6b8cff;

  /* ---------- Semantic Tokens (Dark Mode — Default) ---------- */
  --dsk-background: #0f0d18;
  --dsk-background-elevated: #161328;
  --dsk-foreground: #e8e8f4;
  --dsk-foreground-muted: #a0a3b8;
  --dsk-foreground-subtle: #6e7088;

  --dsk-card: #1a1829;
  --dsk-card-foreground: #ececf6;
  --dsk-card-muted: #9a9db2;
  --dsk-card-border: #2a2840;

  --dsk-popover: #1e1c30;
  --dsk-popover-foreground: #ececf6;
  --dsk-popover-border: #32304a;

  --dsk-primary: #6b5dc2;
  --dsk-primary-foreground: #ffffff;
  --dsk-primary-hover: #7d6fd4;
  --dsk-primary-active: #5a4db0;
  --dsk-primary-soft: rgba(107, 93, 194, 0.18);
  --dsk-primary-ring: rgba(107, 93, 194, 0.4);

  --dsk-accent: #24f0ea;  /* 青色高亮点缀 */
  --dsk-accent-foreground: #0a1212;
  --dsk-accent-soft: rgba(36, 240, 234, 0.10);
  --dsk-accent-ring: rgba(36, 240, 234, 0.35);
  --dsk-accent-glow: rgba(36, 240, 234, 0.18);

  --dsk-muted: #2a2840;
  --dsk-muted-foreground: #9a9db2;

  --dsk-border: #2e2c44;
  --dsk-border-subtle: #222036;

  --dsk-input: #201e32;
  --dsk-input-foreground: #ececf6;
  --dsk-ring: rgba(36, 240, 234, 0.4);

  --dsk-shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.3);
  --dsk-shadow-md: 0 4px 12px rgba(0, 0, 0, 0.28);
  --dsk-shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.35);

  /* Page atmosphere — 深紫黑空间中的少量青色电光 */
  --dsk-page-bg:
    radial-gradient(ellipse 60% 40% at 12% 0%, rgba(93, 78, 168, 0.22), transparent 60%),
    radial-gradient(ellipse 50% 35% at 100% 10%, rgba(93, 78, 168, 0.10), transparent 55%),
    radial-gradient(circle at 85% 90%, rgba(36, 240, 234, 0.04), transparent 40%),
    linear-gradient(180deg, #12101f 0%, #0b0a14 100%);

  /* ---------- Typography ---------- */
  --dsk-font-sans: 'Inter', 'Segoe UI', system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --dsk-font-mono: 'SF Mono', 'Cascadia Mono', 'Consolas', 'Monaco', monospace;

  --dsk-text-xs: 11px;
  --dsk-text-sm: 13px;
  --dsk-text-base: 14px;
  --dsk-text-lg: 16px;
  --dsk-text-xl: 18px;
  --dsk-text-2xl: 22px;
  --dsk-text-3xl: 28px;
  --dsk-text-4xl: 36px;

  --dsk-leading-tight: 1.2;
  --dsk-leading-normal: 1.5;
  --dsk-leading-relaxed: 1.65;

  /* ---------- Radius ---------- */
  --dsk-radius-sm: 6px;
  --dsk-radius-md: 8px;
  --dsk-radius-lg: 12px;
  --dsk-radius-xl: 16px;
  --dsk-radius-full: 9999px;

  /* ---------- Spacing ---------- */
  --dsk-space-1: 4px;
  --dsk-space-2: 8px;
  --dsk-space-3: 12px;
  --dsk-space-4: 16px;
  --dsk-space-5: 20px;
  --dsk-space-6: 24px;
  --dsk-space-8: 32px;
  --dsk-space-10: 40px;
}

/* ---------- Light Mode Overrides ---------- */
:root[data-theme="light"] {
  color-scheme: light;

  --dsk-background: #f7f8fc;
  --dsk-background-elevated: #ffffff;
  --dsk-foreground: #1e1d2e;
  --dsk-foreground-muted: #575a6d;
  --dsk-foreground-subtle: #8a8fa6;

  --dsk-card: #ffffff;
  --dsk-card-foreground: #1e1d2e;
  --dsk-card-muted: #575a6d;
  --dsk-card-border: #e0e2ec;

  --dsk-popover: #ffffff;
  --dsk-popover-foreground: #1e1d2e;
  --dsk-popover-border: #d5d8e5;

  --dsk-primary: #5d4ea8;
  --dsk-primary-foreground: #ffffff;
  --dsk-primary-hover: #4d3f96;
  --dsk-primary-active: #3e3276;
  --dsk-primary-soft: rgba(93, 78, 168, 0.10);
  --dsk-primary-ring: rgba(93, 78, 168, 0.3);

  --dsk-accent: #14c9c4;
  --dsk-accent-foreground: #0a2524;
  --dsk-accent-soft: rgba(20, 201, 196, 0.10);
  --dsk-accent-ring: rgba(20, 201, 196, 0.35);
  --dsk-accent-glow: rgba(20, 201, 196, 0.12);

  --dsk-muted: #eceef6;
  --dsk-muted-foreground: #575a6d;

  --dsk-border: #d5d8e5;
  --dsk-border-subtle: #e8eaf2;

  --dsk-input: #ffffff;
  --dsk-input-foreground: #1e1d2e;
  --dsk-ring: rgba(93, 78, 168, 0.35);

  --dsk-shadow-sm: 0 1px 2px rgba(30, 29, 46, 0.06);
  --dsk-shadow-md: 0 4px 14px rgba(30, 29, 46, 0.08);
  --dsk-shadow-lg: 0 12px 40px rgba(30, 29, 46, 0.10);

  --dsk-success: #0e9995;

  /* Page atmosphere — 冷白空间中的雾紫与少量青色光 */
  --dsk-page-bg:
    radial-gradient(ellipse 55% 40% at 10% 0%, rgba(93, 78, 168, 0.08), transparent 60%),
    radial-gradient(ellipse 45% 35% at 95% 5%, rgba(36, 240, 234, 0.06), transparent 50%),
    linear-gradient(180deg, #fafbff 0%, #f4f6fb 100%);
}

/* ============================================================
   Tailwind @theme inline definition
   ============================================================ */
@theme inline {
  --color-background: var(--dsk-background);
  --color-foreground: var(--dsk-foreground);
  --color-card: var(--dsk-card);
  --color-card-foreground: var(--dsk-card-foreground);
  --color-popover: var(--dsk-popover);
  --color-popover-foreground: var(--dsk-popover-foreground);
  --color-primary: var(--dsk-primary);
  --color-primary-foreground: var(--dsk-primary-foreground);
  --color-muted: var(--dsk-muted);
  --color-muted-foreground: var(--dsk-muted-foreground);
  --color-border: var(--dsk-border);
  --color-input: var(--dsk-input);
  --color-ring: var(--dsk-ring);
  --color-accent: var(--dsk-accent);
  --color-accent-foreground: var(--dsk-accent-foreground);

  --radius-sm: var(--dsk-radius-sm);
  --radius-md: var(--dsk-radius-md);
  --radius-lg: var(--dsk-radius-lg);
  --radius-xl: var(--dsk-radius-xl);
  --radius-full: var(--dsk-radius-full);

  --font-sans: var(--dsk-font-sans);
  --font-mono: var(--dsk-font-mono);

  --shadow-sm: var(--dsk-shadow-sm);
  --shadow-md: var(--dsk-shadow-md);
  --shadow-lg: var(--dsk-shadow-lg);
}

    </style>
