<script>
/* ===== 内联自 js/insights.js ===== */
/* =========================================================================
 * insights.js —— 温馨提示 / 风险预警 / 下一步行动推荐引擎
 * 输出统一结构：{ level: 'danger'|'warn'|'info'|'good', title, body, cta?, tag? }
 * ========================================================================= */
(function () {
  const ZC = window.ZC;
  const fmt = ZC.fmt;

  const L = { danger: '🔴', warn: '🟡', good: '🟢', info: 'ℹ️' };

  function mk(level, title, body, extra) {
    return Object.assign({ level, icon: L[level] || 'ℹ️', title, body }, extra || {});
  }

  /* ============================================== 主入口 */
  ZC.buildInsights = function (profile, R, res) {
    const out = [];
    const p = profile;
    const H = res.headroom;

    /* ---------- 🔴 红线与风险 ---------- */
    if (!p.meta.assessPass) {
      out.push(mk('danger', '基准分 70 分未计入', '班级评议小组评议合格 + 书院审定通过后才能获得基准分。这是全盘最大的单项分值，务必确认状态。', { cta: 'pinxing' }));
    }
    const fatalDed = res.pinxing.deductions.filter(d => d.fatal);
    if (fatalDed.length) {
      out.push(mk('danger', '存在纪律处分类扣分，可能触发"一票否决"',
        `已登记 ${fatalDed.map(d => d.label).join('、')}。受校级、院级纪律处分（含尚未解除）将取消当年度奖学金参评资格，并通常取消表彰奖励参评资格。请核实处分是否已解除、是否在参评学年内。`, { cta: 'eligibility' }));
    }
    const kua = (p.pinxing.deductions || []).filter(d => d.type === 'kuangke').reduce((s, d) => s + (+d.count || 0), 0);
    if (kua >= 3) {
      out.push(mk('danger', `旷课已累计 ${kua} 次`,
        '旷课虽为 −1/次，但累计到一定程度可能构成纪律处分（警告 −4 起），并直接触发奖学金参评资格红线。', { cta: 'pinxing' }));
    }
    if (res.pinxing.deduction > 0) {
      const equiv = res.pinxing.deduction / 4;
      out.push(mk('danger', `扣分已累计 −${fmt(res.pinxing.deduction)} 分（不设上限）`,
        `扣分直接从品行素质分中扣除，没有上限。当前扣分约等于抹掉 ${equiv >= 1 ? fmt(equiv) + ' 个校级竞赛一等奖' : fmt(res.pinxing.deduction) + ' 分加分成果'}。宿舍卫生、旷课这类"小事"是排名落差的主要来源。`, { cta: 'pinxing' }));
    }
    const blocked = res.blocked || [];
    if (blocked.length) {
      out.push(mk('danger', `${blocked.length} 项成果因署名单位不予认定`,
        blocked.map(b => `「${b.label}」：${b.reason}`).join('；') + '。参与外单位科研项目前务必提前确认署名安排。', { cta: 'ability' }));
    }

    /* ---------- 资格红线自检 ---------- */
    const sch = p.eligibility && p.eligibility.scholarship;
    if (sch && (sch.fail || sch.punish)) {
      out.push(mk('danger', '奖学金参评资格自检：不通过',
        [sch.fail ? '参评学年必修课考核不及格（补考、重修视同不及格）' : '', sch.punish ? '受到校级、院级纪律处分（含尚未解除）' : ''].filter(Boolean).join('；') + ' → 取消当年度奖学金参评资格。', { cta: 'eligibility' }));
    }

    /* ---------- 🟡 材料风险 ---------- */
    const allItems = collectAllItems(res, p);
    const risky = allItems.filter(i => i.status === 'rejected');
    const pending = allItems.filter(i => !i.status || i.status === 'none' || i.status === 'todo');
    if (risky.length) {
      out.push(mk('danger', `${risky.length} 条加分项材料被驳回`,
        risky.slice(0, 4).map(i => `「${i.label}」`).join('、') + (risky.length > 4 ? ' 等' : '') + '。请在公示期内补齐佐证材料，必要时启动异议程序。', { cta: 'materials' }));
    } else if (pending.length) {
      const pts = pending.reduce((s, i) => s + (i.points || 0), 0);
      out.push(mk('warn', `${pending.length} 条加分项尚未备好证明材料`,
        `涉及约 ${fmt(pts)} 分。竞赛证书、录用通知、专利证书、志愿服务时长证明、任职文件、主办单位名单都要归档；无佐证材料的加分在班级评议阶段极易被剔除。`, { cta: 'materials' }));
    }
    if (!p.meta.signedOff) {
      out.push(mk('warn', '尚未完成"学生核对并签字确认"', '初评结果必须由本人核对签字后才报书院工作组。签字前是你最后一次低成本纠错的机会。', { cta: 'procedure' }));
    }

    /* ---------- 申诉时效 ---------- */
    if (p.meta.publicityDate) {
      const t = ZC.appealTimeline(p.meta.publicityDate, R);
      const now = new Date();
      const d1 = t.objection;
      const days = Math.ceil((d1 - now) / 86400000);
      if (days < 0) out.push(mk('info', '异议窗口已关闭', `公示日 ${p.meta.publicityDate} 起 3 个工作日的异议期已过（截止 ${ZC.dateStr(d1)}）。如仍有争议，请查看是否处于后续申诉环节。`, { cta: 'procedure' }));
      else if (days <= 3) out.push(mk('warn', `异议窗口仅剩 ${days} 天`, `书面异议截止 ${ZC.dateStr(d1)}（公示起 3 个工作日内）。错过即丧失程序权利。`, { cta: 'procedure' }));
      else out.push(mk('info', `异议截止：${ZC.dateStr(d1)}`, `公示起 3 个工作日内可向书院工作组书面异议 → 3 个工作日内答复 → 不服再 3 个工作日内向学生处申诉 → 学生处 3 个工作日内出具最终处理意见。`, { cta: 'procedure' }));
    }

    /* ---------- 🟢 涨分机会（按剩余空间） ---------- */
    const SV = p.pinxing.service, SR = R.pinxing.service;
    if ((+SV.volunteerHours || 0) < SR.volunteerHours && H.service > 0) {
      const lack = r1(SR.volunteerHours - (+SV.volunteerHours || 0));
      const gain = Math.min(H.service, r2(SR.volunteerPoint * lack / SR.volunteerHours));
      out.push(mk('good', `志愿服务还差 ${fmt(lack)} 小时`,
        `现行口径为每学年 ≥${SR.volunteerHours} 小时加 ${SR.volunteerPoint} 分，不足按比例。补齐可再得约 ${fmt(gain)} 分。志愿时长按学年累计，早做早从容，别拖到学年末集中刷。`, { cta: 'pinxing' }));
    }
    if (H.collective > 0) {
      const per = parseFloat(R.pinxing.collective.perTime) || 0;
      const need = per > 0 ? Math.ceil(H.collective / per) : 0;
      out.push(mk('good', `集体活动分还有 ${fmt(H.collective)} 分空间`,
        `${per > 0 ? `按当前口径 ${fmt(per)} 分/次，再参加约 ${need} 次` : '按当前口径（单次分值为 0，请在设置中修改）参加'}学校或书（学）院主办/发起的重大活动即可拿满。⚑ 单次分值校级办法未统一规定、由书院自行认定，请在设置中改成你所在书院的口径。对集体荣誉有突出贡献可经书院认定一次性满分。`, { cta: 'pinxing' }));
    }
    if (H.ideology > 0) {
      out.push(mk('good', `思想政治理论学习分还有 ${fmt(H.ideology)} 分空间`,
        `参加 1 次各级党团组织理论学习培训（含网络学习）+1；省部级培训 +2；获"优秀学员"额外 +1。三项可叠加、封顶 3 分。网络学习是成本最低的一项。`, { cta: 'pinxing' }));
    }
    if (H.academic > 0.01) {
      out.push(mk('good', `学术科研还有 ${fmt(H.academic)} 分空间`,
        H.academic >= 8 ? '空间很大：一个高水平国际/国家级竞赛三等奖即 +8，省级二等奖 +6，校级一等奖 +4。' :
        H.academic >= 4 ? '一场校级（行业/学会）竞赛一等奖即 +4，省级三等奖 +4。' :
        '剩余空间较小：校级竞赛优秀奖 +1、三等奖 +2 可补齐；国内一般期刊/会议论文一作 +3（已超空间则不涨分）。', { cta: 'ability' }));
    } else if ((res.ability.subs.academic.raw || 0) > R.ability.caps.academic) {
      out.push(mk('info', '学术科研已封顶 10 分',
        `原始合计 ${fmt(res.ability.subs.academic.raw)} 分，超出部分不计。继续堆同类成果不涨分，建议把精力转向文体竞赛（还可 +${fmt(H.culture)}）或任职（还可 +${fmt(H.position)}）。`, { cta: 'ability' }));
    }
    if (H.culture > 0.01) {
      out.push(mk('good', `文体竞赛还有 ${fmt(H.culture)} 分空间`,
        '性价比最高的入口：校级文艺三等奖 +1、校级体育第4—8名 +0.5、校级文艺一等奖 +2。破省级及以上纪录另 +5、破校级纪录 +3。', { cta: 'ability' }));
    }
    const posItems = p.ability.position || [];
    if (H.position > 0.01) {
      const best = res.ability.subs.position.best;
      let posMsg;
      if (!posItems.length) {
        posMsg = '尚未登记任何任职。最低门槛：宿舍长（考核合格）+0.5、团学组织干事（良好）+0.75；班长/团支书考核优秀可 +2；院级及以上学生组织正职优秀 +4。';
      } else if (best && best.assessment !== '优秀') {
        posMsg = `当前「${best.org || ''} ${best.role || ''}」考核为「${best.assessment}」。同一档位下把考核做到"优秀"就能涨分（例如三档：合格 1 → 良好 1.5 → 优秀 2），比换职务更现实。`;
      } else {
        posMsg = '当前已按兼任中的最高档 + 优秀考核计分。若想再提升，只能换到更高档位职务（如从"部长"到"组织正职"）。';
      }
      out.push(mk('good', `任职分还有 ${fmt(H.position)} 分空间`, posMsg, { cta: 'ability' }));
    }
    if (H.reward > 0.01) {
      out.push(mk('good', `奖励分还有 ${fmt(H.reward)} 分空间（总分外的额外分）`,
        '奖励分是在 100 分之外额外的 5 分：精神文明集体/个人荣誉表彰按全国5·省4·市3·校2·院1；见义勇为、舍己救人、拾金不昧等受表彰同标准；做好事受表扬、为校争光每项 +1 可累加。累计超 5 按 5 计。', { cta: 'reward' }));
    }

    /* ---------- ℹ️ 规则陷阱提示 ---------- */
    if ((res.merged || []).length) {
      out.push(mk('info', `${res.merged.length} 处触发"取最高/不累加"规则`,
        res.merged.map(m => `${m.cat}「${m.name}」少计 ${m.dropped} 分（${m.reason}）`).join('；') + '。录入时不必重复提交同一项目的多个奖项。', { cta: 'ability' }));
    }
    const shortTerm = res.ability.subs.position.items.filter(i => i._months !== null && i._months < 12 && !i._ongoing);
    if (shortTerm.length) {
      const b = shortTerm[0];
      out.push(mk('warn', `任职任期不满一年，只能拿酌情分`,
        `「${b.org || ''} ${b.role || '任职'}」任期仅 ${b._months} 个月，按当前口径系数 ${fmt(b._factor)}，得 ${fmt(b._pts)} 分（满一年可得 ${fmt(b._full)} 分）。⚑ 官方原文是"不满一年根据工作时间酌情加分，最高不得超过任期满一年的加分"——不是零分，但性价比明显下降。不同书院的酌情幅度可能不同，请在设置中切换口径。`, { cta: 'ability' }));
    }
    const ongoing = res.ability.subs.position.items.filter(i => i._ongoing && i._months !== null && i._months < 12);
    if (ongoing.length) {
      const b = ongoing[0];
      out.push(mk('info', `任职在职中（至今 ${b._months} 个月），已按"预计满一年"计分`,
        `「${b.org || ''} ${b.role || ''}」当前计 ${fmt(b._pts)} 分。<b>若中途退任</b>，按现行酌情口径只能拿 ${fmt(b._ifQuitNow)} 分——差价 ${fmt(ZC.r2(b._pts - b._ifQuitNow))} 分。坚持做满一年是收益最大化的路径（兼任多项只取最高，不累加）。`, { cta: 'ability' }));
    }
    if (posItems.length > 1) {
      out.push(mk('info', `兼任 ${posItems.length} 项职务，只取最高分`,
        '按规则兼任多项职务不累加。与其挂名多个部门，不如专注一个并做满一年、争取"优秀"考核。', { cta: 'ability' }));
    }

    /* ---------- 目标与差距 ---------- */
    const target = +p.target.score || 0;
    if (target > 0) {
      const gap = r2(target - res.total);
      if (gap > 0) {
        const plan = ZC.recommend(p, R, res, gap).slice(0, 4);
        out.push(mk('warn', `距离目标 ${fmt(target)} 分还差 ${fmt(gap)} 分`,
          plan.length ? '按投入产出比推荐的路径：' + plan.map((x, i) => `${i + 1}. ${x.label}（+${fmt(x.gain)}，投入${ZC.EFFORT_LABEL[x.effort]}）`).join('；')
            : '现有规则内的可拿分已基本拿满，可考虑在设置中调整各项上限或核对书院细则。', { cta: 'simulate' }));
      } else {
        out.push(mk('good', `已达成目标（超出 ${fmt(-gap)} 分）`, `当前 ${fmt(res.total)} 分，理论上限还有 ${fmt(H.total)} 分空间。`, { cta: 'dashboard' }));
      }
    }

    /* ---------- 综合成绩敏感度 ---------- */
    const sens = res.composite.sensitivity;
    if (sens > 0) {
      out.push(mk('info', `综测每 +1 分 → 「${res.composite.preset.name}」综合成绩 +${fmt(sens)} 分`,
        `当前口径：${res.composite.preset.desc}。综测在${res.composite.presetId === 'scholarship' ? '奖学金评定中占 20%，是拉开差距的关键变量' : '该口径中占 ' + fmt(sens * 100) + '%'}。` +
        (res.composite.incomplete ? ' ⚠️ 部分成绩尚未填写，综合成绩为估算值。' : ''), { cta: 'composite' }));
    }

    /* ---------- 满分空间总览 ---------- */
    if (H.total > 0 && res.total > 0) {
      out.push(mk('info', `理论上限还有 ${fmt(H.total)} 分未拿到`,
        `品行加分项剩 ${fmt(H.pinxingAdd)} 分（集体 ${fmt(H.collective)} / 思政 ${fmt(H.ideology)} / 社会服务 ${fmt(H.service)}），能力拓展剩 ${fmt(H.ability)} 分（学术 ${fmt(H.academic)} / 文体 ${fmt(H.culture)} / 任职 ${fmt(H.position)}），奖励分剩 ${fmt(H.reward)} 分。`, { cta: 'simulate' }));
    }

    /* ---------- 心理测评区分 ---------- */
    out.push(mk('info', '别搞混：推免/复试的"综合素质测试"≠ 综测加分',
      '推免生及部分研究生复试环节的"综合素质测试"实质是心理测评，了解的是稳定态度与习惯化反应模式，答案无对错（yzxlcs.xjtu.edu.cn/psytest）。综测加分依据的是学年学业与表现材料，两者互不相通、不需在本工具中处理。', { tag: '常识', cta: 'rulebook' }));

    const order = { danger: 0, warn: 1, good: 2, info: 3 };
    out.sort((a, b) => (order[a.level] - order[b.level]));
    return out;
  };

  function collectAllItems(res, p) {
    const arr = [];
    const push = (list, cat) => (list || []).forEach(i => arr.push({ label: i.project || i.name || i.org || i.label || cat, points: i._pts || i.points || 0, status: i.status || i._status, cat }));
    push(res.ability.subs.academic.items, '学术成果');
    push(res.ability.subs.culture.items, '文体竞赛');
    push(res.ability.subs.position.items, '任职');
    push(res.reward.items, '奖励分');
    res.pinxing.subs.collective.items.forEach(i => arr.push({ label: i.label, points: i.points || 0, status: i.status, cat: '集体活动' }));
    const vh = +((p.pinxing.service || {}).volunteerHours) || 0;
    if (vh > 0) {
      const got = (res.pinxing.subs.service.items.find(x => String(x.label).indexOf('志愿服务') === 0) || {}).points || 0;
      arr.push({ label: `志愿服务 ${ZC.fmt(vh)} 小时`, points: got, status: (p.pinxing.service.volunteerStatus || 'todo'), cat: '社会服务' });
    }
    (p.pinxing.deductions || []).forEach(i => arr.push({ label: i.label || '扣分', points: 0, status: i.status, cat: '扣分' }));
    return arr;
  }
  ZC.collectAllItems = collectAllItems;

  /* ============================================== ROI 推荐引擎 */
  ZC.recommend = function (profile, R, res, gap) {
    const H = res.headroom;
    const capLeft = {
      collective: H.collective, ideology: H.ideology, service: H.service,
      academic: Math.min(H.academic, H.ability), culture: Math.min(H.culture, H.ability),
      position: Math.min(H.position, H.ability), reward: H.reward
    };
    const list = [];
    ZC.OPPORTUNITIES.forEach(o => {
      let gain = 0, note = '';
      if (o.dyn && o.id === 'vol') {
        const lack = Math.max(0, (parseFloat(R.pinxing.service.volunteerHours) || 0) - (+profile.pinxing.service.volunteerHours || 0));
        if (lack <= 0) return;
        const req = parseFloat(R.pinxing.service.volunteerHours) || 0;
        if (req <= 0) return;
        gain = Math.min(capLeft.service, r2((parseFloat(R.pinxing.service.volunteerPoint) || 0) * lack / req));
        note = `还需 ${fmt(lack)} 小时`;
      } else if (o.dyn && o.id === 'collect') {
        const per = parseFloat(R.pinxing.collective.perTime) || 0;
        if (capLeft.collective <= 0 || per <= 0) return;
        const need = Math.ceil(capLeft.collective / per);
        gain = Math.min(capLeft.collective, r2(per * need));
        note = `约 ${need} 次 × ${fmt(per)} 分`;
      } else {
        gain = Math.min(capLeft[o.cap] || 0, o.points || 0);
      }
      if (gain <= 0.001) return;
      const hours = ZC.EFFORT_HOURS[o.effort] || 30;
      list.push({ id: o.id, label: o.label, gain: r2(gain), effort: o.effort, hours, roi: r2(gain / hours * 100) / 100, cap: o.cap, note });
    });
    list.sort((a, b) => b.roi - a.roi || b.gain - a.gain);

    // 贪心组合，凑够 gap
    if (gap) {
      let acc = 0; const plan = [];
      list.forEach(x => { if (acc < gap - 1e-9) { plan.push(x); acc = r2(acc + x.gain); } });
      return plan;
    }
    return list;
  };

  const r1 = (n) => Math.round(n * 10) / 10;
  const r2 = ZC.r2;
})();

</script>
<script>
/* ===== 内联自 js/store.js ===== */
/* =========================================================================
 * store.js —— 状态管理 / 本地持久化 / 档案 / 撤销 / 导入导出 / 日期工具
 * 无后端：全部数据保存在浏览器 localStorage，可导出 JSON 备份与迁移。
 * ========================================================================= */
(function () {
  const ZC = window.ZC;
  const KEY = 'xjtu_zongce_v3';

  /* 存储层：localStorage 优先，被禁用时（如受限的沙箱预览窗口）降级为内存存储 */
  const mem = {};
  let lsOK = true;
  try { localStorage.setItem(KEY + '__probe', '1'); localStorage.removeItem(KEY + '__probe'); }
  catch (e) { lsOK = false; }
  ZC.storageOK = lsOK;
  const disk = {
    get(k) { try { const v = localStorage.getItem(k); return v === null ? (mem[k] === undefined ? null : mem[k]) : v; } catch (e) { return mem[k] === undefined ? null : mem[k]; } },
    set(k, v) { mem[k] = v; if (!lsOK) return false; try { localStorage.setItem(k, v); return true; } catch (e) { lsOK = false; ZC.storageOK = false; return false; } }
  };

  const state = {
    ready: false,
    version: 3,
    profiles: [],
    activeId: null,
    globalRules: {},          // 用户在设置里改过的校级默认值
    ui: { view: 'dashboard', theme: 'light', sidebarOpen: false, tipsFilter: 'all', expanded: {} },
    lastSaved: null,
    dirty: false
  };
  ZC.state = state;

  /* -------------------------------------------------- 档案读写 */
  /** 取当前正在编辑的档案：模拟模式下返回草稿 */
  ZC.getProfile = () => (state.simMode && state.simDraft) ? state.simDraft
    : (state.profiles.find(p => p.id === state.activeId) || state.profiles[0]);
  /** 取正式档案（模拟模式下用于对比基准） */
  ZC.getRealProfile = () => state.profiles.find(p => p.id === state.activeId) || state.profiles[0];
  ZC.getRules = function (profile) {
    const p = profile || ZC.getProfile();
    return ZC.mergeRules(ZC.mergeRules(ZC.DEFAULT_RULES, state.globalRules), p ? p.ruleOverride : null);
  };

  /** 用空白档案作为模板，递归补全缺失字段（数组整体替换，不做元素级合并） */
  function deepFill(base, over) {
    Object.keys(base).forEach(k => {
      const ov = over ? over[k] : undefined;
      if (ov === undefined) return;
      const bv = base[k];
      if (bv && typeof bv === 'object' && !Array.isArray(bv) && ov && typeof ov === 'object' && !Array.isArray(ov)) deepFill(bv, ov);
      else base[k] = ov;
    });
    Object.keys(over || {}).forEach(k => { if (!(k in base)) base[k] = over[k]; });   // 保留自定义扩展键
    return base;
  }
  function fillProfile(p) {
    const out = deepFill(ZC.blankProfile('x', 'y', 'z'), p || {});
    out.id = (p && p.id) || ZC.uid();
    out.createdAt = (p && p.createdAt) || Date.now();
    out.updatedAt = (p && p.updatedAt) || out.createdAt;
    return out;
  }

  function migrate(raw) {
    if (!raw || typeof raw !== 'object') return null;
    (raw.profiles || []).forEach((p, i) => { raw.profiles[i] = fillProfile(p); });
    return raw;
  }

  ZC.load = function () {
    let raw = null;
    try { raw = JSON.parse(disk.get(KEY) || 'null'); } catch (e) { console.warn('读取本地数据失败', e); }
    raw = migrate(raw);
    if (raw && raw.profiles && raw.profiles.length) {
      state.profiles = raw.profiles;
      state.activeId = raw.activeId && raw.profiles.some(p => p.id === raw.activeId) ? raw.activeId : raw.profiles[0].id;
      state.globalRules = raw.globalRules || {};
      state.simMode = !!raw.simMode;
      state.simDraft = raw.simDraft || null;
      if (state.simMode && !state.simDraft) state.simMode = false;
      state.ui = Object.assign(state.ui, raw.ui || {});
    } else {
      const demo = ZC.buildDemoProfile();
      state.profiles = [demo];
      state.activeId = demo.id;
      state.globalRules = {};
      state.firstRun = true;          // 首次打开 → 展示引导
    }
    state.version = 3;
    state.ready = true;
    applyTheme();
    return state;
  };

  const payload = () => JSON.stringify({
    version: state.version, profiles: state.profiles, activeId: state.activeId,
    globalRules: state.globalRules, simMode: state.simMode, simDraft: state.simDraft,
    ui: { view: state.ui.view, theme: state.ui.theme, tipsFilter: state.ui.tipsFilter }
  });

  /** 立即同步落盘（关闭页面前 / 测试用） */
  /** 立即落盘；返回 'disk' | 'memory' | false */
  ZC.flushSave = function () {
    try {
      const ok = disk.set(KEY, payload());
      state.dirty = false; state.lastSaved = new Date();
      return ok ? 'disk' : 'memory';
    } catch (e) { return false; }
  };

  let saveTimer = null;
  ZC.save = function (silent) {
    const p = ZC.getProfile(); if (p) p.updatedAt = Date.now();
    state.dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      const r = ZC.flushSave();
      if (r === false) { ZC.ui && ZC.ui.toast('保存失败：浏览器存储空间不足，请立即导出 JSON 备份', 'danger', 8000); return; }
      if (!silent && ZC.ui) ZC.ui.flashSaved(r === 'memory');
    }, 220);
  };

  /* -------------------------------------------------- 撤销栈 */
  const undoStack = [];
  ZC.snapshot = function (label) {
    undoStack.push({ label: label || '修改', data: JSON.stringify({ profiles: state.profiles, activeId: state.activeId, globalRules: state.globalRules }) });
    if (undoStack.length > 40) undoStack.shift();
  };
  ZC.undo = function () {
    const s = undoStack.pop();
    if (!s) { ZC.ui.toast('没有可撤销的操作', 'muted'); return false; }
    const d = JSON.parse(s.data);
    state.profiles = d.profiles; state.activeId = d.activeId; state.globalRules = d.globalRules;
    ZC.save(true); ZC.ui.toast(`已撤销：${s.label}`, 'ok');
    return true;
  };
  ZC.canUndo = () => undoStack.length > 0;

  /* -------------------------------------------------- 档案 CRUD */
  ZC.addProfile = function (name, college, year, copyFrom) {
    ZC.snapshot('新建档案');
    let p;
    if (copyFrom) { p = ZC.clone(copyFrom); p.id = ZC.uid(); p.createdAt = Date.now(); p.meta.name = name || (copyFrom.meta.name + ' 副本'); p.meta.academicYear = year || copyFrom.meta.academicYear; if (college) p.meta.college = college; }
    else p = ZC.blankProfile(name, college, year);
    state.profiles.push(p); state.activeId = p.id; ZC.save(true);
    return p;
  };
  ZC.deleteProfile = function (id) {
    if (state.profiles.length <= 1) { ZC.ui.toast('至少保留一个档案', 'warn'); return; }
    ZC.snapshot('删除档案');
    const i = state.profiles.findIndex(p => p.id === id);
    if (i < 0) return;
    const nm = state.profiles[i].meta.name;
    state.profiles.splice(i, 1);
    if (state.activeId === id) state.activeId = state.profiles[Math.max(0, i - 1)].id;
    ZC.save(true); ZC.ui.toast(`已删除档案「${nm}」，可撤销`, 'ok', 5000);
  };
  ZC.switchProfile = (id) => { state.activeId = id; ZC.save(true); };

  /* -------------------------------------------------- 路径读写 */
  ZC.getPath = function (obj, path) {
    return path.replace(/\[(\d+)\]/g, '.$1').split('.').reduce((o, k) => (o == null ? o : o[k]), obj);
  };
  ZC.setPath = function (obj, path, val) {
    const keys = path.replace(/\[(\d+)\]/g, '.$1').split('.');
    let cur = obj;
    for (let i = 0; i < keys.length - 1; i++) {
      if (cur[keys[i]] == null) cur[keys[i]] = /^\d+$/.test(keys[i + 1]) ? [] : {};
      cur = cur[keys[i]];
    }
    cur[keys[keys.length - 1]] = val;
  };

  /* -------------------------------------------------- 主题 */
  function applyTheme() {
    document.documentElement.setAttribute('data-theme', state.ui.theme || 'light');
  }
  ZC.toggleTheme = function () {
    state.ui.theme = state.ui.theme === 'dark' ? 'light' : 'dark';
    applyTheme(); ZC.save(true);
  };

  /* -------------------------------------------------- 导入 / 导出 */
  ZC.exportJSON = function () {
    const data = { app: 'XJTU 综测算分器', version: state.version, exportedAt: new Date().toISOString(), profiles: state.profiles, globalRules: state.globalRules };
    ZC.download(`综测数据_${ZC.getProfile().meta.name}_${ZC.today()}.json`, JSON.stringify(data, null, 2), 'application/json');
    ZC.ui.toast('已导出 JSON 备份', 'ok');
  };
  ZC.importJSON = function (text) {
    try {
      const d = JSON.parse(text);
      const incoming = migrate(d);
      if (!incoming || !incoming.profiles || !incoming.profiles.length) throw new Error('文件格式不正确');
      ZC.snapshot('导入数据');
      incoming.profiles.forEach(p => { p.id = ZC.uid(); state.profiles.push(p); });
      state.activeId = state.profiles[state.profiles.length - 1].id;
      if (d.globalRules) state.globalRules = d.globalRules;
      ZC.save(true);
      ZC.ui.toast(`已导入 ${incoming.profiles.length} 个档案`, 'ok');
      return true;
    } catch (e) { ZC.ui.toast('导入失败：' + e.message, 'danger', 5000); return false; }
  };
  ZC.download = function (filename, text, mime) {
    const blob = new Blob([text], { type: (mime || 'text/plain') + ';charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 400);
  };
  ZC.today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };

  /* -------------------------------------------------- 工作日 / 申诉时效 */
  ZC.addWorkdays = function (dateStr, n) {
    const d = new Date(dateStr + 'T00:00:00');
    if (isNaN(d)) return null;
    let added = 0;
    while (added < n) { d.setDate(d.getDate() + 1); const w = d.getDay(); if (w !== 0 && w !== 6) added++; }
    return d;
  };
  ZC.dateStr = (d) => d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` : '—';
  ZC.appealTimeline = function (publicityDate, R) {
    const P = (R || ZC.DEFAULT_RULES).procedure;
    const objection = ZC.addWorkdays(publicityDate, P.publicityDays);
    const reply = objection ? ZC.addWorkdays(ZC.dateStr(objection), P.replyDays) : null;
    const appeal = reply ? ZC.addWorkdays(ZC.dateStr(reply), P.appealDays) : null;
    const final = appeal ? ZC.addWorkdays(ZC.dateStr(appeal), P.finalDays) : null;
    return { objection, reply, appeal, final };
  };

  /* -------------------------------------------------- 导出文本：学年总结/材料清单 */
  ZC.buildMarkdownReport = function (profile, R, res) {
    const p = profile;
    const L = [];
    L.push(`# 综合素质测评自评表（${p.meta.academicYear} 学年）`);
    L.push('');
    L.push(`- 姓名：${p.meta.name}　学号：${p.meta.studentId || '—'}`);
    L.push(`- 书院：${p.meta.college}　专业：${p.meta.major || '—'}　班级：${p.meta.grade || '—'}`);
    L.push(`- 生成时间：${new Date().toLocaleString('zh-CN')}`);
    L.push('');
    L.push(`## 总分：**${ZC.fmt(res.total)}** / ${res.maxTotal}`);
    L.push('');
    L.push('| 构成 | 得分 | 满分 |');
    L.push('|---|---|---|');
    L.push(`| 品行素质分 | ${ZC.fmt(res.pinxing.final)} | ${R.frame.pinxing} |`);
    L.push(`| 能力拓展分 | ${ZC.fmt(res.ability.final)} | ${R.frame.ability} |`);
    L.push(`| 奖励分 | ${ZC.fmt(res.reward.final)} | ${R.reward.cap} |`);
    L.push('');
    const sec = (title, rows) => {
      if (!rows.length) return;
      L.push(`### ${title}`); L.push('| 项目 | 分值 | 佐证材料 | 状态 |'); L.push('|---|---|---|---|');
      rows.forEach(r => L.push(`| ${r[0]} | ${r[1]} | ${r[2] || '—'} | ${r[3] || '—'} |`));
      L.push('');
    };
    const st = (id) => ((ZC.EVIDENCE_STATUS.find(s => s.id === id) || {}).label) || '未准备';
    sec('一、品行素质分 · 集体活动', res.pinxing.subs.collective.items.map(i => [i.label + (i.note ? `（${i.note}）` : ''), ZC.fmt(i.points), '', st(i.status)]));
    if (p.meta.assessPass) L.push(`> 基准分：${ZC.fmt(res.pinxing.base)} 分（班级评议合格 + 书院审定通过）\n`);
    sec('一、品行素质分 · 思想政治理论学习', res.pinxing.subs.ideology.items.map(i => [i.label + (i.note ? `（${i.note}）` : ''), ZC.fmt(i.points), '', '']));
    sec('一、品行素质分 · 社会服务', res.pinxing.subs.service.items.map(i => [i.label + (i.note ? `（${i.note}）` : ''), ZC.fmt(i.points), '', '']));
    sec('一、品行素质分 · 扣分', res.pinxing.deductions.map(i => [i.label, '−' + ZC.fmt(i.points), i.note, '']));
    sec('二、能力拓展分 · 学术科研及创新创业', res.ability.subs.academic.items.map(i => [
      `${i.project || i.name || '未命名'}${i._merged && !i._counted ? '（同一项目取最高，未计入）' : ''}`,
      i._counted ? ZC.fmt(i._pts) : '0', i.evidence || '', st(i.status)]));
    sec('二、能力拓展分 · 文体竞赛', res.ability.subs.culture.items.map(i => [
      `${i.name || i.project || '未命名'}${i._merged && !i._counted ? '（同一项目取最高，未计入）' : ''}`,
      i._counted ? ZC.fmt(i._pts) : '0', i.evidence || '', st(i.status)]));
    sec('二、能力拓展分 · 学生组织、社团任职', res.ability.subs.position.items.map(i => [
      `${i.org || ''} ${i.role || ''}（${i._reason}）${i._counted ? '' : '（兼任取最高，未计入）'}`,
      i._counted ? ZC.fmt(i._pts) : '0', i.evidence || '', st(i.status)]));
    sec('三、奖励分', res.reward.items.map(i => [i.name || i._reason, ZC.fmt(i._pts), i.evidence || '', st(i.status)]));
    L.push('## 计算过程');
    L.push('```');
    res.trace.forEach(t => L.push(`${'　'.repeat(t.indent)}${t.label}${t.value !== undefined ? '　' + t.value : ''}${t.note ? '　// ' + t.note : ''}`));
    L.push('```');
    if (res.composite && !res.composite.incomplete) {
      L.push(''); L.push(`## 综合成绩（${res.composite.preset.name}）`);
      L.push(''); L.push(`**${ZC.fmt(res.composite.total)}**　＝　${res.composite.parts.map(x => `${x.label} ${ZC.fmt(x.value)}×${Math.round(x.weight * 100)}%`).join('　+　')}`);
    }
    L.push('');
    L.push('---');
    L.push('> 本表由「综测算分器」依据《西安交通大学本科生综合素质测评成绩评定办法》（2018年5月印发）及其实施细则自动生成，仅供自评与材料准备参考。');
    L.push('> 集体活动单次分值、任职不满一年的酌情幅度等由各书（学）院自行认定，最终以你所在书院当年公示的细则和班级评议结果为准。');
    return L.join('\n');
  };

  ZC.buildCSV = function (profile, R, res) {
    const rows = [['大类', '子类', '项目', '计入分值', '原始分值', '计算依据', '佐证材料', '材料状态', '日期']];
    const st = (id) => ((ZC.EVIDENCE_STATUS.find(s => s.id === id) || {}).label) || '未准备';
    rows.push(['品行素质分', '基准分', '班级评议合格 + 书院审定通过', ZC.fmt(res.pinxing.base), '', '', '', '', '']);
    const sub = (cat, name, o, getLabel) => (o.items || []).forEach(i => rows.push([cat, name, getLabel(i), i._counted === false ? '0' : ZC.fmt(i._pts !== undefined ? i._pts : i.points), ZC.fmt(i._pts !== undefined ? i._pts : i.points), i._reason || i.note || '', i.evidence || '', st(i.status || i._status), i.date || '']));
    sub('品行素质分', '集体活动', res.pinxing.subs.collective, i => i.label);
    sub('品行素质分', '思想政治理论学习', res.pinxing.subs.ideology, i => i.label);
    sub('品行素质分', '社会服务', res.pinxing.subs.service, i => i.label);
    res.pinxing.deductions.forEach(i => rows.push(['品行素质分', '扣分', i.label, '−' + ZC.fmt(i.points), '', i.note, '', st(i.status), i.date]));
    sub('能力拓展分', '学术科研及创新创业', res.ability.subs.academic, i => i.project || i.name || '');
    sub('能力拓展分', '文体竞赛', res.ability.subs.culture, i => i.name || i.project || '');
    sub('能力拓展分', '学生组织任职', res.ability.subs.position, i => `${i.org || ''} ${i.role || ''}`);
    sub('奖励分', '荣誉表彰', res.reward, i => i.name || i._reason);
    rows.push([]); rows.push(['合计', '', '综合素质测评成绩', ZC.fmt(res.total), '', `满分 ${res.maxTotal}`, '', '', '']);
    return '\uFEFF' + rows.map(r => r.map(c => `"${String(c == null ? '' : c).replace(/"/g, '""')}"`).join(',')).join('\r\n');
  };

  /* -------------------------------------------------- 示例档案（首次打开） */
  ZC.buildDemoProfile = function () {
    const p = ZC.blankProfile('示例同学（可删除）', '彭康书院', ZC.currentAcademicYear());
    p.meta.major = '计算机科学与技术'; p.meta.grade = '计算机0001班'; p.meta.studentId = '42xxxxxx01';
    p.pinxing.collective.entries = [
      { id: ZC.uid(), name: '书院迎新晚会', times: 1, date: '', status: 'approved', evidence: '主办单位名单' },
      { id: ZC.uid(), name: '校庆志愿服务方阵', times: 1, date: '', status: 'submitted', evidence: '活动证明' },
      { id: ZC.uid(), name: '书院体育节', times: 2, date: '', status: 'todo', evidence: '' }
    ];
    p.pinxing.ideology = { orgTraining: 2, provincialTraining: 0, excellentTrainee: 1 };
    p.pinxing.service = { volunteerHours: 21, schoolPractice: 1, cityIntern: 0, provIntern: 0, advanced: 0 };
    p.pinxing.deductions = [{ id: ZC.uid(), type: 'weisheng', count: 1, date: '', note: '10 月宿舍卫生检查', status: 'submitted' }];
    p.ability.academic = [
      { id: ZC.uid(), kind: 'competition', project: '"互联网+"大学生创新创业大赛', level: 'prov', award: '二等奖', date: '', status: 'approved', evidence: '获奖证书扫描件', noMerge: false },
      { id: ZC.uid(), kind: 'competition', project: '全国大学生数学建模竞赛', level: 'intl_nat', award: '二等奖', date: '', status: 'approved', evidence: '获奖证书', noMerge: false },
      { id: ZC.uid(), kind: 'patent', project: '一种基于深度学习的排课方法', name: '实用新型专利', patentType: '实用新型专利', rank: 1, signUnit: '西安交通大学', date: '', status: 'submitted', evidence: '专利证书', noMerge: true }
    ];
    p.ability.culture = [
      { id: ZC.uid(), kind: 'art', name: '书院合唱比赛', level: 'school', award: '二等奖', record: false, date: '', status: 'approved', evidence: '获奖证书' }
    ];
    p.ability.position = [
      { id: ZC.uid(), org: '彭康书院学生会', role: '宣传部部长', tier: 't3', assessment: '良好', startDate: ZC.today().slice(0, 4) + '-09-01', endDate: '', status: 'approved', evidence: '任职文件' }
    ];
    p.reward.items = [{ id: ZC.uid(), category: 'honor', level: 'college', name: '院级三好学生', date: '', status: 'approved', evidence: '表彰文件' }];
    p.coursework.score = '86.4';
    p.target.score = '92';
    p.meta.publicityDate = ZC.today();
    p.notes = '这是首次打开时自动生成的示例档案，用来演示各项录入与计分逻辑。点击「设置 → 数据管理 → 清空为全新档案」即可开始记录你自己的数据。';
    return p;
  };
})();

</script>
<script>
/* ===== 内联自 js/ui.js ===== */
/* =========================================================================
 * ui.js —— 通用 UI 工具：图标 / 表单控件 / Toast / Modal / 进度条 / 格式化
 * ========================================================================= */
(function () {
  const ZC = window.ZC;
  ZC.ui = {};

  /* ------------------------------------------------------- HTML 转义 */
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  ZC.esc = esc; ZC.ui.esc = esc;

  /* ------------------------------------------------------------- 图标 */
  const P = {
    dashboard: '<rect x="3" y="3" width="7.5" height="8.5" rx="1.6"/><rect x="13.5" y="3" width="7.5" height="5" rx="1.6"/><rect x="13.5" y="11" width="7.5" height="10" rx="1.6"/><rect x="3" y="14.5" width="7.5" height="6.5" rx="1.6"/>',

    flask: '<path d="M9.5 3v6.2L4.7 17.4A2 2 0 006.4 20.5h11.2a2 2 0 001.7-3.1L14.5 9.2V3"/><path d="M8.5 3h7"/><path d="M7.3 14.5h9.4"/>',
    users: '<circle cx="9" cy="8" r="3.4"/><path d="M2.8 20c.4-3.4 3.1-5.6 6.2-5.6s5.8 2.2 6.2 5.6"/><path d="M16.5 5.2a3.4 3.4 0 010 6.4"/><path d="M18 14.8c2.1.6 3.5 2.5 3.7 5.2"/>',
    clock: '<circle cx="12" cy="12" r="8.6"/><path d="M12 7v5.3l3.3 2"/>',
    book: '<path d="M4 5.2A2.2 2.2 0 016.2 3H19v15H6.2A2.2 2.2 0 004 20.2z"/><path d="M4 18.2A2.2 2.2 0 016.2 16H19v5H6.2A2.2 2.2 0 014 18.8z"/>',
    gear: '<circle cx="12" cy="12" r="3.1"/><path d="M19.4 14.5a1.6 1.6 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.6 1.6 0 00-2.7 1.1v.2a2 2 0 11-4 0v-.1a1.6 1.6 0 00-2.8-1.1l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.6 1.6 0 00-1.1-2.7h-.2a2 2 0 110-4h.1a1.6 1.6 0 001.1-2.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.6 1.6 0 002.7-1.1v-.2a2 2 0 114 0v.1a1.6 1.6 0 002.8 1.1l.1-.1a2 2 0 112.8 2.8l-.1.1a1.6 1.6 0 001.1 2.7h.2a2 2 0 110 4h-.1a1.6 1.6 0 00-1.5 1z"/>',
    plus: '<path d="M12 5v14M5 12h14"/>',
    trash: '<path d="M4 7h16"/><path d="M9.5 7V5.2A1.2 1.2 0 0110.7 4h2.6a1.2 1.2 0 011.2 1.2V7"/><path d="M6.5 7l.8 12.1A1.6 1.6 0 008.9 20.6h6.2a1.6 1.6 0 001.6-1.5L17.5 7"/><path d="M10.3 11v6M13.7 11v6"/>',
    copy: '<rect x="9" y="9" width="11.5" height="11.5" rx="2"/><path d="M5.5 15H4.8A1.8 1.8 0 013 13.2V4.8A1.8 1.8 0 014.8 3h8.4A1.8 1.8 0 0115 4.8v.7"/>',
    check: '<path d="M4.5 12.5l5 5 10-11"/>',
    x: '<path d="M6 6l12 12M18 6L6 18"/>',
    down: '<path d="M6 9.5l6 6 6-6"/>',
    right: '<path d="M9.5 6l6 6-6 6"/>',
    download: '<path d="M12 3.5v12"/><path d="M7.5 11l4.5 4.5 4.5-4.5"/><path d="M4 20h16"/>',
    upload: '<path d="M12 16.5v-12"/><path d="M7.5 9L12 4.5 16.5 9"/><path d="M4 20h16"/>',
    print: '<path d="M7 9V4h10v5"/><rect x="4" y="9" width="16" height="7" rx="1.8"/><path d="M7 14h10v6H7z"/>',
    undo: '<path d="M4 9h10.5a5 5 0 010 10H8"/><path d="M7.5 5.5L4 9l3.5 3.5"/>',
    sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.2 5.2l1.4 1.4M17.4 17.4l1.4 1.4M18.8 5.2l-1.4 1.4M6.6 17.4l-1.4 1.4"/>',
    moon: '<path d="M20 14.5A8.5 8.5 0 019.5 4a8.5 8.5 0 1010.5 10.5z"/>',

    alert: '<path d="M12 3.5l9.5 16.5H2.5z"/><path d="M12 9.5v4.5M12 17h.01"/>',
    info: '<circle cx="12" cy="12" r="8.6"/><path d="M12 11v5.5M12 7.8h.01"/>',
    bulb: '<path d="M9 17.5h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 00-3.6 10.8c.5.4.8 1 .9 1.7h5.4c.1-.7.4-1.3.9-1.7A6 6 0 0012 3z"/>',
    target: '<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1"/>',
    trend: '<path d="M3.5 16.5l5.5-6 4 4 7.5-8"/><path d="M15 6.5h5.5V12"/>',
    calc: '<rect x="4.5" y="2.8" width="15" height="18.4" rx="2.2"/><path d="M8 7h8"/><path d="M8.5 11.5h.01M12 11.5h.01M15.5 11.5h.01M8.5 15h.01M12 15h.01M15.5 15h.01M8.5 18.2h.01M12 18.2h.01M15.5 18.2h.01"/>',
    list: '<path d="M8.5 6.5h12M8.5 12h12M8.5 17.5h12M3.8 6.5h.01M3.8 12h.01M3.8 17.5h.01"/>',
    pin: '<path d="M12 21s7-6.1 7-11a7 7 0 10-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.6"/>',
    user: '<circle cx="12" cy="8" r="3.8"/><path d="M4.8 20.2c.5-3.8 3.6-6.2 7.2-6.2s6.7 2.4 7.2 6.2"/>',
    star: '<path d="M12 3.6l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.8l5.9-.8z"/>',

  ZC.ui.icon = function (name, size) {
    const s = size || 18;
    return `<svg class="ic" width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[name] || P.info}</svg>`;
  };

  /* ------------------------------------------------------------ Toast */
  ZC.ui.toast = function (msg, type, ms) {
    const root = document.getElementById('toast-root'); if (!root) return;
    const el = document.createElement('div');
    el.className = 'toast toast--' + (type || 'ok');
    const ic = type === 'danger' ? 'alert' : type === 'warn' ? 'alert' : type === 'muted' ? 'info' : 'check';
    el.innerHTML = ZC.ui.icon(ic, 16) + '<span>' + esc(msg) + '</span>';
    root.appendChild(el);
    requestAnimationFrame(() => el.classList.add('in'));
    setTimeout(() => { el.classList.remove('in'); setTimeout(() => el.remove(), 260); }, ms || 2600);
  };
  ZC.ui.flashSaved = function (memoryOnly) {
    const el = document.getElementById('save-state');
    if (!el) return;
    const t = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
    el.textContent = memoryOnly ? ('已保存（仅本次会话）' + t) : ('已保存 ' + t);
    el.classList.toggle('is-mem', !!memoryOnly);
    el.classList.remove('pulse'); void el.offsetWidth; el.classList.add('pulse');
  };

  /* ------------------------------------------------------------ Modal */
  ZC.ui.modal = function (opt) {
    const root = document.getElementById('modal-root');
    root.innerHTML = `<div class="mask" data-close="1"><div class="modal ${opt.wide ? 'modal--wide' : ''}" role="dialog" aria-modal="true">
      <div class="modal__hd"><h3>${esc(opt.title || '')}</h3><button class="ibtn" data-close="1" aria-label="关闭">${ZC.ui.icon('x', 18)}</button></div>
      <div class="modal__bd">${opt.body || ''}</div>
      ${opt.actions ? `<div class="modal__ft">${opt.actions}</div>` : ''}
    </div></div>`;
    root.classList.add('on');
    const close = () => { root.classList.remove('on'); root.innerHTML = ''; document.removeEventListener('keydown', onKey); ZC.ui._closeModal = null; };
    ZC.ui._closeModal = close;
    const onKey = (e) => { if (e.key === 'Escape') close(); };
    document.addEventListener('keydown', onKey);
    root.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', (e) => { if (e.target.closest('.modal') && !e.target.closest('[data-close]')) return; close(); }));
    const okBtn = root.querySelector('[data-ok]');
    if (okBtn) okBtn.addEventListener('click', () => { if (opt.onOk) { if (opt.onOk(root) === false) return; } close(); });
    if (opt.onOpen) opt.onOpen(root, close);
    return { close, root };
  };
  ZC.ui.closeModal = function () { if (ZC.ui._closeModal) ZC.ui._closeModal(); };

  ZC.ui.confirm = function (title, msg, onOk, okLabel) {
    ZC.ui.modal({
      title, body: `<p class="muted" style="margin:0;line-height:1.7">${msg}</p>`,
      actions: `<button class="btn" data-close="1">取消</button><button class="btn btn--danger" data-ok="1">${esc(okLabel || '确定')}</button>`,
      onOk
    });
  };

  /* --------------------------------------------------------- 表单控件 */
  const uidK = (k) => ` data-k="${esc(k)}"`;
  ZC.ui.txt = (k, v, opt) => `<input class="inp" type="text"${uidK(k)} value="${esc(v == null ? '' : v)}" placeholder="${esc((opt || {}).ph || '')}" ${(opt || {}).attr || ''}>`;
  ZC.ui.num = (k, v, opt) => {
    const o = opt || {};
    return `<input class="inp ${o.cls || ''}" type="number" inputmode="decimal"${uidK(k)} data-t="num" value="${v == null || v === '' ? '' : esc(v)}" placeholder="${esc(o.ph || '')}" ${o.min !== undefined ? `min="${o.min}"` : ''} ${o.max !== undefined ? `max="${o.max}"` : ''} ${o.step ? `step="${o.step}"` : 'step="any"'} style="${o.width ? 'width:' + o.width : ''}">`;
  };
  ZC.ui.date = (k, v) => `<input class="inp" type="date"${uidK(k)} value="${esc(v || '')}">`;
  ZC.ui.sel = (k, v, options, opt) => {
    const o = opt || {};
    return `<select class="inp"${uidK(k)} ${o.t ? `data-t="${o.t}"` : ''} style="${o.width ? 'width:' + o.width : ''}">
      ${o.ph ? `<option value="">${esc(o.ph)}</option>` : ''}
      ${options.map(x => {
        const val = typeof x === 'object' ? x.id : x, lab = typeof x === 'object' ? x.label : x;
        return `<option value="${esc(val)}" ${String(v) === String(val) ? 'selected' : ''}>${esc(lab)}</option>`;
      }).join('')}</select>`;
  };
  ZC.ui.chk = (k, v, label, opt) => `<label class="chk ${(opt || {}).cls || ''}"><input type="checkbox"${uidK(k)} data-t="bool" ${v ? 'checked' : ''}><span class="chk__box"></span>${label ? `<span>${label}</span>` : ''}</label>`;
  ZC.ui.field = (label, control, hint) => `<div class="fld"><label class="fld__l">${esc(label)}</label><div class="fld__c">${control}${hint ? `<div class="fld__h">${hint}</div>` : ''}</div></div>`;
  ZC.ui.btn = (label, act, opt) => {
    const o = opt || {};
    return `<button class="btn ${o.cls || ''}" data-act="${esc(act)}" ${o.arg !== undefined ? `data-arg="${esc(o.arg)}"` : ''} ${o.k ? `data-k="${esc(o.k)}"` : ''} ${o.dis ? 'disabled' : ''} title="${esc(o.title || '')}">${o.icon ? ZC.ui.icon(o.icon, o.iconSize || 15) : ''}${label ? `<span>${esc(label)}</span>` : ''}</button>`;
  };
  ZC.ui.ibtn = (act, iconName, opt) => {
    const o = opt || {};
    return `<button class="ibtn ${o.cls || ''}" data-act="${esc(act)}" ${o.arg !== undefined ? `data-arg="${esc(o.arg)}"` : ''} title="${esc(o.title || '')}" aria-label="${esc(o.title || iconName)}">${ZC.ui.icon(iconName, o.size || 16)}</button>`;
  };

  /* ------------------------------------------------------- 进度条/环 */
  ZC.ui.bar = function (value, max, opt) {
    const o = opt || {};
    const pct = max > 0 ? Math.max(0, Math.min(100, value / max * 100)) : 0;
    return `<div class="bar ${o.cls || ''}" ${o.title ? `title="${esc(o.title)}"` : ''}><i style="width:${pct.toFixed(2)}%;${o.color ? 'background:' + o.color : ''}"></i></div>`;
  };
  ZC.ui.ring = function (value, max, label, sub) {
    const pct = max > 0 ? Math.max(0, Math.min(1, value / max)) : 0;
    const C = 2 * Math.PI * 42;
    return `<div class="ring">
      <svg viewBox="0 0 100 100" width="132" height="132">
        <circle cx="50" cy="50" r="42" class="ring__bg"/>
        <circle cx="50" cy="50" r="42" class="ring__fg" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${(C * (1 - pct)).toFixed(1)}"/>
      </svg>
      <div class="ring__c"><b>${ZC.fmt(value)}</b><span>${esc(sub || ('/ ' + max))}</span><em>${esc(label || '')}</em></div>
    </div>`;
  };

  /* ------------------------------------------------------- 徽章 / 标签 */
  ZC.ui.badge = (text, tone, title) => `<span class="badge badge--${tone || 'muted'}" ${title ? `title="${esc(title)}"` : ''}>${esc(text)}</span>`;
  ZC.ui.statusSel = (k, v) => ZC.ui.sel(k, v, ZC.EVIDENCE_STATUS.map(s => ({ id: s.id, label: s.label })), { width: '104px' });
  ZC.ui.statusBadge = (id) => {
    const s = ZC.EVIDENCE_STATUS.find(x => x.id === id) || ZC.EVIDENCE_STATUS[0];
    return ZC.ui.badge(s.label, s.tone);
  };

  /* --------------------------------------------------------- 卡片容器 */
  ZC.ui.card = (title, body, opt) => {
    const o = opt || {};
    return `<section class="card ${o.cls || ''}" ${o.id ? `id="${o.id}"` : ''}>
      ${title ? `<header class="card__hd">${o.icon ? `<span class="card__ic">${ZC.ui.icon(o.icon, 17)}</span>` : ''}<h2>${title}</h2>${o.sub ? `<p class="card__sub">${o.sub}</p>` : ''}${o.actions ? `<div class="card__act">${o.actions}</div>` : ''}</header>` : ''}
      <div class="card__bd">${body}</div>
    </section>`;
  };

  ZC.ui.empty = (iconName, title, desc, action) => `<div class="empty">${ZC.ui.icon(iconName || 'folder', 30)}<h4>${esc(title)}</h4>${desc ? `<p>${desc}</p>` : ''}${action || ''}</div>`;

  /* --------------------------------------------------------- 复制到剪贴板 */
  ZC.ui.copy = async function (text, okMsg) {
    try {
      if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
      else {
        const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove();
      }
      ZC.ui.toast(okMsg || '已复制到剪贴板', 'ok');
    } catch (e) { ZC.ui.toast('复制失败，请手动选择文本复制', 'danger'); }
  };

  /* ---------------------------------------------------------  misc */
  ZC.ui.pct = (v) => Math.round(v * 100) + '%';
  ZC.clamp = (v, a, b) => Math.max(a, Math.min(b, v));
})();

</script>
<script>
/* ===== 内联自 js/views-core.js ===== */
/* =========================================================================
 * views-core.js —— 仪表盘 / 品行素质分 / 能力拓展分 / 奖励分 / 综合成绩
 * ========================================================================= */
(function () {
  const ZC = window.ZC;
  const ui = ZC.ui, esc = ZC.esc, fmt = ZC.fmt;
  const V = (ZC.views = ZC.views || {});

  /* ------------------------------------------------- 公共：条目卡片壳 */
  function entry(o) {
    const cls = ['ent'];
    if (o.counted === false) cls.push('ent--off');
    if (o.blocked) cls.push('ent--blocked');
    return `<article class="${cls.join(' ')}">
      <div class="ent__hd">
        <div class="ent__ti">${o.title || ''}${o.badges || ''}</div>
        <div class="ent__pt ${o.counted === false ? 'is-off' : ''}">${o.points}</div>
      </div>
      ${o.note ? `<div class="ent__note">${o.note}</div>` : ''}
      <div class="ent__bd">${o.body || ''}</div>
      <div class="ent__ft">
        <div class="ent__st">${o.status || ''}</div>
        <div class="ent__ops">${o.ops || ''}</div>
      </div>
    </article>`;
  }
  const ops = (path, i) => `${ui.ibtn('dup', 'copy', { arg: `${path}|${i}`, title: '复制一条' })}${ui.ibtn('del', 'trash', { arg: `${path}|${i}`, title: '删除', cls: 'ibtn--danger' })}`;
  const fld = (label, control) => `<div class="fld"><label class="fld__l">${label}</label>${control}</div>`;

  function pointsTag(v, counted, reason) {
    const t = counted === false ? '未计入' : (v > 0 ? '+' + fmt(v) : fmt(v));
    return `<span class="pt ${counted === false ? 'pt--off' : v > 0 ? 'pt--on' : ''}" ${reason ? `title="${esc(reason)}"` : ''}>${t}</span>`;
  }

  /* 封顶进度小卡 */
  function capChip(label, raw, final, cap) {
    const over = raw > cap + 1e-9;
    return `<div class="chip ${over ? 'chip--over' : ''}" title="${over ? `原始合计 ${fmt(raw)} 分，超出上限部分不计入` : `上限 ${fmt(cap)} 分`}">
      <span class="chip__l">${label}</span>
      <span class="chip__v">${fmt(final)}<i>/${fmt(cap)}</i></span>
      ${ui.bar(final, cap, { cls: 'bar--xs' })}
      ${over ? `<span class="chip__w">溢出 ${fmt(ZC.r2(raw - cap))} 分不计</span>` : ''}
    </div>`;
  }

  /* ==================================================================
   * 仪表盘
   * ================================================================== */
  V.dashboard = {
    render(ctx) {
      const { p, R, res, insights } = ctx;
      const H = res.headroom;
      const target = +p.target.score || 0;
      const f = ZC.state.ui.tipsFilter || 'all';
      const shown = f === 'all' ? insights : insights.filter(i => i.level === f);
      const counts = { all: insights.length, danger: 0, warn: 0, good: 0, info: 0 };
      insights.forEach(i => counts[i.level]++);
      const rec = ZC.recommend(p, R, res).slice(0, 6);

      /* --- 主卡 --- */
      const hero = `<section class="hero">
        <div class="hero__l">
          ${ui.ring(res.total, res.maxTotal, '综合素质测评成绩', '/ ' + res.maxTotal)}
          <div class="hero__meta">
            <div class="hero__nm">${esc(p.meta.name)}</div>
            <div class="hero__sub">${esc(p.meta.college)} · ${esc(p.meta.academicYear)} 学年${p.meta.grade ? ' · ' + esc(p.meta.grade) : ''}</div>
            <div class="hero__goal">
              <label>目标分</label>${ui.num('target.score', p.target.score, { ph: '如 92', width: '78px' })}
              ${target ? `<span class="hero__gap ${res.total >= target ? 'is-pos' : 'is-neg'}">${res.total >= target ? '已达成 +' + fmt(ZC.r2(res.total - target)) : '还差 ' + fmt(ZC.r2(target - res.total))}</span>` : ''}
            </div>
          </div>
        </div>
        <div class="hero__r">
          ${segCard('品行素质分', res.pinxing.final, R.frame.pinxing, 'pinxing', [
            ['基准分', res.pinxing.base], ['集体活动', res.pinxing.subs.collective.final],
            ['思政学习', res.pinxing.subs.ideology.final], ['社会服务', res.pinxing.subs.service.final],
            ['扣分', res.pinxing.deduction ? '−' + fmt(res.pinxing.deduction) : '0']
          ])}
          ${segCard('能力拓展分', res.ability.final, R.frame.ability, 'ability', [
            ['学术科研', res.ability.subs.academic.final], ['文体竞赛', res.ability.subs.culture.final], ['组织任职', res.ability.subs.position.final]
          ])}
          ${segCard('奖励分', res.reward.final, R.reward.cap, 'reward', [['荣誉/好事', res.reward.final]])}
        </div>
      </section>`;

      /* --- 综合成绩 --- */
      const cp = res.composite;
      const compCard = ui.card(
        `综合成绩 <span class="tagline">${esc(cp.preset.name)}</span>`,
        `<div class="comp">
          <div class="comp__v ${cp.incomplete ? 'is-part' : ''}">${fmt(cp.total)}${cp.incomplete ? '<em>部分成绩未填</em>' : ''}</div>
          <div class="comp__f">${cp.parts.map(x => `<span class="${x.filled ? '' : 'is-empty'}">${esc(x.label)} <b>${x.filled ? fmt(x.value) : '—'}</b> × ${Math.round(x.weight * 100)}%</span>`).join('<i>+</i>')}</div>
          <div class="comp__note">综测每 +1 分 → 综合成绩 +${fmt(cp.sensitivity)} 分。
            <a href="#/composite" data-nav="composite">去设置口径与资格自检 ${ui.icon('right', 12)}</a></div>
        </div>`,
        { icon: 'calc', sub: esc(cp.preset.desc), actions: `<button class="lbtn" data-act="goto" data-arg="composite">详情</button>` }
      );

      /* --- 提示 --- */
      const tips = ui.card('温馨提示与风险预警',
        `<div class="tips">
          <div class="tips__f">

          ${capChip('学术科研', res.ability.subs.academic.raw, res.ability.subs.academic.final, R.ability.caps.academic)}
          ${capChip('文体竞赛', res.ability.subs.culture.raw, res.ability.subs.culture.final, R.ability.caps.culture)}
          ${capChip('组织任职', res.ability.subs.position.raw, res.ability.subs.position.final, R.ability.caps.position)}

        { icon: 'target', sub: '每个分项都有封顶，超出部分不计入——先补没满的' });

      /* --- 快捷入口 --- */
      const quick = `<div class="quick">
        ${[['pinxing', 'shield', '录入品行加分/扣分'], ['ability', 'rocket', '录入竞赛·论文·任职'], ['reward', 'award', '录入荣誉表彰'],
           ['materials', 'folder', '整理佐证材料'], ['simulate', 'flask', '如果再加一项会怎样'], ['procedure', 'clock', '公示与申诉时效']].map(([v, i, l]) =>
          `<a class="quick__i" href="#/${v}" data-nav="${v}">${ui.icon(i, 17)}<span>${l}</span></a>`).join('')}

      return `<div class="page">

  function capName(c) {
    return { collective: '集体活动分', ideology: '思政学习分', service: '社会服务分', academic: '学术科研', culture: '文体竞赛', position: '组织任职', reward: '奖励分' }[c] || c;
  }
  function segCard(title, val, max, view, rows) {
    return `<a class="seg" href="#/${view}" data-nav="${view}">

  /* ==================================================================
   * 品行素质分
   * ================================================================== */
  V.pinxing = {
    render(ctx) {
      const { p, R, res } = ctx;
      const PX = R.pinxing, s = res.pinxing.subs;
      const per = PX.collective.perTime;

      /* 基准分 */
      const baseCard = ui.card('基准分',
        `<div class="base">
          <label class="switch">

          </label>
          <div class="base__v ${p.meta.assessPass ? 'is-on' : 'is-off'}">${p.meta.assessPass ? fmt(res.pinxing.base) + ' 分' : '0 分'}</div>
        </div>
        <p class="hint">基准分是品行素质分的主体（占 ${fmt(PX.base)}/${R.frame.pinxing}）。未通过评议将直接失去这部分分值，同时通常也意味着取消当年评奖评优资格。</p>`,

      /* 集体活动 */

      const colBody = `
        ${capChip('集体活动分', s.collective.raw, s.collective.final, PX.caps.collective)}

            `<button class="lbtn" data-act="rule" data-arg="collective">查看原文</button> · 校级办法未统一规定，由各书（学）院自行认定。0.6 为彭康书院细化口径。`)}

        <div class="list">

              title: esc(e.name || '未命名活动'),

                ${fld('日期', ui.date(k + '.date', e.date))}

              </div>`,
              status: ui.statusSel(k + '.status', e.status),
              ops: ops('pinxing.collective.entries', i)
            });

        </div>`;
      const colCard = ui.card('集体活动分', colBody, {
        icon: 'users', sub: `上限 ${fmt(PX.caps.collective)} 分`,

      });

      /* 思想政治理论学习 */

      const idCard = ui.card('思想政治理论学习分',

          ${stepper('pinxing.ideology.orgTraining', ID.orgTraining, `各级党团组织理论学习培训（含网络学习）`, `+${fmt(IDR.orgTraining)}/次`)}
          ${stepper('pinxing.ideology.provincialTraining', ID.provincialTraining, `省、部级理论学习培训`, `+${fmt(IDR.provincialTraining)}/次`)}
          ${stepper('pinxing.ideology.excellentTrainee', ID.excellentTrainee, `培训获"优秀学员"称号`, `额外 +${fmt(IDR.excellentTrainee)}`)}
        </div>
        <p class="hint">三项可叠加，合计封顶 ${fmt(PX.caps.ideology)} 分。网络学习是成本最低的入口。</p>`,
        { icon: 'book', sub: `上限 ${fmt(PX.caps.ideology)} 分` });

      /* 社会服务 */

      const volItem = s.service.items.find(i => String(i.label).indexOf('志愿服务') === 0);
      const volPts = volItem ? volItem.points : 0;
      const svCard = ui.card('社会服务分',
        `${capChip('社会服务分', s.service.raw, s.service.final, PX.caps.service)}

          <div class="bar bar--lg"><i style="width:${volPct.toFixed(1)}%"></i></div>
          <div class="vol__ft">
            ${ui.num('pinxing.service.volunteerHours', SV.volunteerHours, { width: '96px', min: 0, step: '0.5', ph: '小时' })}
            <span class="muted">当前计 ${fmt(volPts)} 分</span>
            <span class="muted">时长证明</span>${ui.statusSel('pinxing.service.volunteerStatus', SV.volunteerStatus || 'todo')}
            ${hours >= SR.volunteerHours ? ui.badge('已达标', 'ok') : ui.badge(`还差 ${fmt(ZC.r2(SR.volunteerHours - hours))} 小时`, 'warn')}
            <button class="lbtn" data-act="rule" data-arg="volunteer">口径说明</button>
          </div>
        </div>
        <div class="steppers">
          ${stepper('pinxing.service.schoolPractice', SV.schoolPractice, '校级社会实践（考核合格的团队成员）', `+${fmt(SR.schoolPractice)}/项`)}
          ${stepper('pinxing.service.cityIntern', SV.cityIntern, '市、县级挂职锻炼及政府见习', `+${fmt(SR.cityIntern)}/项`)}
          ${stepper('pinxing.service.provIntern', SV.provIntern, '省、部级挂职锻炼及政府见习 / 国际组织见习', `+${fmt(SR.provIntern)}/项`)}
          ${stepper('pinxing.service.advanced', SV.advanced, '获先进个人及表彰（额外）', `额外 +${fmt(SR.advanced)}`)}
        </div>
        <p class="hint">各项可累计，合计封顶 ${fmt(PX.caps.service)} 分。志愿服务不足 ${SR.volunteerHours} 小时按比例计分，${SR.volunteerHours} 小时以上不再加分。</p>`,
        { icon: 'pin', sub: `上限 ${fmt(PX.caps.service)} 分` });

      /* 扣分 */
      const ded = p.pinxing.deductions || [];
      const dedCard = ui.card('品行素质扣分',
        `<div class="callout callout--danger">
          <b>${ui.icon('alert', 15)} 扣分不设上限，直接从品行素质分中扣除。</b>
          当前累计 <b class="big">−${fmt(res.pinxing.deduction)}</b> 分。
          ${res.pinxing.deduction > 0 ? `这相当于抹掉 ${fmt(res.pinxing.deduction)} 分的加分成果。` : '暂无扣分，保持住。'}
        </div>
        <div class="dedsum">${PX.deduction.types.map(t => `<span class="dedsum__i" title="${esc(t.label)}：每次 −${t.per} 分">${esc(t.label)} <b>−${t.per}</b></span>`).join('')}</div>
        <div class="list">
          ${ded.map((d, i) => {
            const k = `pinxing.deductions[${i}]`;
            const t = PX.deduction.types.find(x => x.id === d.type) || { label: '其他', per: 1, unit: '次' };
            const per2 = d.type === 'other' ? (+d.customPer || 0) : t.per;
            return entry({
              title: esc(t.label) + ((+d.count || 1) > 1 ? ` × ${d.count}` : ''),
              points: `<span class="pt pt--neg">−${fmt(ZC.r2(per2 * (+d.count || 1)))}</span>`,
              body: `<div class="fgrid">
                ${fld('类型', ui.sel(k + '.type', d.type, PX.deduction.types.map(x => ({ id: x.id, label: x.label }))))}
                ${fld('次数', ui.num(k + '.count', d.count, { width: '76px', min: 1, step: 1 }))}
                ${fld('发生日期', ui.date(k + '.date', d.date))}
                ${fld('说明 / 备注', ui.txt(k + '.note', d.note, { ph: '如：10 月宿舍卫生检查' }))}
                ${d.type === 'other' ? fld('单次扣分', ui.num(k + '.customPer', d.customPer, { width: '86px', min: 0, step: 0.5 })) : ''}

              ${d.type === 'weisheng' ? '<div class="callout callout--warn callout--sm">宿舍卫生不合格为"宿舍每人每次 −1"，全宿舍共同承担。</div>' : ''}`,
              status: ui.statusSel(k + '.status', d.status),
              ops: ops('pinxing.deductions', i)

        });

      return `<div class="page">

    after() {

      if (sel && !sel._b) {
        sel._b = true;
        sel.addEventListener('change', () => { ZC.actions.add('deduction|' + sel.value); });
      }
    }
  };

  function stepper(k, val, label, unit) {
    const v = +val || 0;
    return `<div class="step">
      <div class="step__l"><b>${label}</b><span>${unit}</span></div>
      <div class="step__c">
        <button class="sbtn" data-act="step" data-arg="${k}|-1" title="减少">${ui.icon('minus', 14)}</button>
        <input class="inp inp--c" type="number" data-k="${k}" data-t="num" min="0" step="1" value="${v}">
        <button class="sbtn" data-act="step" data-arg="${k}|1" title="增加">${ui.icon('plus', 14)}</button>
      </div>
    </div>`;
  }
  ZC.actions.step = function (arg) {
    const [k, d] = arg.split('|');
    const p = ZC.getProfile();
    ZC.snapshot('调整计数');
    const cur = +ZC.getPath(p, k) || 0;
    ZC.setPath(p, k, Math.max(0, cur + (+d)));
    ZC.save(); ZC.rerender();
  };

  /* ==================================================================
   * 能力拓展分
   * ================================================================== */
  V.ability = {
    render(ctx) {
      const { p, R, res } = ctx;
      const AB = R.ability, s = res.ability.subs;

      /* ---------- 学术科研 ---------- */
      const compLevels = AB.competition.levels;
      const acad = (p.ability.academic || []).map((it, i) => {
        const r = s.academic.items.find(x => x.id === it.id) || {};
        const k = `ability.academic[${i}]`;
        const kindLabel = { competition: '竞赛获奖', paper: '论文', patent: '专利', book: '专著' }[it.kind] || '成果';
        let body = '';

          const lv = compLevels.find(l => l.id === it.level);

            ${fld('项目 / 竞赛名称', ui.txt(k + '.project', it.project, { ph: '同一项目名会自动合并取最高' }))}
