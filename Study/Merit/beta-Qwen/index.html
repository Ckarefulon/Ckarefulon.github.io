            ${fld('获奖日期', ui.date(k + '.date', it.date))}
            ${fld('佐证材料', ui.txt(k + '.evidence', it.evidence, { ph: '证书编号 / 扫描件' }))}
            ${fld('同一项目分组', ui.txt(k + '.group', it.group, { ph: '留空=按项目名自动分组' }))}
          </div>`;
        } else {
          const cls = it.kind === 'patent'
            ? Object.keys(AB.publication.patentMap).map(t => ({ id: t, label: t + '（' + (AB.publication.patentMap[t] === 'i' ? 'i 类' : 'ii 类') + '）' }))
            : AB.publication.classes.filter(c => it.kind === 'book' ? c.id === 'book' : c.id !== 'book').map(c => ({ id: c.id, label: c.label }));
          const key = it.kind === 'patent' ? k + '.patentType' : k + '.pubClass';
          const val = it.kind === 'patent' ? it.patentType : it.pubClass;
          body = `<div class="fgrid">
            ${fld(it.kind === 'book' ? '书名' : '成果名称', ui.txt(k + '.name', it.name, { ph: it.kind === 'paper' ? '论文题目' : it.kind === 'patent' ? '专利/软著名称' : '专著名称' }))}
            ${fld(it.kind === 'patent' ? '专利类型' : '成果类别', ui.sel(key, val, cls))}
            ${fld(it.isEditor && it.kind === 'book' ? '身份（参编）' : '署名位次', it.kind === 'book' && it.isEditor
              ? `<div class="inline">${ui.chk(k + '.isEditor', true, '参编（+' + fmt(AB.publication.classes.find(c => c.id === 'book').editor) + ' 分）')}</div>`
              : ui.num(k + '.rank', it.rank, { width: '86px', min: 1, step: 1 }))}
            ${fld('第一署名单位', ui.txt(k + '.signUnit', it.signUnit, { ph: '须为 西安交通大学' }))}
            ${fld('日期', ui.date(k + '.date', it.date))}
            ${fld('佐证材料', ui.txt(k + '.evidence', it.evidence, { ph: '录用通知 / 证书号' }))}
          </div>
          <div class="rowset">
            ${it.kind === 'book' && !it.isEditor ? `<label class="chk"><input type="checkbox" data-k="${k}.isEditor" data-t="bool" ${it.isEditor ? 'checked' : ''}><span class="chk__box"></span><span>我是参编（非署名作者）</span></label>` : ''}
            ${it.kind === 'paper' ? `<label class="chk"><input type="checkbox" data-k="${k}.excellentPaper" data-t="bool" ${it.excellentPaper ? 'checked' : ''}><span class="chk__box"></span><span>会议入围优秀论文（额外 +${fmt(AB.publication.excellentPaperBonus)}）</span></label>` : ''}
          </div>`;
        }
        return entry({
          title: esc(it.project || it.name || '未命名成果'),
          badges: `${ui.badge(kindLabel, 'muted')}${r._merged ? ui.badge(r._counted ? '同项目取最高·已计入' : `同项目取最高·未计入`, r._counted ? 'info' : 'warn') : ''}${r._blocked ? ui.badge('署名不符', 'danger') : ''}`,
          points: pointsTag(r._pts || 0, r._blocked ? false : r._counted, r._reason),
          note: r._reason ? `<span class="rsn">${esc(r._reason)}</span>` : '',
          body, status: ui.statusSel(k + '.status', it.status), ops: ops('ability.academic', i)
        });
      }).join('');

      const acadCard = ui.card('学术科研及创新创业',
        `${capChip('学术科研', s.academic.raw, s.academic.final, AB.caps.academic)}
        <div class="tbl-wrap"><table class="tbl tbl--sm">
          <thead><tr><th>竞赛级别</th><th>一等奖</th><th>二等奖</th><th>三等奖</th><th>优秀奖</th></tr></thead>
          <tbody>${compLevels.map(l => `<tr><td class="tl">${esc(l.label)}</td>${['一等奖', '二等奖', '三等奖', '优秀奖'].map(a => `<td>${l.awards[a] === undefined ? '<span class="na">—</span>' : fmt(l.awards[a])}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>
        <p class="hint">${esc(AB.competition.note)}　<button class="lbtn" data-act="rule" data-arg="dedup">同一项目取最高</button>　<button class="lbtn" data-act="rule" data-arg="sign">署名单位要求</button></p>
        <div class="list">${acad || ui.empty('folder', '还没有学术成果', '竞赛获奖、论文、专利、专著都可录入。同一项目获不同奖项不累计、取最高；不同项目可累计。')}</div>`,
        {
          icon: 'flask', sub: `上限 ${fmt(AB.caps.academic)} 分 · 特等奖参照一等奖`,
          actions: `<div class="btns">
            ${ui.btn('竞赛获奖', 'add', { arg: 'academic|academic-comp', cls: 'btn--sm btn--primary', icon: 'plus' })}
            ${ui.btn('论文', 'add', { arg: 'academic|academic-paper', cls: 'btn--sm', icon: 'plus' })}
            ${ui.btn('专利/软著', 'add', { arg: 'academic|academic-patent', cls: 'btn--sm', icon: 'plus' })}
            ${ui.btn('专著', 'add', { arg: 'academic|academic-book', cls: 'btn--sm', icon: 'plus' })}</div>`
        });

      /* ---------- 文体竞赛 ---------- */
      const cul = (p.ability.culture || []).map((it, i) => {
        const r = s.culture.items.find(x => x.id === it.id) || {};
        const k = `ability.culture[${i}]`;
        const tbl = it.kind === 'sport' ? AB.sport : AB.art;
        const lv = tbl.levels.find(l => l.id === it.level);
        return entry({
          title: esc(it.name || '未命名项目'),
          badges: `${ui.badge(it.kind === 'sport' ? '体育' : '文艺', it.kind === 'sport' ? 'info' : 'muted')}${r._merged ? ui.badge(r._counted ? '同项目取最高·已计入' : '同项目取最高·未计入', r._counted ? 'info' : 'warn') : ''}${it.record ? ui.badge('破纪录', 'ok') : ''}`,
          points: pointsTag(r._pts || 0, r._counted, r._reason),
          note: `<span class="rsn">${esc(r._reason || '')}</span>`,
          body: `<div class="fgrid">
            ${fld('项目名称', ui.txt(k + '.name', it.name, { ph: '同一项目名自动合并取最高' }))}
            ${fld('类别', ui.sel(k + '.kind', it.kind, [{ id: 'art', label: '文艺比赛' }, { id: 'sport', label: '体育竞赛' }]))}
            ${fld('级别', ui.sel(k + '.level', it.level, tbl.levels.map(l => ({ id: l.id, label: l.label }))))}
            ${fld(it.kind === 'sport' ? '名次' : '奖项', ui.sel(k + '.award', it.award, lv ? Object.keys(lv.awards) : []))}
            ${fld('日期', ui.date(k + '.date', it.date))}
            ${fld('佐证材料', ui.txt(k + '.evidence', it.evidence, { ph: '证书 / 秩序册' }))}
          </div>
          <div class="rowset">
            <label class="chk"><input type="checkbox" data-k="${k}.record" data-t="bool" ${it.record ? 'checked' : ''}><span class="chk__box"></span>
            <span>破纪录（省级及以上 +${fmt(AB.sport.record.provincialOrAbove)} / 校级 +${fmt(AB.sport.record.school)}，按所选级别自动判定）</span></label>
          </div>`,
          status: ui.statusSel(k + '.status', it.status), ops: ops('ability.culture', i)
        });
      }).join('');

      const culCard = ui.card('文体竞赛',
        `${capChip('文体竞赛', s.culture.raw, s.culture.final, AB.caps.culture)}
        <div class="tbl2">
          <div class="tbl-wrap"><h4>文艺比赛</h4><table class="tbl tbl--sm"><thead><tr><th>级别</th><th>一等</th><th>二等</th><th>三等</th><th>优秀</th></tr></thead>
            <tbody>${AB.art.levels.map(l => `<tr><td class="tl">${esc(l.label)}</td>${['一等奖', '二等奖', '三等奖', '优秀奖'].map(a => `<td>${l.awards[a] === undefined ? '<span class="na">—</span>' : fmt(l.awards[a])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
          <div class="tbl-wrap"><h4>体育竞赛</h4><table class="tbl tbl--sm"><thead><tr><th>级别</th><th>第1名</th><th>第2名</th><th>第3名</th><th>第4—8名</th></tr></thead>
            <tbody>${AB.sport.levels.map(l => `<tr><td class="tl">${esc(l.label)}</td>${['第1名', '第2名', '第3名', '第4—8名'].map(a => `<td>${l.awards[a] === undefined ? '<span class="na">—</span>' : fmt(l.awards[a])}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
        </div>
        <div class="list">${cul || ui.empty('folder', '还没有文体竞赛记录', '校级文艺三等奖 +1、校级体育第4—8名 +0.5 是门槛最低的入口；破省级及以上纪录另 +5。')}</div>`,
        {
          icon: 'star', sub: `上限 ${fmt(AB.caps.culture)} 分 · 破省级及以上纪录 +${fmt(AB.sport.record.provincialOrAbove)}、破校级纪录 +${fmt(AB.sport.record.school)}`,
          actions: `<div class="btns">${ui.btn('文艺比赛', 'add', { arg: 'culture|culture-art', cls: 'btn--sm btn--primary', icon: 'plus' })}${ui.btn('体育竞赛', 'add', { arg: 'culture|culture-sport', cls: 'btn--sm', icon: 'plus' })}</div>`
        });

      /* ---------- 任职 ---------- */
      const PT = AB.position.partialTerm;
      const pos = (p.ability.position || []).map((it, i) => {
        const r = s.position.items.find(x => x.id === it.id) || {};
        const k = `ability.position[${i}]`;
        const tier = AB.position.tiers.find(t => t.id === it.tier);
        return entry({
          title: `${esc(it.org || '未填组织')} <span class="role">${esc(it.role || '未填职务')}</span>`,
          badges: `${ui.badge(tier ? '第' + tier.id.slice(1) + '档' : '未选档', 'muted')}${r._counted ? ui.badge('计入（最高）', 'ok') : (p.ability.position.length > 1 ? ui.badge('兼任取最高·未计入', 'warn') : '')}${r._months !== null && r._months < 12 ? ui.badge('任期不满一年', 'warn') : ''}`,
          points: pointsTag(r._pts || 0, r._counted, r._reason),
          note: `<span class="rsn">${esc(r._reason || '')}</span>`,
          body: `<div class="fgrid">
            ${fld('组织 / 单位', ui.txt(k + '.org', it.org, { ph: '如：彭康书院学生会' }))}
            ${fld('职务', ui.txt(k + '.role', it.role, { ph: '如：宣传部部长' }))}
            ${fld('职务档位', ui.sel(k + '.tier', it.tier, AB.position.tiers.map(t => ({ id: t.id, label: '第' + t.id.slice(1) + '档 · ' + t.label.slice(0, 26) + (t.label.length > 26 ? '…' : '') }))))}
            ${fld('考核等级', ui.sel(k + '.assessment', it.assessment, AB.position.assessments))}
            ${fld('任期开始', ui.date(k + '.startDate', it.startDate))}
            ${fld('任期结束', ui.date(k + '.endDate', it.endDate, { ph: '在职可留空' }))}
            ${fld('佐证材料', ui.txt(k + '.evidence', it.evidence, { ph: '任职文件 / 聘书' }))}
          </div>
          ${tier ? `<div class="tiervalues">该档位分值：${Object.keys(tier.values).map(a => `${a} <b>${fmt(tier.values[a])}</b>`).join(' · ')}${r._months !== null && r._months < 12 ? ` · 当前酌情系数 <b>${fmt(r._factor)}</b>（${r._months} 个月）` : ''}</div>` : ''}`,
          status: ui.statusSel(k + '.status', it.status), ops: ops('ability.position', i)
        });
      }).join('');

      const posCard = ui.card('学生组织、社团任职',
        `${capChip('组织任职', s.position.raw, s.position.final, AB.caps.position)}
        <div class="tbl-wrap"><table class="tbl tbl--sm">
          <thead><tr><th>职务档位</th><th>优</th><th>良</th><th>合格</th></tr></thead>
          <tbody>${AB.position.tiers.map(t => `<tr><td class="tl">${esc(t.label)}</td>${['优秀', '良好', '合格'].map(a => `<td>${fmt(t.values[a])}</td>`).join('')}</tr>`).join('')}</tbody>
        </table></div>
        <div class="rowset rowset--tight">
          <span class="lbl">任期不满一年的处理口径：</span>
          ${ui.sel('ruleOverride.ability.position.partialTerm.mode', PT.mode, [
            { id: 'prorate', label: '按实际工作时间比例（月数/12）— 校级"酌情"的常见实现' },
            { id: 'half', label: '最高不超过满一年的 1/2 — 部分书院细则口径' },
            { id: 'custom', label: '自定义固定系数' },
            { id: 'none', label: '不加分（最严格口径）' }
          ], { width: 'auto' })}
          ${(PT.mode === 'half' || PT.mode === 'custom') ? `<span class="inline">系数 ${ui.num('ruleOverride.ability.position.partialTerm.custom', PT.custom, { width: '76px', min: 0, max: 1, step: 0.05 })}</span>` : ''}
          <button class="lbtn" data-act="rule" data-arg="term">查看原文</button>
        </div>
        <p class="hint">⚑ 官方原文：<b>"任期原则上要求满一年；若不满一年，根据工作时间酌情加分，最高不得超过任期满一年的加分。"</b> 也就是说，不满一年<b>不是零分</b>，而是可获酌情分。兼任多项职务按最高分计、不累加；考核不合格不加分。</p>
        <div class="list">${pos || ui.empty('folder', '还没有任职记录', '最低门槛：宿舍长（考核合格）+0.5；班长/团支书考核优秀可 +2；院级及以上学生组织正职优秀 +4。')}</div>`,
        { icon: 'users', sub: `上限 ${fmt(AB.caps.position)} 分 · 兼任取最高、不累加`, actions: ui.btn('添加任职', 'add', { arg: 'position|position', cls: 'btn--sm btn--primary', icon: 'plus' }) });

      return `<div class="page">
        <div class="page__hd"><h1>能力拓展分</h1><p>满分 ${R.frame.ability} 分 = 学术科研 ≤${fmt(AB.caps.academic)} + 文体竞赛 ≤${fmt(AB.caps.culture)} + 组织任职 ≤${fmt(AB.caps.position)}</p>
          <div class="page__score"><b>${fmt(res.ability.final)}</b><span>/ ${R.frame.ability}</span></div></div>
        ${acadCard}${culCard}${posCard}
      </div>`;
    }
  };

  /* ==================================================================
   * 奖励分
   * ================================================================== */
  V.reward = {
    render(ctx) {
      const { p, R, res } = ctx;
      const RW = R.reward;
      const items = (p.reward.items || []).map((it, i) => {
        const r = res.reward.items[i] || {};
        const k = `reward.items[${i}]`;
        const cat = RW.categories.find(c => c.id === it.category) || RW.categories[0];
        return entry({
          title: esc(it.name || cat.label),
          badges: ui.badge(cat.label, 'muted'),
          points: pointsTag(r._pts || 0, null, r._reason),
          note: `<span class="rsn">${esc(r._reason || '')}</span>`,
          body: `<div class="fgrid">
            ${fld('类别', ui.sel(k + '.category', it.category, RW.categories.map(c => ({ id: c.id, label: c.label }))))}
            ${cat.mode === 'level' ? fld('表彰级别', ui.sel(k + '.level', it.level, RW.levels.map(l => ({ id: l.id, label: `${l.label}（+${l.v}）` })))) : fld('计分方式', `<div class="static">每项 +${fmt(cat.each)} 分，可累加</div>`)}
            ${fld('名称 / 事由', ui.txt(k + '.name', it.name, { ph: '如：校级三好学生 / 拾金不昧受表扬' }))}
            ${fld('日期', ui.date(k + '.date', it.date))}
            ${fld('佐证材料', ui.txt(k + '.evidence', it.evidence, { ph: '表彰文件 / 感谢信' }))}
          </div>`,
          status: ui.statusSel(k + '.status', it.status), ops: ops('reward.items', i)
        });
      }).join('');

      return `<div class="page">
        <div class="page__hd"><h1>奖励分</h1><p>满分 ${fmt(RW.cap)} 分 · 在 100 分之外额外累加，超过 ${fmt(RW.cap)} 分按 ${fmt(RW.cap)} 分计</p>
          <div class="page__score"><b>${fmt(res.reward.final)}</b><span>/ ${fmt(RW.cap)}</span></div></div>
        ${capChip('奖励分', res.reward.raw, res.reward.final, RW.cap)}
        ${ui.card('加分标准', `<div class="tbl-wrap"><table class="tbl tbl--sm">
            <thead><tr><th>类别</th>${RW.levels.map(l => `<th>${esc(l.label)}</th>`).join('')}</tr></thead>
            <tbody>${RW.categories.map(c => `<tr><td class="tl">${esc(c.label)}</td>${c.mode === 'level'
              ? RW.levels.map(l => `<td>${fmt(l.v)}</td>`).join('')
              : `<td colspan="${RW.levels.length}" class="tl">每项 +${fmt(c.each)} 分，可累加</td>`}</tr>`).join('')}</tbody>
          </table></div>`, { icon: 'award' })}
        ${ui.card('已录入的奖励', `<div class="list">${items || ui.empty('award', '还没有奖励分记录', '院级表彰 +1、校级 +2、市级 +3、省级 +4、全国 +5；做好事受表扬每项 +1。志愿服务"先进个人"也可在此计入。')}</div>`,
          { icon: 'star', actions: ui.btn('添加奖励', 'add', { arg: 'reward|reward', cls: 'btn--sm btn--primary', icon: 'plus' }) })}
      </div>`;
    }
  };

  /* ==================================================================
   * 综合成绩与资格
   * ================================================================== */
  V.composite = {
    render(ctx) {
      const { p, R, res } = ctx;
      const cp = res.composite;
      const E = R.eligibility;
      const needDeyu = cp.preset.parts.some(x => x.key === 'deyu');
      const needPe = cp.preset.parts.some(x => x.key === 'pe');

      const presetCard = ui.card('综合成绩口径',
        `<div class="fgrid fgrid--2">
          ${fld('选择口径', ui.sel('ruleOverride.composite.preset', R.composite.preset, R.composite.presets.map(x => ({ id: x.id, label: x.name })), { width: 'auto' }))}
          ${fld('综测是否折算为百分制', ui.sel('ruleOverride.composite.normalizeZongce', R.composite.normalizeZongce ? '1' : '', [{ id: '', label: '否（按原始分 0—105 直接加权）' }, { id: '1', label: '是（综测 ÷ 105 × 100 后加权）' }], { width: 'auto' }))}
        </div>
        <div class="callout callout--info callout--sm"><b>${esc(cp.preset.name)}：</b>${esc(cp.preset.desc)}<br><span class="muted">来源：${esc(cp.preset.source || '')}</span></div>
        <div class="fgrid fgrid--3">
          ${fld('课程考核 / 智育成绩（百分制）', ui.num('coursework.score', p.coursework.score, { ph: '如 86.4' }))}
          ${needDeyu ? fld('思想品德行为成绩', ui.num('coursework.deyu', p.coursework.deyu, { ph: '按书院德育积点折算' })) : ''}
          ${needPe ? fld('体育成绩', ui.num('coursework.pe', p.coursework.pe, { ph: '体育课成绩' })) : ''}
        </div>
        <div class="bigres ${cp.incomplete ? 'is-part' : ''}">
          <span>综合成绩</span><b>${fmt(cp.total)}</b>
          ${cp.incomplete ? '<em class="warn-t">部分成绩未填写，结果为估算值</em>' : ''}
        </div>
        <div class="cmp">${cp.parts.map(x => `<div class="cmp__i"><span>${esc(x.label)}</span><b>${x.filled ? fmt(x.value) : '—'}</b><em>× ${Math.round(x.weight * 100)}% = ${fmt(x.contrib)}</em></div>`).join('')}</div>
        <p class="hint">⚑ 不同用途、不同学院的权重不同：奖学金为 80/20；转专业/分流公开口径为智育 90% + 综测 10%；推免占比因学院而异（电气学院"建议 10%"、公管学院"占 10%"）；崇实书院 2015 细则为德育 20% + 课程 70% + 体育 10%。<b>务必以你所在学院/书院当年公布办法为准。</b></p>
        <div class="sens">综测每 +1 分 → 综合成绩 <b>+${fmt(cp.sensitivity)}</b> 分；综测从 ${fmt(res.total)} 提到 ${fmt(res.maxTotal)}（理论上限）可带来约 <b>+${fmt(ZC.r2((res.maxTotal - res.total) * cp.sensitivity))}</b> 分。</div>`,
        { icon: 'calc' });

      /* 资格自检 */
      const es = p.eligibility || {};
      const schFail = E.scholarship.filter(x => es.scholarship && (x.id === 'pe' ? es.scholarship.pe === false : es.scholarship[x.id])).map(x => x.label);
      const comFail = E.commend.filter(x => es.commend && es.commend[x.id]).map(x => x.label);
      const eligCard = ui.card('参评资格自检',
        `<div class="elig">
          <div class="elig__r ${schFail.length ? 'is-bad' : 'is-ok'}">
            <span class="elig__s">${schFail.length ? ui.icon('x', 20) : ui.icon('check', 20)}</span>
            <div><b>奖学金参评资格</b><p>${schFail.length ? '不通过：' + esc(schFail.join('；')) : '未发现红线情形（最终以当年评审通知为准）'}</p></div>
          </div>
          <div class="elig__r ${comFail.length ? 'is-bad' : 'is-ok'}">
            <span class="elig__s">${comFail.length ? ui.icon('x', 20) : ui.icon('check', 20)}</span>
            <div><b>表彰奖励参评资格</b><p>${comFail.length ? '不通过：' + esc(comFail.join('；')) : '未发现红线情形'}</p></div>
          </div>
        </div>
        <h4 class="sub-h">奖学金红线</h4>
        <div class="checks">
          <label class="chk chk--rev"><input type="checkbox" data-k="eligibility.scholarship.fail" data-t="bool" ${es.scholarship && es.scholarship.fail ? 'checked' : ''}><span class="chk__box"></span><span>参评学年必修课考核不及格（<b>补考、重修视同不及格</b>）</span></label>
          <label class="chk chk--rev"><input type="checkbox" data-k="eligibility.scholarship.punish" data-t="bool" ${es.scholarship && es.scholarship.punish ? 'checked' : ''}><span class="chk__box"></span><span>受到校级、院级纪律处分（含尚未解除）</span></label>
          <label class="chk"><input type="checkbox" data-k="eligibility.scholarship.pe" data-t="bool" ${!es.scholarship || es.scholarship.pe !== false ? 'checked' : ''}><span class="chk__box"></span><span>体测达标（国奖/励志通常要求<b>良好及以上</b>，校级奖学金要求<b>及格</b>）</span></label>
        </div>
        <h4 class="sub-h">表彰奖励常见取消情形</h4>
        <div class="checks">
          ${E.commend.map(x => `<label class="chk chk--rev"><input type="checkbox" data-k="eligibility.commend.${x.id}" data-t="bool" ${es.commend && es.commend[x.id] ? 'checked' : ''}><span class="chk__box"></span><span>${esc(x.label)}</span></label>`).join('')}
        </div>
        <p class="hint">具体取消情形以当年《本科生表彰奖励办法》及书院通知为准。</p>`,
        { icon: 'shield' });

      /* 奖学金档位 */
      const tiers = R.scholarshipTiers;
      const tierCard = ui.card('奖学金档位与金额（供参考）',
        `<div class="tiers">${tiers.map(t => `<div class="tier"><b>${esc(t.name)}</b><span class="tier__a">¥${t.amount.toLocaleString('zh-CN')}</span><em>体测：${esc(t.pe)}</em></div>`).join('')}</div>
        <p class="hint">具体名额比例、评定顺序与体测要求以当年奖学金评审通知为准。可切换到「班级对比」录入同学成绩，估算自己的排名区间。</p>`,
        { icon: 'award', actions: ui.btn('去班级对比', 'goto', { arg: 'class', cls: 'btn--sm' }) });

      return `<div class="page">
        <div class="page__hd"><h1>综合成绩与参评资格</h1><p>综测只是其中一环——把口径、成绩与资格红线一起算清楚</p>
          <div class="page__score"><b>${fmt(cp.total)}</b><span>综合成绩</span></div></div>
        ${presetCard}${eligCard}${tierCard}
      </div>`;
    }
  };
  })();

</script>
<script>
/* ===== 内联自 js/views-tools.js ===== */
/* =========================================================================
 * views-tools.js —— 材料清单 / 情景模拟 / 班级对比 / 程序时效 / 规则手册 / 设置
 * ========================================================================= */
(function () {
  const ZC = window.ZC;
  const ui = ZC.ui, esc = ZC.esc, fmt = ZC.fmt;
  const V = ZC.views;
  const fld = (label, control, hint) => `<div class="fld"><label class="fld__l">${label}</label><div class="fld__c">${control}${hint ? `<div class="fld__h">${hint}</div>` : ''}</div></div>`;

  /* ==================================================================
   * 材料清单
   * ================================================================== */
  V.materials = {
    render(ctx) {
      const { p, res } = ctx;
      const rows = [];
      const add = (cat, name, pts, status, evidence, date, note) => rows.push({ cat, name, pts, status, evidence, date, note });
      res.pinxing.subs.collective.items.forEach(i => add('集体活动', i.label, i.points, i.status, i.evidence, i.date, i.note));
      if (p.pinxing.service.volunteerHours > 0) add('社会服务', `志愿服务 ${fmt(p.pinxing.service.volunteerHours)} 小时`, '', p.pinxing.service.volunteerStatus || 'todo', p.pinxing.service.volunteerNote || '', '', '需志愿服务系统时长记录截图 / 主办方盖章证明');
      res.ability.subs.academic.items.forEach(i => add('学术科研', i.project || i.name || '未命名', i._counted ? i._pts : 0, i.status, i.evidence, i.date, i._reason));
      res.ability.subs.culture.items.forEach(i => add('文体竞赛', i.name || i.project || '未命名', i._counted ? i._pts : 0, i.status, i.evidence, i.date, i._reason));
      res.ability.subs.position.items.forEach(i => add('组织任职', `${i.org || ''} ${i.role || ''}`, i._counted ? i._pts : 0, i.status, i.evidence, i.date, i._reason));
      res.reward.items.forEach(i => add('奖励分', i.name || i._reason, i._pts, i.status, i.evidence, i.date, i._reason));
      res.pinxing.deductions.forEach(i => add('扣分', i.label, -i.points, i.status, '', i.date, i.note));

      const by = (s) => rows.filter(r => r.status === s).length;
      const st = ZC.EVIDENCE_STATUS;
      const filter = ZC.state.ui.matFilter || 'all';
      const shown = filter === 'all' ? rows : rows.filter(r => (r.status || 'none') === filter);

      const GUIDE = [
        ['竞赛获奖', '获奖证书原件扫描件 / 照片；官网公示名单截图；证书编号。团队项目需附成员名单页，证明你在名单内。'],
        ['论文', '录用通知（Acceptance Letter）或期刊封面+目录+正文页；检索证明（如 SCI/EI 检索号）。<b>第一署名单位必须为"西安交通大学"或"Xi\'an Jiaotong University"</b>。'],
        ['专利 / 软著', '专利证书或授权公告；软件著作权登记证书。注意完成人排序。'],
        ['志愿服务', '志愿服务信息系统时长记录截图（含姓名、总时长、学年区间）；主办方盖章的服务证明。'],
        ['社会实践', '立项文件 + 结项/考核合格证明 + 团队成员名单。'],
        ['挂职 / 见习', '接收单位证明（含起止时间、岗位）、政府见习鉴定表。'],
        ['任职', '任职文件 / 聘书 / 选举结果公示；年度考核结果（优/良/合格）；任期起止时间证明。'],
        ['集体活动', '主办单位（学校或书/学院）发布的名单、通知、签到表或活动证明。'],
        ['荣誉表彰', '表彰决定文件（含文号）、证书。'],
        ['扣分事项', '一般由书院/班级直接认定，无需学生举证；如有异议请在公示期内提出。']
      ];

      return `<div class="page">
        <div class="page__hd"><h1>佐证材料清单</h1><p>综测评定的实质是"材料评定"——没有佐证的加分在班级评议阶段极易被剔除</p>
          <div class="page__score"><b>${rows.filter(r => r.status === 'approved').length}<span>/${rows.length}</span></b><span>已认定</span></div></div>

        <div class="stat-row">
          ${st.map(s => `<button class="stat ${filter === s.id ? 'on' : ''}" data-act="mat-filter" data-arg="${s.id}">
            <b class="tone-${s.tone}">${by(s.id)}</b><span>${s.label}</span></button>`).join('')}
          <button class="stat ${filter === 'all' ? 'on' : ''}" data-act="mat-filter" data-arg="all"><b>${rows.length}</b><span>全部</span></button>
        </div>

        ${ui.card('清单', rows.length ? `<div class="tbl-wrap"><table class="tbl">
          <thead><tr><th>类别</th><th>项目</th><th class="tr">分值</th><th>材料状态</th><th>已归档材料</th><th>日期</th></tr></thead>
          <tbody>${shown.map(r => `<tr class="${r.status === 'rejected' ? 'row--bad' : r.status === 'approved' ? 'row--ok' : ''}">
            <td>${ui.badge(r.cat, 'muted')}</td>
            <td class="tl"><b>${esc(r.name || '未命名')}</b>${r.note ? `<em class="sub">${esc(r.note)}</em>` : ''}</td>
            <td class="tr">${r.pts === '' ? '—' : (r.pts < 0 ? '<span class="neg">' + fmt(r.pts) + '</span>' : '+' + fmt(r.pts))}</td>
            <td>${ui.statusBadge(r.status)}</td>
            <td class="tl">${esc(r.evidence || '—')}</td>
            <td>${esc(r.date || '—')}</td></tr>`).join('') || `<tr><td colspan="6" class="empty-sm">该状态下暂无条目</td></tr>`}
          </tbody></table></div>` : ui.empty('folder', '还没有任何条目', '先去录入加分项，这里会自动汇总成材料清单。'),
          { icon: 'folder', actions: `<div class="btns">${ui.btn('复制清单', 'copy-materials', { cls: 'btn--sm', icon: 'copy' })}${ui.btn('导出 CSV', 'exp-csv', { cls: 'btn--sm', icon: 'download' })}${ui.btn('打印', 'print', { cls: 'btn--sm', icon: 'print' })}</div>` })}

        ${ui.card('各类材料准备要点', `<div class="guide">${GUIDE.map(g => `<div class="guide__i"><b>${g[0]}</b><p>${g[1]}</p></div>`).join('')}</div>
          <div class="callout callout--warn"><b>时间建议：</b>从大一开学就建立个人成果清单，竞赛证书、志愿时长、活动证明、任职文件随手归档（建议一个云盘文件夹 + 命名规范「学年_类别_项目名」）。志愿服务 32 小时<b>按学年累计</b>，早做早从容。</div>`,
          { icon: 'bulb' })}
      </div>`;
    }
  };
  ZC.actions['mat-filter'] = (arg) => { ZC.state.ui.matFilter = arg; ZC.rerender(); };
  ZC.actions['copy-materials'] = async () => {
    const { p, R, res } = ZC.ctx();
    await ui.copy(ZC.buildMarkdownReport(p, R, res), '材料清单已复制（Markdown 格式）');
  };

  /* ==================================================================
   * 情景模拟（草稿模式：所有页面都在改草稿，随时对比 / 应用 / 丢弃）
   * ================================================================== */
  ZC.sim = {
    enter() {
      if (ZC.state.simMode) return;
      ZC.state.simDraft = ZC.clone(ZC.getProfile());
      ZC.state.simMode = true; ZC.save(true); ZC.rerender();
      ui.toast('已进入模拟模式：所有改动只影响草稿', 'ok', 3200);
    },
    exit(applyIt) {
      if (!ZC.state.simMode) return;
      if (applyIt) {
        ZC.snapshot('应用模拟结果');
        const d = ZC.state.simDraft;
        const i = ZC.state.profiles.findIndex(x => x.id === d.id);
        if (i >= 0) ZC.state.profiles[i] = d;
        ui.toast('模拟结果已应用到正式档案（可撤销）', 'ok', 4000);
      } else ui.toast('已丢弃模拟草稿', 'muted');
      ZC.state.simMode = false; ZC.state.simDraft = null; ZC.save(true); ZC.rerender();
    },
    reset() {
      ZC.state.simDraft = ZC.clone(ZC.state.profiles.find(x => x.id === ZC.state.activeId));
      ZC.rerender(); ui.toast('草稿已重置为当前正式数据', 'ok');
    },
    quick(arg) {
      if (!ZC.state.simMode) ZC.sim.enter();
      const d = ZC.state.simDraft, R = ZC.getRules(d);
      switch (arg) {
        case 'vol32': d.pinxing.service.volunteerHours = Math.max(+d.pinxing.service.volunteerHours || 0, R.pinxing.service.volunteerHours); break;
        case 'orgtrain': d.pinxing.ideology.orgTraining = (+d.pinxing.ideology.orgTraining || 0) + 1; break;
        case 'provtrain': d.pinxing.ideology.provincialTraining = (+d.pinxing.ideology.provincialTraining || 0) + 1; break;
        case 'collect': d.pinxing.collective.entries.push({ id: ZC.uid(), name: '假设：重大活动', times: 1, status: 'todo', evidence: '' }); break;
        case 'practice': d.pinxing.service.schoolPractice = (+d.pinxing.service.schoolPractice || 0) + 1; break;
        case 'provint': d.pinxing.service.provIntern = (+d.pinxing.service.provIntern || 0) + 1; break;
        case 'c_sch_1': d.ability.academic.push({ id: ZC.uid(), kind: 'competition', project: '假设：校级竞赛', level: 'school', award: '一等奖', status: 'todo', evidence: '' }); break;
        case 'c_sch_3': d.ability.academic.push({ id: ZC.uid(), kind: 'competition', project: '假设：校级竞赛', level: 'school', award: '三等奖', status: 'todo', evidence: '' }); break;
        case 'c_prov_2': d.ability.academic.push({ id: ZC.uid(), kind: 'competition', project: '假设：省级竞赛', level: 'prov', award: '二等奖', status: 'todo', evidence: '' }); break;
        case 'c_nat_3': d.ability.academic.push({ id: ZC.uid(), kind: 'competition', project: '假设：国家级竞赛', level: 'intl_nat', award: '三等奖', status: 'todo', evidence: '' }); break;
        case 'p_gen': d.ability.academic.push({ id: ZC.uid(), kind: 'paper', name: '假设：一般期刊论文', pubClass: 'general', rank: 1, signUnit: '西安交通大学', status: 'todo', evidence: '', noMerge: true }); break;
        case 'p_core': d.ability.academic.push({ id: ZC.uid(), kind: 'paper', name: '假设：核心/国际会议论文', pubClass: 'ii', rank: 1, signUnit: '西安交通大学', status: 'todo', evidence: '', noMerge: true }); break;
        case 'p_util': d.ability.academic.push({ id: ZC.uid(), kind: 'patent', name: '假设：实用新型专利', patentType: '实用新型专利', rank: 1, signUnit: '西安交通大学', status: 'todo', evidence: '', noMerge: true }); break;
        case 'a_sch_1': d.ability.culture.push({ id: ZC.uid(), kind: 'art', name: '假设：校级文艺比赛', level: 'school', award: '一等奖', status: 'todo', evidence: '' }); break;
        case 'a_sch_3': d.ability.culture.push({ id: ZC.uid(), kind: 'art', name: '假设：校级文艺比赛', level: 'school', award: '三等奖', status: 'todo', evidence: '' }); break;
        case 'a_prov_1': d.ability.culture.push({ id: ZC.uid(), kind: 'art', name: '假设：省级文艺比赛', level: 'prov', award: '一等奖', status: 'todo', evidence: '' }); break;
        case 's_sch_48': d.ability.culture.push({ id: ZC.uid(), kind: 'sport', name: '假设：校级体育竞赛', level: 'school', award: '第4—8名', status: 'todo', evidence: '' }); break;
        case 'pos_dorm': d.ability.position.push({ id: ZC.uid(), org: '假设：宿舍', role: '宿舍长', tier: 't4', assessment: '合格', startDate: ZC.today().slice(0, 4) + '-09-01', endDate: ZC.today().slice(0, 4 + 1) + '-08-31', status: 'todo', evidence: '' }); break;
        case 'pos_banz': d.ability.position.push({ id: ZC.uid(), org: '假设：班级', role: '班长', tier: 't3', assessment: '优秀', startDate: ZC.today().slice(0, 4) + '-09-01', endDate: ZC.today().slice(0, 4 + 1) + '-08-31', status: 'todo', evidence: '' }); break;
        case 'pos_head': d.ability.position.push({ id: ZC.uid(), org: '假设：院级学生组织', role: '主席', tier: 't1', assessment: '优秀', startDate: ZC.today().slice(0, 4) + '-09-01', endDate: ZC.today().slice(0, 4 + 1) + '-08-31', status: 'todo', evidence: '' }); break;
        case 'r_coll': d.reward.items.push({ id: ZC.uid(), category: 'honor', level: 'college', name: '假设：院级表彰', status: 'todo', evidence: '' }); break;
        case 'r_school': d.reward.items.push({ id: ZC.uid(), category: 'honor', level: 'school', name: '假设：校级表彰', status: 'todo', evidence: '' }); break;
        case 'r_deed': d.reward.items.push({ id: ZC.uid(), category: 'deed', name: '假设：做好事受表扬', status: 'todo', evidence: '' }); break;
        case 'ded_kuangke': d.pinxing.deductions.push({ id: ZC.uid(), type: 'kuangke', count: 1, note: '假设：旷课 1 次', status: 'todo' }); break;
        case 'ded_weisheng': d.pinxing.deductions.push({ id: ZC.uid(), type: 'weisheng', count: 1, note: '假设：宿舍卫生不合格', status: 'todo' }); break;
        case 'ded_jinggao': d.pinxing.deductions.push({ id: ZC.uid(), type: 'jinggao', count: 1, note: '假设：警告处分', status: 'todo' }); break;
      }
      ZC.save(true); ZC.rerender();
    },
    apply() { ZC.sim.exit(true); },
    discard() { ZC.sim.exit(false); }
  };
  ZC.actions['sim-enter'] = () => ZC.sim.enter();
  ZC.actions['sim-apply'] = () => ZC.sim.exit(true);
  ZC.actions['sim-discard'] = () => ui.confirm('丢弃模拟草稿', '草稿中的所有假设改动将被丢弃，正式档案不受影响。', () => ZC.sim.exit(false), '丢弃');
  ZC.actions['sim-quick'] = (arg) => ZC.sim.quick(arg);

  V.simulate = {
    render(ctx) {
      const base = ZC.state.profiles.find(x => x.id === ZC.state.activeId);
      const R = ZC.getRules(base);
      const baseRes = ZC.compute(base, R);
      const inSim = ZC.state.simMode;
      const draft = inSim ? ZC.state.simDraft : base;
      const draftRes = inSim ? ctx.res : baseRes;

      const QUICK = [
        ['🟢 品行加分', [['vol32', '志愿服务补满 32h'], ['orgtrain', '党团理论学习 +1 次'], ['provtrain', '省部级培训 +1 次'], ['collect', '集体活动 +1 次'], ['practice', '校级社会实践 +1 项'], ['provint', '省部级见习 +1 项']]],
        ['🔵 学术科研', [['c_sch_3', '校级竞赛 三等奖'], ['c_sch_1', '校级竞赛 一等奖'], ['c_prov_2', '省级竞赛 二等奖'], ['c_nat_3', '国家级竞赛 三等奖'], ['p_gen', '一般期刊论文（一作）'], ['p_core', '核心/国际会议（一作）'], ['p_util', '实用新型专利']]],
        ['🟣 文体竞赛', [['a_sch_3', '校级文艺 三等奖'], ['a_sch_1', '校级文艺 一等奖'], ['a_prov_1', '省级文艺 一等奖'], ['s_sch_48', '校级体育 第4—8名']]],
        ['🟠 任职与奖励', [['pos_dorm', '宿舍长（合格）'], ['pos_banz', '班长（优秀）'], ['pos_head', '院级组织正职（优秀）'], ['r_coll', '院级表彰'], ['r_school', '校级表彰'], ['r_deed', '做好事 +1']]],
        ['🔴 反向模拟：如果出事了', [['ded_kuangke', '旷课 1 次'], ['ded_weisheng', '宿舍卫生不合格'], ['ded_jinggao', '警告处分']]]
      ];

      const segs = [
        ['品行素质分', baseRes.pinxing.final, draftRes.pinxing.final, R.frame.pinxing],
        ['能力拓展分', baseRes.ability.final, draftRes.ability.final, R.frame.ability],
        ['奖励分', baseRes.reward.final, draftRes.reward.final, R.reward.cap],
        ['综合素质测评成绩', baseRes.total, draftRes.total, baseRes.maxTotal]
      ];
      const cb = ZC.composite(base, R, baseRes.total), cd = ZC.composite(draft, R, draftRes.total);

      const cmp = `<div class="tbl-wrap"><table class="tbl tbl--cmp">
        <thead><tr><th>项目</th><th class="tr">当前正式</th><th class="tr">${inSim ? '模拟草稿' : '（未开始模拟）'}</th><th class="tr">变化</th><th class="tr">满分</th></tr></thead>
        <tbody>${segs.map(s => {
          const d = ZC.r2(s[2] - s[1]);
          return `<tr class="${s[0].includes('测评成绩') ? 'row--sum' : ''}"><td class="tl">${s[0]}</td><td class="tr">${fmt(s[1])}</td><td class="tr">${fmt(s[2])}</td>
            <td class="tr">${d === 0 ? '<span class="na">0</span>' : `<b class="${d > 0 ? 'pos' : 'neg'}">${ZC.signed(d)}</b>`}</td><td class="tr na">${fmt(s[3])}</td></tr>`;
        }).join('')}
        <tr class="row--sum"><td class="tl">${esc(cb.preset.name)}综合成绩</td><td class="tr">${fmt(cb.total)}</td><td class="tr">${fmt(cd.total)}</td>
          <td class="tr">${ZC.r2(cd.total - cb.total) === 0 ? '<span class="na">0</span>' : `<b class="${cd.total > cb.total ? 'pos' : 'neg'}">${ZC.signed(ZC.r2(cd.total - cb.total))}</b>`}</td><td class="tr na">—</td></tr>
        </tbody></table></div>`;

      const gapPlan = (function () {
        const t = +base.target.score || 0;
        if (!t) return '';
        const gap = ZC.r2(t - baseRes.total);
        if (gap <= 0) return `<div class="callout callout--ok"><b>已达成目标 ${fmt(t)} 分</b>（当前 ${fmt(baseRes.total)}，超出 ${fmt(-gap)} 分）。</div>`;
        const plan = ZC.recommend(base, R, baseRes, gap);
        let acc = 0;
        return `<div class="plan"><h4>目标反推：从 ${fmt(baseRes.total)} 到 ${fmt(t)}（差 ${fmt(gap)} 分）</h4>
          <ol>${plan.map(x => { acc = ZC.r2(acc + x.gain); return `<li><span class="plan__g">+${fmt(x.gain)}</span><b>${esc(x.label)}</b><em>投入${ZC.EFFORT_LABEL[x.effort]}</em><span class="plan__acc">累计 ${fmt(ZC.r2(baseRes.total + acc))}</span>
            <button class="lbtn" data-act="sim-quick" data-arg="${simIdFor(x.id)}" ${simIdFor(x.id) ? '' : 'disabled'}>加入模拟</button></li>`; }).join('')}</ol>
          ${acc < gap ? `<p class="warn-t">按当前剩余空间，最多还能提升 ${fmt(acc)} 分，仍差 ${fmt(ZC.r2(gap - acc))} 分。可能需要核对书院细则或调整目标。</p>` : `<p class="muted">完成前 ${plan.findIndex((x, i) => ZC.r2(plan.slice(0, i + 1).reduce((s, y) => s + y.gain, 0)) >= gap) + 1 || plan.length} 项即可达标。</p>`}
        </div>`;
      })();

      return `<div class="page">
        <div class="page__hd"><h1>情景模拟</h1><p>「如果我再做一件事，综测会涨多少？」——先模拟，再决定把时间花在哪</p>
          ${inSim ? `<div class="simmode">${ui.icon('flask', 15)} 模拟模式进行中</div>` : ''}</div>

      return `<div class="page">
        <div class="page__hd"><h1>规则手册</h1><p>校级办法全文速查 · ⚑ 标记为常见误解或需要按书院口径确认之处</p></div>

            const pos = s.selectionStart;

        });
      }
    }

      </div>`, { icon: 'info' });

      return `<div class="page">
        <div class="page__hd"><h1>设置</h1><p>个人信息 · 书院口径 · 规则参数 · 数据备份</p></div>
        ${profileCard}${collegeCard}${dataCard}${about}
      </div>`;
    },
    profileModal() {
      const list = ZC.state.profiles.map(p => {
        const R = ZC.getRules(p); const res = ZC.compute(p, R);
        return `<div class="pf ${p.id === ZC.state.activeId ? 'on' : ''}">
          <div class="pf__b"><b>${esc(p.meta.name)}</b><em>${esc(p.meta.college)} · ${esc(p.meta.academicYear)}${p.meta.grade ? ' · ' + esc(p.meta.grade) : ''}</em></div>
          <div class="pf__s">${fmt(res.total)} 分</div>
          <div class="pf__o">
            ${p.id === ZC.state.activeId ? ui.badge('当前', 'ok') : ui.ibtn('prof-switch', 'check', { arg: p.id, title: '切换到此档案' })}
            ${ui.ibtn('prof-dup', 'copy', { arg: p.id, title: '复制（用于新学年）' })}
            ${ui.ibtn('prof-del', 'trash', { arg: p.id, cls: 'ibtn--danger', title: '删除' })}
          </div></div>`;
      }).join('');
      ui.modal({
        title: '档案管理', wide: true,
        body: `<p class="muted">建议每学年建一个档案；也可以给室友/同学各建一个用来互相核对（数据仍只存在你本机）。</p><div class="pfs">${list}</div>`,
        actions: `<button class="btn" data-close="1">关闭</button><button class="btn btn--primary" data-act="prof-new">${ui.icon('plus', 15)} 新建档案</button>`
      });
    },
    newProfile() {
      const years = [];
      const cy = new Date().getFullYear();
      for (let y = cy + 1; y >= cy - 5; y--) years.push(y + '—' + String(y + 1).slice(2));
      ui.modal({
        title: '新建档案',
        body: `<div class="fgrid">
            ${fld('姓名 / 档案名', `<input class="inp" id="np-name" placeholder="如：张三 或 大二上">`)}
            ${fld('书院', `<select class="inp" id="np-col">${ZC.COLLEGES.map(c => `<option ${c === (ZC.getProfile().meta.college) ? 'selected' : ''}>${c}</option>`).join('')}</select>`)}
            ${fld('学年', `<select class="inp" id="np-year">${years.map(y => `<option ${y === ZC.currentAcademicYear() ? 'selected' : ''}>${y}</option>`).join('')}</select>`)}
            ${fld('初始数据', `<label class="chk"><input type="checkbox" id="np-copy" checked><span class="chk__box"></span><span>从当前档案复制（新学年沿用个人信息与规则口径）</span></label>`)}
          </div>`,
        actions: `<button class="btn" data-close="1">取消</button><button class="btn btn--primary" data-ok="1">创建</button>`,
        onOk(root) {
          const name = root.querySelector('#np-name').value.trim() || '新档案';
          const col = root.querySelector('#np-col').value;
          const year = root.querySelector('#np-year').value;
          const copy = root.querySelector('#np-copy').checked ? ZC.getProfile() : null;
          ZC.addProfile(name, col, year, copy);
          ZC.rerender(); ui.toast('已创建并切换到新档案', 'ok');
        }
      });
    }
  };
  ZC.actions['prof-new'] = () => V.settings.newProfile();
})();

</script>
<script>
/* ===== 内联自 js/app.js ===== */
/* =========================================================================
 * app.js —— 应用外壳、路由、事件委托、渲染调度
 * ========================================================================= */
(function () {
  const ZC = window.ZC;
  const ui = ZC.ui, esc = ZC.esc;

  ZC.NAV = [
    { group: '计分', items: [
      { id: 'dashboard', label: '仪表盘', icon: 'dashboard' },
      { id: 'pinxing', label: '品行素质分', icon: 'shield', tag: '80' },
      { id: 'ability', label: '能力拓展分', icon: 'rocket', tag: '20' },
      { id: 'reward', label: '奖励分', icon: 'award', tag: '+5' }
    ]},
    { group: '工具', items: [
      { id: 'composite', label: '综合成绩与资格', icon: 'calc' },
      { id: 'materials', label: '材料清单', icon: 'folder' },
      { id: 'simulate', label: '情景模拟', icon: 'flask' },
      { id: 'class', label: '班级对比', icon: 'users' },
      { id: 'procedure', label: '程序与时效', icon: 'clock' }
    ]},
    { group: '参考', items: [
      { id: 'rulebook', label: '规则手册', icon: 'book' },
      { id: 'settings', label: '设置', icon: 'gear' }
    ]}
  ];

  ZC.views = ZC.views || {};

  /* ------------------------------------------------------- 计算缓存 */
  ZC.ctx = function () {
    const p = ZC.getProfile();
    const R = ZC.getRules(p);
    const res = ZC.compute(p, R);
    const insights = ZC.buildInsights(p, R, res);
    return { p, R, res, insights };
  };

  /* ============================================================ 外壳 */
  function shell() {
    const navHtml = ZC.NAV.map(g => `
      <div class="nav__g">${g.group}</div>
      ${g.items.map(it => `<a class="nav__i" href="#/${it.id}" data-nav="${it.id}">
          <span class="nav__ic">${ui.icon(it.icon, 17)}</span><span class="nav__lb">${it.label}</span>
          ${it.tag ? `<span class="nav__tag">${it.tag}</span>` : ''}
          <span class="nav__sc" data-score-for="${it.id}"></span>
        </a>`).join('')}`).join('');

    return `
    <div class="app">
      <aside class="side" id="side">
        <div class="side__top">
          <div class="brand">
            <span class="brand__m">${ui.icon('calc', 20)}</span>
            <span class="brand__t">综测算分器<em>西安交通大学 · 本科生综合素质测评</em></span>
          </div>
        </div>
        <nav class="nav" id="nav">${navHtml}</nav>
        <div class="side__ft">
          <div class="side__note">纯本地运行 · 数据不上传<br><span id="save-state">未保存</span></div>
        </div>
      </aside>
      <div class="main">
        <header class="top" id="top">
          <button class="ibtn only-m" data-act="menu" title="菜单">${ui.icon('list', 20)}</button>
          <div class="top__prof" data-act="profiles" title="切换 / 管理档案">
            ${ui.icon('user', 15)}
            <span class="top__pname" id="top-pname">—</span>
            <span class="top__pyear" id="top-pyear"></span>
            ${ui.icon('down', 14)}
          </div>
          <div class="top__strip" id="score-strip"></div>
          <div class="top__act">
            <button class="ibtn" data-act="undo" title="撤销 (Ctrl+Z)" id="btn-undo">${ui.icon('undo', 17)}</button>
            <button class="ibtn" data-act="export" title="导出备份 / 报表">${ui.icon('download', 17)}</button>
            <button class="ibtn" data-act="theme" title="切换深浅色">${ui.icon('moon', 17)}</button>
          </div>
        </header>
        <div class="view" id="view"></div>
        <footer class="foot">
          <p>依据《西安交通大学本科生综合素质测评成绩评定办法》（2018年5月印发）及其实施细则构建 · 仅供自评参考</p>
          <p class="foot__w">集体活动单次分值、任职不满一年的酌情幅度等由各书（学）院自行认定，最终以所在书院当年公示细则与班级评议结果为准。</p>
        </footer>
      </div>
      <div class="side-mask" id="side-mask" data-act="menu"></div>
    </div>`;
  }

  /* ============================================================ 计分条 */
  function scoreStrip(ctx) {
    const { res, p } = ctx;
    const R = ctx.R;
    const seg = [
      { k: 'pinxing', l: '品行', v: res.pinxing.final, m: R.frame.pinxing },
      { k: 'ability', l: '能力', v: res.ability.final, m: R.frame.ability },
      { k: 'reward', l: '奖励', v: res.reward.final, m: R.reward.cap }
    ];
    const target = +p.target.score || 0;
    const gap = target ? ZC.r2(target - res.total) : null;
    return `
      <div class="strip">
        ${seg.map(s => `<a class="strip__s" href="#/${s.k === 'pinxing' ? 'pinxing' : s.k === 'ability' ? 'ability' : 'reward'}" title="${s.l}素质分 ${ZC.fmt(s.v)} / ${s.m}">
            <span class="strip__l">${s.l}</span><b>${ZC.fmt(s.v)}</b><i>${s.m}</i>
            ${ui.bar(s.v, s.m, { cls: 'bar--xs' })}
          </a>`).join('')}
        <a class="strip__t" href="#/dashboard" title="综合素质测评成绩">
          <span class="strip__l">总分</span><b class="strip__big">${ZC.fmt(res.total)}</b><i>/ ${res.maxTotal}</i>
        </a>
        ${gap !== null ? `<span class="strip__g ${gap > 0 ? 'is-neg' : 'is-pos'}" title="距离目标 ${ZC.fmt(target)} 分">
            ${ui.icon('target', 13)} ${gap > 0 ? '差 ' + ZC.fmt(gap) : '超 ' + ZC.fmt(-gap)}</span>` : ''}
      </div>`;
  }

  /* ============================================================ 渲染 */
  let pending = false;
  ZC.rerender = function (opts) {
    if (pending) return; pending = true;
    requestAnimationFrame(() => { pending = false; doRender(opts); });
  };
  function doRender() {
    const ctx = ZC.ctx();
    const view = ZC.views[ZC.state.ui.view] || ZC.views.dashboard;

    // 焦点与滚动保持
    const ae = document.activeElement;
    const key = ae && ae.dataset ? ae.dataset.k : null;
    let s1 = 0, s2 = 0;
    try { s1 = ae.selectionStart; s2 = ae.selectionEnd; } catch (e) {}
    const sy = window.scrollY;

    const el = document.getElementById('view');
    el.innerHTML = view.render(ctx);
    document.getElementById('score-strip').innerHTML = scoreStrip(ctx);
    document.getElementById('top-pname').textContent = ctx.p.meta.name;
    document.getElementById('top-pyear').textContent = ctx.p.meta.academicYear + ' · ' + ctx.p.meta.college;

    // 侧栏小分
    const set = (id, txt) => { const n = document.querySelector(`[data-score-for="${id}"]`); if (n) n.textContent = txt; };
    set('pinxing', ZC.fmt(ctx.res.pinxing.final));
    set('ability', ZC.fmt(ctx.res.ability.final));
    set('reward', ZC.fmt(ctx.res.reward.final));
    set('dashboard', ZC.fmt(ctx.res.total));

    document.querySelectorAll('.nav__i').forEach(a => a.classList.toggle('on', a.dataset.nav === ZC.state.ui.view));
    const ub = document.getElementById('btn-undo'); if (ub) ub.disabled = !ZC.canUndo();

    if (key) {
      const t = el.querySelector(`[data-k="${key.replace(/"/g, '\\"')}"]`);
      if (t) { t.focus(); try { t.setSelectionRange(s1, s2); } catch (e) {} }
    }
    window.scrollTo(0, sy);
    if (view.after) view.after(ctx);
  }

  ZC.go = function (id) {
    if (!ZC.views[id]) id = 'dashboard';
    ZC.state.ui.view = id;
    if (location.hash !== '#/' + id) history.replaceState(null, '', '#/' + id);
    window.scrollTo(0, 0);
    ZC.rerender();
    ZC.save(true);
    document.body.classList.remove('side-open');
  };

  /* ============================================================ 事件 */
  function coerce(el, raw) {
    const t = el.dataset.t;
    if (t === 'bool') return el.checked;
    if (t === 'num') return raw === '' ? '' : (isNaN(+raw) ? raw : +raw);
    if (t === 'int') return raw === '' ? '' : parseInt(raw, 10);
    return raw;
  }

  function onField(el) {
    const k = el.dataset.k; if (!k) return;
    const p = ZC.getProfile();
    const val = coerce(el, el.value);
    const cur = ZC.getPath(p, k);
    if (String(cur) === String(val)) return;
    ZC.setPath(p, k, val);
    if (ZC.fixups) ZC.fixups(p, k);      // 级别/类别切换后校正失效的选项
    ZC.save();
    ZC.rerender();
  }

  /* -------------------------------------------------- 新增条目模板 */
  function newItem(cat, arg) {
    const base = { id: ZC.uid(), status: 'todo', evidence: '', date: '' };
    switch (cat) {
      case 'collective': return Object.assign(base, { name: '', times: 1 });
      case 'deduction': return Object.assign(base, { type: arg || 'kuangke', count: 1, note: '' });
      case 'academic-comp': return Object.assign(base, { kind: 'competition', project: '', level: 'school', award: '三等奖', noMerge: false });
      case 'academic-paper': return Object.assign(base, { kind: 'paper', project: '', name: '', pubClass: 'ii', rank: 1, signUnit: '西安交通大学', excellentPaper: false, isEditor: false, noMerge: true });
      case 'academic-patent': return Object.assign(base, { kind: 'patent', project: '', name: '', patentType: '实用新型专利', rank: 1, signUnit: '西安交通大学', noMerge: true });
      case 'academic-book': return Object.assign(base, { kind: 'book', project: '', name: '', pubClass: 'book', rank: 1, signUnit: '西安交通大学', isEditor: false, noMerge: true });
      case 'culture-art': return Object.assign(base, { kind: 'art', name: '', level: 'school', award: '三等奖', record: false });
      case 'culture-sport': return Object.assign(base, { kind: 'sport', name: '', level: 'school', award: '第3名', record: false });
      case 'position': return Object.assign(base, { org: '', role: '', tier: 't4', assessment: '合格', startDate: '', endDate: '' });
      case 'reward': return Object.assign(base, { category: 'honor', level: 'school', name: '' });
      case 'classmate': return { id: ZC.uid(), name: '', composite: '', zongce: '', self: false };
      default: return base;
    }
  }
  const LIST_PATH = {
    collective: 'pinxing.collective.entries', deduction: 'pinxing.deductions',
    academic: 'ability.academic', culture: 'ability.culture', position: 'ability.position',
    reward: 'reward.items', classmate: 'classmates'
  };

  Object.assign(ZC.actions, {
    nav: (arg) => ZC.go(arg),
    menu: () => document.body.classList.toggle('side-open'),
    theme: () => { ZC.toggleTheme(); ZC.rerender(); },
    undo: () => { if (ZC.undo()) ZC.rerender(); },
    export: () => ZC.actions.exportMenu(),
    exportMenu: () => {
      const { p, R, res } = ZC.ctx();
      ui.modal({
        title: '导出与备份', wide: false,
        body: `<div class="exp">
          <button class="exp__i" data-act="exp-json">${ui.icon('download', 20)}<b>数据备份 (JSON)</b><span>含全部档案与设置，可跨设备导入</span></button>
          <button class="exp__i" data-act="exp-md">${ui.icon('list', 20)}<b>自评表 (Markdown)</b><span>可直接粘贴进学年总结 / 发给辅导员</span></button>
          <button class="exp__i" data-act="exp-csv">${ui.icon('calc', 20)}<b>明细表 (CSV)</b><span>Excel 打开，逐项含计算依据</span></button>
          <button class="exp__i" data-act="print">${ui.icon('print', 20)}<b>打印 / 存为 PDF</b><span>排版已针对 A4 优化</span></button>
        </div>`,
        actions: `<button class="btn" data-close="1">关闭</button>`
      });
    },
    'exp-json': () => ZC.exportJSON(),
    'exp-md': () => { const { p, R, res } = ZC.ctx(); ZC.download(`综测自评表_${p.meta.name}_${ZC.today()}.md`, ZC.buildMarkdownReport(p, R, res), 'text/markdown'); ui.toast('已导出 Markdown 自评表', 'ok'); },
    'exp-csv': () => { const { p, R, res } = ZC.ctx(); ZC.download(`综测明细_${p.meta.name}_${ZC.today()}.csv`, ZC.buildCSV(p, R, res), 'text/csv'); ui.toast('已导出 CSV 明细', 'ok'); },
    print: () => window.print(),
    'copy-md': async () => { const { p, R, res } = ZC.ctx(); await ui.copy(ZC.buildMarkdownReport(p, R, res), '自评表已复制'); },

    /* 档案 */
    profiles: () => ZC.views.settings.profileModal(),
    'prof-new': () => ZC.views.settings.newProfile(),
    'prof-switch': (arg) => { ZC.switchProfile(arg); ZC.rerender(); ui.toast('已切换档案', 'ok', 1600); },
    'prof-dup': (arg) => { const src = ZC.state.profiles.find(x => x.id === arg); ZC.addProfile(src.meta.name + ' 副本', src.meta.college, src.meta.academicYear, src); ZC.rerender(); ui.toast('已复制档案', 'ok'); },
    'prof-del': (arg) => {
      const src = ZC.state.profiles.find(x => x.id === arg);
      ui.confirm('删除档案', `确定删除「${esc(src.meta.name)}」？删除后可用顶部撤销按钮恢复。`, () => { ZC.deleteProfile(arg); ZC.rerender(); }, '删除');
    },

    /* 列表增删 */
    add: (arg) => {
      const [listCat, itemCat] = arg.split('|');
      const p = ZC.getProfile();
      const path = LIST_PATH[listCat];
      if (!path) return;
      ZC.snapshot('新增条目');
      if (listCat === 'classmate') {
        p.classmates = p.classmates || [];
        p.classmates.push(newItem('classmate'));
      } else {
        const arr = ZC.getPath(p, path);
        arr.push(newItem(itemCat || listCat, itemCat));
      }
      ZC.save(); ZC.rerender();
    },
    del: (arg) => {
      const [path, idx] = arg.split('|');
      const p = ZC.getProfile();
      ZC.snapshot('删除条目');
      const arr = ZC.getPath(p, path);
      arr.splice(+idx, 1);
      ZC.save(); ZC.rerender(); ui.toast('已删除，可撤销', 'ok', 2200);
    },
    dup: (arg) => {
      const [path, idx] = arg.split('|');
      const p = ZC.getProfile();
      ZC.snapshot('复制条目');
      const arr = ZC.getPath(p, path);
      const c = ZC.clone(arr[+idx]); c.id = ZC.uid(); c.status = 'todo';
      arr.splice(+idx + 1, 0, c);
      ZC.save(); ZC.rerender();
    },
    move: (arg) => {
      const [path, idx, dir] = arg.split('|');
      const p = ZC.getProfile(); const arr = ZC.getPath(p, path);
      const i = +idx, j = i + (+dir);
      if (j < 0 || j >= arr.length) return;
      ZC.snapshot('排序');
      [arr[i], arr[j]] = [arr[j], arr[i]];
      ZC.save(); ZC.rerender();
    },

    /* 规则原文弹窗 */
    rule: (arg) => {
      const txt = ZC.RULE_TEXT[arg] || '';
      const titles = { formula: '总公式', collective: '集体活动分', term: '任职任期规则', sign: '署名单位要求', dedup: '同一项目取最高', psy: '心理测评 ≠ 综测', procedure: '评定程序与异议申诉', volunteer: '志愿服务工时口径' };
      ui.modal({ title: '规则原文 · ' + (titles[arg] || ''), body: `<blockquote class="quote">${esc(txt)}</blockquote>`, actions: `<button class="btn btn--primary" data-close="1">知道了</button>` });
    },

    /* 设置 */
    'reset-rules': () => ui.confirm('恢复校级默认规则', '将清除你对规则参数的全部自定义（不影响已录入的加分条目），确定继续？', () => { ZC.snapshot('重置规则'); ZC.state.globalRules = {}; const p = ZC.getProfile(); p.ruleOverride = {}; ZC.save(); ZC.rerender(); ui.toast('已恢复校级默认规则', 'ok'); }, '恢复默认'),
    'clear-profile': () => ui.confirm('清空当前档案数据', '将删除当前档案内的所有加分/扣分条目，恢复到空白状态。建议先导出备份。确定继续？', () => {
      ZC.snapshot('清空档案'); const p = ZC.getProfile(); const meta = ZC.clone(p.meta); const id = p.id, ca = p.createdAt;
      const fresh = ZC.blankProfile(meta.name, meta.college, meta.academicYear);
      fresh.meta = meta; fresh.id = id; fresh.createdAt = ca;
      const i = ZC.state.profiles.findIndex(x => x.id === id); ZC.state.profiles[i] = fresh;
      ZC.save(); ZC.rerender(); ui.toast('已清空', 'ok');
    }, '清空'),
    'import': () => {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = () => { const f = inp.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { if (ZC.importJSON(rd.result)) ZC.rerender(); }; rd.readAsText(f); };
      inp.click();
    },
    'demo': () => { ZC.snapshot('载入示例'); const d = ZC.buildDemoProfile(); ZC.state.profiles.push(d); ZC.state.activeId = d.id; ZC.save(); ZC.rerender(); ui.toast('已载入示例档案', 'ok'); },

    /* 提示筛选 */
    'tips-filter': (arg) => { ZC.state.ui.tipsFilter = arg; ZC.save(true); ZC.rerender(); },

    /* 首启引导 */
    'welcome-blank': () => {
      ZC.snapshot('清空示例数据');
      const old = ZC.getProfile();
      const fresh = ZC.blankProfile('', old.meta.college, old.meta.academicYear);
      fresh.id = old.id; fresh.createdAt = old.createdAt;
      ZC.state.profiles[ZC.state.profiles.findIndex(x => x.id === old.id)] = fresh;
      ZC.save(true); ZC.go('settings');
      ui.toast('已清空，先填一下基本信息吧', 'ok', 3200);
    },
    'welcome-demo': () => { ZC.go('dashboard'); },

    /* 模拟：具体动作在 views-tools.js 中注册 */

    /* 快捷跳转 */
    goto: (arg) => ZC.go(arg)
  });

  /* ============================================================ 启动 */
  function bind() {
    const root = document;   // 文档级委托：弹窗(#modal-root)内的按钮同样生效
    root.addEventListener('input', (e) => { const el = e.target.closest('[data-k]'); if (el) onField(el); });
    root.addEventListener('change', (e) => { const el = e.target.closest('[data-k]'); if (el) onField(el); });
    root.addEventListener('click', (e) => {
      const nav = e.target.closest('[data-nav]');
      if (nav) { e.preventDefault(); ZC.go(nav.dataset.nav); return; }
      const b = e.target.closest('[data-act]');
      if (!b || b.disabled) return;
      const fn = ZC.actions[b.dataset.act];
      if (fn) {
        e.preventDefault();
        if (b.closest('#modal-root')) ui.closeModal();   // 弹窗内的动作：先关闭再执行（动作可能打开新弹窗）
        fn(b.dataset.arg, b, e);
      }
    });
    window.addEventListener('hashchange', () => {
      const id = (location.hash || '').replace('#/', '');
      if (id && ZC.views[id] && id !== ZC.state.ui.view) { ZC.state.ui.view = id; ZC.rerender(); }
    });
    document.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && !e.target.closest('input,textarea,select')) { e.preventDefault(); ZC.actions.undo(); }
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') { e.preventDefault(); ZC.save(); ui.toast('数据保存在本机浏览器，建议同时导出 JSON 备份', 'ok', 3200); }
      if (e.key === '/' && !e.target.closest('input,textarea,select')) { const s = document.getElementById('rb-search'); if (s) { e.preventDefault(); s.focus(); } }
    });
    window.addEventListener('beforeunload', () => { if (ZC.state.dirty) ZC.flushSave(); });
    window.addEventListener('pagehide', () => { if (ZC.state.dirty) ZC.flushSave(); });
  }

  ZC.boot = function () {
    ZC.load();
    const h = (location.hash || '').replace('#/', '');
    if (h && ZC.views[h]) ZC.state.ui.view = h;
    document.getElementById('app').innerHTML = shell();
    bind();
    doRender();
    ZC.save(true);
    if (ZC.state.firstRun) {
      ZC.state.firstRun = false;
      ui.modal({
        title: '欢迎使用「综测算分器」',
        body: `<p>这是一个<b>纯本地运行</b>的西安交通大学本科生综合素质测评工具：算分、备材料、想清楚下一步该做什么。<b>不需要注册，数据不会上传</b>，全部保存在你这台设备的浏览器里。</p>
          <div class="callout callout--info callout--sm">当前已经装好一个<b>示例档案</b>（填了各种数据），方便你直接看懂每一项怎么填、分数怎么算、提示怎么来的。</div>
          <div class="callout callout--warn callout--sm">计分依据为《西安交通大学本科生综合素质测评成绩评定办法》(2018) 及实施细则。<b>集体活动单次分值、任职不满一年的折减幅度等由各书院自行认定</b>，请在「设置」里改成你所在书院的口径。</div>`,
        actions: `<button class="btn" data-act="import">${ui.icon('upload', 15)} 导入备份</button>
                  <button class="btn" data-act="welcome-blank">${ui.icon('plus', 15)} 从零开始录入我的</button>
                  <button class="btn btn--primary" data-act="welcome-demo">先看看示例数据</button>`
      });
    }
    setTimeout(() => {
      const el = document.getElementById('save-state');
      if (el) el.textContent = ZC.storageOK ? '已就绪 · 数据存于本机浏览器' : '仅本次会话有效（本地存储被禁用）';
      if (!ZC.storageOK) {
        ZC.ui.modal({
          title: '当前环境禁用了本地存储',
          body: `<p>检测到此浏览器环境不允许写入本地存储（常见于受限的网页预览窗口、无痕模式或站点数据被禁用）。</p>
            <div class="callout callout--warn"><b>影响：</b>你录入的数据只在本次会话内有效，关闭页面后会丢失。</div>
            <div class="callout callout--ok"><b>解决办法：</b>把 <code>index.html</code> 下载到本地，用 Chrome / Edge / Safari 直接双击打开，即可自动保存、离线使用。也可以随时用「导出备份 (JSON)」把数据存成文件，之后在正常环境中导入。</div>`,
          actions: `<button class="btn" data-act="export">导出备份</button><button class="btn btn--primary" data-close="1">我知道了，继续使用</button>`
        });
      }
    }, 400);
  };

  document.addEventListener('DOMContentLoaded', () => { try { ZC.boot(); } catch (e) { console.error(e); document.getElementById('app').innerHTML = '<div style="padding:40px;font:14px/1.8 system-ui">应用初始化失败：' + esc(e.message) + '</div>'; } });
})();

</script>
</body>
</html>
