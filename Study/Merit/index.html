<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
	<meta name="description" content="西安交通大学本科生综合素质测评自评工具：按校级办法与书院口径算分、备材料、找性价比最高的下一步，数据本机保存并可同步云端。">
	<link rel="icon" href="/favicon.svg?v=2255" type="image/svg+xml">

	<!-- 主题先落地，避免深浅色闪一下（与其它页面共用 smartCubeTheme） -->
	<script>
		(function () {
			var saved = null;
			try { saved = localStorage.getItem("smartCubeTheme"); } catch (e) {}
			var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
			document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
		})();
	</script>

	<!-- 设计令牌（dsk-*），必须先于页面样式 -->
	<link rel="stylesheet" href="/ui/colors_and_type.css?v=2255">
	<link rel="stylesheet" href="/nav/nav.css?v=2143">
	<link rel="stylesheet" href="merit.css?v=2255">

	<title>综测算分器 — 西安交通大学本科生综合素质测评</title>
</head>
<body>
	<div id="app"></div>
	<div id="toast" role="status" aria-live="polite"></div>

	<!-- 站点顶栏（nav.js 只注册 window.siteNav，顶栏由 merit-app.js 初始化） -->
	<script src="/nav/nav.js?v=2143" defer></script>

	<!-- 站点作用域（必须先于云同步定义） -->
	<script src="/assets/services/core/site-scope.js?v=2255" defer></script>

	<!-- Supabase：登录态与本站其它工具共用 -->
	<script src="/assets/vendor/supabase/supabase.min.js" defer></script>
	<script src="/supabase/supabase-config.js?v=1877" defer></script>
	<script src="/supabase/supabase-client.js?v=1877" defer></script>
	<script src="/supabase/auth-manager.js?v=1892" defer></script>

	<!-- 云端数据压缩（可选：缺少时自动退回明文上传） -->
	<script src="/assets/services/sync/payload-codec.js?v=2143" defer></script>

	<!-- 应用本体：规则 → 引擎 → 提示 → 控件 → 存储/云同步 → 视图 → 外壳 -->
	<script src="merit-rules.js?v=2255" defer></script>
	<script src="merit-engine.js?v=2255" defer></script>
	<script src="merit-insights.js?v=2255" defer></script>
	<script src="merit-ui.js?v=2255" defer></script>
	<script src="merit-store.js?v=2255" defer></script>
	<script src="merit-views.js?v=2255" defer></script>
	<script src="merit-app.js?v=2255" defer></script>
</body>
</html>
